}
/* ==========================================================================
   SLEEP SYSTEM
   An accelerated, illustrative night:
     drifting off → deep sleep (slow waves + hippocampal replay)
     → REM-like recombination & integration (+ gentle downscaling) → waking.
   Replay fires recent memories/skills in compressed sequences through their
   learned pathways; consolidation and synapse stability rise, interference
   falls. Phases are a teaching device, not literal sleep-stage physiology.
   ========================================================================== */
const SLEEP_PHASES = [
  { id: 'drift', name: 'Drifting off', until: 5, flow: 1, text: 'External input fades. Activity slows and begins to synchronise.' },
  { id: 'deep', name: 'Deep sleep · replay', until: 21, flow: 2, text: 'Slow waves sweep the cortex while the hippocampus replays recent experiences.' },
  { id: 'rem', name: 'REM-like · integration', until: 33, flow: 2, text: 'Dream-like recombination links related memories. Unused connections are gently downscaled.' },
  { id: 'wake', name: 'Waking', until: 40, flow: 3, text: 'Wakeful activity returns—on a more stable network than before.' },
];
const SLEEP_FLOW = ['DAY EXPERIENCE', 'TEMPORARY MEMORY', 'SLEEP / CONSOLIDATION', 'STABILIZED NETWORK'];

class SleepSystem {
  constructor(game) {
    this.game = game;
    this.active = false; this.t = 0; this.duration = 40; this.phaseIndex = -1;
    this.accelerated = true; this.cycles = 0;
    this.before = null; this.summary = null;
    this.replays = 0; this.replayCounts = {}; this.downscaled = 0; this.stabilized = 0; this.integrations = 0;
    this.timers = { wave: 1, ripple: 2, rem: 0.5 };
    this.lastReplay = null;
  }
  get phase() { return SLEEP_PHASES[Math.max(0, this.phaseIndex)]; }

  snapshot() {
    const mem = this.game.memory;
    return {
      memories: mem.list.map((m) => ({ id: m.id, name: m.name, encoded: m.encoded, storage: mem.storage(m), acc: m.retrievalAccessibility, cons: m.consolidation, int: m.interference })),
      skill: this.game.skill.bestEfficiency(),
      efficiency: this.game.plasticity.computeEfficiency(),
    };
  }

  start() {
    if (this.active) return;
    const g = this.game;
    g.attention.endSession(true); g.attention.ambient = []; g.memory.cancelRecall();
    this.active = true; this.t = 0; this.phaseIndex = -1;
    this.replays = 0; this.replayCounts = {}; this.downscaled = 0; this.stabilized = 0; this.integrations = 0;
    this.timers = { wave: 0.8, ripple: 1.6, rem: 0.5 };
    this.before = this.snapshot(); this.summary = null;
    g.audio.sleep(true);
    document.body.classList.add('sleeping');
    g.bus.emit('SLEEP_STARTED', {});
  }

  stop() { if (this.active) this.finish(true); }

  update(dt) {
    if (!this.active) return;
    const g = this.game, sim = g.sim;
    this.t += dt;
    let pi = SLEEP_PHASES.findIndex((p) => this.t < p.until);
    if (pi < 0) pi = SLEEP_PHASES.length - 1;
    if (pi !== this.phaseIndex) { this.phaseIndex = pi; this.onPhase(SLEEP_PHASES[pi]); }
    const ph = SLEEP_PHASES[pi];
    sim.activityScale = ph.id === 'drift' ? lerp(0.9, 0.25, this.t / 5) : ph.id === 'deep' ? 0.16 : ph.id === 'rem' ? 0.45 : lerp(0.45, 1, (this.t - 33) / 7);
    if (ph.id === 'drift' || ph.id === 'deep') {
      this.timers.wave -= dt;
      if (this.timers.wave <= 0) { this.timers.wave = ph.id === 'deep' ? 2.4 : 3; this.slowWave(); }
    }
    if (ph.id === 'deep') {
      this.timers.ripple -= dt;
      if (this.timers.ripple <= 0) { this.timers.ripple = 1.45; this.replayNext(); }
    }
    if (ph.id === 'rem') {
      this.timers.rem -= dt;
      if (this.timers.rem <= 0) { this.timers.rem = 1.1; this.dreamRecombine(); }
    }
    for (const m of g.memory.list) if (m.encoded) m.interference = Math.max(0.03, m.interference - dt * 0.004);
    g.attention.distraction = Math.max(0.02, g.attention.distraction - dt * 0.05);
    g.attention.energy = Math.min(1, g.attention.energy + dt * 0.03);
    if (this.t >= this.duration) this.finish(false);
  }

  onPhase(ph) {
    this.game.ui.journal(`Sleep · ${ph.name}`);
    if (ph.id === 'rem') this.downscale();
    this.game.ui.markDirty('panel', 'overlay');
  }

  /** Synchronised cortical "up states": several regions burst together. */
  slowWave() {
    const sim = this.game.sim;
    shuffle(sim.regions.filter((r) => r.id !== 'reward')).slice(0, 4)
      .forEach((r, i) => sim.regionalWave(r, { delay: i * 0.08, spread: 0.1, cause: 'slow-wave', kind: 'slow' }));
    this.game.renderer?.pulseFog(0.6);
  }

  replayNext() {
    const g = this.game;
    const cands = g.memory.list.filter((m) => m.encoded).map((m) => ({ m, w: 0.25 + m.recentActivity + (1 - m.consolidation) * 0.8 }));
    const skillEff = g.skill.bestEfficiency();
    if (g.skill.totalReps() > 0) cands.push({ skill: true, w: 0.35 + Math.min(0.8, g.skill.recentPractice) });
    if (!cands.length) return;
    let r = Math.random() * cands.reduce((s, c) => s + c.w, 0), choice = cands[0];
    for (const c of cands) { r -= c.w; if (r <= 0) { choice = c; break; } }
    if (choice.skill) {
      g.skill.replay();
      this.replays++; this.replayCounts.skill = (this.replayCounts.skill || 0) + 1;
      this.lastReplay = 'Piano sequence';
      g.ui.floatAt(g.sim.regionById.motor.center, 'REPLAY · SKILL', '#a99bff');
      g.bus.emit(EV.SLEEP_REPLAY, { skill: true, efficiency: skillEff });
    } else this.replayMemory(choice.m);
  }

  replayMemory(m) {
    const g = this.game, sim = g.sim;
    const seq = [...m.indexNeurons, ...shuffle(m.features.map((f) => f.neuron))];
    seq.forEach((n, i) => sim.schedule(i * 0.11, () => sim.fire(n, { forced: true, driven: true, kind: 'replay', cause: 'replay' })));
    const gain = g.memory.consolidate(m, 0.12 * (0.6 + 0.4 * Math.min(1, m.recentActivity + 0.4)));
    m.retrievalAccessibility = clamp(m.retrievalAccessibility + 0.03 * (1 - m.retrievalAccessibility));
    m.interference = clamp(m.interference * 0.95);
    for (const id of m.associatedSynapseIds) { const s = sim.synapses[id]; s.longTermStability = clamp(s.longTermStability + 0.04 * (1 - s.longTermStability)); }
    m.recentActivity *= 0.75;
    this.replays++; this.replayCounts[m.id] = (this.replayCounts[m.id] || 0) + 1;
    this.lastReplay = m.name;
    const hip = sim.regionById.hippocampus.center;
    g.renderer?.addRing(hip, [0.66, 0.6, 1], 1.4);
    g.ui.floatAt(hip, `REPLAY · ${m.name.toUpperCase()}`, '#b8acff');
    if (gain > 0.004) g.ui.floatAt(m.features[0].neuron.position, `CONSOLIDATION ${pts(gain)}`, '#a99bff');
    g.audio.dreamTone();
    g.bus.emit(EV.SLEEP_REPLAY, { memory: m, gain });
  }

  /** REM-like phase: fragments of different memories co-activate; related ones integrate. */
  dreamRecombine() {
    const g = this.game, sim = g.sim;
    const enc = g.memory.list.filter((m) => m.encoded);
    if (!enc.length) { sim.regionalWave(pick(sim.regions), { spread: 0.15, kind: 'slow', cause: 'dream' }); return; }
    const a = pick(enc), b = pick(enc);
    const fa = pick(a.features).neuron, fb = pick(b.features).neuron;
    sim.fire(fa, { forced: true, kind: 'dream', cause: 'dream' });
    sim.schedule(0.15, () => sim.fire(fb, { forced: true, kind: 'dream', cause: 'dream' }));
    if (a !== b && a.consolidation > 0.3 && b.consolidation > 0.3) {
      const syn = sim.connect(a.features[0].neuron, b.features[0].neuron, 0.12, { networks: ['integration'], protected: true, baseline: 0.1 });
      if (syn) { g.plasticity.change(syn, 0.05 * (1 - syn.weight), 'driven'); syn.longTermStability = clamp(syn.longTermStability + 0.05); }
      this.integrations++;
      if (this.integrations % 2 === 1) g.ui.floatAt(V3.lerp(fa.position, fb.position, 0.5), `LINKING ${a.name.toUpperCase()} ↔ ${b.name.toUpperCase()}`, '#c9bfff');
    }
  }

  /** One hypothesis (synaptic homeostasis): weak unused links shrink; useful ones stabilise. */
  downscale() {
    const sim = this.game.sim;
    let down = 0, st = 0;
    for (const s of sim.synapses) {
      if (!s.enabled) continue;
      if (!s.protected && s.networkMembership.size === 0 && s.weight < 0.3 && sim.time - s.lastActivationTime > 20) {
        s.weight = Math.max(PL.W_MIN, s.weight - (s.weight - s.baseline * 0.8) * 0.15); down++;
      } else if (s.weight > 0.5 && s.networkMembership.has('trainable')) {
        s.longTermStability = clamp(s.longTermStability + 0.06); st++;
      }
    }
    this.downscaled = down; this.stabilized = st;
    this.game.ui.floatAt([0, 3.6, 0], `DOWNSCALING ${down} WEAK LINKS · STABILISING ${st}`, '#a99bff');
  }

  finish(early) {
    const g = this.game;
    this.active = false;
    g.sim.activityScale = 1;
    g.audio.sleep(false);
    document.body.classList.remove('sleeping');
    const after = this.snapshot();
    this.summary = { early, before: this.before, after, replays: this.replays, replayCounts: { ...this.replayCounts }, downscaled: this.downscaled, stabilized: this.stabilized, integrations: this.integrations, duration: this.t };
    if (!early) {
      this.cycles++;
      g.bus.emit(EV.CONSOLIDATION_COMPLETE, { summary: this.summary });
    } else g.ui.journal('Woken early — changes made so far are kept.');
    g.ui.markDirty('panel', 'overlay', 'bar');
  }
}
/* ==========================================================================
   REPAIR SYSTEM
   An isolated circuit SOURCE → RELAY 1 → MAIN RELAY → TARGET. Disabling the
   main relay blocks the signal. The player grows new connections (limited
   reach and growth resources) through candidate neurons, then *practises*
   the new route: new synapses start weak and cannot drive the next cell
   until repeated activation strengthens them. A graph-routing analogy for
   network adaptation — not a model of treatment or recovery from injury.
   ========================================================================== */
class RepairSystem {
  constructor(game) {
    this.game = game;
    this.phase = 'intact';          // intact → damaged → building → forming → restored
    this.maxGrowth = 4; this.growth = 4; this.reach = 1.85;
    this.built = []; this.testing = null; this.lastTest = null;
    this.practices = 0; this.practicing = false; this.tests = 0;
    this.restored = false; this.everRestored = false;
    this.onArrival = this.onArrival.bind(this);
  }

  install(sim) {
    const k = (x) => sim.n(x);
    this.source = k('rep_source'); this.r1 = k('rep_r1'); this.r2 = k('rep_r2'); this.target = k('rep_target');
    this.candidates = ['rep_c1', 'rep_c2', 'rep_c3', 'rep_c4'].map(k);
    this.nodes = [this.source, this.r1, this.r2, this.target, ...this.candidates];
    this.nodeSet = new Set(this.nodes);
    for (const n of this.nodes) n.networkMembership.add('repair');
    const opts = { networks: ['repair'], protected: true, stability: 0.8, baseline: 0.9, set: true };
    this.original = [sim.connect(this.source, this.r1, 0.93, opts), sim.connect(this.r1, this.r2, 0.93, opts), sim.connect(this.r2, this.target, 0.93, opts)];
  }

  isNode(n) { return this.nodeSet.has(n); }
  get damaged() { return this.r2.health <= 0; }

  damage() {
    if (this.damaged) return;
    const g = this.game;
    this.r2.health = 0; this.r2.activation = 0; this.r2.flash = 0;
    this.phase = this.route() ? 'forming' : 'damaged';
    this.restored = false; this.lastTest = null;
    g.renderer?.addRing(this.r2.position, [1, 0.35, 0.4], 1.5);
    g.ui.floatAt(this.r2.position, 'MAIN RELAY OFFLINE', '#ff8a96');
    g.audio.error(0.8);
    g.bus.emit(EV.PATHWAY_DAMAGED, { neuron: this.r2 });
  }

  canConnect(a, b) {
    const sim = this.game.sim;
    if (!a || !b) return { ok: false, reason: 'Choose two neurons.' };
    if (!this.isNode(a) || !this.isNode(b)) return { ok: false, reason: 'Choose neurons from the highlighted repair circuit.' };
    if (a === b) return { ok: false, reason: 'Choose two different neurons.' };
    if (a.health <= 0 || b.health <= 0) return { ok: false, reason: 'The offline relay cannot form new connections.' };
    if (a === this.target) return { ok: false, reason: 'TARGET is the end of the route. Start from an upstream neuron.' };
    if (b === this.source) return { ok: false, reason: 'Signals should flow toward TARGET, not back into SOURCE.' };
    const existing = sim.synapseBetween(a, b);
    if (existing && existing.enabled) return { ok: false, reason: 'These neurons are already connected.' };
    const d = V3.dist(a.position, b.position);
    if (d > this.reach) return { ok: false, far: true, dist: d, reason: `Too far for a new connection (${d.toFixed(1)} > ${this.reach.toFixed(1)} units). Route through an intermediate neuron.` };
    if (this.growth <= 0) return { ok: false, reason: 'No growth resources left. Remove an unused new connection to recover one.' };
    return { ok: true, dist: d };
  }

  grow(a, b) {
    const chk = this.canConnect(a, b);
    if (!chk.ok) return chk;
    const g = this.game, sim = g.sim;
    const syn = sim.connect(a, b, 0.35, { custom: true, networks: ['repair', 'trainable'], protected: true, baseline: 0.2, set: true });
    syn.myelinLevel = 0; syn.longTermStability = 0.05;
    if (!this.built.includes(syn)) this.built.push(syn);
    this.growth--;
    if (this.damaged) this.phase = this.route() ? 'forming' : 'building';
    const mid = syn.pointAt(0.5, [0, 0, 0]);
    g.renderer?.addRing(mid, [0.45, 0.9, 0.6], 0.8);
    g.ui.floatAt(mid, 'NEW CONNECTION · WEAK', '#74e39a');
    g.audio.strengthen(0.5);
    g.bus.emit('SYNAPSE_GROWN', { synapse: syn });
    return { ok: true, synapse: syn };
  }

  removeBuilt(syn) {
    if (!this.built.includes(syn)) return false;
    syn.enabled = false;
    this.built = this.built.filter((s) => s !== syn);
    this.growth = Math.min(this.maxGrowth, this.growth + 1);
    if (this.damaged) this.phase = this.route() ? 'forming' : (this.built.length ? 'building' : 'damaged');
    return true;
  }

  /** Breadth-first search for a functional route SOURCE → TARGET (offline cells excluded). */
  route() {
    const prev = new Map(), q = [this.source], seen = new Set(q);
    while (q.length) {
      const cur = q.shift();
      if (cur === this.target) {
        const path = [cur];
        let c = cur;
        while (prev.has(c)) { c = prev.get(c); path.unshift(c); }
        return path;
      }
      for (const s of cur.outgoing) {
        if (!s.enabled || !this.isNode(s.target) || s.target.health <= 0 || seen.has(s.target)) continue;
        seen.add(s.target); prev.set(s.target, cur); q.push(s.target);
      }
    }
    return null;
  }
  routeSynapses(path) { const sim = this.game.sim; const out = []; for (let i = 0; i < path.length - 1; i++) out.push(sim.synapseBetween(path[i], path[i + 1])); return out; }
  /** Bottleneck weight of the current route (0 if none). */
  routeStrength() { const p = this.route(); if (!p) return 0; return Math.min(...this.routeSynapses(p).map((s) => s.weight)); }
  /** Weight needed for one synapse to fire its (attended) target alone in this model. */
  get driveThreshold() { const t = this.target; return t.threshold / (this.game.sim.synapticGain * Math.max(0.5, t.gain)); }

  test() {
    if (this.testing) return 'busy';
    const sim = this.game.sim;
    const tag = 'rtest' + (++this.tests);
    this.testing = { tag, t: 0, reached: new Set([this.source]), blockedAt: null, weakAt: null, success: false };
    sim.arrivalListeners.add(this.onArrival);
    sim.fire(this.source, { forced: true, kind: 'test', tag, cause: 'test' });
    this.game.audio.tick(0.8);
    return 'ok';
  }
  onArrival(sig, fired, spawned, blocked) {
    const r = this.testing;
    if (!r || sig.tag !== r.tag) return;
    const tgt = sig.synapse.target, g = this.game;
    if (blocked) { if (!r.blockedAt) { r.blockedAt = tgt; g.ui.floatAt(tgt.position, 'SIGNAL BLOCKED ✗', '#ff8a96'); g.renderer?.addRing(tgt.position, [1, 0.35, 0.4], 1); } }
    else if (fired) { r.reached.add(tgt); if (tgt === this.target) r.success = true; }
    else if (this.isNode(tgt) && !r.weakAt) { r.weakAt = tgt; g.ui.floatAt(tgt.position, 'TOO WEAK TO FIRE', '#fbbf5b'); }
  }
  update(dt) {
    const r = this.testing;
    if (!r) return;
    r.t += dt;
    const inflight = this.game.sim.signals.some((s) => s.tag === r.tag);
    if (r.success || (!inflight && r.t > 0.4) || r.t > 9) this.finishTest();
  }
  finishTest() {
    const r = this.testing, g = this.game;
    this.testing = null;
    g.sim.arrivalListeners.delete(this.onArrival);
    const ok = r.success, damaged = this.damaged;
    const path = this.route();
    this.lastTest = { ok, damaged, blockedAt: r.blockedAt, weakAt: r.weakAt, reached: r.reached.size, routeLength: path ? path.length : 0, viaBypass: !!path && path.some((n) => this.candidates.includes(n)) };
    g.bus.emit(EV.ROUTE_TESTED, { ok, damaged });
    if (ok) {
      g.renderer?.addRing(this.target.position, [0.45, 0.95, 0.6], 1.6);
      g.ui.floatAt(this.target.position, damaged ? 'FUNCTION RESTORED ✓' : 'SIGNAL DELIVERED ✓', '#74e39a');
      g.audio.success();
      if (damaged && !this.restored) {
        this.restored = true; this.everRestored = true; this.phase = 'restored';
        g.bus.emit(EV.PATHWAY_REPAIRED, { route: path });
        g.reward.outcome('repair', 1, { label: 'REWARD · FUNCTION RESTORED' });
      }
    } else {
      g.ui.floatAt(this.target.position, 'NO SIGNAL AT TARGET', '#ff8a96');
      g.audio.error(0.6);
    }
    g.ui.markDirty('panel', 'bar');
  }

  /** Guided repeated activation along the new route (rehabilitation-inspired practice). */
  practice() {
    const path = this.route();
    if (!path) return 'noroute';
    if (this.practicing || this.testing) return 'busy';
    const g = this.game, sim = g.sim;
    this.practicing = true; this.practices++;
    g.plasticity.learningScale = 2;
    path.forEach((n, i) => sim.schedule(i * 0.32, () => sim.fire(n, { forced: true, driven: true, kind: 'repair', cause: 'practice' })));
    sim.schedule(path.length * 0.32 + 0.25, () => {
      g.reward.outcome('repair-practice', 0.6, { floor: 0.15, label: 'PRACTICE · REINFORCED' });
      g.plasticity.learningScale = 1;
      this.practicing = false;
      const s = this.routeStrength();
      g.ui.floatAt(this.target.position, `ROUTE STRENGTH ${pct(s)}`, '#74e39a');
      g.ui.markDirty('panel', 'bar');
    });
    return 'ok';
  }

  reset() {
    const g = this.game;
    this.r2.health = 1;
    for (const s of this.built) s.enabled = false;
    this.built = []; this.growth = this.maxGrowth;
    this.phase = 'intact'; this.restored = false; this.lastTest = null; this.practices = 0;
    if (this.testing) { g.sim.arrivalListeners.delete(this.onArrival); this.testing = null; }
    g.plasticity.learningScale = 1; this.practicing = false;
  }

  statusLines() {
    const path = this.route(), strength = this.routeStrength(), need = this.driveThreshold;
    const original = this.damaged ? 'DAMAGED' : 'INTACT';
    let alt = 'NOT NEEDED';
    if (this.damaged) alt = !this.built.length ? 'NONE YET' : !path ? 'INCOMPLETE' : strength < need ? 'FORMING' : 'READY TO TEST';
    const fn = this.restored ? 'FUNCTION RESTORED' : this.damaged ? 'FUNCTION LOST' : 'FUNCTION OK';
    return { original, alt, fn, strength, need, path };
  }
}
/* ==========================================================================
   KNOWLEDGE SYSTEM (Build mode)
   Concepts are nodes; correctly identified relationships become links. The
   graph is laid out with a small 3D force simulation around the brain.
   Interconnection is rewarded more than isolated additions:
     knowledge density = links / possible links among placed concepts
     retrieval routes  = mean links per concept (ways in to each idea)
     network complexity = independent loops (links − concepts + components)
   ========================================================================== */
class KnowledgeSystem {
  constructor(game) {
    this.game = game;
    this.placed = new Set(['neuron']);
    this.links = new Map();          // relationId → { source }
    this.pos = {}; this.vel = {}; this.anchor = {};
    this.question = null; this.selected = null;
    this.streak = 0; this.bestStreak = 0; this.answered = 0; this.mistakes = 0;
    this.linkAnim = new Map();        // relationId → time created (for spark animation)
    this.initPositions();
  }

  initPositions() {
    const center = [0, 0.9, 0.4];
    CONCEPTS.forEach((c, i) => {
      let a;
      if (c.root) a = [0, 1.2, 0.9];
      else {
        const reg = REGION_BY_ID[c.region] || { center };
        const dir = V3.norm(V3.sub(reg.center, center));
        const rnd = keyedRandom('concept:' + c.id);
        a = V3.add(V3.add(center, V3.scale(dir, 2.4 + rnd() * 1.1)), [(rnd() - 0.5) * 1.4, 0.7 + (rnd() - 0.5) * 1.2, (rnd() - 0.5) * 1.4 + 1.0]);
      }
      this.anchor[c.id] = a; this.pos[c.id] = a.slice(); this.vel[c.id] = [0, 0, 0];
    });
  }

  relation(a, b) { return RELATIONS.find((r) => (r.a === a && r.b === b) || (r.a === b && r.b === a)) || null; }
  isLinked(relId) { return this.links.has(relId); }
  degree(cid) { let d = 0; for (const id of this.links.keys()) { const r = RELATIONS[id]; if (r.a === cid || r.b === cid) d++; } return d; }

  /** Concepts reachable from NEURON through links. */
  connectedSet() {
    const seen = new Set(['neuron']), q = ['neuron'];
    while (q.length) {
      const c = q.shift();
      for (const id of this.links.keys()) {
        const r = RELATIONS[id];
        const o = r.a === c ? r.b : r.b === c ? r.a : null;
        if (o && !seen.has(o)) { seen.add(o); q.push(o); }
      }
    }
    return seen;
  }
  isolated() { const conn = this.connectedSet(); return [...this.placed].filter((c) => !conn.has(c)); }

  metrics() {
    const N = this.placed.size, E = this.links.size;
    const conn = this.connectedSet();
    // components among placed concepts
    const seen = new Set(); let C = 0;
    for (const c of this.placed) {
      if (seen.has(c)) continue;
      C++; const q = [c]; seen.add(c);
      while (q.length) {
        const x = q.shift();
        for (const id of this.links.keys()) { const r = RELATIONS[id]; const o = r.a === x ? r.b : r.b === x ? r.a : null; if (o && !seen.has(o)) { seen.add(o); q.push(o); } }
      }
    }
    return {
      concepts: conn.size, placed: N, total: CONCEPTS.length, links: E,
      density: N > 1 ? E / (N * (N - 1) / 2) : 0,
      routes: N ? (2 * E) / N : 0,
      complexity: Math.max(0, E - N + C),
      isolated: N - conn.size,
    };
  }

  available() { return RELATIONS.filter((r) => !this.links.has(r.id) && (this.placed.has(r.a) || this.placed.has(r.b))); }

  /** relId (optional): ask about that specific relationship when it is available (Demo Mode). */
  nextQuestion(focusId = null, relId = null) {
    let pool = this.available();
    if (focusId) { const f = pool.filter((r) => r.a === focusId || r.b === focusId); if (f.length) pool = f; }
    if (!pool.length) { this.question = null; return null; }
    const conn = this.connectedSet(), iso = new Set(this.isolated());
    const bridging = pool.filter((r) => (iso.has(r.a) && conn.has(r.b)) || (iso.has(r.b) && conn.has(r.a)));
    const cross = pool.filter((r) => this.placed.has(r.a) && this.placed.has(r.b));
    const expand = pool.filter((r) => !(this.placed.has(r.a) && this.placed.has(r.b)));
    const choice = pool.find((r) => r.id === relId) || (bridging.length ? pick(bridging) : (cross.length && (Math.random() < 0.55 || !expand.length)) ? pick(cross) : pick(expand.length ? expand : pool));
    const options = shuffle([{ text: choice.right, ok: true }, ...choice.wrong.map((t) => ({ text: t, ok: false }))]);
    this.question = { rel: choice, options, answered: null, wrong: [] };
    return this.question;
  }

  answer(i) {
    const q = this.question, g = this.game;
    if (!q || q.answered !== null) return null;
    const opt = q.options[i];
    if (!opt) return null;
    if (!opt.ok) {
      if (!q.wrong.includes(i)) q.wrong.push(i);
      this.streak = 0; this.mistakes++;
      g.audio.error(0.5);
      return { ok: false };
    }
    q.answered = i;
    const r = q.rel;
    const newConcept = !this.placed.has(r.a) ? r.a : !this.placed.has(r.b) ? r.b : null;
    const iso = new Set(this.isolated());
    const bridged = iso.has(r.a) || iso.has(r.b);
    this.placed.add(r.a); this.placed.add(r.b);
    if (newConcept) { const other = newConcept === r.a ? r.b : r.a; this.pos[newConcept] = V3.add(this.pos[other], [(Math.random() - 0.5) * 1.2, 0.8, (Math.random() - 0.5) * 1.2]); }

    g.ui.floatAt(V3.lerp(this.pos[r.a], this.pos[r.b], 0.5), cross ? 'NEW RETRIEVAL ROUTE ↑' : 'CONCEPT CONNECTED', '#f5d38a');
    g.audio.success();
    g.bus.emit(EV.CONCEPT_CONNECTED, { relation: r, newConcept, cross, bridged, links: this.links.size });
    return { ok: true, newConcept, cross, bridged };
  }

  /** Cross-mode integration: what was learned elsewhere appears here. */
  syncFromOtherModes() {
    const g = this.game, added = [];
    const auto = (a, b, source) => {
      const r = this.relation(a, b);
      if (r && !this.links.has(r.id)) { this.placed.add(a); this.placed.add(b); this.links.set(r.id, { source }); added.push(`${CONCEPT_BY_ID[a].label}–${CONCEPT_BY_ID[b].label}`); }
    };
    const place = (c) => { if (!this.placed.has(c)) { this.placed.add(c); added.push(CONCEPT_BY_ID[c].label); } };
    const ms = g.missions;
    if (ms.isDone('word')) { auto('plasticity', 'learning', 'learn'); auto('learning', 'memory', 'learn'); auto('plasticity', 'brain', 'learn'); }
    if (ms.isDone('sequence')) { auto('synapse', 'plasticity', 'learn'); }
    if (g.memory.encodedCount() > 1 || ms.isDone('redbird')) place('memory');
    if (g.sleep.cycles > 0) auto('memory', 'sleep', 'dream');
    if (Object.values(g.skill.stage).some((s) => s !== 'beginner')) place('myelin');
    if (g.attention.sessions > 0) place('attention');
    if (g.reward.count > 0) place('reward');
    if (g.stats.gliaTypes.size > 0) place('glia');
    return added;
  }

  update(dt) {
    const ids = [...this.placed];
    const F = {};
    for (const id of ids) F[id] = [0, 0, 0];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = ids[i], b = ids[j];
      const d = V3.sub(this.pos[a], this.pos[b]);
      const dist2 = d[0] * d[0] + d[1] * d[1] + d[2] * d[2] + 0.05;
      const f = 1.8 / dist2, dist = Math.sqrt(dist2);
      for (let k = 0; k < 3; k++) { F[a][k] += d[k] / dist * f; F[b][k] -= d[k] / dist * f; }
    }
    for (const id of this.links.keys()) {
      const r = RELATIONS[id];
      if (!this.placed.has(r.a) || !this.placed.has(r.b)) continue;
      const d = V3.sub(this.pos[r.b], this.pos[r.a]);
      const dist = V3.len(d) || 1e-3;
      const f = (dist - 2.15) * 0.55;
      for (let k = 0; k < 3; k++) { F[r.a][k] += d[k] / dist * f; F[r.b][k] -= d[k] / dist * f; }
    }
    for (const id of ids) {
      const anc = this.anchor[id], p = this.pos[id], v = this.vel[id];
      const k = CONCEPT_BY_ID[id].root ? 1.2 : 0.12;
      for (let i = 0; i < 3; i++) {
        F[id][i] += (anc[i] - p[i]) * k;
        v[i] = (v[i] + F[id][i] * dt) * Math.exp(-dt * 2.2);
        p[i] += v[i] * dt;
      }
    }
  }
}
/* ==========================================================================
   SKILL SYSTEM (Train mode)
   Four motor neurons map to the A S D F keys. Each practised transition
   (key i → key j) is a real synapse that strengthens through timing-based
   plasticity and reward, and grows myelin with repeated driven use.
     BEGINNER  weak transitions → the prefrontal "control" cell must assist
     PRACTICE  stronger transitions → the next note is pre-activated
     SKILLED   efficient transitions → the network can play the sequence alone
   ========================================================================== */
class SkillSystem {
  constructor(game) {
    this.game = game;
    this.seqId = 'run'; this.pos = 0;
    this.lastPress = null; this.repStart = null; this.repErrors = 0;
    this.presses = 0; this.errors = 0;
    this.recent = [];                // rolling window of key presses
    this.reps = Object.fromEntries(PIANO.sequences.map((s) => [s.id, 0]));
    this.stage = Object.fromEntries(PIANO.sequences.map((s) => [s.id, 'beginner']));
    this.bestRepTime = {};
    this.lastRep = null; this.predicted = -1;
    this.auto = null; this.preview = null;
    this.recentPractice = 0;
    this.keyFlash = [0, 0, 0, 0];
  }

  install(sim) {
    this.keys = PIANO.neurons.map((k) => sim.n(k));
    this.cereb = PIANO.cereb.map((k) => sim.n(k));
    this.control = sim.n(PIANO.control);
    this.control.label = 'Conscious control';
    this.keys.forEach((k, i) => {
      k.label = `Key ${PIANO.keys[i]} · note ${PIANO.notes[i]}`; k.networkMembership.add('skill');
      this.cereb[i].label = 'Cerebellar refinement'; this.cereb[i].networkMembership.add('skill');
      sim.connect(k, this.cereb[i], 0.24, { networks: ['skill'], protected: true, tract: true });
      sim.connect(this.control, k, 0.5, { networks: ['skill-control'], protected: true });
    });
    for (const seq of PIANO.sequences) {
      for (let i = 0; i < seq.notes.length - 1; i++) {
        const a = seq.notes[i], b = seq.notes[i + 1];
        if (a === b) continue;
        sim.connect(this.keys[a], this.keys[b], 0.1, { networks: ['skill', 'skill:' + seq.id, 'trainable'], protected: true, baseline: 0.08 });
        sim.connect(this.cereb[a], this.keys[b], 0.08, { networks: ['skill', 'skill:' + seq.id], protected: true, tract: true, baseline: 0.06 });
      }
    }
  }

  get seq() { return PIANO.sequences.find((s) => s.id === this.seqId); }
  transitions(seq = this.seq) {
    const sim = this.game.sim, out = [];
    for (let i = 0; i < seq.notes.length - 1; i++) {
      const s = sim.synapseBetween(this.keys[seq.notes[i]], this.keys[seq.notes[i + 1]]);
      if (s && !out.includes(s)) out.push(s);
    }
    return out;
  }
  /** Network efficiency for a sequence (game index): mean weight × myelin factor of its transitions. */
  efficiency(seqId = this.seqId) {
    const tr = this.transitions(PIANO.sequences.find((s) => s.id === seqId));
    return tr.length ? tr.reduce((s, x) => s + x.efficiency, 0) / tr.length : 0;
  }
  bestEfficiency() { return Math.max(...PIANO.sequences.map((s) => this.efficiency(s.id))); }
  totalReps() { return Object.values(this.reps).reduce((a, b) => a + b, 0); }
  stageFor(eff) { let st = SKILL_STAGES[0]; for (const s of SKILL_STAGES) if (eff >= s.min) st = s; return st; }

  metrics() {
    const eff = this.efficiency();
    const win = this.recent.slice(-24);
    const errorRate = win.length ? win.filter((x) => !x.ok).length / win.length : 0;
    const ints = win.filter((x) => x.ok && x.interval).map((x) => x.interval);
    const reaction = ints.length ? ints.reduce((a, b) => a + b, 0) / ints.length : null;
    const assists = win.filter((x) => x.ok && x.interval != null);
    const assistRate = assists.length ? assists.filter((x) => x.assisted).length / assists.length : 1 - eff;
    const effort = clamp(0.1 + 0.55 * (1 - eff) + 0.35 * assistRate);
    // Displayed stage is the highest reached; efficiency can still fade with disuse.
    const reached = SKILL_STAGES.find((s) => s.id === this.stage[this.seqId]) || SKILL_STAGES[0];
    const now = this.stageFor(eff);
    const stage = SKILL_STAGES.indexOf(now) > SKILL_STAGES.indexOf(reached) ? now : reached;
    return { eff, errorRate, reaction, speed: reaction ? 1 / reaction : 0, effort, stage, fading: eff < reached.min - 0.05, reps: this.reps[this.seqId], presses: this.presses };
  }

  setSequence(id) {
    if (!PIANO.sequences.some((s) => s.id === id)) return;
    this.seqId = id; this.pos = 0; this.repErrors = 0; this.predicted = -1; this.lastPress = null;
  }
  busy() { return !!(this.auto || this.preview); }

  press(i) {
    const g = this.game, sim = g.sim;
    if (this.busy()) return 'busy';
    const seq = this.seq, expected = seq.notes[this.pos], now = sim.time;
    this.presses++;
    this.keyFlash[i] = 1;
    g.audio.note(PIANO.freqs[i]);
    if (i === expected) {
      let interval = null, assisted = false;
      if (this.pos === 0) { this.repStart = now; this.repErrors = 0; }
      else {
        interval = now - this.lastPress;
        const syn = sim.synapseBetween(this.keys[seq.notes[this.pos - 1]], this.keys[i]);
        assisted = !syn || syn.efficiency < 0.45;
        if (assisted) {
          // Weak transition: conscious (prefrontal) control has to drive the next movement.
          sim.fire(this.control, { forced: true, kind: 'control', cause: 'effort', noSpawn: true });
          sim.visualPulse(sim.synapseBetween(this.control, this.keys[i]), 'control', 0.5);
        }
      }
      g.plasticity.learningScale = 1.5;   // deliberate practice: focused, repeated, with feedback
      sim.fire(this.keys[i], { forced: true, driven: true, kind: 'skill', cause: 'practice' });
      g.plasticity.learningScale = 1;
      this.recent.push({ ok: true, interval, assisted }); if (this.recent.length > 60) this.recent.shift();
      this.lastPress = now; this.pos++;
      this.recentPractice = Math.min(1, this.recentPractice + 0.05);
      if (this.pos >= seq.notes.length) this.completeRep();
      else {
        const next = sim.synapseBetween(this.keys[i], this.keys[seq.notes[this.pos]]);
        this.predicted = next && next.weight > 0.35 ? seq.notes[this.pos] : -1;
        if (this.predicted >= 0) this.keys[this.predicted].flash = Math.max(this.keys[this.predicted].flash, 0.45 * next.weight);
      }
      return 'ok';
    }
    sim.fire(this.keys[i], { forced: true, driven: true, kind: 'skill', cause: 'practice' });
    this.errors++; this.repErrors++;
    this.recent.push({ ok: false }); if (this.recent.length > 60) this.recent.shift();
    this.pos = 0; this.predicted = -1; this.lastPress = null;
    g.audio.error(0.4);
    g.ui.floatAt(this.keys[i].position, 'ERROR RATE ↑', '#ff8a96');
    g.bus.emit('SKILL_ERROR', { note: i, expected });
    return 'error';
  }

  completeRep() {
    const g = this.game, seq = this.seq, now = g.sim.time;
    this.reps[seq.id]++;
    const time = now - (this.repStart ?? now), clean = this.repErrors === 0;
    if (clean) this.bestRepTime[seq.id] = Math.min(this.bestRepTime[seq.id] ?? Infinity, time);
    const { rpe } = g.reward.outcome('skill:' + seq.id, clean ? 1 : 0.55, { label: 'REWARD · SEQUENCE COMPLETE', floor: 0.06 });
    const eff = this.efficiency(seq.id);
    this.lastRep = { time, clean, rpe, eff, n: this.reps[seq.id] };
    this.pos = 0; this.repErrors = 0; this.predicted = -1; this.lastPress = null;
    const prev = this.stage[seq.id], st = this.stageFor(eff);
    const order = (id) => SKILL_STAGES.findIndex((s) => s.id === id);
    if (order(st.id) > order(prev)) {
      this.stage[seq.id] = st.id;
      g.bus.emit(EV.SKILL_STAGE, { sequence: seq, stage: st });
    }
    g.bus.emit(EV.SKILL_SEQUENCE, { sequence: seq, reps: this.reps[seq.id], clean, eff, rpe });
  }

  /** "Let the network play": the chain runs only if each transition can drive the next cell alone. */
  autoplay() {
    if (this.busy()) return 'busy';
    const g = this.game, sim = g.sim, seq = this.seq;
    this.auto = { seq, step: 0, ok: null };
    const playStep = (i) => {
      const n = this.keys[seq.notes[i]];
      sim.fire(n, { forced: true, kind: 'skill', cause: 'auto', noSpawn: true });
      this.keyFlash[seq.notes[i]] = 1; g.audio.note(PIANO.freqs[seq.notes[i]]);
      this.auto.step = i;
      if (i >= seq.notes.length - 1) { sim.schedule(0.4, () => this.finishAuto(true, i + 1)); return; }
      const next = this.keys[seq.notes[i + 1]];
      const syn = sim.synapseBetween(n, next);
      const drive = syn ? syn.weight * sim.synapticGain * next.gain : 0;
      const delay = syn ? sim.travelTime(syn) : 0.6;
      if (syn) sim.visualPulse(syn, 'skill');
      if (syn && drive >= next.threshold) sim.schedule(delay, () => playStep(i + 1));
      else sim.schedule(delay, () => { g.ui.floatAt(next.position, 'CHAIN STOPS · TOO WEAK', '#fbbf5b'); this.finishAuto(false, i + 1); });
    };
    playStep(0);
    return 'ok';
  }
  finishAuto(ok, reached) {
    const seq = this.auto?.seq || this.seq;
    this.auto = null;
    this.lastAuto = { ok, reached, total: seq.notes.length, seq: seq.id };
    if (ok) { this.game.audio.success(); this.game.ui.floatAt(this.keys[seq.notes[seq.notes.length - 1]].position, 'PLAYED BY THE NETWORK ✓', '#60b8ff'); }
    this.game.ui.markDirty('panel', 'overlay', 'bar');
  }

  /** Demonstration of the target sequence (no learning credit). */
  playPreview() {
    if (this.busy()) return 'busy';
    const g = this.game, sim = g.sim, seq = this.seq;
    this.preview = true;
    seq.notes.forEach((note, i) => sim.schedule(i * 0.5, () => { sim.fire(this.keys[note], { forced: true, kind: 'skill', cause: 'preview' }); this.keyFlash[note] = 1; g.audio.note(PIANO.freqs[note]); }));
    sim.schedule(seq.notes.length * 0.5 + 0.2, () => { this.preview = null; g.ui.markDirty('panel', 'overlay'); });
    return 'ok';
  }

  /** Compressed offline replay during sleep. */
  replay() {
    const sim = this.game.sim;
    const best = PIANO.sequences.filter((s) => this.reps[s.id] > 0).sort((a, b) => this.reps[b.id] - this.reps[a.id])[0] || this.seq;
    best.notes.forEach((note, i) => sim.schedule(i * 0.09, () => sim.fire(this.keys[note], { forced: true, driven: true, kind: 'replay', cause: 'replay' })));
    this.recentPractice *= 0.7;
  }

  update(dt) {
    for (let i = 0; i < 4; i++) if (this.keyFlash[i] > 0) this.keyFlash[i] = Math.max(0, this.keyFlash[i] - dt * 4);
    this.recentPractice = Math.max(0, this.recentPractice - dt * 0.002);
  }
}
/* ==========================================================================
   GLIA SYSTEM
   Autonomous, subtle behaviour (never enemies):
     astrocytes       drift toward recently active synapses and support them
     oligodendrocytes settle near frequently practised axons, boosting myelin
     microglia        inspect weak/inactive links and converge on damage
   ========================================================================== */
class GliaSystem {
  constructor(game) { this.game = game; this.decayTimer = 0; }

  update(dt) {
    const sim = this.game.sim, t = sim.time;
    for (const g of sim.glia) {
      g.retarget -= dt;
      if (g.retarget <= 0) { g.retarget = 2.5 + Math.random() * 2.5; this.chooseTarget(g); }
      const wob = [Math.sin(t * 0.7 + g.phase) * 0.12, Math.cos(t * 0.53 + g.phase * 1.3) * 0.1, Math.sin(t * 0.61 + g.phase * 0.7) * 0.12];
      for (let i = 0; i < 3; i++) {
        g.velocity[i] = g.velocity[i] * Math.exp(-dt * 2) + (g.target[i] + wob[i] - g.position[i]) * dt * 0.8;
        g.position[i] += g.velocity[i] * dt;
      }
      if (g.type === 'oligodendrocyte') for (const s of g.focusSynapses) s.oligoSupport = 1;
      else if (g.type === 'astrocyte') for (const s of g.focusSynapses) s.target.energy = Math.min(1, s.target.energy + dt * 0.02);
    }
    this.decayTimer += dt;
    if (this.decayTimer > 1) { this.decayTimer = 0; for (const s of sim.synapses) if (s.oligoSupport > 0) s.oligoSupport = Math.max(0, s.oligoSupport - 0.3); }
  }

  chooseTarget(g) {
    const sim = this.game.sim, tmp = [0, 0, 0];
    const near = (s, r) => V3.dist(s.source.position, g.home) < r;
    g.focusNeuron = null;
    if (g.type === 'astrocyte') {
      const c = sim.synapses.filter((s) => s.enabled && s.recentActivity > 0.1 && near(s, 2.4)).sort((a, b) => b.recentActivity - a.recentActivity).slice(0, 4);
      g.focusSynapses = c;
      if (c.length) { g.target = V3.add(c[0].pointAt(0.82, tmp), [0.16, 0.22, 0.1]); g.state = `Supporting ${c.length} active synapse${c.length > 1 ? 's' : ''}`; }
      else { g.target = this.jitterHome(g); g.state = 'Maintaining the local environment'; }
    } else if (g.type === 'oligodendrocyte') {
      const score = (s) => s.myelinLevel * 2 + s.activationFrequency;
      const c = sim.synapses.filter((s) => s.enabled && s.networkMembership.size && near(s, 3.4) && (s.myelinLevel > 0.04 || s.activationFrequency > 0.25)).sort((a, b) => score(b) - score(a)).slice(0, 3);
      g.focusSynapses = c;
      if (c.length) { g.target = V3.add(c[0].pointAt(0.5, tmp), [0, 0.32, 0.2]); g.state = `Myelinating ${c.length} practised axon${c.length > 1 ? 's' : ''}`; }
      else { g.target = this.jitterHome(g); g.state = 'Waiting near quiet axons'; }
    } else {
      const damaged = sim.neurons.find((n) => n.health <= 0 && V3.dist(n.position, g.home) < 5.5);
      if (damaged) {
        g.focusNeuron = damaged; g.focusSynapses = damaged.incoming.filter((s) => s.enabled).slice(0, 3);
        g.target = V3.add(damaged.position, [(Math.random() - 0.5) * 0.6, 0.3, (Math.random() - 0.5) * 0.6]);
        g.state = 'Responding to a damaged relay';
      } else {
        const quiet = sim.synapses.filter((s) => s.enabled && !s.protected && s.weight < 0.25 && sim.time - s.lastActivationTime > 12 && near(s, 2.4));
        const s = quiet.length ? pick(quiet) : null;
        g.focusSynapses = s ? [s] : [];
        g.target = s ? V3.add(s.pointAt(0.5, tmp), [0, 0.15, 0]) : this.jitterHome(g);
        g.state = s ? 'Inspecting a weak, inactive link' : 'Surveying the neighbourhood';
      }
    }
  }

  /** Inspector actions (game abstractions of each glial role). */
  support(g) {
    const sim = this.game.sim, reg = g.region;
    let changed = 0, message = '';
    if (g.type === 'astrocyte') {
      for (const n of reg.neurons) { if (n.energy < 1) changed++; n.energy = Math.min(1, n.energy + 0.25); }
      for (const s of sim.synapses) if (s.enabled && s.source.region === reg && s.recentActivity > 0.05) s.longTermStability = clamp(s.longTermStability + 0.04);

    } else if (g.type === 'oligodendrocyte') {
      for (const s of sim.synapses) if (s.enabled && s.source.region === reg && s.activationCount >= 3 && sim.time - s.lastActivationTime < 15) { s.myelinLevel = clamp(s.myelinLevel + 0.06); changed++; }
      message = changed ? `${changed} recently active axon${changed > 1 ? 's' : ''} received model insulation.` : 'No qualifying axons yet. Send several signals here or practise a skill first.';
    } else {
      for (const s of sim.synapses) {
        if (changed >= 3) break;
        if (s.enabled && !s.protected && s.networkMembership.size === 0 && s.weight < 0.2 && sim.time - s.lastActivationTime > 12 && s.source.region === reg) { s.enabled = false; changed++; }
      }
      message = changed ? `${changed} weak, inactive link${changed > 1 ? 's' : ''} cleared (a simplified pruning analogy).` : 'No weak inactive links here right now.';
    }
    this.game.renderer?.addRing(g.position, [0.55, 0.85, 0.9], 1);
    this.game.bus.emit(EV.GLIA_ACTION, { glia: g, changed });
    return { changed, message };
  }
}
/* ==========================================================================
   PROGRESSION — "Neural Complexity" points accumulate from learning events
   (not idle time). Levels unlock modes and recruit more of the network into
   view. Points never decrease; the network itself can still weaken.
   ========================================================================== */
class ProgressionSystem {
  constructor(game) {
    this.game = game;
    this.points = 0; this.level = 1; this.unlockAll = false;
    this.caps = {};
    this.lastGain = null;
  }
  levelDef(l = this.level) { return LEVELS[clamp(l, 1, LEVELS.length) - 1]; }
  next() { return LEVELS[this.level] || null; }
  progressToNext() { const cur = this.levelDef(), nx = this.next(); return nx ? clamp((this.points - cur.points) / (nx.points - cur.points)) : 1; }
  isUnlocked(modeId) { return this.unlockAll || (MODE_BY_ID[modeId]?.unlock ?? 99) <= this.level; }
  recruitFraction() { return this.unlockAll ? 1 : this.levelDef().recruit; }

  award(pts, reason, capKey = null, capMax = Infinity) {
    if (this.sandbox) return 0;   // Demo Mode never earns complexity
    if (capKey) {
      const used = this.caps[capKey] || 0;
      if (used >= capMax) return 0;
      pts = Math.min(pts, capMax - used);
      this.caps[capKey] = used + pts;
    }
    if (pts <= 0) return 0;
    this.points += pts;
    this.lastGain = { pts, reason, at: performance.now() };
    this.game.ui?.markDirty('top');
    this.checkLevel();
    return pts;
  }

  checkLevel() {
    while (LEVELS[this.level] && this.points >= LEVELS[this.level].points) {
      this.level++;
      const def = this.levelDef();
      this.game.sim.setRecruitment(this.recruitFraction(), true);
      this.game.bus.emit(EV.LEVEL_UP, { level: this.level, def });
      if (!this.unlockAll) this.game.bus.emit(EV.MODE_UNLOCKED, { mode: def.unlocks, level: this.level });
    }
  }

  setUnlockAll(on) {
    this.unlockAll = !!on;
    this.game.sim.setRecruitment(this.recruitFraction(), on);
    this.game.ui?.markDirty('top', 'dock', 'panel');
  }

  bind(bus) {
    const A = (pts, reason, cap, max) => this.award(pts, reason, cap, max);
    bus.on(EV.NEURON_FIRED, (e) => { if (e.cause === 'manual') A(1, 'Fired a neuron', 'fire', 10); });
    bus.on(EV.NEURON_SELECTED, () => A(1, 'Inspected a neuron', 'select', 8));
    bus.on(EV.SYNAPSE_SELECTED, () => A(2, 'Inspected a synapse', 'synapse', 6));
    bus.on(EV.GLIA_SELECTED, () => A(2, 'Met a glial cell', 'glia', 6));
    bus.on(EV.REGION_SELECTED, () => A(1, 'Visited a region', 'region', 9));
    bus.on(EV.SIGNAL_FOLLOWED, (e) => A(Math.min(4, e.hops), 'Followed a signal', 'follow', 8));
    bus.on(EV.CONNECTION_STRENGTHENED, (e) => { if (e.source !== 'spont' && e.level >= 0.6) A(1, 'Strengthened a synapse', 'strengthen', 40); });
    bus.on(EV.MYELIN_INCREASED, (e) => { if (e.level >= 0.5) A(2, 'Myelinated an axon', 'myelin', 40); });
    bus.on(EV.MEMORY_ENCODED, () => A(10, 'Encoded a memory'));
    bus.on(EV.MEMORY_RECALLED, () => A(8, 'Recalled a memory', 'recall', 48));
    bus.on(EV.MEMORY_FAILED, (e) => A(e.partial ? 3 : 1, 'Practised retrieval', 'recallfail', 15));
    bus.on(EV.MEMORY_STABILIZED, () => A(15, 'Stabilised a memory'));
    bus.on(EV.SKILL_SEQUENCE, () => A(3, 'Practised a sequence', 'skillrep', 75));
    bus.on(EV.SKILL_STAGE, () => A(15, 'Skill stage reached'));
    bus.on(EV.FOCUS_COMPLETE, (e) => A(10 + Math.round(e.result.score * 20), 'Focus session', 'focus', 120));
    bus.on(EV.CONSOLIDATION_COMPLETE, () => A(25, 'Completed a sleep cycle', 'sleep', 100));
    bus.on(EV.PATHWAY_REPAIRED, () => A(30, 'Restored a pathway', 'repair', 60));
    bus.on(EV.CONCEPT_CONNECTED, (e) => A(e.cross ? 8 : 6, 'Connected concepts'));
    bus.on(EV.MISSION_COMPLETED, () => A(20, 'Mission completed'));
    bus.on(EV.MODE_MASTERED, () => A(15, 'Mode mastered'));
    bus.on(EV.ACHIEVEMENT_UNLOCKED, () => A(10, 'Achievement'));
    bus.on(EV.DISTRACTION_SUPPRESSED, () => A(1, 'Suppressed a distraction', 'suppress', 15));
    bus.on(EV.ROUTE_TESTED, () => A(1, 'Tested a route', 'routetest', 6));

  }
}

/* ==========================================================================
   ROUTE PROBE — fire a start cell and watch whether activity reaches a goal.
   ========================================================================== */
class RouteProbe {
  constructor(game, start, goal, opts = {}) {
    this.game = game; this.goal = goal; this.opts = opts;
    this.tag = 'probe' + (++RouteProbe.count);
    this.t = 0; this.ok = false; this.done = false;
    this.reached = new Set([start]); this.weakAt = null;
    this.onArrive = (sig, fired) => {
      if (sig.tag !== this.tag) return;
      const tgt = sig.synapse.target;
      if (fired) { this.reached.add(tgt); if (tgt === this.goal) this.ok = true; }
      else if (opts.watch && opts.watch.includes(tgt) && !this.weakAt) this.weakAt = tgt;
    };
    game.sim.arrivalListeners.add(this.onArrive);
    game.sim.fire(start, { forced: true, kind: opts.kind || 'test', tag: this.tag, cause: 'test' });
  }
  update(dt) {
    if (this.done) return;
    this.t += dt;
    const inflight = this.game.sim.signals.some((s) => s.tag === this.tag);
    if (this.ok || (!inflight && this.t > 0.3) || this.t > 8) {
      this.done = true;
      this.game.sim.arrivalListeners.delete(this.onArrive);
      this.opts.onDone?.(this);
    }
  }
}
RouteProbe.count = 0;

/* ==========================================================================
   MISSION SYSTEM — Learn missions (game logic) and mode objectives.
   ========================================================================== */
class MissionSystem {
  constructor(game) {
    this.game = game;
    this.active = 'sequence';
    this.state = {
      sequence: { status: 'available', reps: 0, step: 0, tests: 0, testOk: false, lastTest: null, wrong: 0 },
      redbird: { status: 'available', experiences: 0, window: null, lastBound: 0 },
      word: { status: 'available', runs: 0, context: null, step: 0, lastContext: null, contextRuns: { read: 0, hear: 0, use: 0 } },
    };

    this.mastered = new Set();

  /** The A → B → C → D route starts weak (and therefore unreliable). */
  install(sim) {
    const n = LEARN_MISSIONS[0].nodes.map((k) => sim.n(k));
    n.forEach((x) => x.networkMembership.add('lesson'));
    for (let i = 0; i < n.length - 1; i++) sim.connect(n[i], n[i + 1], 0.12, { set: true, networks: ['lesson', 'trainable'], protected: true, baseline: 0.08 });
  }
  isDone(id) { return this.state[id]?.status === 'complete'; }

    st.status = 'complete';
    this.game.bus.emit(EV.MISSION_COMPLETED, { id, mission: LEARN_MISSIONS.find((m) => m.id === id) });
    if (LEARN_MISSIONS.every((m) => this.isDone(m.id))) this.master('learn');

  master(modeId) {

  bind(bus) {

    const checkExplore = () => { if (ex.selected.size >= 3 && ex.fired >= 3 && ex.synapse && ex.followed && ex.regions.size >= 3) this.master('explore'); };
    bus.on(EV.NEURON_SELECTED, (e) => { ex.selected.add(e.neuron.key); checkExplore(); });
    bus.on(EV.NEURON_FIRED, (e) => { if (e.cause === 'manual') { ex.fired++; checkExplore(); } });
    bus.on(EV.SYNAPSE_SELECTED, () => { ex.synapse = true; checkExplore(); });
    bus.on(EV.SIGNAL_FOLLOWED, () => { ex.followed = true; checkExplore(); });
    bus.on(EV.REGION_SELECTED, (e) => { ex.regions.add(e.region.id); checkExplore(); });
    bus.on(EV.MEMORY_RECALLED, () => { const ok = g.memory.list.filter((m) => m.successCount > 0).length; if (ok >= 2) this.master('remember'); });
    bus.on(EV.SKILL_STAGE, (e) => { if (e.stage.id === 'skilled') this.master('train'); });
    bus.on(EV.FOCUS_COMPLETE, (e) => { if (e.result.success) this.master('focus'); });
    bus.on(EV.CONSOLIDATION_COMPLETE, () => this.master('dream'));
    bus.on(EV.PATHWAY_REPAIRED, () => this.master('repair'));
    bus.on(EV.CONCEPT_CONNECTED, (e) => { if (e.links >= 10) this.master('build'); });
  }

  /* ---------- Mission 1: sequence ---------- */
  seqNeurons() { return LEARN_MISSIONS[0].nodes.map((k) => this.game.sim.n(k)); }
  seqSynapses() { const n = this.seqNeurons(), sim = this.game.sim; return [sim.synapseBetween(n[0], n[1]), sim.synapseBetween(n[1], n[2]), sim.synapseBetween(n[2], n[3])]; }
  /** Probability-style reliability index of the A→D route (game metric). */
  seqReliability() {

    return this.seqSynapses().reduce((r, s) => {
      const drive = s.weight * sim.synapticGain * s.target.gain / s.target.threshold;
      return r * clamp(0.15 + 1.1 * s.weight) * smoothstep(0.55, 1.05, drive);
    }, 1);
  }
  seqClick(i) {

    if (i !== st.step) {

      g.audio.error(0.4);
      g.ui.floatAt(n[i].position, 'OUT OF ORDER · RESTART AT A', '#fbbf5b');

    }

      g.bus.emit('LESSON_REP', { mission: 'sequence', reps: st.reps });
    }
    return 'ok';
  }
  seqTest() {

    const probe = new RouteProbe(g, n[0], n[3], { kind: 'test', watch: n, onDone: (p) => {
      st.tests++; st.lastTest = { ok: p.ok, reached: [...p.reached].filter((x) => n.includes(x)).length, weakAt: p.weakAt };
      if (p.ok) {

        g.ui.floatAt(n[3].position, 'A ALONE REACHED D ✓', '#fbbf5b');
        g.audio.success();

      } else {

        g.audio.error(0.5);
      }

    } });
    probe.mission = 'sequence';
    this.probes.push(probe);
    return 'ok';
  }

  /* ---------- Mission 2: red bird ---------- */
  birdMemory() { return this.game.memory.memories.redbird; }
  startExperience() {
    const st = this.state.redbird;
    if (st.window) return 'busy';
    st.window = { t: 0, duration: 7.5, bound: new Set(), idx: 0, timer: 0, ending: false };
    this.game.audio.chime(0.6);
    return 'ok';
  }
  bindFeature(fid) {
    const g = this.game, st = this.state.redbird, w = st.window, m = this.birdMemory();
    const f = m.feature(fid);
    if (!f) return 'none';
    if (!w || w.ending) { g.ui.floatAt(f.neuron.position, 'OUTSIDE BINDING WINDOW', '#fbbf5b'); g.audio.error(0.3); return 'nowindow'; }
    if (w.bound.has(fid)) return 'already';
    w.bound.add(fid);
    g.sim.fire(f.neuron, { forced: true, driven: true, kind: 'bind', cause: 'lesson' });
    g.audio.note(392 * Math.pow(2, w.bound.size / 12), 0.22);
    g.ui.floatAt(f.neuron.position, `${f.label.toUpperCase()} · BOUND`, '#ff9fb0');
    if (w.bound.size >= m.features.length) { w.ending = true; g.sim.schedule(0.6, () => this.endExperience()); }
    return 'ok';
  }
  updateExperience(dt) {
    const w = this.state.redbird.window;
    if (!w || w.ending) return;
    w.t += dt; w.timer += dt;
    const m = this.birdMemory(), sim = this.game.sim;
    if (w.timer >= 0.25) {
      w.timer = 0;
      const idx = m.indexNeurons[w.idx++ % m.indexNeurons.length];
      sim.fire(idx, { forced: true, driven: true, kind: 'bind', cause: 'binding' });
    }
    if (w.t >= w.duration) { w.ending = true; this.endExperience(); }
  }
  endExperience() {
    const g = this.game, st = this.state.redbird, w = st.window, m = this.birdMemory(), sim = g.sim;
    if (!w) return;
    st.window = null;
    const bound = [...w.bound];
    st.lastBound = bound.length;
    if (!bound.length) { g.ui.toast('No features were bound. Activate features while the binding window is open.', 'warn'); return; }
    // Hippocampal replay of the bound pattern right after the experience.
    const seq = [...m.indexNeurons, ...bound.map((id) => m.feature(id).neuron)];
    seq.forEach((n, i) => sim.schedule(0.15 + i * 0.12, () => sim.fire(n, { forced: true, driven: true, kind: 'bind', cause: 'binding' })));
    sim.schedule(0.2 + seq.length * 0.12, () => {
      const quality = g.attention.encodingQuality * (bound.length / m.features.length);
      st.experiences++;
      g.reward.outcome('lesson:redbird', bound.length / m.features.length, { floor: 0.08, label: 'REWARD · EXPERIENCE ENCODED' });
      g.memory.noteExperience(m, { bound, quality });
      const storage = g.memory.storage(m);
      g.ui.floatAt(m.indexNeurons[0].position, `STORED STRENGTH ${pct(storage)}`, '#ffbf66');
      const allTwice = m.features.every((f) => (m.bindCounts[f.id] || 0) >= 2);
      if (storage >= 0.55 && allTwice) this.complete('redbird');
      g.ui.markDirty('panel', 'bar', 'overlay');
    });
  }

  /* ---------- Mission 3: neuroplasticity ---------- */
  wordMemory() { return this.game.memory.memories.neuroplasticity; }
  startContext(ctxId) {
    const st = this.state.word, ctx = LEARN_MISSIONS[2].contexts.find((c) => c.id === ctxId);
    if (!ctx) return 'none';
    st.context = ctxId; st.step = 0;
    st.variety = st.lastContext && st.lastContext !== ctxId ? 1.4 : 1;
    return 'ok';
  }
  wordClick(fid) {
    const g = this.game, st = this.state.word, m = this.wordMemory();
    const ctx = LEARN_MISSIONS[2].contexts.find((c) => c.id === st.context);
    const f = m.feature(fid);
    if (!f) return 'none';
    if (!ctx) { g.ui.floatAt(f.neuron.position, 'CHOOSE A CONTEXT FIRST', '#fbbf5b'); return 'nocontext'; }
    if (ctx.path[st.step] !== fid) { st.step = 0; g.audio.error(0.4); g.ui.floatAt(f.neuron.position, 'FOLLOW THE HIGHLIGHTED ORDER', '#fbbf5b'); return 'wrong'; }
    g.plasticity.learningScale = 2 * (st.variety || 1);
    g.sim.fire(f.neuron, { forced: true, driven: true, kind: 'lesson', cause: 'lesson' });
    g.plasticity.learningScale = 1;
    g.audio.note(329.63 * Math.pow(2, st.step * 3 / 12), 0.22);
    st.step++;
    if (st.step >= ctx.path.length) {
      st.runs++; st.contextRuns[ctx.id]++; st.lastContext = ctx.id; st.context = null; st.step = 0;
      g.memory.noteExperience(m, { bound: ctx.path, quality: g.attention.encodingQuality });
      g.reward.outcome('lesson:word:' + ctx.id, 1, { floor: 0.1, label: 'REWARD · CONTEXT LEARNED' });
      if (this.wordRoutes().every((r) => r.ok)) {
        this.complete('word');
        g.ui.floatAt(m.feature('meaning').neuron.position, 'CONCEPT INTEGRATED ✓', '#fbbf5b');
      }
    }
    return 'ok';
  }
  wordRoutes() {
    const m = this.wordMemory(), sim = this.game.sim;
    return LEARN_MISSIONS[2].routes.map((r) => {
      const strength = Math.min(...r.pairs.map(([a, b]) => sim.pairStrength(m.feature(a).neuron, m.feature(b).neuron)));
      return { ...r, strength, ok: strength >= 0.5 };
    });
  }

  update(dt) {
    this.updateExperience(dt);
    for (const p of this.probes) p.update(dt);
    this.probes = this.probes.filter((p) => !p.done);
  }
}
/* ==========================================================================
   AUDIO SYSTEM — everything synthesised with the Web Audio API.
   Off by default; the AudioContext is only created after the player opts in
   (a user gesture), so nothing ever autoplays.
   ========================================================================== */
class AudioSystem {
  constructor(game) {
    this.game = game;
    this.ctx = null; this.master = null;
    this.enabled = false; this.volume = 0.7;
    this.lastPulse = 0; this.pad = null;
  }
  ensure() {
    if (this.ctx) return true;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return false;
      this.ctx = new C();
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;

    const rp = d.repair;

      g.repair.built = rp.built.map((k) => sim.synapseByKey.get(k)).filter((s) => s && s.enabled);
      for (const s of g.repair.built) s.networkMembership.add('repair').add('trainable');

    }
    const kn = d.knowledge;
    if (kn) {
      g.knowledge.placed = new Set(['neuron', ...kn.placed]);
      g.knowledge.links = new Map(kn.links.map(([id, src]) => [id, { source: src }]));
      for (const [id] of kn.links) { const r = RELATIONS[id]; g.knowledge.placed.add(r.a); g.knowledge.placed.add(r.b); }
      g.knowledge.answered = kn.answered; g.knowledge.mistakes = kn.mistakes; g.knowledge.bestStreak = kn.bestStreak;

    sim.time = d.simTime || 0;
    for (const s of sim.synapses) { s.lastActivationTime = sim.time - 5; }
  }

  exportFile() {
    const data = this.snapshot();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `neuron-save-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();

  }

  async importFile(file) {
    if (!file) throw new Error('No file chosen.');
    if (file.size > 4 * 1024 * 1024) throw new Error('That file is too large to be a NEURON save.');
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch { throw new Error('The file is not valid JSON.'); }
    return this.validate(parsed);

  clear() { try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(LEGACY_SAVE_KEY); } catch { /* storage unavailable */ } }
}
/* ==========================================================================
   CAMERA CONTROLLER
   Orbit camera with smoothed yaw/pitch/radius/target, eased "flights" for

   that tracks a moving signal. Scale (MICRO / NETWORK / BRAIN) derives from

const HOME_VIEW = { yaw: 0.42, pitch: 0.2, radius: 15.5, target: [0, 0.35, 0.1] };

class CameraController {
  constructor(game) {
    this.game = game;
    this.yaw = HOME_VIEW.yaw; this.pitch = HOME_VIEW.pitch; this.radius = 42; this.target = HOME_VIEW.target.slice();
    this.want = { yaw: HOME_VIEW.yaw, pitch: HOME_VIEW.pitch, radius: HOME_VIEW.radius, target: HOME_VIEW.target.slice() };

    if (duration > 0 && !opts.exact && this.game.demo?.active) duration = Math.max(1.4, duration * 1.15);

      if (v.pitch !== undefined) this.want.pitch = v.pitch;
      if (v.radius !== undefined) this.want.radius = v.radius;
      if (v.target) this.want.target = v.target.slice();

  /** Target and distance that fit a set of points (bounding sphere). */
  boundsView(points, pad = 1.6) {
