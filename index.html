const DISCLAIMER = 'This interactive simulation simplifies neuroscience for educational purposes. Neural activity, memory percentages, connection strength, attention values, and accelerated processes are game abstractions and should not be interpreted as direct biological measurements or medical information.';
/* ==========================================================================
   DOMAIN MODEL
   Neurons integrate signed inputs, fire at threshold, then rest through a
   refractory period. Synapses carry weight, myelin, stability, plasticity and
   an eligibility trace. All values are normalised game units.
   ========================================================================== */

class BrainRegion {
  constructor(def, index) {
    this.def = def; this.id = def.id; this.index = index; this.name = def.name;
    this.center = def.center.slice(); this.radii = def.radii.slice();
    this.rgb = hexToRgb(def.color);
    this.neurons = [];
    this.activity = 0;          // smoothed fraction of recently firing cells (0..1)
    this.highlight = 0;         // visual emphasis, animated by the renderer
  }
}

class Neuron {
  constructor(id, key, region, position, type, opts = {}) {
    this.id = id; this.key = key; this.region = region; this.position = position;
    this.type = type;                        // 'excitatory' | 'inhibitory'
    this.role = opts.role || null;           // named lesson role, e.g. 'seqA'
    this.label = opts.label || null;
    this.restingPotential = 0;
    this.activation = 0;                     // integrated input (game units)
    this.threshold = opts.threshold ?? 1;
    this.recentActivity = 0;                 // decaying firing trace (0..1)
    this.plasticity = opts.plasticity ?? 0.9;
    this.energy = 1;                         // metabolic-style resource (game abstraction)
    this.health = 1;                         // 0 = offline (Repair mode)
    this.networkMembership = new Set(opts.networks || []);
    this.outgoing = []; this.incoming = [];
    this.refractory = 0; this.lastFired = -1e9; this.lastFireDriven = false;
    this.lastDrivenFire = -1e9;              // last spike that belonged to an attended experience
    this.flash = 0;                          // visual intensity of the last spike
    this.gain = 1;                           // attention spotlight modulation
    this.selected = false;
    this.quiet = !!opts.quiet; this.isolated = !!opts.isolated; this.isIndex = !!opts.index;
    this.recruitOrder = opts.recruitOrder ?? 0; this.recruited = true; this.recruitGlow = 0;
    this.fireCount = 0;
    this.size = opts.size ?? 0.11;
    this.seed = hashString(key);
  }
  get myelinEfficiency() {
    let s = 0, c = 0;
    for (const syn of this.outgoing) if (syn.enabled) { s += syn.myelinLevel; c++; }
    return c ? s / c : 0;
  }
  get displayType() {
    const rid = this.region.id;
    if (this.type === 'inhibitory') return rid === 'cerebellum' ? 'Purkinje-like (inhibitory)' : 'Interneuron-like (inhibitory)';
    if (rid === 'reward') return 'Dopamine-like (modulatory)';
    if (rid === 'cerebellum') return 'Granule-like (excitatory)';
    if (this.isIndex) return 'Hippocampal index (excitatory)';
    return 'Pyramidal-like (excitatory)';
  }
  get code() { return `${this.region.def.short.slice(0, 3).toUpperCase()}-${String(this.id + 1).padStart(3, '0')}`; }
}

class Synapse {
  constructor(id, source, target, weight, opts = {}) {
    this.id = id; this.key = `${source.key}>${target.key}`;
    this.source = source; this.target = target;
    this.weight = weight; this.initialWeight = weight;
    this.baseline = opts.baseline ?? Math.min(weight, 0.2);   // slow decay drifts toward this
    this.activationFrequency = 0; this.freqAcc = 0;
    this.recentActivity = 0;
    this.longTermStability = opts.stability ?? 0.05;
    this.effectType = source.type === 'inhibitory' ? 'inhibitory' : 'excitatory';
    this.plasticity = opts.plasticity ?? 0.85;
    this.associatedMemory = opts.memory ?? null;
    this.networkMembership = new Set(opts.networks || []);
    this.myelinLevel = opts.myelin ?? 0;
    this.lastActivationTime = -1e9; this.lastArrival = -1e9;
    this.activationCount = 0; this.failures = 0;
    this.eligibility = 0; this.rewardGlow = 0;
    this.lastPairedPre = -1e9; this.lastPairedPost = -1e9;     // background pairings
    this.lastDrivenPre = -1e9; this.lastDrivenPost = -1e9;     // attended pairings (kept separate so echoes can't consume them)
    this.resource = 1; this.resourceTime = -1e9;   // short-term depression (transmitter availability)
    this.enabled = true; this.custom = !!opts.custom; this.tract = !!opts.tract;
    this.oligoSupport = 0;
    this.protected = !!opts.protected;
    this.computeGeometry();
  }
  computeGeometry() {
    const a = this.source.position, b = this.target.position;
    this.length = V3.dist(a, b);
    const rnd = keyedRandom('curve:' + this.key);
    const dir = V3.norm(V3.sub(b, a));
    let perp = V3.cross(dir, [rnd() - 0.5, rnd() - 0.5, rnd() - 0.5]);
    if (V3.len(perp) < 1e-3) perp = V3.cross(dir, [0, 1, 0]);
    perp = V3.norm(perp);
    const bend = this.length * (this.tract ? 0.22 + rnd() * 0.12 : 0.1 + rnd() * 0.12);
    this.control = V3.add(V3.lerp(a, b, 0.5), V3.scale(perp, bend));
  }
  get sign() { return this.effectType === 'inhibitory' ? -1 : 1; }
  /** Composite efficiency index used by Train and the HUD (game metric). */
  get efficiency() { return this.weight * (0.75 + 0.25 * this.myelinLevel); }
  pointAt(t, out) { return bezier(this.source.position, this.control, this.target.position, t, out); }
}

class Signal {
  constructor(id, synapse, o) {
    this.id = id; this.synapse = synapse; this.t = 0;
    this.duration = o.duration; this.strength = o.strength; this.sign = o.sign;
    this.kind = o.kind; this.driven = o.driven; this.chain = o.chain || 0; this.tag = o.tag || null;
  }
}

class GlialCell {
  constructor(id, type, region, position) {
    this.id = id; this.type = type; this.region = region;
    this.position = position.slice(); this.home = position.slice(); this.target = position.slice();
    this.velocity = [0, 0, 0];
    this.phase = Math.random() * TAU;
    this.size = type === 'astrocyte' ? 0.2 : type === 'oligodendrocyte' ? 0.17 : 0.13;
    this.state = 'Surveying the neighbourhood';
    this.focusSynapses = [];   // synapses its processes currently contact
    this.focusNeuron = null;
    this.retarget = 0;
  }
  get typeName() { return { astrocyte: 'Astrocyte', oligodendrocyte: 'Oligodendrocyte', microglia: 'Microglia' }[this.type]; }
}

/* ==========================================================================
   BRAIN SIMULATION
   update(dt): scheduled events → leaky integration & spontaneous firing →
   signal travel & delivery. Plasticity hooks run at firing time.
   ========================================================================== */
class BrainSimulation {
  constructor(game, quality) {
    this.game = game; this.bus = game.bus; this.quality = quality;
    this.cfg = QUALITY[quality];
    this.time = 0;
    this.regions = []; this.regionById = {};
    this.neurons = []; this.neuronByKey = new Map();
    this.synapses = []; this.synapseByKey = new Map();
    this.signals = []; this.glia = [];
    this.scheduled = [];
    this.nextSignalId = 1;
    this.geometryVersion = 0;          // bump when synapses are added (renderer rebuilds)
    this.activityScale = 1;            // modes and sleep scale spontaneous activity
    this.spontaneousRate = 0.055;      // spikes / s / recruited neuron at activityScale 1
    this.synapticGain = 1.4;           // a single synapse needs w ≳ 0.72 to fire a resting cell
    this.globalEfficiency = 0;
    this.maxSignals = this.cfg.maxSignals;
    this.arrivalListeners = new Set();
    this.firedRecently = 0;
  }

  /* ---------- construction ---------- */
  build() {
    REGIONS.forEach((def, i) => { const r = new BrainRegion(def, i); this.regions.push(r); this.regionById[r.id] = r; });
    for (const r of ROLE_NEURONS) {
      const reg = this.regionById[r.region];
      const pos = r.abs ? r.abs.slice() : [reg.center[0] + r.at[0] * reg.radii[0], reg.center[1] + r.at[1] * reg.radii[1], reg.center[2] + r.at[2] * reg.radii[2]];
      this.addNeuron(r.key, reg, pos, 'excitatory', { role: r.key, label: r.label, quiet: r.quiet, isolated: r.isolated, index: r.index, size: 0.125 });
    }
    // Filler neurons: deterministic per key, so the first N are identical across quality presets.
    for (const reg of this.regions) {
      const target = Math.max(this.cfg.perRegion, reg.neurons.length + 6);
      let i = 0;
      while (reg.neurons.length < target && i < 600) {
        const key = `${reg.id}:${i}`; i++;
        const rnd = keyedRandom(key);
        const u = rnd() * 2 - 1, th = rnd() * TAU, rr = Math.cbrt(0.08 + rnd() * 0.92) * 0.97, s = Math.sqrt(1 - u * u);
        const pos = [reg.center[0] + Math.cos(th) * s * rr * reg.radii[0], reg.center[1] + u * rr * reg.radii[1], reg.center[2] + Math.sin(th) * s * rr * reg.radii[2]];
        if (this.neurons.some((n) => V3.dist(n.position, pos) < 0.34)) continue;
        const type = rnd() < 0.2 ? 'inhibitory' : 'excitatory';
        this.addNeuron(key, reg, pos, type, { recruitOrder: rnd(), size: 0.085 + rnd() * 0.045, threshold: 0.94 + rnd() * 0.12 });
      }
    }
    // Local wiring: each cell projects to its nearest neighbours plus one random partner.
    for (const reg of this.regions) {
      const pool = reg.neurons.filter((n) => !n.isolated && !n.role);
      const roleCells = reg.neurons.filter((n) => !n.isolated && n.role);
      const all = pool.concat(roleCells);
      for (const n of all) {
        const rnd = keyedRandom('w:' + n.key);
        const near = pool.filter((m) => m !== n).map((m) => [m, V3.dist(m.position, n.position)]).sort((a, b) => a[1] - b[1]);
        const k = n.role ? 2 : 3;
        for (let j = 0; j < Math.min(k, near.length); j++) this.connect(n, near[j][0], 0.08 + rnd() * 0.28);
        if (!n.role && near.length > 5) this.connect(n, near[3 + Math.floor(rnd() * (near.length - 3))][0], 0.06 + rnd() * 0.2);
        // a few fillers project back onto role cells, so trained routes sit inside living tissue
        if (!n.role && roleCells.length && rnd() < 0.18) this.connect(n, roleCells[Math.floor(rnd() * roleCells.length)], 0.05 + rnd() * 0.12);
      }
    }
    // Long-range tracts between regions.
    for (const [from, to, count] of TRACTS) {
      const nConn = Math.max(1, Math.round(count * this.cfg.perRegion / 24));
      const A = this.regionById[from].neurons.filter((x) => !x.isolated && !x.role);
      const B = this.regionById[to].neurons.filter((x) => !x.isolated && !x.role);
      const rnd = keyedRandom(`tract:${from}>${to}`);
      for (let i = 0; i < nConn; i++) this.connect(A[Math.floor(rnd() * A.length)], B[Math.floor(rnd() * B.length)], 0.1 + rnd() * 0.22, { tract: true });
    }
    this.buildGlia();
  }

  addNeuron(key, region, position, type, opts) {
    const n = new Neuron(this.neurons.length, key, region, position, type, opts);
    this.neurons.push(n); this.neuronByKey.set(key, n); region.neurons.push(n);
    return n;
  }

  /** Create (or reuse) a directed synapse. opts.ensure raises the weight to at least w. */
  connect(a, b, w, opts = {}) {
    if (!a || !b || a === b) return null;
    const key = `${a.key}>${b.key}`;
    let syn = this.synapseByKey.get(key);
    if (syn) {
      if (opts.ensure) syn.weight = Math.max(syn.weight, w);
      if (opts.set) syn.weight = w;
      if (opts.networks) opts.networks.forEach((t) => syn.networkMembership.add(t));
      if (opts.memory) syn.associatedMemory = opts.memory;
      if (opts.protected) syn.protected = true;
      if (opts.baseline !== undefined) syn.baseline = opts.baseline;
      syn.enabled = true;
      return syn;
    }
    syn = new Synapse(this.synapses.length, a, b, w, opts);
    this.synapses.push(syn); this.synapseByKey.set(key, syn);
    a.outgoing.push(syn); b.incoming.push(syn);
    this.geometryVersion++;
    return syn;
  }

  synapseBetween(a, b) { return a && b ? this.synapseByKey.get(`${a.key}>${b.key}`) || null : null; }
  /** Strength of an association between two cells regardless of direction. */
  pairStrength(a, b) { const x = this.synapseBetween(a, b), y = this.synapseBetween(b, a); return Math.max(x && x.enabled ? x.weight : 0, y && y.enabled ? y.weight : 0); }
  n(key) { return this.neuronByKey.get(key) || null; }

  buildGlia() {
    const types = ['astrocyte', 'oligodendrocyte', 'microglia'];
    let id = 0;
    for (const reg of this.regions) {
      const rnd = keyedRandom('glia:' + reg.id);
      const count = reg.id === 'hippocampus' || reg.id === 'motor' || reg.id === 'association' ? 4 : 3;
      for (let i = 0; i < count; i++) {
        const type = types[(i + reg.index) % 3];
        const pos = [reg.center[0] + (rnd() - 0.5) * reg.radii[0] * 1.5, reg.center[1] + (rnd() - 0.5) * reg.radii[1] * 1.5, reg.center[2] + (rnd() - 0.5) * reg.radii[2] * 1.5];
        this.glia.push(new GlialCell(id++, type, reg, pos));
      }
    }
  }

  setRecruitment(fraction, animate = false) {
    let newly = 0;
    for (const n of this.neurons) {
      const want = !!n.role || n.recruitOrder < fraction;
      if (want && !n.recruited) { n.recruited = true; if (animate) { n.recruitGlow = 1; this.schedule(Math.random() * 2.2, () => this.fire(n, { cause: 'recruit', forced: true })); } newly++; }
      else if (!want) n.recruited = false;
    }
    return newly;
  }

  /* ---------- scheduling ---------- */
  schedule(delay, fn) {
    const at = this.time + Math.max(0, delay);
    const item = { at, fn };
    let lo = 0, hi = this.scheduled.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (this.scheduled[mid].at <= at) lo = mid + 1; else hi = mid; }
    this.scheduled.splice(lo, 0, item);
    return item;
  }
  cancel(item) { const i = this.scheduled.indexOf(item); if (i >= 0) this.scheduled.splice(i, 1); }

  /* ---------- dynamics ---------- */
  travelTime(syn) {
    // Speed rises with connection strength, myelin and overall network efficiency (illustrative).
    const speed = 0.45 + 0.8 * syn.weight + 1.6 * syn.myelinLevel + 0.25 * this.globalEfficiency;
    return 0.16 + (syn.length * 0.3) / speed;
  }

  /**
   * Fire a neuron. Returns the spawned signals, or null if it could not fire.
   * o.cause: 'spontaneous' | 'manual' | 'cascade' | 'lesson' | 'replay' | ...
   * o.driven: activity that belongs to an attended experience (gates strong plasticity)
   */
  fire(n, o = {}) {
    if (!n || n.health <= 0) return null;
    if (n.refractory > 0 && !o.forced) return null;
    const t = this.time;
    n.activation = -0.25; n.refractory = 0.2; n.lastFired = t; n.lastFireDriven = !!o.driven;
    if (o.driven) n.lastDrivenFire = t;
    n.flash = 1; n.fireCount++; n.recentActivity = Math.min(1, n.recentActivity + 0.3);
    n.energy = Math.max(0, n.energy - 0.012);
    this.firedRecently++;
    this.game.plasticity.onFire(n, o);
    this.bus.emit(EV.NEURON_FIRED, { neuron: n, cause: o.cause || 'spontaneous', driven: !!o.driven });
    const spawned = [];
    if (o.noSpawn) return spawned;
    for (const syn of n.outgoing) {
      if (!syn.enabled) continue;
      syn.lastActivationTime = t; syn.activationCount++; syn.freqAcc++;
      // Weak synapses release unreliably: the visual "intermittent" look of an untrained route.
      const pRelease = clamp(0.15 + 1.1 * syn.weight);
      if (!o.reliable && Math.random() > pRelease) { syn.failures++; continue; }
      if (this.signals.length >= this.maxSignals && !o.driven && !o.forced && !o.tag) continue;
      // Short-term depression: each release uses ~45% of the available transmitter, which recovers
      // over ~1.2 s. Occasional use is unaffected; self-sustaining loops run out of steam.
      const avail = 1 - (1 - syn.resource) * Math.exp(-(t - syn.resourceTime) / 1.2);
      syn.resource = avail * 0.55; syn.resourceTime = t;
      const sig = new Signal(this.nextSignalId++, syn, {
        duration: this.travelTime(syn) * (o.speed || 1), strength: (o.boost ?? 1) * avail, sign: syn.sign,
        kind: o.kind || (o.driven ? 'driven' : 'normal'), driven: !!o.driven, chain: o.chain || 0, tag: o.tag,
      });
      this.signals.push(sig); spawned.push(sig);
      syn.recentActivity = Math.max(syn.recentActivity, 0.55);
      this.game.plasticity.onTransmit(syn, o);
      this.bus.emit(EV.SYNAPSE_ACTIVATED, { synapse: syn, driven: !!o.driven, kind: sig.kind });
    }
    return spawned;
  }

  /** A purely visual pulse along a synapse (no effect on the receiving cell). */
  visualPulse(syn, kind = 'normal', speed = 1) {
    if (!syn || !syn.enabled) return null;
    const sig = new Signal(this.nextSignalId++, syn, { duration: this.travelTime(syn) * speed, strength: 0, sign: syn.sign, kind, driven: false });
    sig.visualOnly = true;
    this.signals.push(sig);
    return sig;
  }

  deliver(sig) {
    const syn = sig.synapse, target = syn.target;
    syn.recentActivity = Math.max(syn.recentActivity, sig.visualOnly ? 0.6 : 1);
    if (sig.visualOnly) { target.flash = Math.max(target.flash, 0.35); return; }
    syn.lastArrival = this.time;
    if (!syn.enabled) return;
    if (target.health <= 0) {
      this.bus.emit(EV.SIGNAL_BLOCKED, { synapse: syn, neuron: target, signal: sig });
      for (const fn of this.arrivalListeners) fn(sig, false, null, true);
      return;
    }
    const input = sig.sign * syn.weight * sig.strength * this.synapticGain * target.gain;
    target.activation = clamp(target.activation + input, -1.2, 2.4);
    target.flash = Math.max(target.flash, Math.min(0.55, Math.abs(input) * 0.45));
    let spawned = null;
    if (target.activation >= target.threshold && target.refractory <= 0) {
      const carry = sig.kind === 'normal' || sig.kind === 'driven' || sig.kind === 'reward' || sig.kind === 'recall' || sig.kind === 'intrusion' ? undefined : sig.kind;
      // Cascaded spikes are never "attended": strong learning stays with the cells of the experience.
      spawned = this.fire(target, { cause: 'cascade', driven: false, kind: carry, chain: sig.chain + 1, tag: sig.tag });
    }
    for (const fn of this.arrivalListeners) fn(sig, !!spawned, spawned, false);
  }

  update(dt) {
    this.time += dt;
    const t = this.time;
    while (this.scheduled.length && this.scheduled[0].at <= t) {
      const item = this.scheduled.shift();
      try { item.fn(); } catch (err) { console.error('NEURON scheduled event failed', err); }
    }
    const leak = Math.exp(-dt / 0.6), actDecay = Math.exp(-dt / 4), flashDecay = dt * 1.9;
    const rate = this.spontaneousRate * this.activityScale * this.cfg.spont;
    for (const n of this.neurons) {
      n.activation = n.restingPotential + (n.activation - n.restingPotential) * leak;
      if (n.refractory > 0) n.refractory -= dt;
      if (n.flash > 0) n.flash = Math.max(0, n.flash - flashDecay);
      if (n.recruitGlow > 0) n.recruitGlow = Math.max(0, n.recruitGlow - dt * 0.4);
      n.recentActivity *= actDecay;
      if (n.energy < 1) n.energy = Math.min(1, n.energy + dt * 0.02);
      if (rate > 0 && n.recruited && !n.quiet && n.health > 0 && Math.random() < rate * dt) this.fire(n, { cause: 'spontaneous' });
    }
    for (const syn of this.synapses) if (syn.recentActivity > 0) syn.recentActivity = Math.max(0, syn.recentActivity - dt * 0.9);
    for (let i = this.signals.length - 1; i >= 0; i--) {
      const s = this.signals[i];
      s.t += dt / s.duration;
      if (s.t >= 1) {
        this.signals[i] = this.signals[this.signals.length - 1];
        this.signals.pop();
        this.deliver(s);
      }
    }
  }

  /* ---------- collective activity patterns ---------- */
  /** A travelling wave across one region, ordered by distance from a seed cell. */
  regionalWave(region, o = {}) {
    const cells = region.neurons.filter((n) => n.recruited && n.health > 0 && !n.isolated);
    if (!cells.length) return;
    const seed = o.seed || pick(cells);
    for (const n of cells) {
      const d = V3.dist(n.position, seed.position);
      this.schedule((o.delay || 0) + d * (o.spread || 0.22), () => this.fire(n, { cause: o.cause || 'wave', forced: true, kind: o.kind, driven: !!o.driven }));
    }
  }
  /** Synchronised burst across every region (an "up state"). */
  networkBurst(o = {}) {
    for (const reg of this.regions) this.regionalWave(reg, { delay: Math.random() * 0.25, spread: 0.12, cause: 'burst', kind: o.kind });
  }
  /** Fire a sequence of regions: the BRAIN-scale functional chain. */
  runChain(onStep) {
    BRAIN_CHAIN.forEach((rid, i) => {
      this.schedule(i * 0.7, () => {
        const reg = this.regionById[rid];
        const cells = shuffle(reg.neurons.filter((n) => n.recruited && !n.isolated)).slice(0, 5);
        cells.forEach((n, j) => this.schedule(j * 0.05, () => this.fire(n, { cause: 'chain', forced: true, kind: 'chain' })));
        if (onStep) onStep(rid, i);
      });
    });
  }

  enabledSynapseCount() { let c = 0; for (const s of this.synapses) if (s.enabled) c++; return c; }
}
/* ==========================================================================
   PLASTICITY SYSTEM
   A simplified, Hebbian-inspired rule with spike-timing dependence:
     pre fires 0…1.5 s before post  → potentiation  Δw = η·M·timing·(1 − w)
     post fired 0…0.6 s before pre  → mild depression Δw = −η⁻·timing·w
   M (modulation) folds in attention/encoding quality, a decaying reward trace
   and sleep. "Driven" activity (attended experience, practice, replay) learns
   strongly; spontaneous background noise barely changes anything, so the
   network does not drift on its own. Unused synapses decay slowly toward a
   baseline unless stabilised (consolidated). Everything is clamped.
   ========================================================================== */
const PL = Object.freeze({
  WINDOW_LTP: 1.5, TAU_PLUS: 0.8, WINDOW_LTD: 0.6, TAU_MINUS: 0.3,
  ETA_DRIVEN: 0.25, ETA_SPONT: 0.0004, LTD_RATIO: 0.3,
  W_MIN: 0.02, W_MAX: 1, DECAY: 0.0012, IDLE: 15,
  THRESHOLDS: [0.35, 0.6, 0.85], MYELIN_THRESHOLDS: [0.25, 0.5, 0.75],
});

class PlasticitySystem {
  constructor(game) {
    this.game = game;
    this.rewardTrace = 0;
    this.batchTimer = 0; this.scaleTimer = 0; this.effTimer = 0;
    this.pending = new Map();       // synapse → accumulated driven Δw (for floating feedback)
    this.flushTimer = 0;
    this.networkEfficiency = 0;
    this.learningScale = 1;          // missions can apply a variety bonus
  }

  modulation() {
    const att = this.game.attention;
    const enc = att.encodingQuality;
    const sleep = this.game.sleep.active ? 0.65 : 1;
    return (0.35 + 0.65 * enc) * (1 + 0.5 * Math.min(1, this.rewardTrace)) * sleep * this.learningScale;
  }

  /**
   * Called by the simulation whenever neuron `post` fires.
   * Attended ("driven") spikes pair on their own timeline (lastDrivenFire), so a stray cascade
   * re-firing a lesson cell cannot erase the pairing the player just made. Only attended pairings
   * create eligibility for later reward; background activity changes weights only minutely.
   */
  onFire(post, o) {
    const t = this.game.sim.time;
    let M = -1;
    for (const syn of post.incoming) {
      if (!syn.enabled) continue;
      const pre = syn.source;
      if (o.driven) {
        const dtd = t - pre.lastDrivenFire;
        if (dtd > 0 && dtd <= PL.WINDOW_LTP && pre.lastDrivenFire > syn.lastDrivenPre) {
          syn.lastDrivenPre = pre.lastDrivenFire;
          const timing = Math.exp(-dtd / PL.TAU_PLUS);
          if (M < 0) M = this.modulation();
          this.change(syn, PL.ETA_DRIVEN * M * timing * syn.plasticity * post.plasticity * (1 - syn.weight), 'driven');
          syn.eligibility = Math.min(1, syn.eligibility + timing);
          continue;
        }
      }
      const dtp = t - pre.lastFired;
      if (dtp <= 0 || dtp > PL.WINDOW_LTP || pre.lastFired <= syn.lastPairedPre) continue;
      syn.lastPairedPre = pre.lastFired;
      // Background activity can maintain a connection (restore it toward where it started) but never
      // grow it: only attended experience, practice, reward or replay makes pathways stronger.
      if (syn.weight < syn.initialWeight) this.change(syn, PL.ETA_SPONT * Math.exp(-dtp / PL.TAU_PLUS) * syn.plasticity * (1 - syn.weight), 'spont');
    }
    // Depression of outputs whose target already fired just before this spike (post-before-pre).
    for (const syn of post.outgoing) {
      if (!syn.enabled) continue;
      const tgt = syn.target;
      if (o.driven) {
        const dtd = t - tgt.lastDrivenFire;
        if (dtd > 0 && dtd <= PL.WINDOW_LTD && tgt.lastDrivenFire > syn.lastDrivenPost) {
          syn.lastDrivenPost = tgt.lastDrivenFire;
          this.change(syn, -PL.ETA_DRIVEN * PL.LTD_RATIO * Math.exp(-dtd / PL.TAU_MINUS) * syn.plasticity * syn.weight * (1 - 0.7 * syn.longTermStability), 'driven');
          continue;
        }
      }
      const dtm = t - tgt.lastFired;
      if (dtm <= 0 || dtm > PL.WINDOW_LTD || tgt.lastFired <= syn.lastPairedPost) continue;
      syn.lastPairedPost = tgt.lastFired;
      this.change(syn, -PL.ETA_SPONT * PL.LTD_RATIO * Math.exp(-dtm / PL.TAU_MINUS) * syn.plasticity * syn.weight * (1 - 0.7 * syn.longTermStability), 'spont');
    }
  }

  /** Activity-dependent myelination (simplified): practised, driven transmission adds insulation. */
  onTransmit(syn, o) {
    if (!o.driven) return;
    const rate = o.kind === 'skill' ? 0.05 : o.kind === 'replay' ? 0.02 : o.kind === 'repair' ? 0.03 : 0.012;
    const before = syn.myelinLevel;
    syn.myelinLevel = clamp(before + rate * (1 + 0.6 * syn.oligoSupport) * (1 - before) * (0.4 + 0.6 * syn.weight), 0, 1);
    for (const th of PL.MYELIN_THRESHOLDS) if (before < th && syn.myelinLevel >= th) this.game.bus.emit(EV.MYELIN_INCREASED, { synapse: syn, level: th });
  }

  /** Apply a bounded weight change and publish threshold crossings. */
  change(syn, dw, source) {
    if (!dw) return;
    const before = syn.weight;
    syn.weight = clamp(before + dw, PL.W_MIN, PL.W_MAX);
    const real = syn.weight - before;
    if (source !== 'spont' && Math.abs(real) > 1e-4) this.pending.set(syn, (this.pending.get(syn) || 0) + real);
    for (const th of PL.THRESHOLDS) {
      if (before < th && syn.weight >= th) this.game.bus.emit(EV.CONNECTION_STRENGTHENED, { synapse: syn, level: th, source });
      else if (before >= th && syn.weight < th) this.game.bus.emit(EV.CONNECTION_WEAKENED, { synapse: syn, level: th, source });
    }
  }

  update(dt) {
    const sim = this.game.sim, t = sim.time;
    this.rewardTrace *= Math.exp(-dt / 1.5);
    this.flushTimer += dt;
    if (this.flushTimer > 0.4) {
      this.flushTimer = 0;
      if (this.pending.size) {
        const list = [...this.pending.entries()].filter(([, d]) => Math.abs(d) > 0.012).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
        this.pending.clear();
        if (list.length) this.game.bus.emit('SYNAPSES_CHANGED', { changes: list.slice(0, 3), total: list.length });
      }
    }
    // Batched slow processes every 0.5 s: eligibility decay, frequency estimate, inactivity decay.
    this.batchTimer += dt;
    if (this.batchTimer >= 0.5) {
      const step = this.batchTimer; this.batchTimer = 0;
      const eligDecay = Math.exp(-step / 2), sleeping = this.game.sleep.active;
      for (const syn of sim.synapses) {
        if (syn.eligibility > 0) syn.eligibility = syn.eligibility < 0.005 ? 0 : syn.eligibility * eligDecay;
        if (syn.rewardGlow > 0) syn.rewardGlow = Math.max(0, syn.rewardGlow - step * 0.6);
        syn.activationFrequency = lerp(syn.activationFrequency, syn.freqAcc / step, 0.25); syn.freqAcc = 0;
        if (!syn.enabled || sleeping) continue;
        if (t - syn.lastActivationTime > PL.IDLE && syn.weight > syn.baseline) {
          const before = syn.weight;
          syn.weight -= (syn.weight - syn.baseline) * PL.DECAY * (1 - 0.92 * syn.longTermStability) * step;
          for (const th of PL.THRESHOLDS) if (before >= th && syn.weight < th) this.game.bus.emit(EV.CONNECTION_WEAKENED, { synapse: syn, level: th, source: 'decay' });
        }
        if (syn.myelinLevel > 0 && t - syn.lastActivationTime > 60) syn.myelinLevel = Math.max(0, syn.myelinLevel - 0.00015 * step * (1 - syn.longTermStability));
      }
    }
    // Homeostatic synaptic scaling keeps any cell from accumulating runaway excitation.
    this.scaleTimer += dt;
    if (this.scaleTimer > 5) {
      this.scaleTimer = 0;
      for (const n of sim.neurons) {
        let sum = 0;
        for (const s of n.incoming) if (s.enabled && s.effectType === 'excitatory') sum += s.weight;
        if (sum > 3.4) { const k = Math.pow(3.4 / sum, 0.3); for (const s of n.incoming) if (s.enabled && !s.protected) s.weight = clamp(s.weight * k, PL.W_MIN, PL.W_MAX); }
      }
    }
    this.effTimer += dt;
    if (this.effTimer > 1) { this.effTimer = 0; this.networkEfficiency = this.computeEfficiency(); sim.globalEfficiency = this.networkEfficiency; }
  }

  /** Network efficiency (game index): mean efficiency of all trainable pathways. */
  computeEfficiency() {
    let s = 0, c = 0;
    for (const syn of this.game.sim.synapses) if (syn.enabled && syn.networkMembership.has('trainable')) { s += syn.efficiency; c++; }
    return c ? s / c : 0;
  }
}

/* ==========================================================================
   REWARD SYSTEM
   ACTION → RESULT → REWARD SIGNAL → NETWORK UPDATE → FUTURE BEHAVIOUR.
   Inspired by three-factor learning: synapses that were recently co-active
   carry an eligibility trace; a reward-related signal converts those traces
   into lasting change. The signal tracks *prediction error*: as an outcome
   becomes expected, the burst shrinks. Not a "pleasure meter".
   ========================================================================== */
class RewardSystem {
  constructor(game) {
    this.game = game;
    this.expectations = {};
    this.lastRPE = 0; this.lastAmount = 0; this.count = 0;
    this.neurons = [];
  }
  install(sim) {
    this.neurons = ['rew_1', 'rew_2', 'rew_3'].map((k) => sim.n(k));
    // Diffuse modulatory projections, drawn as golden pulses when a reward fires.
    const targets = ['prefrontal', 'motor', 'hippocampus', 'association'];
    this.neurons.forEach((rn, i) => {
      for (const rid of targets) {
        const cells = sim.regionById[rid].neurons.filter((n) => !n.isolated);
        const rnd = keyedRandom(`reward:${i}:${rid}`);
        for (let k = 0; k < 2; k++) sim.connect(rn, cells[Math.floor(rnd() * cells.length)], 0.14, { networks: ['reward'], protected: true, tract: true });
      }
    });
  }
  /** Compare an outcome with expectation for this context; reward only the surprise. */
  outcome(key, value, opts = {}) {
    const expected = this.expectations[key] ?? 0.25;
    const rpe = value - expected;
    this.expectations[key] = clamp(expected + 0.3 * rpe, 0, 0.95);
    this.lastRPE = rpe;
    const amount = Math.max(opts.floor ?? 0.1, rpe);
    if (value > 0) this.trigger(amount, { ...opts, rpe, expected });
    return { rpe, expected, amount };
  }
  trigger(amount, opts = {}) {
    const g = this.game, sim = g.sim;
    amount = clamp(amount, 0, 1);
    this.lastAmount = amount; this.count++;
    g.plasticity.rewardTrace = Math.min(1.5, g.plasticity.rewardTrace + amount);
    let eligible = 0;
    for (const syn of sim.synapses) {
      if (!syn.enabled || syn.eligibility < 0.03) continue;
      g.plasticity.change(syn, 0.35 * amount * syn.eligibility * syn.plasticity * (1 - syn.weight), 'reward');
      syn.rewardGlow = 1; eligible++;
    }
    this.neurons.forEach((n, i) => sim.schedule(i * 0.06, () => sim.fire(n, { cause: 'reward', forced: true, reliable: true, kind: 'reward' })));
    g.renderer?.addRing(sim.regionById.reward.center, [1, 0.78, 0.36], 0.9 + amount * 1.1);
    g.ui?.floatAt(sim.regionById.reward.center, opts.label || `REWARD SIGNAL ↑`, '#ffc35c');
    g.audio.reward(amount);
    g.bus.emit(EV.REWARD_TRIGGERED, { amount, eligible, rpe: opts.rpe ?? amount, label: opts.label || 'Reward' });
  }
}
/* ==========================================================================
   MEMORY SYSTEM
   A memory is a distributed pattern: feature neurons in several regions plus
   hippocampal "index" cells, joined by real synapses in the network.

   storage strength      = mean association strength of the pattern's synapses
   retrieval access.     = how easily a cue can reactivate it right now
   consolidation         = stability; slows forgetting, protects synapses
   interference          = competition from similar memories

   Forgetting is NOT deletion: accessibility drifts down over time, faster with
   interference and slower with consolidation, while storage only changes if
   the synapses themselves change.
   ========================================================================== */
class Memory {
  constructor(def) {
    this.def = def; this.id = def.id; this.name = def.name; this.kind = def.kind;
    this.features = def.features.map((f) => ({ ...f, neuron: null }));
    this.indexNeurons = []; this.lures = []; this.pairs = [];
    this.adj = new Map();
    this.associatedNeuronIds = []; this.associatedSynapseIds = [];
    const init = def.initial;
    this.encodingStrength = init.encodingStrength;
    this.storageStrength = 0;              // cached mean strength of the pattern's synapses (see MemorySystem.storage)
    this.retrievalAccessibility = init.accessibility;
    this.interference = init.interference;
    this.consolidation = init.consolidation;
    this.lastRetrieved = null; this.retrievalCount = 0; this.successCount = 0;
    this.createdAt = def.origin === 'prior' ? 'prior' : null;
    this.encoded = def.origin === 'prior';
    this.stabilized = init.consolidation >= 0.6;
    this.bindCounts = Object.fromEntries(def.features.map((f) => [f.id, 0]));
    this.experiences = 0;
    this.recentActivity = 0;
    this.lastOutcome = null;
    this.cueId = def.cue;
  }
  feature(id) { return this.features.find((f) => f.id === id); }
}

class MemorySystem {
  constructor(game) {
    this.game = game;
    this.list = MEMORY_DEFS.map((d) => new Memory(d));
    this.memories = Object.fromEntries(this.list.map((m) => [m.id, m]));
    this.recall = null; this.lastRecall = null;
    this.forgetTimer = 0;
  }

  install(sim) {
    const usedLures = new Set();
    for (const m of this.list) {
      const init = m.def.initial, tag = 'memory:' + m.id;
      const nets = [tag]; if (m.def.origin === 'learn') nets.push('trainable');
      const prior = m.def.origin === 'prior';
      for (const f of m.features) { f.neuron = sim.n(f.key); f.neuron.networkMembership.add(tag); f.neuron.label = f.label; }
      m.storageStrength = 0;
      m.indexNeurons = m.def.index.map((k) => { const n = sim.n(k); n.networkMembership.add(tag); n.label = 'Hippocampal index'; return n; });
      const rnd = keyedRandom('mem:' + m.id);
      const stab = prior ? init.consolidation * 0.9 : 0.05;
      const link = (a, b) => {
        for (const [x, y] of [[a, b], [b, a]]) {
          const w = clamp(init.weight + (rnd() - 0.5) * 0.06, 0.03, 0.95);
          const syn = sim.connect(x, y, w, { set: true, memory: m.id, networks: nets, protected: true, stability: stab, baseline: prior ? w * 0.8 : 0.06 });
          syn.longTermStability = Math.max(syn.longTermStability, stab);
          m.associatedSynapseIds.push(syn.id);
          if (!m.adj.has(x)) m.adj.set(x, []);
          m.adj.get(x).push({ to: y, syn });
        }
        m.pairs.push([a, b]);
      };
      for (const f of m.features) for (const idx of m.indexNeurons) link(f.neuron, idx);
      for (const [a, b] of m.def.links) link(m.feature(a).neuron, m.feature(b).neuron);
      m.associatedNeuronIds = [...m.features.map((f) => f.neuron.id), ...m.indexNeurons.map((n) => n.id)];
      m.lures = m.def.lures.map((l, i) => {
        const cands = sim.regionById[l.region].neurons.filter((n) => !n.role && !n.isolated && !usedLures.has(n)).sort((a, b) => (a.key < b.key ? -1 : 1));
        const n = cands[(i * 3 + m.id.length) % cands.length];
        usedLures.add(n);
        return { label: l.label, neuron: n };
      });
    }
  }

  /** Stored strength of the connection pattern (0..1 game index). */
  storage(m) {
    const sim = this.game.sim;
    let s = 0;
    for (const [a, b] of m.pairs) s += sim.pairStrength(a, b);
    return clamp((s / m.pairs.length - 0.04) / 0.86);
  }

  status(m) {
    if (!m.encoded) return { label: 'Not yet encoded', tone: '', text: m.def.mission ? `Encode it in Learn · Mission ${LEARN_MISSIONS.find((x) => x.id === m.def.mission).n}.` : '' };
    const st = this.storage(m), acc = m.retrievalAccessibility;
    if (m.interference >= 0.5) return { label: 'Competing memories interfering', tone: 'bad', text: 'Similar memories compete for the same cues. Retrieval is blocked more often.' };
    if (st >= 0.45 && acc < 0.35) return { label: 'Stored but hard to access', tone: 'warn', text: 'The pattern still exists in the synapses, but cues struggle to reactivate it.' };
    if (m.consolidation < 0.3) return { label: 'Fragile · not yet consolidated', tone: 'warn', text: 'New and unstable. Sleep and spaced recall help it settle.' };
    if (acc >= 0.6 && m.consolidation >= 0.6) return { label: 'Stable and accessible', tone: 'good', text: 'Well stored, consolidated and easy to retrieve.' };
    return { label: 'Developing', tone: 'accent', text: 'Getting stronger. Keep practising retrieval.' };
  }

  /** Called by Learn missions after each attended experience. */
  noteExperience(m, info) {
    const sim = this.game.sim, att = this.game.attention;
    m.experiences++;
    for (const id of info.bound || []) m.bindCounts[id] = (m.bindCounts[id] || 0) + 1;
    m.encodingStrength = clamp(lerp(m.encodingStrength || info.quality, info.quality, 0.5));
    m.recentActivity = 1;
    for (const id of m.associatedSynapseIds) { const s = sim.synapses[id]; s.longTermStability = clamp(s.longTermStability + 0.015); }
    m.interference = clamp(m.interference + 0.08 * att.distraction);
    for (const [other, k] of Object.entries(m.def.similar || {})) {
      const o = this.memories[other];
      if (o && o.encoded && o !== m) o.interference = clamp(o.interference + 0.03 * k);
    }
    const storage = this.storage(m);
    if (!m.encoded && storage >= 0.3) {
      m.encoded = true; m.createdAt = sim.time;
      m.retrievalAccessibility = clamp(0.3 + 0.4 * m.encodingStrength);
      this.game.bus.emit(EV.MEMORY_ENCODED, { memory: m, storage });
    } else if (m.encoded) {
      m.retrievalAccessibility = clamp(m.retrievalAccessibility + 0.05 * (1 - m.retrievalAccessibility) * info.quality);
    }
  }

  consolidate(m, amount) {
    const before = m.consolidation;
    m.consolidation = clamp(before + amount * (1 - before));
    if (!m.stabilized && m.consolidation >= 0.6 && m.encoded) {
      m.stabilized = true;
      this.game.bus.emit(EV.MEMORY_STABILIZED, { memory: m });
    }
    return m.consolidation - before;
  }

  addInterference(m, amount = 0.3) {
    m.interference = clamp(m.interference + amount);
    this.game.bus.emit(EV.DISTRACTION_OCCURRED, { interference: true, memory: m });
  }

  /* ---------- recall: pattern completion ---------- */
  startRecall(memId, cueIds) {
    const m = this.memories[memId];
    if (!m || this.recall) return null;
    const cueSet = new Set(cueIds && cueIds.length ? cueIds : [m.cueId]);
    const nodes = new Map();
    for (const f of m.features) nodes.set(f.neuron, { neuron: f.neuron, feature: f, a: 0, target: 0, revealed: false, cue: cueSet.has(f.id), lastFire: -9, via: null });
    for (const n of m.indexNeurons) nodes.set(n, { neuron: n, feature: null, a: 0, target: 0, revealed: false, cue: false, lastFire: -9, via: null });
    this.recall = {
      m, cueSet, nodes, t: 0, duration: 6.5, boost: 0, A: 0, energySpent: 0,
      lures: m.lures.map((l) => ({ ...l, a: 0, intruding: false, suppressed: false, lastFire: -9, phase: Math.random() * TAU })),
      before: { acc: m.retrievalAccessibility, storage: this.storage(m), cons: m.consolidation, int: m.interference },
    };
    m.recentActivity = Math.max(m.recentActivity, 0.6);
    this.lastRecall = null;
    return this.recall;
  }

  /** Effective retrieval drive: accessibility × (1 − interference) × attention, plus effort. */
  effectiveAccess(r) {
    const att = this.game.attention;
    const intEff = clamp(r.m.interference + 0.5 * att.distraction);
    const intrusions = r.lures.filter((l) => l.intruding && !l.suppressed).length;
    return clamp((0.25 + 0.75 * r.m.retrievalAccessibility) * (1 - 0.55 * intEff) * (0.75 + 0.25 * att.focus) + r.boost - 0.1 * intrusions, 0.02, 1.2);
  }

  updateRecall(dt) {
    const r = this.recall;
    if (!r) return;
    const sim = this.game.sim;
    r.t += dt; r.boost *= Math.exp(-dt / 2.5);
    const A = this.effectiveAccess(r); r.A = A;
    for (const node of r.nodes.values()) { node.target = node.cue ? 1 : 0; }
    // Each active node passes on activation ∝ synaptic weight × effective access.
    for (const node of r.nodes.values()) {
      if (node.a < 0.05) continue;
      for (const { to, syn } of r.m.adj.get(node.neuron) || []) {
        const tn = r.nodes.get(to);
        if (!tn || tn.cue || !syn.enabled || to.health <= 0) continue;
        const v = node.a * clamp(syn.weight * A * 3.2, 0, 0.97);
        if (v > tn.target) { tn.target = v; tn.via = syn; }
      }
    }
    const rise = 1 - Math.exp(-dt * 2.2);
    for (const node of r.nodes.values()) {
      node.a += (node.target - node.a) * rise;
      if (!node.revealed && node.a >= 0.5) {
        node.revealed = true; node.lastFire = r.t;
        sim.fire(node.neuron, { cause: 'recall', forced: true, kind: 'recall' });
        if (node.via) sim.visualPulse(node.via, 'recall');
        if (node.feature && !node.cue) { this.game.ui.floatAt(node.neuron.position, node.feature.label.toUpperCase(), '#d9c8ff'); this.game.audio.chime(0.5 + 0.1 * r.nodes.size); }
      }
      if ((node.revealed || node.cue) && r.t - node.lastFire > (node.cue ? 0.7 : 1.1)) {
        node.lastFire = r.t;
        sim.fire(node.neuron, { cause: 'recall', forced: true, kind: 'recall' });
      }
    }
    const intEff = clamp(r.m.interference + 0.5 * this.game.attention.distraction);
    for (const l of r.lures) {
      if (l.suppressed) { l.a = Math.max(0, l.a - dt * 2); l.intruding = false; continue; }
      const target = intEff * 1.05 * (0.62 + 0.38 * Math.sin(r.t * 1.6 + l.phase));
      l.a += (target - l.a) * rise;
      const was = l.intruding;
      l.intruding = l.a >= 0.45 && r.t > 0.8;
      if (l.intruding && !was) { this.game.ui.floatAt(l.neuron.position, `INTRUSION · ${l.label.toUpperCase()}`, '#ff8a96'); this.game.audio.error(0.4); }
      if (l.intruding && r.t - l.lastFire > 0.8) { l.lastFire = r.t; sim.fire(l.neuron, { forced: true, kind: 'intrusion', cause: 'intrusion' }); }
    }
    const feats = [...r.nodes.values()].filter((n) => n.feature);
    if (r.t >= r.duration || (feats.every((n) => n.revealed || n.cue) && r.t > 2.4)) this.finishRecall();
  }

  concentrate() {
    const r = this.recall, att = this.game.attention;
    if (!r) return 'idle';
    if (att.energy < 0.1) return 'tired';
    att.energy -= 0.1; r.energySpent += 0.1;
    r.boost = Math.min(0.2, r.boost + 0.065);
    const sim = this.game.sim;
    for (const k of ['task_1', 'task_2', 'task_3']) sim.fire(sim.n(k), { forced: true, kind: 'focus', cause: 'effort' });
    this.game.ui.floatAt(sim.regionById.prefrontal.center, 'EFFORTFUL RETRIEVAL ↑', '#c4a7ff');
    return 'ok';
  }

  suppressIntrusions() {
    const r = this.recall, att = this.game.attention;
    if (!r) return 0;
    let n = 0;
    for (const l of r.lures) if (l.intruding && !l.suppressed) {
      l.suppressed = true; l.intruding = false; n++;
      att.energy = Math.max(0, att.energy - 0.06);
      this.game.renderer?.addRing(l.neuron.position, [1, 0.5, 0.6], 0.9);
      this.game.ui.floatAt(l.neuron.position, 'SUPPRESSED', '#ff8a96');
      this.game.bus.emit(EV.DISTRACTION_SUPPRESSED, { intrusion: true, label: l.label });
    }
    return n;
  }

  cancelRecall() { this.recall = null; }

  finishRecall() {
    const r = this.recall;
    if (!r) return;
    this.recall = null;
    const g = this.game, sim = g.sim, m = r.m;
    const feats = [...r.nodes.values()].filter((n) => n.feature && !n.cue);
    const revealed = feats.filter((n) => n.revealed).length;
    const fraction = feats.length ? revealed / feats.length : 0;
    const success = fraction >= 0.8, partial = !success && fraction >= 0.4;
    const accBefore = m.retrievalAccessibility;
    // Retrieval practice: every attempt helps a little; successful retrieval helps most.
    m.retrievalAccessibility = clamp(accBefore + (success ? 0.15 : partial ? 0.12 : 0.07) * (1 - accBefore));
    this.consolidate(m, success ? 0.03 : 0.012);
    if (success) m.interference = clamp(m.interference * 0.88);
    for (const node of r.nodes.values()) if (node.revealed && node.via) g.plasticity.change(node.via, 0.04 * (1 - node.via.weight), 'driven');
    m.retrievalCount++; if (success) m.successCount++;
    m.lastRetrieved = sim.time; m.recentActivity = 1;
    m.lastOutcome = { fraction, revealed, total: feats.length, success, partial, accBefore, accAfter: m.retrievalAccessibility, storage: this.storage(m), cue: [...r.cueSet], intrusions: r.lures.filter((l) => l.suppressed).length };
    this.lastRecall = { ...m.lastOutcome, m, nodes: r.nodes };
    g.ui.floatAt(m.features[0].neuron.position, `RETRIEVAL ACCESS ${pts(m.retrievalAccessibility - accBefore)}`, '#c4a7ff');
    g.bus.emit(success ? EV.MEMORY_RECALLED : EV.MEMORY_FAILED, { memory: m, fraction, success, partial });
    if (success) g.reward.outcome('recall:' + m.id, 1, { label: 'REWARD · PATTERN COMPLETED' });
  }

  update(dt) {
    this.updateRecall(dt);
    this.forgetTimer += dt;
    if (this.forgetTimer < 1) return;
    const step = this.forgetTimer; this.forgetTimer = 0;
    for (const m of this.list) m.storageStrength = this.storage(m);
    if (this.game.sleep.active) return;
    for (const m of this.list) {
      if (!m.encoded) continue;
      const rate = (1 / 900) * (1 - 0.85 * m.consolidation) * (1 + m.interference);
      m.retrievalAccessibility = Math.max(0.05, m.retrievalAccessibility * (1 - rate * step));
      m.interference = Math.max(0.03, m.interference - step * 0.0003);
      m.recentActivity *= Math.exp(-step / 400);
    }
  }

  encodedCount() { return this.list.filter((m) => m.encoded).length; }
}
/* ==========================================================================
   ATTENTION SYSTEM
   Attention acts as a spotlight on a network: attended neurons get extra gain,
   others are mildly suppressed, and learning updates scale with encoding
   quality = focus × (1 − distraction). Distractors are competing networks
   that fire in their own regions and pull activity away from the task
   (a simplified "biased competition" picture).
   ========================================================================== */
class AttentionSystem {
  constructor(game) {
    this.game = game;
    this.baseline = 0.6; this.focus = 0.6; this.distraction = 0.06;
    this.energy = 1;                 // focus energy: a game resource spent on effortful control
    this.boostTimer = 0; this.override = null;
    this.spotlightSet = new Set();
    this.ambient = []; this.ambientTimer = 28; this.nextId = 1;
    this.session = null; this.lastSession = null;
    this.sessions = 0; this.bestScore = 0;
    this.taskNeurons = [];
  }

  install(sim) {
    const t = ['task_1', 'task_2', 'task_3', 'task_4', 'task_5', 'task_6'].map((k) => sim.n(k));
    this.taskNeurons = t;
    for (let i = 0; i < t.length; i++) {
      t[i].networkMembership.add('task'); t[i].label = 'Task network';
      sim.connect(t[i], t[(i + 1) % t.length], 0.32, { networks: ['task', 'trainable'], protected: true });
      sim.connect(t[i], t[(i + 3) % t.length], 0.22, { networks: ['task'], protected: true });
    }
  }

  get encodingQuality() { const f = this.override ?? this.focus; return clamp(f * (1 - 0.7 * this.distraction)); }
  setSpotlight(neurons) { this.spotlightSet = new Set(neurons || []); }

  update(dt, modeId) {
    if (this.boostTimer > 0) this.boostTimer -= dt;
    const target = clamp(this.baseline + (this.boostTimer > 0 ? 0.1 : 0) - this.distraction * 0.45);
    this.focus = damp(this.focus, target, 0.8, dt);
    if (!this.session) this.energy = Math.min(1, this.energy + dt * 0.03);
    this.updateAmbient(dt, modeId);
    const ambientLoad = this.ambient.reduce((s, d) => s + d.salience, 0);
    const sessionLoad = this.session ? this.session.distractors.filter((d) => !d.relevant).reduce((s, d) => s + d.salience, 0) * 0.5 : 0;
    this.distraction = damp(this.distraction, clamp(0.04 + ambientLoad * 0.55 + sessionLoad), 2, dt);
    if (this.session) this.updateSession(dt);
    this.applyGains();
  }

  applyGains() {
    const has = this.spotlightSet.size > 0, f = this.focus;
    for (const n of this.game.sim.neurons) n.gain = has ? (this.spotlightSet.has(n) ? 1 + 0.35 * f : 1 - 0.1 * f) : 1;
  }

  /** A point just outside the brain near a region, where a distractor "appears". */
  anchorFor(def) {
    const reg = this.game.sim.regionById[def.regions[0]];
    const dir = V3.norm(V3.sub(reg.center, [0, 0.4, 0]));
    const jitter = [(Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 1.6];
    return V3.add(V3.add(reg.center, V3.scale(dir, 2.4)), jitter);
  }

  /* ---------- ambient distractions (Learn / Remember / Train) ---------- */
  updateAmbient(dt, modeId) {
    const allowed = ['learn', 'remember', 'train'].includes(modeId) && !this.game.sleep.active && this.game.settings.ambient;
    const sim = this.game.sim;
    for (const d of this.ambient) {
      d.age += dt;
      d.salience = Math.min(0.85, d.salience + d.def.grow * dt * 0.6);
      d.fireTimer += dt;
      if (d.fireTimer > 0.3) { d.fireTimer = 0; const reg = sim.regionById[pick(d.def.regions)]; const n = pick(reg.neurons.filter((x) => x.recruited && !x.isolated)); if (n && Math.random() < d.salience) sim.fire(n, { forced: true, kind: 'distractor', cause: 'distractor' }); }
    }
    const before = this.ambient.length;
    this.ambient = this.ambient.filter((d) => d.age < d.life);
    if (before !== this.ambient.length) this.game.ui.markDirty('overlay');
    if (!allowed) { if (this.ambient.length) { this.ambient = []; this.game.ui.markDirty('overlay'); } return; }
    this.ambientTimer -= dt;
    if (this.ambientTimer <= 0) {
      this.ambientTimer = 30 + Math.random() * 25;
      const chance = clamp(0.75 - (this.baseline - 0.6) * 2.5, 0.25, 0.75);
      if (Math.random() < chance && this.ambient.length < 2) this.spawnAmbient();
    }
  }
  spawnAmbient() {
    const def = pick(DISTRACTORS.filter((d) => !d.habituates));
    const d = { id: this.nextId++, def, label: def.label, salience: lerp(def.base[0], def.base[1], Math.random()), age: 0, life: 13, fireTimer: 0, pos: this.anchorFor(def), ambient: true };
    this.ambient.push(d);
    this.game.ui.floatAt(d.pos, 'DISTRACTION ↑', '#ff9f7a');
    this.game.audio.ping(0.5);
    this.game.bus.emit(EV.DISTRACTION_OCCURRED, { distractor: d, ambient: true });
    this.game.ui.markDirty('overlay');
  }
  dismissAmbient(id) {
    const d = this.ambient.find((x) => x.id === id);
    if (!d) return;
    this.ambient = this.ambient.filter((x) => x !== d);
    this.energy = Math.max(0, this.energy - 0.03);
    this.game.ui.floatAt(d.pos, 'SUPPRESSED · ENCODING ↑', '#5eead4');
    this.game.renderer?.addRing(d.pos, [1, 0.55, 0.45], 0.8);
    this.game.bus.emit(EV.DISTRACTION_SUPPRESSED, { distractor: d, ambient: true });
    this.game.ui.markDirty('overlay');
  }

  /* ---------- Focus mini-game ---------- */
  /**
   * opts (optional, used by Demo Mode): duration in game-seconds, cues:false to skip task-relevant
   * cues, script:[{ id, at }] to spawn named distractions at set times instead of at random.
   */
  startSession(opts = {}) {
    const cueTimes = opts.cues === false ? [] : [12 + Math.random() * 8, 33 + Math.random() * 12];
    this.session = {
      t: 0, duration: opts.duration || 60, T: 0.56, distractors: [], nextSpawn: 2.2, cues: shuffle(TASK_CUES), cueTimes,
      script: Array.isArray(opts.script) ? opts.script.map((x) => ({ ...x })) : null,
      captured: null, switches: 0, focusTime: 0, streak: 0, bestStreak: 0, encSum: 0, dominance: 0.6,
      decisions: 0, correct: 0, threats: 0, suppressed: 0, habituated: 0, wasted: 0, missed: 0, engaged: 0,
      reinforcements: 0, fireTimer: 0, deepFocus: false, history: [],
    };
    this.energy = 1; this.ambient = [];
    this.setSpotlight(this.taskNeurons);
    this.game.ui.markDirty('overlay');
  }
  spawnSessionItem(def, relevant) {
    const s = this.session;
    const d = relevant
      ? { id: this.nextId++, def: { id: def.id, label: def.label, regions: ['prefrontal', 'association'], habituates: false, grow: 0.05 }, label: def.label, relevant: true, salience: 0.35, age: 0, pos: this.anchorFor({ regions: ['association'] }) }
      : { id: this.nextId++, def, label: def.label, relevant: false, salience: lerp(def.base[0], def.base[1], Math.random()), age: 0, pos: this.anchorFor(def) };
    s.distractors.push(d);
    if (!relevant) { s.threats += def.habituates ? 0 : 1; this.game.bus.emit(EV.DISTRACTION_OCCURRED, { distractor: d }); this.game.ui.floatAt(d.pos, `${d.label} ↑`, '#ff9f7a'); this.game.audio.ping(0.6); }
    else { this.game.ui.floatAt(d.pos, 'TASK-RELEVANT SIGNAL', '#5eead4'); this.game.audio.chime(0.7); }
    this.game.ui.markDirty('overlay');
  }
  updateSession(dt) {
    const s = this.session, sim = this.game.sim;
    s.t += dt;
    s.T += (0.36 - s.T) * (1 - Math.exp(-dt / 8));
    if (s.captured) s.T = Math.max(0.08, s.T - dt * 0.05);
    if (s.script) {
      while (s.script.length && s.t >= s.script[0].at) { const id = s.script.shift().id, def = DISTRACTORS.find((d) => d.id === id); if (def) this.spawnSessionItem(def, false); }
    } else if (s.t >= s.nextSpawn && s.t < s.duration - 3) {
      this.spawnSessionItem(pick(DISTRACTORS), false);
      s.nextSpawn = s.t + lerp(5, 3.1, s.t / s.duration) * (0.8 + Math.random() * 0.45);
    }
    if (s.cueTimes.length && s.t >= s.cueTimes[0]) { s.cueTimes.shift(); this.spawnSessionItem(s.cues.pop() || TASK_CUES[0], true); }
    for (const d of s.distractors) {
      d.age += dt;
      if (d.relevant) {
        d.salience = Math.min(0.9, d.salience + 0.05 * dt);
        if (d.age > 7) { d.gone = true; s.missed++; s.decisions++; this.game.ui.floatAt(d.pos, `MISSED · ${d.label}`, '#ff8a96'); }
      } else if (d.def.habituates) {
        d.salience += (d.age < 4 ? d.def.grow : -0.07) * dt;
        if (d.salience < 0.08) { d.gone = true; s.habituated++; this.game.ui.floatAt(d.pos, 'HABITUATED · IGNORED', '#8ea2b4'); }
      } else {
        d.salience = Math.min(1, d.salience + d.def.grow * dt);
        if (d.age > 16) d.gone = true;
      }
    }
    if (s.distractors.some((d) => d.gone)) { s.distractors = s.distractors.filter((d) => !d.gone); this.game.ui.markDirty('overlay'); }
    const threats = s.distractors.filter((d) => !d.relevant);
    let strongest = null;
    for (const d of threats) if (!strongest || d.salience > strongest.salience) strongest = d;
    if (s.captured && (!s.distractors.includes(s.captured) || s.T > s.captured.salience + 0.05)) { s.captured = null; this.game.ui.floatAt(sim.regionById.prefrontal.center, 'BACK ON TASK', '#5eead4'); this.game.ui.markDirty('overlay'); }
    if (!s.captured && strongest && strongest.salience > s.T + 0.08) {
      s.captured = strongest; s.switches++;
      this.game.audio.error(0.5);
      this.game.ui.floatAt(strongest.pos, 'ATTENTION CAPTURED', '#ff8a96');
      this.game.bus.emit(EV.ATTENTION_CAPTURED, { distractor: strongest });
      this.game.ui.markDirty('overlay');
    }
    const load = threats.reduce((sum, d) => sum + d.salience, 0);
    s.dominance = s.T / (s.T + load * 0.85 + 1e-6) * (s.captured ? 0.5 : 1);
    this.energy = clamp(this.energy + dt * (s.captured ? 0.006 : s.dominance > 0.55 ? 0.03 : 0.014));
    if (s.dominance >= 0.55 && !s.captured) {
      s.focusTime += dt; s.streak += dt; s.bestStreak = Math.max(s.bestStreak, s.streak);
      if (s.streak >= 20 && !s.deepFocus) { s.deepFocus = true; this.game.achievements.unlock('deep-focus'); }
    } else s.streak = 0;
    s.encSum += s.dominance * (0.6 + 0.4 * this.energy) * dt;
    s.fireTimer += dt;
    if (s.fireTimer > 0.12) {
      s.fireTimer = 0;
      if (Math.random() < s.T) sim.fire(pick(this.taskNeurons), { forced: true, kind: 'focus', cause: 'task' });
      for (const d of s.distractors) {
        if (Math.random() > d.salience * 0.85) continue;
        const reg = sim.regionById[pick(d.def.regions)];
        const n = pick(reg.neurons.filter((x) => x.recruited && !x.isolated));
        if (n) sim.fire(n, { forced: true, kind: d.relevant ? 'focus' : 'distractor', cause: 'distractor' });
      }
    }
    if (s.history.length === 0 || s.t - s.history[s.history.length - 1].t > 0.5) s.history.push({ t: s.t, d: s.dominance });
    if (s.t >= s.duration) this.endSession();
  }
  reinforce() {
    const s = this.session;
    if (!s) return 'idle';
    if (this.energy < 0.06) { this.game.ui.floatAt(this.game.sim.regionById.prefrontal.center, 'FOCUS ENERGY LOW', '#fbbf5b'); return 'tired'; }
    this.energy -= 0.06; s.reinforcements++;
    s.T = Math.min(1, s.T + 0.17);
    const sim = this.game.sim;
    this.taskNeurons.forEach((n, i) => sim.schedule(i * 0.04, () => sim.fire(n, { forced: true, driven: true, kind: 'focus', cause: 'task' })));
    const cue = s.distractors.find((d) => d.relevant);
    if (cue) {
      s.distractors = s.distractors.filter((d) => d !== cue);
      s.decisions++; s.correct++; s.engaged++;
      s.T = Math.min(1, s.T + 0.15);
      this.game.ui.floatAt(cue.pos, 'RELEVANT · ENGAGED ✓', '#5eead4');
      this.game.audio.chime(0.9);
    } else this.game.ui.floatAt(sim.regionById.prefrontal.center, 'TASK ↑', '#5eead4');
    if (s.captured && s.T > s.captured.salience) { s.captured = null; this.game.ui.floatAt(sim.regionById.prefrontal.center, 'BACK ON TASK', '#5eead4'); }
    this.game.ui.markDirty('overlay');
    return 'ok';
  }
  suppress(id) {
    const s = this.session;
    if (!s) return 'idle';
    let d = id != null ? s.distractors.find((x) => x.id === id) : null;
    if (!d) d = s.distractors.filter((x) => !x.relevant).sort((a, b) => b.salience - a.salience)[0] || null;
    if (!d) { this.game.ui.toast('Nothing to suppress right now. Reinforce the task instead.', 'info'); return 'none'; }
    if (this.energy < 0.05) { this.game.ui.floatAt(d.pos, 'FOCUS ENERGY LOW', '#fbbf5b'); return 'tired'; }
    this.energy -= 0.05;
    s.distractors = s.distractors.filter((x) => x !== d);
    s.decisions++;
    if (d.relevant) {
      s.T = Math.max(0.1, s.T - 0.08);
      this.game.ui.floatAt(d.pos, 'RELEVANT SIGNAL LOST ✗', '#ff8a96');
      this.game.audio.error(0.6);
    } else {
      s.correct++; s.suppressed++;
      if (d.def.habituates && d.age > 4) s.wasted++;
      if (s.captured === d) s.captured = null;
      this.game.renderer?.addRing(d.pos, [1, 0.5, 0.6], 1.1);
      this.game.ui.floatAt(d.pos, 'SUPPRESSED ✓', '#ff7fae');
      this.game.audio.tick(0.7);
      // Inhibitory interneurons in the distractor's region fire: visible suppression.
      const sim = this.game.sim;
      for (const rid of d.def.regions) {
        const inh = sim.regionById[rid].neurons.filter((n) => n.type === 'inhibitory' && n.recruited);
        inh.slice(0, 3).forEach((n, i) => sim.schedule(i * 0.05, () => sim.fire(n, { forced: true, kind: 'inhibit', cause: 'suppress' })));
      }
      this.game.bus.emit(EV.DISTRACTION_SUPPRESSED, { distractor: d });
    }
    this.game.ui.markDirty('overlay');
    return 'ok';
  }
  endSession(aborted = false) {
    const s = this.session;
    if (!s) return null;
    this.session = null;
    this.setSpotlight(null);
    if (aborted) { this.game.ui.markDirty('overlay'); return null; }
    const focusDuration = s.focusTime / s.duration;
    const encodingQuality = s.encSum / s.duration;
    const accuracy = s.decisions ? s.correct / s.decisions : (focusDuration > 0.5 ? 1 : 0);
    const suppression = s.threats ? Math.min(1, s.suppressed / s.threats) : 1;
    const score = clamp(0.35 * focusDuration + 0.3 * encodingQuality + 0.2 * accuracy + 0.15 * (1 - Math.min(1, s.switches / 6)));
    const grade = score >= 0.8 ? 'A' : score >= 0.65 ? 'B' : score >= 0.5 ? 'C' : 'D';
    const success = focusDuration >= 0.6 && accuracy >= 0.6;
    const result = { focusDuration, encodingQuality, accuracy, suppression, switches: s.switches, bestStreak: s.bestStreak, decisions: s.decisions, correct: s.correct, suppressed: s.suppressed, threats: s.threats, habituated: s.habituated, wasted: s.wasted, missed: s.missed, engaged: s.engaged, score, grade, success, history: s.history };
    this.lastSession = result; this.sessions++;
    this.bestScore = Math.max(this.bestScore, score);
    this.baseline = Math.min(0.82, this.baseline + 0.03 * score);
    this.boostTimer = 120 * score;
    this.game.bus.emit(EV.FOCUS_COMPLETE, { result });
    this.game.reward.outcome('focus', score, { label: 'REWARD · TASK COMPLETED' });
    this.game.ui.markDirty('overlay');
    return result;
