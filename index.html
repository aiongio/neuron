  }
}
/* ==========================================================================
   INTRO — a short cinematic: the camera drifts in from deep space while the
   network assembles and the text sequence plays. Skippable at any time.
   ========================================================================== */
class Intro {
  constructor(game) { this.game = game; this.el = $('#intro'); this.running = false; }
  start() {
    const g = this.game, cam = g.camera;
    this.running = true; g.introRunning = true;
    document.body.classList.add('intro-running');
    this.el.hidden = false; this.el.classList.remove('leaving');
    this.el.innerHTML = `<div class="intro-text" id="introText" aria-live="polite"></div><button class="btn ghost intro-skip" data-action="intro-skip">Skip intro <span class="kbd">Esc</span></button><div class="intro-progress" aria-hidden="true"><i id="introProg"></i></div>`;
    this.i = -1; this.t = 0; this.lineDur = 2.7; this.total = INTRO_LINES.length * this.lineDur;
    this.final = false;
    const reduced = !g.settings.motion;
    cam.follow = null; cam.flight = null;
    cam.yaw = cam.want.yaw = -0.9; cam.pitch = cam.want.pitch = 0.55; cam.radius = cam.want.radius = 48; cam.target = [0, 0.3, 0]; cam.want.target = [0, 0.3, 0];
    cam.flyTo({ yaw: HOME_VIEW.yaw, pitch: HOME_VIEW.pitch, radius: cam.homeRadius(), target: HOME_VIEW.target }, reduced ? 0 : this.total + 1.5);
    // The network "assembles": cells ignite progressively from the centre outward.
    for (const n of g.sim.neurons) if (n.recruited) {
      const d = V3.len(n.position);
      g.sim.schedule(0.4 + d * 0.55 + Math.random() * 1.2, () => { n.recruitGlow = 1; g.sim.fire(n, { forced: true, cause: 'intro' }); });
    }
    this.next();
  }
  next() {
    const g = this.game, box = $('#introText');
    this.i++;
    if (!box) return;
    if (this.i < INTRO_LINES.length) {
      box.innerHTML = `<div class="intro-line">${INTRO_LINES[this.i]}</div>`;
      this.beat(this.i);
    } else this.showFinal();
  }
  beat(i) {
    const g = this.game, sim = g.sim;
    if (i === 1) sim.networkBurst();
    if (i === 3) sim.regionalWave(sim.regionById.visual, { spread: 0.25 });
    if (i === 4) { const ns = g.missions.seqNeurons(); for (let k = 0; k < 3; k++) ns.forEach((n, j) => sim.schedule(k * 0.8 + j * 0.16, () => sim.fire(n, { forced: true, kind: 'lesson', cause: 'intro' }))); }
    if (i === 5) sim.runChain();
    if (i === 6) { const m = g.memory.memories.paris; [...m.indexNeurons, ...m.features.map((f) => f.neuron)].forEach((n, j) => sim.schedule(j * 0.14, () => sim.fire(n, { forced: true, kind: 'recall', cause: 'intro' }))); }
  }
  showFinal() {
    const box = $('#introText');
    this.final = true;
    const tutDone = this.game.tutorial.done;
    box.innerHTML = `<div class="intro-line final hold">WELCOME TO NEURON.<small>INSIDE THE LIVING BRAIN</small></div>
      <div class="intro-start">${btn('intro-start', tutDone ? 'Enter the network' : 'Begin the guided tour', { cls: 'primary', icon: 'play', data: { guided: tutDone ? 'no' : 'yes' } })}${tutDone ? '' : btn('intro-start', 'Explore freely', { data: { guided: 'no' } })}${btn('intro-demo', '▶ Watch the demo', { cls: 'ghost', aria: 'Watch an automatic demonstration of the game' })}</div>`;
    const p = $('#introProg'); if (p) p.style.width = '100%';
    setTimeout(() => $('[data-action="intro-start"]', this.el)?.focus(), 400);
  }
  update(dt) {
    if (!this.running || this.final) return;
    this.t += dt;
    const p = $('#introProg'); if (p) p.style.width = `${(clamp(this.t / this.total) * 100).toFixed(1)}%`;
    if (this.t >= (this.i + 1) * this.lineDur) this.next();
  }
  skip() { if (!this.final) { this.game.camera.home(); this.showFinal(); } else this.finish(false); }
  finish(guided) {
    const g = this.game;
    if (!this.running) return;
    this.running = false; g.introRunning = false; g.introSeen = true;
    this.el.classList.add('leaving');
    document.body.classList.remove('intro-running');
    setTimeout(() => { this.el.hidden = true; this.el.innerHTML = ''; }, 1200);
    g.camera.home();
    g.ui.markDirty('top', 'dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags');
    if (guided) g.tutorial.start();
    else g.tutorial.offered = true;
    if (innerWidth > 980) g.setPanelOpen(true);
    g.saver.save();
  }
}

/* ==========================================================================
   GUIDED TUTORIAL — ten steps, each completed by a real game event.
   The coach card points at the relevant control (or 3D target) with a ring.
   ========================================================================== */
class Tutorial {
  constructor(game) {
    this.game = game;
    this.step = 0; this.active = false; this.done = false; this.skipped = false; this.offered = false; this.min = false;
    this.el = $('#coach'); this.ring = $('#spotRing');
    this.posTimer = 0; this.suggest = null;
  }
  serialize() { return { step: this.step, done: this.done, skipped: this.skipped, offered: this.offered }; }
  restore(d) { this.step = d.step; this.done = d.done; this.skipped = d.skipped; this.offered = d.offered; this.active = d.offered && !d.done && !d.skipped; }
  get current() { return this.active ? TUTORIAL_STEPS[this.step] : null; }

  bind(bus) {
    const c = (id) => () => this.complete(id);
    bus.on(EV.CAMERA_ROTATED, c('rotate'));
    bus.on(EV.CAMERA_ZOOMED, (e) => { if (e.dir === 'in' || e.radius < 11) this.complete('zoom'); });
    bus.on(EV.REGION_SELECTED, c('zoom'));
    bus.on(EV.NEURON_SELECTED, c('select'));
    bus.on(EV.NEURON_FIRED, (e) => { if (e.cause === 'manual') this.complete('fire'); });
    bus.on(EV.SIGNAL_FOLLOWED, c('watch'));
    bus.on(EV.SYNAPSE_SELECTED, c('synapse'));
    bus.on('LESSON_REP', c('strengthen'));
    bus.on(EV.MEMORY_ENCODED, c('memory'));
    bus.on(EV.MEMORY_RECALLED, (e) => { if (e.success) this.complete('recall'); });
    bus.on(EV.MODE_UNLOCKED, c('unlock'));
    bus.on(EV.MODE_CHANGED, (e) => { if ((MODE_BY_ID[e.mode]?.unlock ?? 0) >= 4) this.complete('unlock'); });
    this.game.sim.arrivalListeners.add((sig) => {
      if (sig.tag === 'manual' && this.current?.id === 'watch' && !this.watchPending) { this.watchPending = true; setTimeout(() => { this.watchPending = false; this.complete('watch'); }, 900); }
    });
  }
  start() { this.active = true; this.offered = true; this.skipped = false; this.done = false; this.step = 0; this.min = false; this.render(); }
  restart() { this.start(); }
  skip() { this.active = false; this.skipped = true; this.hide(); this.game.ui.toast('Tour hidden. Restart it any time from Settings.', 'info', 'help'); this.game.ui.markDirty('tags'); }
  complete(id) {
    const cur = this.current;
    if (!cur || cur.id !== id) return;
    this.game.bus.emit('TUTORIAL_STEP', { id, step: this.step });
    this.game.audio.chime(0.6);
    this.step++;
    if (this.step >= TUTORIAL_STEPS.length) {
      this.active = false; this.done = true; this.hide();
      this.game.ui.toast('<b>Guided tour complete</b>You know the basics. The rest of the network is yours to explore.', 'good', 'check', true);
    } else { this.render(); this.checkAuto(); }
    this.game.ui.markDirty('tags');
  }
  checkAuto() {
    const g = this.game, cur = this.current;
    if (!cur) return;
    if (cur.id === 'unlock' && LEVELS.every((l) => g.progression.isUnlocked(l.unlocks))) this.complete('unlock');
    if (cur.id === 'memory' && g.memory.memories.redbird.encoded) this.complete('memory');
  }
  hide() { this.el.hidden = true; this.ring.hidden = true; }
  render() {
    const cur = this.current, g = this.game;
    if (!cur || g.introRunning) { this.hide(); return; }
    const locked = cur.id === 'strengthen' || cur.id === 'memory' ? !g.progression.isUnlocked('learn') : cur.id === 'recall' ? !g.progression.isUnlocked('remember') : false;
    const lockMode = cur.id === 'recall' ? 'remember' : 'learn';
    this.el.hidden = false;
    this.el.classList.toggle('min', this.min);
    if (this.min) {
      this.el.innerHTML = `<button class="btn sm ghost" data-action="tutorial-max">${icon('help')} Tour · step ${this.step + 1}/${TUTORIAL_STEPS.length}: ${esc(cur.title)}</button>`;
    } else {
      this.el.innerHTML = `<div class="eyebrow"><span>Guided tour · ${this.step + 1} / ${TUTORIAL_STEPS.length}</span><button class="btn icon sm ghost" data-action="tutorial-min" aria-label="Minimise the tour" style="min-height:0;height:1.4rem;width:1.4rem">${icon('minus', 'sm')}</button></div>
        <h3>${esc(cur.title)}</h3><p>${esc(cur.text)}</p>
        ${locked ? `<p style="color:var(--warn)">${MODE_BY_ID[lockMode].name} unlocks at level ${MODE_BY_ID[lockMode].unlock}. Keep exploring to grow complexity — or unlock everything for a demo.</p>` : ''}
        <div class="dots">${TUTORIAL_STEPS.map((_, i) => `<i class="${i < this.step ? 'done' : i === this.step ? 'now' : ''}"></i>`).join('')}</div>
        <div class="actions">${locked ? btn('toggle-unlock', 'Unlock all (demo)', { cls: 'sm', data: { force: 'on' } }) : ''}${btn('tutorial-skip', 'Skip tour', { cls: 'sm ghost' })}</div>`;
    }
    this.position();
  }
  /** Neuron suggested during the "select" step: a recruited cell near the view centre. */
  suggestedNeuron() {
    if (this.current?.id !== 'select') return null;
    if (this.suggest && this.suggest.recruited) return this.suggest;
    const g = this.game, cam = g.camera;
    let best = null, bd = Infinity;
    for (const n of g.sim.neurons) {
      if (!n.recruited || n.isolated || n.type !== 'excitatory' || n.outgoing.length < 2) continue;
      const p = cam.project(n.position);
      if (!p || !p.visible) continue;
      const d = Math.hypot(p.x - cam.width * 0.45, p.y - cam.height * 0.5);
      if (d < bd) { bd = d; best = n; }

    this.suggest = best;
    return best;
  }
  position() {
    const cur = this.current;
    if (!cur || this.el.hidden) return;
    let target = null;
    if (cur.anchor && cur.anchor !== 'canvas' && cur.anchor !== 'target-neuron') {
      target = $$(cur.anchor).find((el) => el.offsetParent !== null && el.getBoundingClientRect().width > 0) || null;
    }
    const coach = this.el.getBoundingClientRect();
    const W = innerWidth, H = innerHeight;
    if (target) {
      const r = target.getBoundingClientRect();
      Object.assign(this.ring.style, { left: `${r.left - 6}px`, top: `${r.top - 6}px`, width: `${r.width + 12}px`, height: `${r.height + 12}px` });
      this.ring.hidden = false;
      let left = r.right + 16, top = r.top + r.height / 2 - coach.height / 2;
      if (left + coach.width > W - 12) left = r.left - coach.width - 16;
      if (left < 12) { left = clamp(r.left + r.width / 2 - coach.width / 2, 12, W - coach.width - 12); top = r.top - coach.height - 16; if (top < 70) top = r.bottom + 16; }
      this.el.style.left = `${clamp(left, 12, W - coach.width - 12)}px`; this.el.style.top = `${clamp(top, 70, H - coach.height - 12)}px`;
    } else {
      this.ring.hidden = true;
      const narrow = W < 700;
      this.el.style.left = `${narrow ? 12 : Math.max(12, W * 0.5 - coach.width / 2 - (W > 980 ? 160 : 0))}px`;
      this.el.style.top = `${narrow ? 70 : 92}px`;
    }
  }
  update(dt) {
    if (!this.active) return;
    if (this.el.hidden && !this.game.introRunning) this.render();
    this.posTimer += dt;
    if (this.posTimer > 0.35) {
      this.posTimer = 0;
      this.position();
      const cur = this.current, g = this.game;
      if (cur?.id === 'zoom' && g.camera.radius < 10.5) this.complete('zoom');
      if (cur?.id === 'select' && this.suggest && !this.suggest.recruited) this.suggest = null;
      this.checkAuto();
    }
  }
}
/* ==========================================================================
   DEMO MODE — "▶ DEMO" plays the game automatically with the real systems.
   The player's world (simulation, systems, modes) is detached untouched —
   autosave suspended, nothing awarded — while a fresh sandbox world plays
   ten narrated steps. Finishing or exiting swaps that exact world back in.
     DemoController  lifecycle (start · pause · resume · skip · restart ·
                     exit · complete), a pausable demo clock with abortable
                     waits, narration cards, the ghost cursor, camera helpers
                     and state capture/restore.
     demoSteps       the ten scripted steps. Every action goes through the

const DEMO_WORLD_KEYS = ['bus', 'sim', 'plasticity', 'reward', 'memory', 'attention', 'sleep', 'repair', 'knowledge', 'skill', 'glia', 'progression', 'achievements', 'missions', 'stats', 'tutorial', 'modes'];
const DEMO_MIN_HINT = 4;     // seconds a narration card stays before the next may replace it
const DEMO_LOCKED_MSG = 'Demo Mode is playing automatically. Pause or exit the demo to take control.';
const DEMO_FOCUS_SESSION = { duration: 15, cues: false, script: [{ id: 'phone', at: 1.2 }, { id: 'chat', at: 3.6 }, { id: 'social', at: 6 }, { id: 'sound', at: 9 }] };

class DemoController {

    this.highlights = null; this.glow = new Set(); this.glowApplied = false; this.presses = [];
    this.noticeUntil = 0; this.liveTimer = 0; this.demoH = 0;

  }

  get paused() { return this.state === 'paused'; }

  /* ---------- lifecycle ---------- */
  /** The top-bar button: start; while paused or after finishing it restarts. */
  onButton() {

  start() {
    const g = this.game;
    if (this.active || this.starting || g.introRunning || !g.renderer.ready || !g.sim) return false;
    this.starting = true;
    try {
      if (g.ui.modal) g.ui.closeModal();
      this.hideCard();
      g.saver.save();                           // the player's own latest state is on disk before anything changes
      this.saved = this.captureState();
      this.mount();
      this.state = 'running';
      document.body.classList.add('demo-on', 'demo-lock');
      g.ui.hideTip(); g.ui.el.toasts.innerHTML = '';
      this.launch();
      g.setPanelOpen(innerWidth > 980);
      this.renderControls(); this.updateButton(); this.focusControls();
      g.ui.announce('Automatic demo started. Space pauses, Escape exits.');
    } catch (err) {
      console.error('NEURON demo: could not start', err);
      this.abandon();
    } finally { this.starting = false; }
    return this.active;
  }

  /** A fresh sandbox, then step 1. Cancels whatever ran before, so only one sequence is ever live. */
  launch() {
    this.cancelRun();
    const runId = ++this.runId;
    this.runAc = new AbortController();
    this.clock = 0; this.results = {}; this.log = []; this.stepIndex = -1; this.stepStart = 0; this.announcedStep = -1;
    this.highlights = null; this.glow.clear(); this.clearPresses(); this.hideCursor(); this.clearHint();
    this.buildSandbox();
    this.game.setPaused(false, true);
    this.runSteps(runId).catch((err) => console.warn('NEURON demo: run ended unexpectedly', err));
  }
  /** Abort every pending wait of the current run (they reject with AbortError) and drop queued narration. */
  cancelRun() {
    this.stepAc?.abort(); this.runAc?.abort();
    for (const w of this.waiters) { w.signal.removeEventListener('abort', w.onAbort); w.reject(demoAbortError()); }
    this.waiters.clear();
    this.hintQueue = Promise.resolve();
  }
  async runSteps(runId) {
    for (let i = 0; i < demoSteps.length; i++) {
      if (runId !== this.runId) return;
      this.stepAc = new AbortController();
      try { await this.runStep(i); }
      catch (err) { if (err?.name !== 'AbortError') console.warn(`NEURON demo: step "${demoSteps[i].id}" stopped early — continuing.`, err); }
      if (runId !== this.runId) return;
      this.settle();
    }
    if (runId === this.runId) this.complete();
  }
  /** Run one step (0-based index into demoSteps). */
  async runStep(stepIndex) {
    const step = demoSteps[stepIndex];
    await this.holdHint();                     // the previous card gets its full reading time first
    this.stepIndex = stepIndex; this.stepStart = this.clock;
    this.renderHeader();
    if (step.lead) await this.status(step);
    await step.run(this, this.game);
  }
  /** Leave a stable state after a step ends or is skipped. */
  settle() {
    const g = this.game;
    g.stopFollow(true);
    g.plasticity.learningScale = 1;
    this.highlights = null; this.glow.clear();
    document.body.classList.remove('demo-dim');
    this.hideCursor();
  }

  pause() {
    if (this.state !== 'running') return;
    this.state = 'paused';
    this.game.setPaused(true, true);
    this.renderControls(); this.updateButton();
    this.game.ui.announce('Demo paused. Press Space to resume or Escape to exit.');
  }
  resume() {
    if (this.state !== 'paused') return;
    this.state = 'running';
    this.game.setPaused(false, true);
    this.renderControls(); this.updateButton();
    this.game.ui.announce('Demo resumed.');
  }
  togglePause() { if (this.state === 'paused') this.resume(); else this.pause(); }
  /** Cancel the current step cleanly; the runner settles and moves on (staying paused if paused). */
  skipStep() {
    if (!this.active || !this.stepAc) return;
    this.clearHint();
    this.stepAc.abort();
    this.game.ui.announce('Skipping to the next demo step.');
  }
  /** Back to step 1 in a brand-new sandbox (the player's own state stays safely detached). */
  restart() {
    if (!this.active) { this.replay(); return; }
    this.state = 'running';
    this.launch();
    this.renderControls(); this.updateButton();
    this.game.ui.announce('Demo restarted from step 1.');
  }
  replay() { this.hideCard(); if (this.state === 'complete') this.state = 'idle'; this.start(); }
  /** Stop everything and give the player back exactly what they had. */
  exit() {
    if (this.state === 'complete') { this.takeControl(); return; }
    if (!this.active) return;
    this.cancelRun(); this.runId++;
    this.teardown();
    this.state = 'idle';
    this.updateButton();
    this.game.saver.save();   // the player's untouched state, plus any preference changed meanwhile (e.g. mute)
    this.game.input.canvas.focus({ preventScroll: true });   // control returns to the network (Space pauses it again)
    this.game.ui.announce('Demo ended. Your network is exactly as you left it.');
  }
  /** All ten steps played: stop automation, restore the player's world, offer TAKE CONTROL / REPLAY DEMO. */
  complete() {
    if (!this.active) return;
    const summary = this.finalSummary();
    this.cancelRun(); this.runId++;
    this.teardown();
    this.state = 'complete';
    this.game.saver.save();
    this.showCard(summary);
    this.updateButton();
  }
  takeControl() {
    this.hideCard();
    if (this.state === 'complete') this.state = 'idle';
    this.updateButton();
    this.game.input.canvas.focus({ preventScroll: true });
  }
  /** Automation off, the player's world and view back, demo chrome removed. */
  teardown() {
    this.settle();
    this.clearHint(); this.hideCursor(); this.clearPresses(); this.applyGlow();
    this.restoreState();
    document.body.classList.remove('demo-on', 'demo-lock', 'demo-dim');
    if (this.el) { this.el.panel.hidden = true; this.el.notice.classList.remove('show'); this.el.notice.textContent = ''; this.el.fade.style.opacity = '0'; }
    this.noticeUntil = 0;
    document.documentElement.style.removeProperty('--demo-h'); this.demoH = 0;
    this.game.updateViewShift();
  }
  /** Last-resort clean-up if the demo cannot start: put everything back. */
  abandon() {
    this.cancelRun(); this.runId++;
    try { this.teardown(); } catch (err) { console.error('NEURON demo: clean-up failed', err); }
    this.state = 'idle'; this.updateButton();
  }

  /* ---------- state safety ---------- */
  /** Detach the player's live world untouched and remember the view around it. */
  captureState() {
    const g = this.game, cam = g.camera, w = cam.flight ? cam.flight.to : cam.want;
    g.stopFollow(true);
    const world = {};
    for (const k of DEMO_WORLD_KEYS) world[k] = g[k];
    return {
      world, modeId: g.modeId, selection: g.selection, focusRegion: g.focusRegion, trace: g.trace, followPath: g.followPath,
      paused: g.paused, introSeen: g.introSeen, membrane: g.membraneHistory,
      camera: { yaw: cam.yaw, pitch: cam.pitch, radius: cam.radius, target: cam.target.slice(), want: { yaw: w.yaw, pitch: w.pitch, radius: w.radius, target: w.target.slice() }, fly: cam.fly, flyPos: cam.flyPos.slice() },
      panelOpen: !g.ui.el.app.classList.contains('panel-closed'), panelTab: g.ui.panelTab, journal: g.ui.journalItems.slice(),
      sleeping: document.body.classList.contains('sleeping'), focusSession: document.body.classList.contains('focus-session'),
    };
  }
  /** Swap the player's exact world back in and restore mode, selection, camera, pause, panel and journal. */
  restoreState() {
    const g = this.game, s = this.saved;
    if (!s) return;
    this.saved = null;
    if (this.inSandbox) { try { g.mode.exit(); } catch (err) { console.warn('NEURON demo: sandbox clean-up failed', err); } }
    this.inSandbox = false;
    g.stopFollow(true);
    for (const k of DEMO_WORLD_KEYS) g[k] = s.world[k];
    g.modeId = s.modeId; g.selection = s.selection; g.focusRegion = s.focusRegion; g.trace = s.trace; g.followPath = s.followPath;
    g.introSeen = s.introSeen; g.membraneHistory = s.membrane;
    g.renderer.setWorld(g.sim); g.renderer.rings.length = 0;
    const cam = g.camera, c = s.camera;
    cam.flight = null; cam.follow = null; cam.keys.clear();
    cam.fly = c.fly; cam.flyPos = c.flyPos.slice();
    if (c.fly || this.reduced) {
      cam.yaw = c.yaw; cam.pitch = c.pitch; cam.radius = c.radius; cam.target = c.target.slice();
      Object.assign(cam.want, { yaw: c.want.yaw, pitch: c.want.pitch, radius: c.want.radius, target: c.want.target.slice() });
    } else {
      // Glide back to the player's own view (unwinding the demo's orbit) rather than jumping.
      let yaw = c.want.yaw;
      while (yaw - cam.want.yaw > Math.PI) yaw -= TAU;
      while (yaw - cam.want.yaw < -Math.PI) yaw += TAU;
      cam.yaw += c.want.yaw - yaw; cam.want.yaw += c.want.yaw - yaw;
      cam.flyTo({ yaw: c.want.yaw, pitch: c.want.pitch, radius: c.want.radius, target: c.want.target }, 1.2);
    }
    cam.touch();
    g.paused = s.paused;
    g.applyModeColor();
    document.body.classList.toggle('sleeping', s.sleeping);
    document.body.classList.toggle('focus-session', s.focusSession);
    g.audio.sleep(!!(s.sleeping && g.sleep.active));
    const ui = g.ui;
    ui.journalItems = s.journal; ui.renderJournal();
    ui.clearFloaters(); ui.hideTip();
    g.setPanelOpen(s.panelOpen); ui.setTab(s.panelTab);
    ui.lastPanelKey = '';
    ui.markDirty('top', 'dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags', 'sel');
    if (g.tutorial.active) g.tutorial.render(); else g.tutorial.hide();
    g.input.hoverHit = null; g.input.updateCursor();
    g.lastScale = null; g.saveTimer = 0;
  }
  /** A brand-new world for the demo: all modes, full network, no saved progress, no rewards. */
  buildSandbox() {
    const g = this.game;
    if (this.inSandbox) { try { g.mode.exit(); } catch (err) { console.warn('NEURON demo: sandbox clean-up failed', err); } }
    g.stopFollow(true);
    const data = { format: SAVE_FORMAT, version: 2, settings: { ...g.settings }, progress: { points: 0, level: 1, unlockAll: true, introSeen: true, caps: {}, mode: 'explore', tutorial: { step: 0, done: true, skipped: false, offered: true } } };
    g.createWorld(data, { sandbox: true });
    this.inSandbox = true;
    g.modeId = 'explore'; g.selection = null; g.focusRegion = null; g.trace = null; g.followPath = null;
    g.membraneHistory = new Array(100).fill(0);
    const cam = g.camera; cam.fly = false; cam.flight = null; cam.follow = null; cam.keys.clear();
    g.applyModeColor(); g.mode.enter(); g.applySpotlight();
    document.body.classList.remove('sleeping', 'focus-session');
    g.audio.sleep(false);
    g.tutorial.hide();
    g.renderer.rings.length = 0;
    g.input.hoverHit = null; g.input.updateCursor();
    const ui = g.ui;
    ui.clearFloaters(); ui.hideTip();
    ui.journalItems = []; ui.journal('Demo sandbox: a fresh network built for the demonstration.');
    ui.lastPanelKey = ''; ui.setTab('mode');
    ui.markDirty('top', 'dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags', 'sel');
  }

  /* ---------- clock & cancellable waits ---------- */
  /** Resolve after ms of demo time. Pauses with the demo; rejects (AbortError) on skip, restart or exit. */
  wait(ms) {
    const signal = this.stepAc?.signal;
    const p = new Promise((resolve, reject) => {
      if (!signal || signal.aborted) { reject(demoAbortError()); return; }
      const w = { at: this.clock + Math.max(0, ms) / 1000, resolve, reject, signal };
      w.onAbort = () => { this.waiters.delete(w); reject(demoAbortError()); };
      signal.addEventListener('abort', w.onAbort, { once: true });
      this.waiters.add(w);
    });
    p.catch(() => {});   // an abandoned wait never surfaces as an unhandled rejection
    return p;
  }
  /** Poll a condition on the demo clock: true when it holds, false (with a dev warning) after the timeout. Never hangs. */
  async waitFor(pred, timeoutMs = 8000, label = 'condition') {
    const end = this.clock + timeoutMs / 1000;
    for (;;) {
      let ok = false;
      try { ok = !!pred(); } catch (err) { console.warn(`NEURON demo: checking ${label} failed`, err); }
      if (ok) return true;
      if (this.clock >= end) { console.warn(`NEURON demo: gave up waiting for ${label} after ${Math.round(timeoutMs)} ms — continuing.`); return false; }
      await this.wait(50);
    }
  }
  /** Called once per frame by Game.frame(). */
  tick(dt) {
    if (!this.el) return;
    const g = this.game, now = performance.now();
    if (this.state === 'running' && !g.paused) {
      this.clock += dt;
      if (this.waiters.size) for (const w of [...this.waiters]) if (this.clock >= w.at) { this.waiters.delete(w); w.signal.removeEventListener('abort', w.onAbort); w.resolve(); }
    }
    if (this.active) {
      this.updateCursor(dt);
      this.liveTimer += dt;
      if (this.liveTimer >= 0.15) { this.liveTimer = 0; this.refreshHint(); this.updateProgress(); }
      if (this.glow.size || this.glowApplied) this.applyGlow();
      const h = this.el.panel.offsetHeight;
      if (h && Math.abs(h - this.demoH) > 1) { this.demoH = h; document.documentElement.style.setProperty('--demo-h', `${h}px`); g.updateViewShift(); }
    }
    if (this.presses.length) this.presses = this.presses.filter((p) => { if (now < p.until && p.el.isConnected) return true; p.el.classList.remove('demo-press'); return false; });
    if (this.noticeUntil && now > this.noticeUntil) { this.noticeUntil = 0; this.el.notice.classList.remove('show'); this.el.notice.textContent = ''; }
  }

  /* ---------- narration ---------- */
  /** Queue a narration card. Cards stay at least DEMO_MIN_HINT seconds and fade, never replacing each other abruptly. */
  say(cfg) {
    const p = this.hintQueue.then(() => this.showHint(cfg));
    this.hintQueue = p.catch(() => {});
    p.catch(() => {});
    return p;
  }
  /** Wait until the visible narration card has had its minimum reading time (status cards don't count). */
  async holdHint() {
    const left = DEMO_MIN_HINT - (this.clock - this.hintAt);
    if (this.hint && !this.hint.status && left > 0) await this.wait(left * 1000);
  }
  /** Fade the current card out before the next one appears. */
  async fadeHint() {
    const old = this.el.hint.firstElementChild;
    if (old && !this.reduced) { old.classList.add('out'); await this.wait(280); }
  }
  /** A quiet "what is happening" card while a new step sets up; its first narration card replaces it without delay. */
  async status(step) {
    if (!this.el) return;
    await this.fadeHint();
    this.hint = { status: true }; this.hintAt = this.clock;
    this.el.hint.innerHTML = `<div class="dh status${this.reduced ? '' : ' pre'}"><h3>${esc(step.title)}</h3><p>${esc(step.lead)}</p></div>`;
    const card = this.el.hint.firstElementChild;
    if (!this.reduced) { void card.offsetWidth; card.classList.remove('pre'); }
    this.el.live.textContent = `Step ${this.stepIndex + 1} of ${demoSteps.length}: ${step.title}.`;
    this.announcedStep = this.stepIndex;
  }
  /** Show one card: a short title, one or two sentences, optional live before → after statistics and a display. */
  async showHint(cfg) {
    if (!this.el) return;
    await this.holdHint();
    await this.fadeHint();
    const box = this.el.hint;
    this.hint = cfg; this.hintAt = this.clock;
    const wide = !!cfg.display;
    box.innerHTML = `<div class="dh${wide ? ' wide' : ''}${this.reduced ? '' : ' pre'}"><div><h3>${esc(cfg.title)}</h3><p>${esc(cfg.text)}</p>${cfg.stats?.length ? `<div class="demo-stats">${cfg.stats.map((s, i) => `<span class="demo-stat">${esc(s.label)}<b data-ds="${i}"></b></span>`).join('')}</div>` : ''}</div>${wide ? '<div data-dd></div>' : ''}</div>`;
    this.refreshHint();
    const card = box.firstElementChild;
    if (!this.reduced) { void card.offsetWidth; card.classList.remove('pre'); }
    const lead = this.announcedStep !== this.stepIndex ? `Step ${this.stepIndex + 1} of ${demoSteps.length}: ${demoSteps[this.stepIndex].title}. ` : '';
    this.announcedStep = this.stepIndex;
    this.el.live.textContent = `${lead}${cfg.title}. ${cfg.text}`;
    this.log.push({ step: this.stepIndex, title: cfg.title, text: cfg.text });
  }
  refreshHint() {
    const h = this.hint, box = this.el?.hint;
    if (!h || !box) return;
    (h.stats || []).forEach((s, i) => {
      const b = box.querySelector(`[data-ds="${i}"]`);
      if (!b) return;
      let html = '—';
      try { html = this.statText(s); } catch (err) { console.warn('NEURON demo: statistic failed', err); }
      if (b._v !== html) { b._v = html; b.innerHTML = html; }
    });
    if (h.display) {
      const d = box.querySelector('[data-dd]');
      let html = '';
      try { html = h.display(); } catch (err) { console.warn('NEURON demo: display failed', err); }
      if (d && d._v !== html) { d._v = html; d.innerHTML = html; }
    }
  }
  /** "12% → 46% ↑ +34": arrows and signed numbers, so change is never shown by colour alone. */
  statText(s) {
    const now = typeof s.now === 'function' ? s.now() : s.now;
    if (typeof now === 'string') return esc(now);
    if (now == null || !Number.isFinite(now)) return '—';
    if (s.before == null) return esc(s.fmt(now));
    const d = now - s.before;
    let delta = '';
    if (Math.abs(d) >= (s.fmt === pct ? 0.005 : 1e-3)) {
      const good = s.better === 'up' ? d > 0 : d < 0;
      const txt = s.delta ? s.delta(d) : s.fmt === pct ? `${d > 0 ? '↑' : '↓'} ${pts(d)}` : d > 0 ? '↑' : '↓';
      delta = `<span class="d ${good ? 'good' : 'bad'}">${esc(txt)}</span>`;
    }
    return `${esc(s.fmt(s.before))} → ${esc(s.fmt(now))}${delta}`;
  }
  clearHint() { this.hint = null; this.hintAt = -1e9; this.hintQueue = Promise.resolve(); if (this.el) this.el.hint.innerHTML = ''; }

  /* ---------- ghost cursor ---------- */
  /** Glide the ghost cursor to a control (element or resolver), a 3D point ([x, y, z]) or a screen point; resolves on arrival. */
  async moveGhostCursor(target, opts = {}) {
    const p = this.point(target);
    if (!p || !this.el) return false;
    const c = this.cur;
    if (!c.placed) { c.x = innerWidth / 2; c.y = innerHeight * 0.6; c.placed = true; }
    if (!c.shown) this.showCursor();
    c.fx = c.x; c.fy = c.y; c.target = target; c.t = 0; c.moving = true; c.hideAt = Infinity;
    const dist = Math.hypot(p.x - c.x, p.y - c.y);
    c.dur = this.reduced ? 0.16 : opts.fast ? clamp(0.14 + dist / 1800, 0.16, 0.5) : clamp(0.32 + dist / 1400, 0.38, 1.05);
    await this.waitFor(() => !c.moving, (c.dur + 3) * 1000, 'ghost cursor');
    return true;
  }
  /** Screen position of a cursor target; moving targets (labels, 3D objects) are re-resolved every frame. */
  point(target) {
    const t = typeof target === 'function' ? target() : target;
    if (!t) return null;
    if (t instanceof Element) {
      if (!t.isConnected) return null;
      const r = t.getBoundingClientRect();
      return r.width || r.height ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : null;
    }
    if (Array.isArray(t)) { const s = this.game.camera.project(t, {}); return s && s.visible ? { x: s.x, y: s.y } : null; }
    return typeof t.x === 'number' ? t : null;
  }
  updateCursor(dt) {
    const c = this.cur, el = this.el.cursor;
    if (c.moving) {
      if (!this.paused) c.t = Math.min(1, c.t + dt / c.dur);
      const p = this.point(c.target) || { x: c.x, y: c.y };
      const k = easeInOut(c.t);
      c.x = lerp(c.fx, p.x, k); c.y = lerp(c.fy, p.y, k);
      if (c.t >= 1) c.moving = false;
    } else if (c.shown && c.target) { const p = this.point(c.target); if (p) { c.x = p.x; c.y = p.y; } }
    if (c.shown && !c.moving && this.clock >= c.hideAt) this.hideCursor();
    el.style.transform = `translate3d(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px, 0)`;
    const k = (this.clock - c.pulseAt) / 0.45, ring = this.el.ring;
    if (k >= 0 && k <= 1) { ring.style.opacity = (0.9 * (1 - k)).toFixed(2); ring.style.transform = this.reduced ? 'none' : `scale(${(0.5 + 1.3 * k).toFixed(2)})`; }
    else if (ring.style.opacity !== '0') ring.style.opacity = '0';
  }
  showCursor() { this.cur.shown = true; this.el?.cursor.classList.add('show'); }
  hideCursor() { const c = this.cur; c.shown = false; c.moving = false; c.target = null; c.hideAt = Infinity; this.el?.cursor.classList.remove('show'); }
  /** Fade the cursor out shortly after a click so it never hides the activity it caused. */
  hideCursorSoon(s = 0.9) { this.cur.hideAt = this.clock + s; }
  pulse(el) {
    this.cur.pulseAt = this.clock;
    if (el) { el.classList.add('demo-press'); this.presses.push({ el, until: performance.now() + 480 }); }
  }
  clearPresses() { for (const p of this.presses) p.el.classList.remove('demo-press'); this.presses = []; }

  /* ---------- acting like a player ---------- */
  /** The on-screen control for an action (optionally matching data-* values), preferring in-world controls. */
  control(action, data = {}) {
    let sel = `[data-action="${action}"]`;
    for (const [k, v] of Object.entries(data)) sel += `[data-${k}="${String(v)}"]`;
    const rank = (el) => (el.closest('#modeOverlay') ? 0 : el.closest('#labels') ? 1 : el.closest('#selChip') ? 2 : el.closest('#panel') ? 3 : el.closest('#modeDock') ? 4 : 5);
    let best = null, bestRank = 9;
    for (const el of $$(sel)) { if (!this.usable(el)) continue; const r = rank(el); if (r < bestRank) { best = el; bestRank = r; } }
    return best;
  }
  usable(el) {
    if (!el.isConnected || el.disabled || el.closest('#missionBar, [hidden], #demoUi, .modal-backdrop')) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 6 || r.height < 6 || r.right < 4 || r.bottom < 4 || r.left > innerWidth - 4 || r.top > innerHeight - 4) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== 'hidden' && cs.display !== 'none';
  }
  /** Scroll a panel control into view, as a player would before clicking it. */
  reveal(el) {
    const box = el.closest('#panelBody');
    if (!box) return;
    const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (r.top < b.top + 8 || r.bottom > b.bottom - 8) box.scrollTo({ top: box.scrollTop + r.top - b.top - (b.height - r.height) / 2, behavior: this.reduced ? 'auto' : 'smooth' });
  }
  /**
   * Click a real control the way a player would: glide there, pulse, then run the very same action a click runs
   * (Game.action). Layouts that don't show the control (e.g. phones with the panel closed) point at opts.anchor instead.
   */
  async click(action, data = {}, opts = {}) {
    const g = this.game;
    const find = () => this.control(action, data);
    let el = find();
    if (el) { this.reveal(el); await this.moveGhostCursor(find, opts); }
    else if (opts.anchor) await this.moveGhostCursor(opts.anchor, opts);
    el = find();
    this.pulse(el);
    const target = el || { dataset: Object.fromEntries(Object.entries(data).map(([k, v]) => [k, String(v)])) };
    const act = () => (opts.run ? opts.run(target) : g.action(action, target));
    if (opts.cut && this.reduced) await this.cut(act); else act();
    this.hideCursorSoon(opts.hide ?? 0.9);
    if (opts.after !== 0) await this.wait(opts.after ?? 300);
    return !!el;
  }
  /** Click a neuron in the 3D view (the same route as a click or tap on the canvas). */
  async pickNeuron(n, opts = {}) {
    await this.moveGhostCursor(n.position, opts);
    this.pulse(null);
    this.game.onPick({ type: 'neuron', obj: n });
    this.hideCursorSoon();
    await this.wait(opts.after ?? 350);
  }
  /** Switch modes through the dock, exactly like a player. */
  async mode(id) {
    const g = this.game;
    if (g.modeId === id) { g.ui.setTab('mode'); return; }
    await this.click('mode', { mode: id }, { after: 0, cut: true, fast: true });
    await this.waitCamera();
    await this.wait(150);
  }
  highlight(h) { this.highlights = h ? { rgb: [1, 1, 1], level: 1, ...h } : null; }
  /** Merged into Game.computeDecor(): demo emphasis on top of the mode's own highlights. */
  decorate(d) {
    const h = this.active ? this.highlights : null;
    if (!h) return;
    for (const n of h.neurons || []) if (n) d.hiNeurons.set(n, { rgb: h.rgb, level: h.level });
    for (const s of h.synapses || []) if (s) d.hiSynapses.set(s, { rgb: h.rgb, level: h.level });
    if (h.region) d.focusRegion = h.region;
  }
  glowTags(ids) { this.glow = new Set(ids || []); }
  applyGlow() {
    let any = false;
    for (const [id, el] of this.game.ui.tagEls) { const on = this.glow.has(id); el.classList.toggle('demo-glow', on); if (on) any = true; }
    this.glowApplied = any;
  }

  /* ---------- camera ---------- */
  /** Eased camera move that waits until it settles. Reduced motion: a short dim and a cut instead of a flight. */
  async interpolateCamera(view, duration = 1.8) {
    const cam = this.game.camera;
    if (this.reduced) { await this.cut(() => cam.flyTo(view, 0)); return; }
    cam.flyTo(view, duration, { exact: true });
    await this.waitCamera((duration + 4) * 1000);
    await this.wait(180);
  }
  /** Start a camera move without waiting for it (narration can run alongside). */
  startCamera(view, duration = 2) { this.game.camera.flyTo(view, this.reduced ? 0 : duration, { exact: true }); }
  waitCamera(ms = 6000) { const cam = this.game.camera; return this.waitFor(() => !cam.flight, ms, 'camera move'); }
  /** Flight time grows with distance, so no move feels rushed. */
  flightTime(view) {
    const w = this.game.camera.want;
    const d = view.target ? V3.dist(w.target, view.target) : 0, dr = view.radius != null ? Math.abs(w.radius - view.radius) : 0;
    return clamp(1.1 + d * 0.08 + dr * 0.03, 1.2, 2.5);
  }
  smoothFocusOnObject(sel, radius) {
    const o = sel.obj, syn = sel.type === 'synapse';
    const view = { target: syn ? o.pointAt(0.5, [0, 0, 0]) : o.position, radius: radius ?? (syn ? Math.max(2.8, o.length * 1.3) : 3.1) };
    return this.interpolateCamera(view, this.flightTime(view));
  }
  smoothFocusOnRegion(region, radius = 7.2) {
    const view = { target: region.center, radius: radius * this.game.camera.zoomNorm };
    return this.interpolateCamera(view, this.flightTime(view));
  }
  smoothReturnToOverview(wide = false) {
    const cam = this.game.camera;
    const view = { pitch: HOME_VIEW.pitch + (wide ? 0.06 : 0), radius: cam.homeRadius() * (wide ? 1.3 : 1), target: HOME_VIEW.target };
    return this.interpolateCamera(view, Math.max(2, this.flightTime(view)));
  }
  /** Press Follow signal (the real control) and ride along until the followed pulse comes to rest. */
  async followSignal() {
    const g = this.game, n = g.selection?.type === 'neuron' ? g.selection.obj : null;
    await this.click('follow-signal', {}, { anchor: n?.position, after: 0, hide: 0.3 });
    await this.waitFor(() => !g.follow, 15000, 'the followed signal');
    if (g.follow) g.stopFollow();
  }
  /** Reduced motion: dim briefly around an instant change instead of animating it. */
  async cut(fn) {
    const f = this.el.fade;
    f.style.opacity = '.55';
    try { await this.wait(110); fn(); await this.wait(90); }
    finally { f.style.opacity = '0'; }
  }

  /* ---------- step helpers ---------- */
  /** A typical excitatory cell whose strongest outputs can carry a followed signal several hops. */
  showcaseNeuron() {
    const sim = this.game.sim, gain = sim.synapticGain;
    let best = null, bestScore = -1;
    for (const n of sim.neurons) {
      if (!n.recruited || n.isolated || n.health <= 0 || n.type !== 'excitatory' || n.role || n.networkMembership.size) continue;
      let hops = 0, cur = n;
      const seen = new Set([n]);
      for (let i = 0; i < 6; i++) {
        const s = cur.outgoing.filter((x) => x.enabled && x.target.health > 0 && !seen.has(x.target)).sort((a, b) => b.weight - a.weight)[0];
        if (!s || s.weight * gain < s.target.threshold * (i ? 1 : 0.75)) break;
        hops++; seen.add(s.target); cur = s.target;
      }
      const score = hops * 10 + Math.min(6, n.outgoing.filter((x) => x.enabled).length);
      if (score > bestScore) { bestScore = score; best = n; }
    }
    return best || sim.neurons.find((n) => n.recruited && !n.isolated);
  }
  followCount() { const g = this.game; return g.follow ? g.follow.path.length : g.followPath ? g.followPath.points.length : 1; }
  recallCount(m) {
    const mem = this.game.memory, r = mem.recall || (mem.lastRecall?.m === m ? mem.lastRecall : null);
    return r ? [...r.nodes.values()].filter((x) => x.feature && !x.cue && x.revealed).length : 0;
  }
  flowHtml() {
    const s = this.game.sleep;
    const stage = s.active ? s.phase.flow : s.summary && !s.summary.early ? 4 : 0;
    const labels = ['DAY EXPERIENCE', 'TEMPORARY MEMORY', 'SLEEP REPLAY', 'STABILIZED NETWORK'];
    return `<div class="demo-flow" role="img" aria-label="Day experience, then temporary memory, then sleep replay, then a stabilized network">${labels.map((l, i) => `<span class="${i < stage ? 'done' : i === stage ? 'on' : ''}">${i < stage ? '✓ ' : ''}${l}</span>${i < labels.length - 1 ? '<i aria-hidden="true">↓</i>' : ''}`).join('')}</div>`;
  }
  repairHtml() {
    const rp = this.game.repair, st = rp.statusLines(), lt = rp.lastTest;
    const row = (k, v, tone) => `<span class="${tone}"><small>${k}</small>${v}</span>`;
    const sig = lt ? (lt.ok ? ['DELIVERED ✓', 'ok'] : ['FAILED ✗', 'bad']) : ['NOT TESTED', ''];
    const alt = rp.restored ? ['IN USE ✓', 'ok'] : !rp.damaged ? ['NOT NEEDED', ''] : st.alt === 'READY TO TEST' ? ['READY', 'ok'] : st.alt === 'FORMING' ? ['FORMING', 'warn'] : [st.alt, ''];
    return `<div class="demo-status">${row('ORIGINAL ROUTE', rp.damaged ? 'DAMAGED ✗' : 'INTACT ✓', rp.damaged ? 'bad' : 'ok')}${row('SIGNAL', sig[0], sig[1])}${row('ALTERNATIVE ROUTE', alt[0], alt[1])}${row('FUNCTION', rp.restored ? 'RESTORED ✓' : rp.damaged ? 'LOST ✗' : 'OK ✓', rp.restored || !rp.damaged ? 'ok' : 'bad')}</div>`;
  }
  /** The trained pathway with the highest mean synaptic strength: Learn route, piano skill or repair bypass. */
  strongestTrainedPathway() {
    const g = this.game, ms = g.missions, sk = g.skill, rp = g.repair, run = PIANO.sequences[0];
    const cands = [
      { name: 'A → B → C → D', neurons: ms.seqNeurons(), synapses: ms.seqSynapses() },
      { name: 'PIANO A → S → D → F', neurons: run.notes.map((i) => sk.keys[i]), synapses: sk.transitions(run) },
    ];
    const path = rp.route();
    if (rp.restored && path) cands.push({ name: 'REPAIR BYPASS', neurons: path, synapses: rp.routeSynapses(path) });
    for (const c of cands) c.mean = c.synapses.reduce((s, x) => s + (x ? x.weight : 0), 0) / Math.max(1, c.synapses.length);
    return cands.sort((a, b) => b.mean - a.mean)[0];
  }
  /** Real values recorded during the steps (sandbox), for the final narration card. */
  finalStats() {
    const r = this.results, out = [];
    if (r.learn) out.push(demoStat('Route efficiency', r.learn.before, r.learn.after));
    if (r.train) out.push(demoStat('Skill effort', r.train.effortBefore, r.train.effortAfter, { better: 'down' }));
    if (r.dream) out.push(demoStat('Memory consolidation', r.dream.consBefore, r.dream.consAfter));
    if (r.build) out.push(demoStat('Connected concepts', r.build.conceptsBefore, r.build.conceptsAfter, { fmt: fmtNum, delta: (d) => `↑ +${d}` }));
    return out;
  }
  /** Rows for the completion card (labelled as demo results, not the player's progress). */
  finalSummary() {
    const r = this.results, ba = (a, b) => `${pct(a)} → ${pct(b)}`, rows = [];
    rows.push(['Learning', r.learn ? `route efficiency ${ba(r.learn.before, r.learn.after)}${r.learn.test ? ' · A alone reached D' : ''}` : 'skipped']);
    rows.push(['Memory', r.memory ? `${r.memory.revealed} of ${r.memory.total} features recalled · access ${ba(r.memory.accBefore, r.memory.accAfter)}` : 'skipped']);
    rows.push(['Skill', r.train ? `effort ${ba(r.train.effortBefore, r.train.effortAfter)} · ${r.train.stage}` : 'skipped']);
    rows.push(['Attention', r.focus ? `grade ${r.focus.grade} · encoding ${pct(r.focus.enc)} · ${r.focus.switches} switch${r.focus.switches === 1 ? '' : 'es'}` : 'skipped']);
    rows.push(['Sleep', r.dream ? `consolidation ${ba(r.dream.consBefore, r.dream.consAfter)}` : 'skipped']);
    rows.push(['Repair', r.repair ? (r.repair.restored ? `function restored after ${r.repair.practices} practice run${r.repair.practices === 1 ? '' : 's'}` : 'bypass still forming') : 'skipped']);
    rows.push(['Knowledge', r.build ? `${r.build.conceptsAfter} connected concepts · complexity ${r.build.complexityBefore} → ${r.build.complexityAfter}` : 'skipped']);
    return rows;
  }

  /* ---------- chrome ---------- */
  mount() {
    if (!this.el) this.el = { panel: $('#demoPanel'), hint: $('#demoHint'), prog: $('#demoProg'), progBar: $('#demoProgBar'), notice: $('#demoNotice'), card: $('#demoCard'), live: $('#demoLive'), pause: $('#demoPause'), cursor: $('#demoCursor'), ring: $('#demoCursor .ring'), fade: $('#demoFade') };
    this.el.panel.hidden = false;
  }
  panelRect() { return this.active && this.el && !this.el.panel.hidden ? this.el.panel.getBoundingClientRect() : null; }
  focusControls() { this.el?.pause.focus({ preventScroll: true }); }
  renderHeader() {
    const i = this.stepIndex;
    setText('demoStep', `Step ${i + 1} of ${demoSteps.length}`);
    setText('demoTitle', demoSteps[i].title);
    this.updateProgress();
  }
  updateProgress() {
    if (!this.el || this.stepIndex < 0) return;
    const step = demoSteps[this.stepIndex];
    const frac = (this.stepIndex + Math.min(0.97, (this.clock - this.stepStart) / step.dur)) / demoSteps.length, v = Math.round(frac * 100);
    this.el.prog.style.width = `${(frac * 100).toFixed(1)}%`;
    if (this.el.progBar.getAttribute('aria-valuenow') !== String(v)) {
      this.el.progBar.setAttribute('aria-valuenow', v);
      this.el.progBar.setAttribute('aria-valuetext', `Step ${this.stepIndex + 1} of ${demoSteps.length}, ${v}% of the demo`);
    }
  }
  renderControls() {
    if (!this.el) return;
    const p = this.paused, b = this.el.pause;
    b.innerHTML = p ? '▶ <span>RESUME</span>' : '❚❚ <span>PAUSE</span>';
    b.setAttribute('aria-label', p ? 'Resume the demo' : 'Pause the demo');
    b.classList.toggle('primary', p);
    this.el.panel.classList.toggle('paused', p);
  }
  /** Top-bar button states: ▶ DEMO · DEMO RUNNING · RESTART DEMO (paused or finished). */
  updateButton() {
    const b = $('#demoBtn');
    if (!b) return;
    const st = this.state;
    b.querySelector('.lbl').textContent = st === 'running' ? 'DEMO RUNNING' : st === 'idle' ? '▶ DEMO' : 'RESTART DEMO';
    b.classList.toggle('running', st === 'running');
    b.classList.toggle('restart', st === 'paused' || st === 'complete');
    b.setAttribute('aria-label', st === 'idle' ? 'Start automatic game demonstration' : st === 'running' ? 'Demo running. Use the demo controls to pause, skip or exit.' : 'Restart the automatic game demonstration');
    b.title = st === 'idle' ? 'Watch the game play itself (about 3 minutes)' : st === 'running' ? 'The demo is playing' : 'Restart the demo from step 1';
  }
  /** Shown when someone tries to use the game while the demo is in charge. */
  notice(text = DEMO_LOCKED_MSG) {
    if (!this.el || !this.active) return;
    this.noticeUntil = performance.now() + 3800;
    if (this.el.notice.textContent !== text) this.el.notice.textContent = text;
    this.el.notice.classList.add('show');
  }
  /** Keyboard while the demo is in charge: Esc exits, Space pauses/resumes, Tab and Enter keep working, M still mutes. */
  onKey(e) {
    const g = this.game, k = e.key;
    if (k === 'Escape') { e.preventDefault(); this.exit(); return; }
    if (e.code === 'Space' || k === ' ') { if (e.target?.closest?.('#demoUi button, #demoBtn')) return; e.preventDefault(); if (!e.repeat) this.togglePause(); return; }
    if (['Tab', 'Enter', 'Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(k) || e.ctrlKey || e.metaKey || e.altKey || /^F\d{1,2}$/.test(k)) return;
    if (k.toLowerCase() === 'm' && !e.repeat) { e.preventDefault(); g.action('toggle-sound', { dataset: {} }); return; }
    if (this.paused && e.target === g.input.canvas) {
      const cam = g.camera;
      const moves = { ArrowLeft: () => cam.orbit(-25, 0), ArrowRight: () => cam.orbit(25, 0), ArrowUp: () => cam.orbit(0, -20), ArrowDown: () => cam.orbit(0, 20), '+': () => cam.zoom(0.85), '=': () => cam.zoom(0.85), '-': () => cam.zoom(1.18), _: () => cam.zoom(1.18) };
      if (moves[k]) { e.preventDefault(); moves[k](); return; }
    }
    e.preventDefault();
    if (!e.repeat) this.notice();
  }
  showCard(rows) {
    if (!this.el) return;
    const c = this.el.card;
    $('#demoUi').classList.add('card-on'); document.body.classList.add('demo-card-on');
    c.innerHTML = `<div class="eyebrow">Demo complete</div><h2 id="demoCardTitle">Your network is waiting.</h2>
      <p>Everything you just watched ran on the real game systems inside a temporary sandbox. Your own network, progress and achievements are exactly as you left them—nothing from the demo was saved.</p>
      <ul class="demo-sum" aria-label="Demo results (sandbox, not your progress)">${rows.map(([k, v]) => `<li><span>${esc(k)}</span><b>${esc(v)}</b></li>`).join('')}</ul>
      <div class="actions">${btn('demo-take-control', 'TAKE CONTROL', { cls: 'primary', icon: 'hand' })}${btn('demo-replay', 'REPLAY DEMO', { icon: 'reset' })}</div>`;
    c.hidden = false;
    $('[data-action="demo-take-control"]', c)?.focus({ preventScroll: true });
    this.el.live.textContent = 'Demo complete. Take control, or replay the demo.';
  }
  hideCard() { if (this.el) { this.el.card.hidden = true; this.el.card.innerHTML = ''; $('#demoUi').classList.remove('card-on'); document.body.classList.remove('demo-card-on'); } }
}

/* The ten steps. Each one moves the camera, lets it settle, highlights, explains, then acts — using real controls.
   Where an action illustrates the card on screen, it runs while that card is being read. */
const demoSteps = [
  { id: 'intro', title: 'Welcome', lead: null, dur: 9, async run(demo, g) {
    const cam = g.camera;
    document.body.classList.add('demo-dim');
    demo.say({ title: 'The game plays itself', text: 'Welcome to NEURON. This automatic demonstration will play the game for you. No input is required—watch how neural activity becomes learning, memory, skill, and knowledge.' });
    // Pull back to the whole network with a slow orbit while the most active regions light up.
    demo.startCamera({ yaw: cam.want.yaw + 0.55, pitch: HOME_VIEW.pitch + 0.06, radius: cam.homeRadius() * 1.3, target: HOME_VIEW.target }, 8.5);
    await demo.wait(1500);
    const regions = g.sim.regions.slice().sort((a, b) => b.activity - a.activity).slice(0, 3);
    for (const r of regions) { demo.highlight({ region: r }); g.sim.regionalWave(r, { spread: 0.16 }); await demo.wait(1100); }
    demo.highlight(null);
    await demo.say({ title: 'A teaching model', text: 'This is a simplified educational neural network. Its values and accelerated processes are game abstractions rather than direct biological measurements.' });
    await demo.wait(4000);
    document.body.classList.remove('demo-dim');
  } },

  { id: 'explore', title: 'Explore a neuron', lead: 'Explore mode · zooming in on a single cell…', dur: 18, async run(demo, g) {
    await demo.mode('explore');
    const n = demo.showcaseNeuron();
    await demo.smoothFocusOnRegion(n.region);                  // a cluster of cells
    await demo.pickNeuron(n, { after: 200 });                  // a real selection: the inspector opens on wide screens
    if (innerWidth <= 980) { await demo.click('show-inspector', {}, { anchor: n.position, after: 2200 }); await demo.click('panel-close', {}, { after: 250 }); }
    await demo.smoothFocusOnObject({ type: 'neuron', obj: n }, 3);   // MICRO scale reveals soma, dendrites, axon and synapses
    demo.glowTags(['p_dend', 'p_soma']);
    demo.say({ title: 'Dendrites and soma', text: 'A neuron receives signals through branching structures called dendrites. Its cell body integrates this activity.' });
    await demo.wait(4000);
    demo.glowTags(['p_axon', 'p_syn']);
    await demo.say({ title: 'Threshold and axon', text: 'When activity reaches the firing threshold, the neuron produces an electrical signal that travels along its axon.', stats: [demoStat('Activation', null, () => n.activation, { fmt: (v) => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2) }), demoStat('Firing threshold', null, n.threshold, { fmt: (v) => v.toFixed(2) })] });
    await demo.wait(900);
    await demo.click('fire-selected', {}, { anchor: n.position });   // the real Fire action
    await demo.wait(1100);
    demo.glowTags(null);
    await demo.say({ title: 'Across the synapses', text: 'The signal crosses synapses and influences connected neurons, creating a visible wave of network activity.', stats: [demoStat('Neurons reached by the followed signal', null, () => demo.followCount(), { fmt: fmtNum })] });
    await demo.followSignal();                                 // the real Follow signal control
    demo.results.explore = { hops: demo.followCount() };
    await demo.wait(600);
  } },

  { id: 'learn', title: 'Learning', lead: 'Learn mode · Mission 1, the route A → B → C → D…', dur: 23, async run(demo, g) {
    const ms = g.missions, nodes = LEARN_MISSIONS[0].nodes;
    await demo.mode('learn');
    if (ms.active !== 'sequence') { await demo.click('learn-mission', { id: 'sequence' }, { after: 0 }); await demo.waitCamera(); }
    const ns = ms.seqNeurons(), syns = ms.seqSynapses();
    const eff = () => syns.reduce((s, x) => s + x.efficiency, 0) / syns.length;
    const rel = () => ms.seqReliability();
    const travel = () => g.sim.travelTime(syns[0]);
    const probing = () => ms.probes.some((p) => p.mission === 'sequence');
    const testText = () => { const t = ms.state.sequence.lastTest; return probing() ? 'signal travelling…' : t ? (t.ok ? 'reached D ✓' : `faded at cell ${t.reached} of 4 ✗`) : 'not run yet'; };
    const before = { eff: eff(), rel: rel(), tt: travel() };
    demo.highlight({ neurons: ns, synapses: syns, rgb: COL.learn, level: 0.9 });
    demo.say({ title: 'A weak pathway', text: 'At first, this sequence travels through a weak and unreliable pathway.', stats: [demoStat('Synaptic efficiency', null, eff), demoStat('Fire A alone', null, testText, { fmt: String })] });
    await demo.wait(700);
    await demo.click('seq-test', {}, { anchor: ns[0].position });   // fire A alone: the weak route fails
    await demo.waitFor(() => !probing(), 8000, 'the route test');
    await demo.wait(500);
    demo.highlight(null);
    await demo.say({ title: 'Repeat the pattern', text: 'The same useful pattern is now being repeated. Coordinated activity gradually increases the efficiency of relevant connections.', stats: [demoStat('Synaptic efficiency', before.eff, eff), demoStat('Route reliability', before.rel, rel), demoStat('Repetitions', null, () => ms.state.sequence.reps, { fmt: fmtNum })] });
    let reps = 0;
    const rep = async () => {                                 // the real A → B → C → D clicks, at a learnable pace
      for (let i = 0; i < 4; i++) { await demo.click('learn-node', { key: nodes[i] }, { fast: true, after: 0, anchor: ns[i].position }); await demo.wait(170); }
      reps++;
      await demo.wait(350);
    };
    while (reps < 6 && (reps < 4 || rel() < 0.85)) await rep();
    // Test again once the route's transmitter has recovered (short-term depression fades within ~1 s).
    for (let tries = 0; tries < 2 && rel() >= 0.6; tries++) {
      await demo.wait(1100);
      await demo.click('seq-test', {}, { anchor: ns[0].position });
      await demo.waitFor(() => !probing(), 8000, 'the route test');
      if (ms.state.sequence.lastTest?.ok || tries) break;
      await rep();                                            // not yet: one more repetition, as a player would
    }
    const after = { eff: eff(), rel: rel(), tt: travel() };
    demo.highlight({ neurons: ns, synapses: syns, rgb: COL.learn, level: 1 });
    await demo.say({ title: 'Neuroplasticity', text: 'The brighter and faster pathway represents neuroplasticity: experience can change how neural networks function.', stats: [demoStat('Synaptic efficiency', before.eff, after.eff), demoStat('A → B travel time', before.tt, after.tt, { fmt: fmtSec, better: 'down', delta: (d) => (d < 0 ? '↓ faster' : '↑ slower') }), demoStat('Fire A alone', null, testText, { fmt: String })] });
    demo.results.learn = { before: before.eff, after: after.eff, relBefore: before.rel, relAfter: after.rel, reps, test: !!ms.state.sequence.lastTest?.ok && after.rel >= 0.6 };
    await demo.wait(4000);
  } },

  { id: 'memory', title: 'Memory', lead: 'Remember mode · the Paris Trip memory…', dur: 16, async run(demo, g) {
    const mem = g.memory, m = mem.memories.paris, cue = m.feature('eiffel').neuron;
    await demo.mode('remember');
    if (g.modes.remember.memId !== 'paris') { await demo.click('mem-select', { id: 'paris' }, { after: 0 }); await demo.waitCamera(); }
    const before = { st: mem.storage(m), acc: m.retrievalAccessibility, int: m.interference, cons: m.consolidation };
    demo.highlight({ neurons: [...m.features.map((f) => f.neuron), ...m.indexNeurons], synapses: m.associatedSynapseIds.map((id) => g.sim.synapses[id]), rgb: COL.memory, level: 0.8 });
    demo.say({ title: 'A distributed memory', text: 'A memory is represented here as a distributed pattern across many connected neurons—not as information stored inside one neuron.', stats: [demoStat('Storage strength', null, () => mem.storage(m)), demoStat('Retrieval accessibility', null, () => m.retrievalAccessibility), demoStat('Interference', null, () => m.interference, { better: 'down' }), demoStat('Consolidation', null, () => m.consolidation)] });
    // Hippocampal coordination: the index cells fire first, then the features they bind together.
    [...m.indexNeurons, ...m.features.map((f) => f.neuron)].forEach((n, i) => g.sim.schedule(0.4 + i * 0.18, () => g.sim.fire(n, { forced: true, kind: 'recall', cause: 'show' })));
