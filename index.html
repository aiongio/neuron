<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<meta name="color-scheme" content="dark">
<meta name="description" content="NEURON — Inside the Living Brain. An interactive 3D educational game about neurons, synapses, learning, memory, attention, sleep and network adaptation. Runs offline from a single file.">
<title>NEURON — Inside the Living Brain</title>
<style>
/* ==========================================================================
   NEURON — visual system
   The 3D canvas fills the viewport; every HUD element floats above it as
   restrained "glass". Sizes use rem so the UI-scale setting resizes the HUD.
   ========================================================================== */
:root {
  --ui-scale: 1;
  --bg: #02060b;
  --ink: #ebf3f8;
  --ink-2: #c3d1dc;
  --muted: #8ea2b4;
  --dim: #70869a;
  --line: rgba(165, 205, 235, .11);
  --line-2: rgba(165, 205, 235, .2);
  --glass: rgba(7, 14, 23, .68);
  --glass-strong: rgba(6, 12, 20, .9);
  --glass-hi: rgba(255, 255, 255, .045);
  --accent: #5eead4;
  --accent-soft: rgba(94, 234, 212, .14);
  --good: #74e39a;
  --warn: #fbbf5b;
  --bad: #ff8a96;
  --info: #7cc8ff;
  --exc: #5eead4;
  --inh: #ff7fae;
  --reward: #ffc35c;
  --memory: #c4a7ff;
  --radius: 16px;
  --radius-sm: 10px;
  --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dock-w: 4.6rem;
  --panel-w: 25rem;
  --gap: 1.1rem;
  font-size: calc(14px * var(--ui-scale));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 1rem; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.nowrap { white-space: nowrap; }

/* ---------- icons ---------- */
.ic { width: 1.15rem; height: 1.15rem; flex-shrink: 0; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: .95rem; height: .95rem; }
.ic.lg { width: 1.4rem; height: 1.4rem; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: 2.35rem; padding: .5rem .85rem; border-radius: var(--radius-sm);
  border: 1px solid var(--line-2); background: rgba(150, 190, 220, .06);
  font-size: .86rem; font-weight: 500; letter-spacing: .01em; color: var(--ink);
  transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease), box-shadow .18s var(--ease), color .18s;
  user-select: none;
}
.btn:hover:not(:disabled) { background: rgba(150, 190, 220, .13); border-color: rgba(190, 225, 245, .32); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #031512; font-weight: 650; box-shadow: 0 0 0 0 transparent, 0 8px 24px -10px var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 0 0 3px var(--accent-soft), 0 10px 30px -10px var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: rgba(150, 190, 220, .09); }
.btn.danger { color: var(--bad); border-color: rgba(255, 138, 150, .3); }
.btn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 1.9rem; padding: .3rem .6rem; font-size: .78rem; border-radius: 8px; }
.btn.icon { width: 2.35rem; padding: 0; }
.btn.icon.sm { width: 1.9rem; }
.btn .kbd { margin-left: .15rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 1.25rem; height: 1.25rem; padding: 0 .3rem; border-radius: 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; font: 600 .68rem/1 var(--mono); color: var(--ink-2); background: rgba(255,255,255,.04); }
.btn.primary .kbd { color: #031512; border-color: rgba(3, 21, 18, .3); background: rgba(255,255,255,.25); }

.eyebrow { font-size: .66rem; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.eyebrow.muted { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: .3rem; font-size: .66rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: .18rem .55rem; white-space: nowrap; }
.tag.good { color: var(--good); border-color: rgba(116, 227, 154, .3); }
.tag.warn { color: var(--warn); border-color: rgba(251, 191, 91, .3); }
.tag.bad { color: var(--bad); border-color: rgba(255, 138, 150, .3); }
.tag.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

/* ---------- glass ---------- */
.glass {
  background: var(--glass); border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 24px 60px -24px rgba(0, 0, 0, .7);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  border-radius: var(--radius);
}

/* ==========================================================================
   App frame
   ========================================================================== */
#app { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }
#gl:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
#gl.hovering { cursor: pointer; }
#gl.crosshair { cursor: crosshair; }
#labels, #floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labels { z-index: 2; }
#floaters { z-index: 6; }
.hud { position: absolute; z-index: 5; transition: opacity .5s var(--ease), transform .5s var(--ease); }
body.intro-running .hud, body.intro-running #labels { opacity: 0; pointer-events: none; }
body.sleeping .hud { opacity: .5; }
body.focus-session .mode-head { opacity: 0; }
body.sleeping .hud:hover, body.sleeping .hud:focus-within { opacity: .95; }
body.sleeping #missionBar, body.sleeping #panel { opacity: .82; }

/* ---------- top bar ---------- */
.topbar {
  top: 0; left: 0; right: 0; height: 4.4rem; padding: 0 1.1rem 0 1.15rem;
  display: flex; align-items: center; gap: 1rem;
  background: linear-gradient(180deg, rgba(2, 6, 11, .88), rgba(2, 6, 11, .45) 60%, transparent);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: .7rem; min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 2.2rem; height: 2.2rem; color: var(--accent); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 55%, transparent)); flex-shrink: 0; }
.brand-name { font-size: 1.12rem; font-weight: 700; letter-spacing: .42em; line-height: 1; }
.brand-sub { font-size: .6rem; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-top: .35rem; white-space: nowrap; }
.stat-strip { flex: 1; display: flex; justify-content: center; gap: .35rem; min-width: 0; overflow: hidden; }
.stat { display: flex; flex-direction: column; align-items: flex-start; padding: .35rem .8rem; border-radius: 10px; min-width: 6.3rem; }
.stat .k { font-size: .58rem; letter-spacing: .17em; text-transform: uppercase; color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font: 500 1.05rem/1.25 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.stat .v small { font-size: .7rem; color: var(--muted); font-weight: 500; margin-left: .15rem; }
.stat .spark { width: 100%; height: 3px; border-radius: 3px; background: rgba(255,255,255,.07); margin-top: .3rem; overflow: hidden; }
.stat .spark i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .4s var(--ease); }
.top-actions { display: flex; align-items: center; gap: .4rem; margin-left: auto; }
.complexity { display: flex; align-items: center; gap: .65rem; padding: .3rem .8rem .3rem .35rem; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(8, 16, 26, .55); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); text-align: left; transition: border-color .2s, background .2s; }
.complexity:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: rgba(12, 24, 36, .7); }
.complexity svg { width: 2.2rem; height: 2.2rem; }
.complexity .lv { font: 700 .62rem/1 var(--font); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.complexity .lvname { font-size: .82rem; font-weight: 600; margin-top: .2rem; white-space: nowrap; }
.sim-ctl { display: flex; align-items: center; gap: .25rem; padding: .2rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(8, 16, 26, .5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.speed-group { display: flex; gap: 1px; }
.speed-group button { border: 0; background: transparent; color: var(--muted); font: 600 .7rem/1 var(--mono); padding: .45rem .42rem; border-radius: 7px; min-width: 2.1rem; }
.speed-group button:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.speed-group button.on { color: #031512; background: var(--accent); }
#pauseBtn.paused { color: var(--warn); }

/* ---------- mode dock ---------- */
.dock {
  left: var(--gap); top: 50%; transform: translateY(-50%);
  width: var(--dock-w); padding: .45rem; display: flex; flex-direction: column; gap: .2rem;
}
.mode-btn {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .32rem;
  width: 100%; aspect-ratio: 1 / .98; border-radius: 12px; border: 1px solid transparent; background: transparent;
  color: var(--muted); font-size: .64rem; font-weight: 600; letter-spacing: .01em;
  transition: color .2s, background .2s, border-color .2s; padding: .5rem 0 .35rem;
}
.mode-btn > span:not(.num) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 .15rem; }
.mode-btn .ic { width: 1.3rem; height: 1.3rem; }
.mode-btn:hover:not(.locked) { color: var(--ink); background: rgba(255, 255, 255, .05); }
.mode-btn.current { color: var(--mc); background: color-mix(in srgb, var(--mc) 12%, transparent); border-color: color-mix(in srgb, var(--mc) 30%, transparent); }
.mode-btn.current::before { content: ""; position: absolute; left: -.48rem; top: 28%; bottom: 28%; width: 2px; border-radius: 2px; background: var(--mc); box-shadow: 0 0 10px var(--mc); }
.mode-btn .num { position: absolute; top: .25rem; left: .35rem; font: 600 .55rem/1 var(--mono); color: var(--dim); }
.mode-btn .mastered { position: absolute; top: .22rem; right: .28rem; width: .9rem; height: .9rem; color: var(--good); }
.mode-btn.locked { color: #3e5161; cursor: not-allowed; }
.mode-btn.locked .lock { position: absolute; right: .3rem; top: .28rem; width: .72rem; height: .72rem; color: #4f6475; }
.mode-btn.fresh { animation: fresh 1.6s var(--ease) 3; }
@keyframes fresh { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--mc) 30%, transparent), 0 0 28px var(--mc); } }

/* ---------- mode heading ---------- */
.mode-head { left: calc(var(--dock-w) + var(--gap) * 2); top: 5.1rem; max-width: 27rem; pointer-events: none; }
.mode-head .eyebrow { color: var(--accent); }
.mode-head h1 { font-size: 2.25rem; font-weight: 350; letter-spacing: -.035em; line-height: 1.08; margin-top: .5rem; text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.mode-head p { margin-top: .6rem; color: var(--ink-2); font-size: .9rem; max-width: 23rem; text-shadow: 0 1px 12px rgba(0,0,0,.8); }
.mode-head.quiet h1 { opacity: .55; }
.mode-head.quiet p { opacity: 0; }
.mode-head h1, .mode-head p { transition: opacity 1.2s var(--ease); }
.mode-head.swap { animation: headIn .7s var(--ease); }
@keyframes headIn { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------- side panel ---------- */
.panel {
  right: var(--gap); top: 4.9rem; bottom: var(--gap); width: var(--panel-w);
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform .45s var(--ease), opacity .35s var(--ease);
}
#app.panel-closed .panel { transform: translateX(calc(100% + var(--gap) * 2)); opacity: 0; pointer-events: none; }
.panel-tabs { display: flex; align-items: center; gap: .25rem; padding: .55rem .6rem .5rem .75rem; border-bottom: 1px solid var(--line); }
.panel-tabs .tab { border: 0; background: transparent; color: var(--muted); font-size: .78rem; font-weight: 600; padding: .45rem .7rem; border-radius: 8px; letter-spacing: .02em; }
.panel-tabs .tab:hover { color: var(--ink); }
.panel-tabs .tab.on { color: var(--ink); background: rgba(255, 255, 255, .07); }
.panel-tabs .tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: .35rem; vertical-align: middle; box-shadow: 0 0 8px var(--accent); }
.panel-tabs .spacer { flex: 1; }
.panel-body { flex: 1; overflow-y: auto; padding: 1.1rem 1.15rem 1.2rem; scrollbar-width: thin; scrollbar-color: rgba(160, 200, 230, .2) transparent; }
.panel-body::-webkit-scrollbar { width: 8px; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(160, 200, 230, .16); border-radius: 8px; }
.panel-body.swap { animation: panelIn .35s var(--ease); }
@keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.journal { border-top: 1px solid var(--line); padding: .7rem 1.15rem .75rem; background: rgba(0, 0, 0, .12); }
.journal summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
.journal summary::-webkit-details-marker { display: none; }
.journal ol { list-style: none; margin: .45rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .3rem; max-height: 7.2rem; overflow: hidden; }
.journal li { display: flex; gap: .55rem; font-size: .74rem; color: var(--muted); line-height: 1.35; animation: panelIn .3s var(--ease); }
.journal li:first-child { color: var(--ink-2); }
.journal li time { font: .66rem/1.5 var(--mono); color: var(--dim); flex-shrink: 0; }
.panel-open { right: var(--gap); top: 5rem; }
#app:not(.panel-closed) .panel-open { opacity: 0; pointer-events: none; transform: translateX(10px); }

/* panel content blocks */
.p-head .kicker { font: 600 .66rem/1 var(--mono); letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
.p-head h2 { font-size: 1.5rem; font-weight: 450; letter-spacing: -.025em; line-height: 1.15; margin-top: .55rem; }
.p-head p { color: var(--ink-2); font-size: .84rem; margin-top: .55rem; line-height: 1.55; }
.p-sec { margin-top: 1.25rem; }
.p-sec > h3 { font-size: .68rem; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: .6rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.divider { height: 1px; background: var(--line); margin: 1.15rem 0; }
.stack { display: flex; flex-direction: column; gap: .5rem; }
.row { display: flex; align-items: center; gap: .5rem; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: .85rem .9rem; background: rgba(255, 255, 255, .02); }
.card.accent { border-color: color-mix(in srgb, var(--accent) 28%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.card.good { border-color: rgba(116, 227, 154, .35); background: rgba(116, 227, 154, .06); }
.card.warn { border-color: rgba(251, 191, 91, .35); background: rgba(251, 191, 91, .06); }
.card.bad { border-color: rgba(255, 138, 150, .35); background: rgba(255, 138, 150, .06); }
.card h4 { font-size: .86rem; font-weight: 600; }
.card p { font-size: .78rem; color: var(--ink-2); margin-top: .3rem; line-height: 1.5; }

.meter-row { margin-top: .7rem; }
.meter-row:first-child { margin-top: 0; }
.meter-row .row { font-size: .78rem; color: var(--ink-2); justify-content: space-between; margin-bottom: .35rem; }
.meter-row .row b { font: 600 .8rem/1 var(--mono); color: var(--ink); }
.meter-row .row .delta { font: 600 .7rem/1 var(--mono); margin-left: .35rem; }
.meter { position: relative; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .07); overflow: visible; }
.meter > i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--mc, var(--accent)); box-shadow: 0 0 10px color-mix(in srgb, var(--mc, var(--accent)) 60%, transparent); transition: width .35s var(--ease); }
.meter > .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 2px; opacity: .7; }
.meter.thin { height: 3px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: .45rem .75rem; font-size: .8rem; }
.kv span { color: var(--muted); }
.kv b { font-weight: 550; text-align: right; font-variant-numeric: tabular-nums; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.metric { border: 1px solid var(--line); border-radius: 11px; padding: .6rem .7rem; background: rgba(255,255,255,.015); }
.metric .k { font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.metric .v { font-size: 1.3rem; font-weight: 400; letter-spacing: -.02em; margin-top: .2rem; font-variant-numeric: tabular-nums; }
.metric .v small { font-size: .72rem; color: var(--muted); margin-left: .15rem; }
.metric .s { font-size: .68rem; color: var(--dim); margin-top: .1rem; }

.steps { display: flex; flex-direction: column; gap: .45rem; }
.step { display: flex; gap: .6rem; align-items: flex-start; font-size: .8rem; color: var(--ink-2); line-height: 1.45; }
.step .n { width: 1.35rem; height: 1.35rem; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font: 600 .62rem/1 var(--mono); color: var(--muted); }
.step.done { color: var(--muted); }
.step.done .n { background: color-mix(in srgb, var(--good) 18%, transparent); border-color: color-mix(in srgb, var(--good) 50%, transparent); color: var(--good); }
.step.now .n { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step.now { color: var(--ink); }

.science { margin-top: 1rem; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.science > div { display: flex; flex-direction: column; gap: .3rem; padding: .7rem .85rem; font-size: .76rem; line-height: 1.55; color: var(--ink-2); }
.science > div + div { border-top: 1px dashed var(--line); background: rgba(0, 0, 0, .14); }
.science .lab { display: flex; align-items: center; gap: .35rem; font-size: .58rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.science .lab.sci { color: var(--info); }
.science .lab.game { color: var(--warn); }
details.more { margin-top: .8rem; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.015); }
details.more summary { cursor: pointer; padding: .6rem .8rem; font-size: .78rem; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: .45rem; }

.mission-list { display: flex; flex-direction: column; gap: .45rem; }
.mission-card { display: flex; align-items: center; gap: .7rem; width: 100%; text-align: left; padding: .65rem .75rem; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
.mission-card:hover:not(:disabled) { border-color: var(--line-2); background: rgba(255,255,255,.045); }
.mission-card.on { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.mission-card .mn { width: 1.9rem; height: 1.9rem; border-radius: 9px; display: grid; place-items: center; font: 700 .72rem/1 var(--mono); background: rgba(255,255,255,.05); color: var(--muted); flex-shrink: 0; }
.mission-card.on .mn { background: var(--accent); color: #031512; }
.mission-card.done .mn { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.mission-card .mt { font-size: .84rem; font-weight: 600; }
.mission-card .ms { font-size: .72rem; color: var(--muted); margin-top: .1rem; }
.chip-row { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line-2); border-radius: 99px; padding: .35rem .7rem; font-size: .76rem; background: rgba(255,255,255,.03); color: var(--ink-2); }
button.chip:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--ink); }
.chip.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--ink); }
.chip.done { border-color: rgba(116, 227, 154, .45); color: var(--good); }
.chip.next { border-color: var(--warn); color: var(--warn); box-shadow: 0 0 0 3px rgba(251, 191, 91, .12); }
.chip .sw { width: .55rem; height: .55rem; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 8px var(--c, var(--accent)); }
.region-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
.region-grid .btn { justify-content: flex-start; font-size: .76rem; min-height: 2.1rem; }
.region-grid .sw { width: .5rem; height: .5rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex-shrink: 0; }

/* before/after pathway strip (Learn) */
.path-strip { display: flex; align-items: center; margin: .5rem 0 .2rem; height: 1.6rem; }
.path-strip .node { width: 1.45rem; height: 1.45rem; border-radius: 50%; border: 1.5px solid var(--c, var(--accent)); display: grid; place-items: center; font: 700 .6rem/1 var(--mono); color: var(--c, var(--accent)); flex-shrink: 0; background: var(--bg); position: relative; z-index: 1; }
.path-strip .node.lit { background: var(--c, var(--accent)); color: #031512; box-shadow: 0 0 12px var(--c, var(--accent)); }
.path-strip .link { flex: 1; height: 2px; margin: 0 -1px; background-image: linear-gradient(90deg, var(--c, var(--accent)) var(--fill, 20%), transparent 0); background-size: 9px 2px; opacity: .45; }
.path-strip .link.solid { background: var(--c, var(--accent)); opacity: 1; box-shadow: 0 0 8px var(--c, var(--accent)); height: 3px; }

/* ---------- view tools ---------- */
.view-tools { left: var(--gap); bottom: calc(var(--gap) + 5.6rem); display: flex; align-items: center; gap: .45rem; padding: .3rem; }
.scale-switch { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: rgba(0,0,0,.25); }
.scale-switch button { border: 0; background: transparent; color: var(--muted); font-size: .64rem; font-weight: 700; letter-spacing: .14em; padding: .45rem .6rem; border-radius: 8px; }
.scale-switch button:hover { color: var(--ink); }
.scale-switch button.on { color: #031512; background: var(--accent); }
.view-tools .sep { width: 1px; height: 1.4rem; background: var(--line); }
.view-tools .btn.icon { width: 2.1rem; min-height: 2.1rem; border-color: transparent; background: transparent; }
.view-tools .btn.icon:hover { background: rgba(255,255,255,.07); }
.view-tools .btn.icon.on { color: var(--accent); background: var(--accent-soft); }

/* ---------- mission bar ---------- */
.mission-bar {
  left: calc(var(--dock-w) + var(--gap) * 2); right: calc(var(--panel-w) + var(--gap) * 2); bottom: var(--gap);
  min-height: 4.7rem; padding: .7rem .8rem .7rem 1.1rem; display: flex; align-items: center; gap: 1.1rem;
  transition: right .45s var(--ease), opacity .4s;
}
#app.panel-closed .mission-bar { right: var(--gap); }
.mb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .35rem; }
.mb-top { display: flex; align-items: baseline; gap: .65rem; min-width: 0; }
.mb-top .eyebrow { flex-shrink: 0; }
.mb-obj { font-size: .92rem; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mb-progress { display: flex; align-items: center; gap: .6rem; }
.mb-progress .meter { flex: 1; max-width: 18rem; }
.mb-progress .count { font: 600 .72rem/1 var(--mono); color: var(--muted); white-space: nowrap; }
.mb-insight { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: .4rem; }
.mb-insight b { color: var(--ink-2); font-weight: 600; }
.mb-actions { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 52%; }

/* ---------- mode overlay (center stage) ---------- */
.mode-overlay { position: absolute; z-index: 4; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
.mode-overlay > * { pointer-events: auto; }
.stage-bottom { position: absolute; left: 50%; bottom: calc(var(--gap) + 9.4rem); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .6rem; }
#app:not(.panel-closed) .stage-bottom { left: calc(50% - (var(--panel-w) + var(--gap)) / 2 + (var(--dock-w) + var(--gap)) / 2); }
.stage-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#app:not(.panel-closed) .stage-center { left: calc(50% - (var(--panel-w) + var(--gap)) / 2 + (var(--dock-w) + var(--gap)) / 2); }
.seq-track { display: flex; gap: .4rem; padding: .45rem .55rem; border-radius: 99px; }
.seq-step { width: 2.3rem; height: 2.3rem; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); display: grid; place-items: center; font: 700 .78rem/1 var(--mono); color: var(--muted); padding: 0; transition: all .2s var(--ease); }
button.seq-step:hover { border-color: var(--accent); color: var(--ink); }
.seq-step.next { border-color: var(--warn); color: var(--warn); box-shadow: 0 0 0 4px rgba(251, 191, 91, .14); transform: scale(1.06); }
.seq-step.done { background: var(--accent); border-color: var(--accent); color: #031512; }
.seq-step.wrong { border-color: var(--bad); color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.seq-step.wide { width: auto; padding: 0 .8rem; border-radius: 99px; font-size: .7rem; letter-spacing: .06em; }

/* piano */
.piano { display: flex; gap: .4rem; padding: .6rem; border-radius: 18px; }
.piano .key { position: relative; width: 4.4rem; height: 6.4rem; border-radius: 8px 8px 14px 14px; border: 1px solid rgba(255,255,255,.18); background: linear-gradient(180deg, rgba(235, 245, 250, .92), rgba(170, 195, 210, .85)); color: #0a1a22; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: .6rem; font-weight: 700; font-size: 1.05rem; transition: transform .08s, background .15s, box-shadow .15s; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 10px 30px -12px rgba(0,0,0,.8); }
.piano .key small { font: 700 .66rem/1 var(--mono); opacity: .55; margin-top: .3rem; }
.piano .key.expect { box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 0 0 3px var(--warn), 0 0 30px -4px var(--warn); }
.piano .key.predicted::after { content: ""; position: absolute; inset: 6px; border-radius: 6px; border: 2px dashed rgba(10, 60, 90, .45); }
.piano .key.lit { background: linear-gradient(180deg, #fff2c9, var(--reward)); transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), 0 0 34px -2px var(--reward); }
.piano .key.err { background: linear-gradient(180deg, #ffd9de, var(--bad)); }
.piano .key:disabled { opacity: .6; }

/* focus arena */
.focus-hud { position: absolute; top: 5.2rem; left: 50%; transform: translateX(-50%); width: min(34rem, 92vw); padding: .85rem 1rem; }
#app:not(.panel-closed) .focus-hud { left: calc(50% - (var(--panel-w) + var(--gap)) / 2 + (var(--dock-w) + var(--gap)) / 2); }
.compete { display: grid; grid-template-columns: 8.6rem 1fr 2.8rem; gap: .35rem .6rem; align-items: center; font-size: .72rem; }
.compete .nm { font-weight: 650; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compete .nm.task { color: var(--accent); }
.compete .val { font: 600 .72rem/1 var(--mono); text-align: right; color: var(--ink-2); }
.compete .bar { height: 7px; border-radius: 7px; background: rgba(255,255,255,.06); overflow: hidden; }
.compete .bar i { display: block; height: 100%; border-radius: 7px; background: var(--c); transition: width .2s linear; }
.focus-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; gap: .8rem; }
.focus-top .clock { font: 600 1.3rem/1 var(--mono); letter-spacing: -.02em; }
.focus-flags { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }
.captured-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: .8rem 1.2rem; border-radius: 14px; background: rgba(60, 14, 22, .78); border: 1px solid rgba(255, 138, 150, .45); color: #ffd3d9; text-align: center; pointer-events: none; animation: headIn .35s var(--ease); }
.captured-banner b { display: block; font-size: 1.1rem; letter-spacing: .1em; }
.captured-banner { max-width: min(30rem, 88vw); }
#app:not(.panel-closed) .captured-banner { left: calc(50% - (var(--panel-w) + var(--gap)) / 2 + (var(--dock-w) + var(--gap)) / 2); }
.distractor { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: auto; border-radius: 99px; padding: .4rem .75rem .4rem .45rem; display: flex; align-items: center; gap: .45rem; border: 1px solid rgba(255, 160, 130, .45); background: rgba(40, 14, 10, .72); color: #ffd7c8; font-size: .72rem; font-weight: 700; letter-spacing: .09em; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); white-space: nowrap; box-shadow: 0 0 calc(10px + 30px * var(--s, .3)) -6px rgba(255, 130, 90, calc(.4 + .6 * var(--s, .3))); }
.distractor .ring { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#ff9f7a calc(var(--s, .3) * 360deg), rgba(255,255,255,.1) 0); }
.distractor .ring i { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: rgba(40, 14, 10, .95); display: grid; place-items: center; }
.distractor.relevant { border-color: rgba(94, 234, 212, .55); background: rgba(6, 40, 36, .75); color: #c9fff4; }
.distractor.relevant .ring { background: conic-gradient(var(--exc) calc(var(--s, .3) * 360deg), rgba(255,255,255,.1) 0); }
.distractor.relevant .ring i { background: rgba(6, 40, 36, .95); }
.distractor.habituating { opacity: .75; }
.distractor .hint { font-size: .58rem; letter-spacing: .1em; opacity: .7; font-weight: 600; }
.distractor:hover { filter: brightness(1.2); }

/* overlays: experience / question / result cards */
.stage-card { width: min(28rem, 92vw); padding: 1rem 1.1rem; text-align: left; }
.stage-card .option { padding: .55rem .75rem; margin-top: .35rem; font-size: .8rem; }
.stage-card h3 { font-size: 1.25rem; font-weight: 450; letter-spacing: -.02em; margin-top: .4rem; }
.stage-card p { font-size: .84rem; color: var(--ink-2); margin-top: .45rem; line-height: 1.55; }
.stage-card .actions { display: flex; gap: .45rem; margin-top: .9rem; flex-wrap: wrap; }
.option { display: block; width: 100%; text-align: left; padding: .7rem .85rem; margin-top: .45rem; border-radius: 11px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); font-size: .82rem; line-height: 1.45; }
.option:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.option.right { border-color: var(--good); background: rgba(116, 227, 154, .1); color: #d6ffe4; }
.option.wrong { border-color: var(--bad); background: rgba(255, 138, 150, .08); color: #ffd6dc; }
.option .lbl { font: 700 .66rem/1 var(--mono); color: var(--muted); margin-right: .5rem; }
.window-bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: .7rem; }
.window-bar i { display: block; height: 100%; background: var(--warn); width: 100%; }

/* dream */
.dream-stage { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); text-align: center; pointer-events: none; width: min(40rem, 90vw); }
#app:not(.panel-closed) .dream-stage { left: calc(50% - (var(--panel-w) + var(--gap)) / 2 + (var(--dock-w) + var(--gap)) / 2); }
.dream-stage .eyebrow { color: #b8acff; }
.dream-stage h2 { font-size: 2.4rem; font-weight: 250; letter-spacing: -.03em; color: #e7e1ff; margin-top: .5rem; text-shadow: 0 0 40px rgba(140, 120, 255, .5); }
.dream-stage p { color: #b9b0de; margin-top: .45rem; font-size: .92rem; }
.dream-flow { display: flex; align-items: center; justify-content: center; gap: .35rem; margin-top: 1.1rem; flex-wrap: nowrap; }
.dream-flow span { font-size: .58rem; font-weight: 700; letter-spacing: .12em; padding: .42rem .6rem; white-space: nowrap; border-radius: 99px; border: 1px solid rgba(180, 170, 255, .2); color: #8f88b8; transition: all .6s var(--ease); }
.dream-flow span.on { color: #fff; border-color: #a99bff; background: rgba(140, 120, 255, .22); box-shadow: 0 0 24px -4px #8b7dff; }
.dream-flow span.done { color: #cfc8ff; border-color: rgba(180, 170, 255, .4); }
.dream-flow i { color: #6f6a99; font-style: normal; }
.dream-flow.vertical { flex-direction: column; gap: .25rem; margin-top: 1rem; }
.dream-flow.vertical span { width: 100%; text-align: center; }
.cmp-table { width: 100%; border-collapse: collapse; font-size: .76rem; }
.cmp-table th { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 650; text-align: right; padding: .35rem .25rem; }
.cmp-table th:first-child, .cmp-table td:first-child { text-align: left; }
.cmp-table td { padding: .42rem .25rem; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.cmp-table .up { color: var(--good); }
.cmp-table .down { color: var(--bad); }

/* ---------- 3D labels ---------- */
.lbl3d { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
.region-label { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: .4rem; padding: .28rem .55rem; border-radius: 7px; border: 1px solid rgba(255,255,255,.08); background: rgba(4, 10, 18, .55); color: var(--ink-2); font-size: .62rem; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: color .2s, border-color .2s, background .2s, opacity .4s; }
.region-label .sw { width: .42rem; height: .42rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.region-label:hover, .region-label.on { color: #fff; border-color: color-mix(in srgb, var(--c) 60%, transparent); background: rgba(8, 18, 30, .78); }
.region-label .act { font: 600 .58rem/1 var(--mono); color: var(--muted); letter-spacing: 0; }
.chain-label { pointer-events: none; font-size: .7rem; font-weight: 700; letter-spacing: .2em; color: #fff; text-shadow: 0 0 18px var(--c), 0 0 4px rgba(0,0,0,.9); }
.chain-label small { display: block; font-size: .56rem; letter-spacing: .18em; color: var(--muted); text-align: center; margin-top: .15rem; text-shadow: 0 1px 6px #000; }
.node-tag { pointer-events: auto; cursor: pointer; padding: .26rem .5rem; border-radius: 7px; font-size: .66rem; font-weight: 650; letter-spacing: .08em; background: rgba(6, 14, 24, .78); border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 45%, transparent); color: color-mix(in srgb, var(--c, var(--accent)) 80%, white); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 6px 18px -8px rgba(0,0,0,.9); transition: background .2s, color .2s, opacity .3s; }
.node-tag.target { background: var(--c, var(--accent)); color: #041512; border-color: transparent; box-shadow: 0 0 22px -2px var(--c, var(--accent)); animation: tagPulse 1.4s ease-in-out infinite; }
@keyframes tagPulse { 50% { box-shadow: 0 0 34px 2px var(--c, var(--accent)); } }
.node-tag.hiddenf { border-style: dashed; color: var(--muted); background: rgba(6, 14, 24, .6); }
.node-tag.revealed { background: rgba(196, 167, 255, .22); color: #f1eaff; border-color: #c4a7ff; animation: revealIn .5s var(--ease); }
@keyframes revealIn { from { transform: scale(.7); opacity: 0; } }
.node-tag.intrusion { border-color: var(--bad); color: #ffd6dc; background: rgba(70, 16, 26, .8); }
.node-tag.off { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.node-tag.dim { opacity: .7; }
.node-tag .k { font-family: var(--mono); opacity: .7; margin-right: .3rem; }
.part-label { pointer-events: auto; cursor: help; font-size: .58rem; font-weight: 700; letter-spacing: .16em; color: #dff; padding: .18rem .4rem; border-left: 1px solid rgba(220, 255, 255, .6); background: linear-gradient(90deg, rgba(4, 12, 20, .7), transparent); }
.concept-label { pointer-events: auto; cursor: pointer; padding: .32rem .62rem; border-radius: 99px; font-size: .68rem; font-weight: 700; letter-spacing: .12em; border: 1px solid rgba(245, 211, 138, .45); background: rgba(24, 18, 6, .66); color: #ffe7b0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: opacity .3s, background .2s; }
.concept-label.locked { border-style: dashed; color: #8a8270; background: rgba(10, 10, 10, .4); border-color: rgba(200, 190, 160, .2); }
.concept-label.isolated { border-color: rgba(251, 191, 91, .9); color: var(--warn); }
.concept-label.sel { background: #f5d38a; color: #1c1404; box-shadow: 0 0 26px -4px #f5d38a; }
.concept-label.root::before { content: "◆ "; }
.floater { position: absolute; left: 0; top: 0; font-size: .7rem; font-weight: 750; letter-spacing: .12em; white-space: nowrap; color: var(--c, var(--accent)); text-shadow: 0 0 14px var(--c, var(--accent)), 0 1px 4px rgba(0,0,0,.9); animation: floatUp 1.9s var(--ease) forwards; }
@keyframes floatUp { 0% { opacity: 0; translate: -50% 4px; } 12% { opacity: 1; translate: -50% -6px; } 75% { opacity: 1; } 100% { opacity: 0; translate: -50% -42px; } }

/* ---------- selection chip ---------- */
.sel-chip { left: calc(var(--dock-w) + var(--gap) * 2); bottom: calc(var(--gap) + 9.2rem); padding: .6rem .65rem .6rem .85rem; display: flex; align-items: center; gap: .8rem; max-width: 34rem; }
.sel-chip > div:first-child { min-width: 11rem; max-width: 15rem; }
.sel-chip .t { font-size: .84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-chip .s { font-size: .7rem; color: var(--muted); margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-chip .actions { display: flex; gap: .3rem; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 40; top: 4.9rem; right: calc(var(--panel-w) + var(--gap) * 2); display: flex; flex-direction: column; align-items: flex-end; gap: .4rem; pointer-events: none; width: min(23rem, 92vw); transition: right .45s var(--ease); }
#app.panel-closed ~ .toasts { right: var(--gap); }
.toast { display: flex; gap: .6rem; align-items: flex-start; padding: .6rem .85rem; width: 100%; border-radius: 12px; font-size: .8rem; line-height: 1.45; color: var(--ink); background: rgba(8, 18, 28, .9); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -14px rgba(0,0,0,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); animation: toastIn .3s var(--ease); pointer-events: auto; }
.toast .ic { color: var(--accent); margin-top: .05rem; }
.toast.good { border-color: rgba(116, 227, 154, .4); } .toast.good .ic { color: var(--good); }
.toast.warn { border-color: rgba(251, 191, 91, .4); } .toast.warn .ic { color: var(--warn); }
.toast.bad { border-color: rgba(255, 138, 150, .45); } .toast.bad .ic { color: var(--bad); }
.toast.big { padding: .75rem .95rem; }
.toast b { display: block; font-size: .86rem; margin-bottom: .1rem; }
.toast.big b { font-size: .92rem; }
.toast.out { animation: toastOut .35s var(--ease) forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

/* ---------- tooltip ---------- */
#tooltip { position: fixed; z-index: 60; left: 0; top: 0; max-width: 19rem; padding: .6rem .75rem; border-radius: 11px; background: rgba(6, 14, 22, .95); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -12px rgba(0,0,0,.95); font-size: .76rem; line-height: 1.5; color: var(--ink-2); pointer-events: none; opacity: 0; transition: opacity .14s; }
#tooltip.show { opacity: 1; }
#tooltip b { display: block; color: var(--ink); font-size: .8rem; margin-bottom: .15rem; }
#tooltip .tt-k { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; display: block; margin-bottom: .2rem; }
#tooltip .tt-more { display: block; margin-top: .35rem; color: var(--dim); font-size: .68rem; }
.term { border-bottom: 1px dotted color-mix(in srgb, var(--accent) 70%, transparent); cursor: help; color: inherit; }

/* ---------- modal ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1.4rem; background: rgba(1, 4, 8, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: fadeIn .25s var(--ease); }
@keyframes fadeIn { from { opacity: 0; } }
.modal { width: min(52rem, 100%); max-height: min(88dvh, 54rem); display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(160deg, rgba(14, 26, 38, .97), rgba(5, 11, 18, .98)); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: 0 40px 120px -30px #000; animation: modalIn .35s var(--ease); }
.modal.narrow { width: min(30rem, 100%); }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.985); } }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.3rem 1.4rem 1rem; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 1.55rem; font-weight: 400; letter-spacing: -.025em; margin-top: .4rem; }
.modal-body { padding: 1.1rem 1.4rem 1.4rem; overflow-y: auto; scrollbar-width: thin; }
.modal-body > p, .modal-body .lead { font-size: .88rem; color: var(--ink-2); line-height: 1.6; }
.modal-body h3 { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .6rem; font-weight: 650; }
.tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs .btn.on { color: var(--ink); background: rgba(255,255,255,.09); border-color: var(--line-2); }
.guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 1.2rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.setting label, .setting .lb { font-size: .86rem; }
.setting small { display: block; font-size: .74rem; color: var(--muted); margin-top: .15rem; line-height: 1.45; }
.switch { position: relative; width: 2.5rem; height: 1.45rem; flex-shrink: 0; -webkit-appearance: none; appearance: none; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid var(--line-2); cursor: pointer; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.45rem - 6px); height: calc(1.45rem - 6px); border-radius: 50%; background: #cfe0ea; transition: transform .2s var(--ease); }
.switch:checked { background: var(--accent); border-color: var(--accent); }
.switch:checked::after { transform: translateX(1.05rem); background: #031512; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid var(--line); flex-shrink: 0; }
.seg button { border: 0; background: transparent; color: var(--muted); font-size: .74rem; font-weight: 600; padding: .4rem .65rem; border-radius: 8px; }
.seg button.on { background: var(--accent); color: #031512; }
input[type=range] { accent-color: var(--accent); width: 100%; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .5rem; }
.ach { display: flex; gap: .65rem; padding: .7rem; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
.ach .ai { width: 2.2rem; height: 2.2rem; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--dim); flex-shrink: 0; }
.ach.got { border-color: rgba(255, 195, 92, .35); background: rgba(255, 195, 92, .05); }
.ach.got .ai { background: rgba(255, 195, 92, .16); color: var(--reward); }
.ach h4 { font-size: .8rem; font-weight: 650; letter-spacing: .04em; }
.ach p { font-size: .72rem; color: var(--muted); margin-top: .15rem; line-height: 1.4; }
.level-list { display: flex; flex-direction: column; gap: .35rem; }
.level { display: grid; grid-template-columns: 2rem 1fr auto; gap: .7rem; align-items: center; padding: .55rem .7rem; border-radius: 11px; border: 1px solid var(--line); }
.level .ln { font: 700 .8rem/1 var(--mono); color: var(--dim); text-align: center; }
.level.got { border-color: color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.level.got .ln { color: var(--accent); }
.level.cur { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
.level h4 { font-size: .84rem; font-weight: 600; }
.level p { font-size: .72rem; color: var(--muted); }
.level .un { font-size: .66rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; text-align: right; }
.disclaimer { border: 1px solid rgba(251, 191, 91, .3); background: rgba(251, 191, 91, .05); border-radius: 12px; padding: .9rem 1rem; font-size: .84rem; line-height: 1.6; color: var(--ink-2); }
.disclaimer b { color: var(--warn); display: block; font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; margin-bottom: .35rem; }
.ctl-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.ctl-table td { padding: .55rem .3rem; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
.ctl-table td:first-child { color: var(--ink); width: 36%; }

/* ---------- intro ---------- */
#intro { position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(2,6,11,.2), rgba(2,6,11,.75) 70%); transition: opacity 1.2s var(--ease); }
#intro.leaving { opacity: 0; pointer-events: none; }
.intro-text { max-width: 46rem; padding: 0 1.5rem; }
.intro-line { font-size: clamp(1.4rem, 3.4vw, 2.6rem); font-weight: 300; letter-spacing: .06em; line-height: 1.25; color: #eaf6ff; text-shadow: 0 0 40px rgba(94, 234, 212, .35); animation: introLine 3.3s var(--ease) forwards; }
.intro-line.final { font-weight: 600; letter-spacing: .32em; color: var(--accent); }

@keyframes introLine { 0% { opacity: 0; filter: blur(8px); transform: translateY(10px); } 18% { opacity: 1; filter: blur(0); transform: none; } 82% { opacity: 1; filter: blur(0); } 100% { opacity: 0; filter: blur(6px); transform: translateY(-8px); } }

.intro-skip { position: absolute; right: 1.4rem; bottom: 1.4rem; }

.intro-start { margin-top: 2rem; display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; opacity: 0; animation: introHold 1s var(--ease) .6s forwards; }
.loading-veil { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; transition: opacity .8s var(--ease); }
.loading-veil.gone { opacity: 0; pointer-events: none; }

.loading-veil .eyebrow { color: var(--muted); }
@keyframes breathe { 50% { opacity: .45; transform: scale(.94); } }

/* ---------- tutorial coach ---------- */
.coach { position: fixed; z-index: 30; width: min(21rem, 90vw); padding: .95rem 1rem 1rem; transition: left .45s var(--ease), top .45s var(--ease), opacity .3s; }
.coach .eyebrow { display: flex; justify-content: space-between; }
.coach h3 { font-size: 1.05rem; font-weight: 550; margin-top: .45rem; }
.coach p { font-size: .8rem; color: var(--ink-2); margin-top: .35rem; line-height: 1.5; }
.coach .actions { display: flex; gap: .35rem; margin-top: .8rem; justify-content: flex-end; }
.coach .dots { display: flex; gap: 3px; margin-top: .75rem; }
.coach .dots i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); }
.coach .dots i.done { background: var(--accent); }
.coach .dots i.now { background: var(--warn); }
.coach.min { width: auto; padding: .5rem .7rem; }
.spot-ring { position: fixed; z-index: 29; pointer-events: none; border-radius: 14px; border: 2px solid var(--warn); box-shadow: 0 0 0 4px rgba(251, 191, 91, .18), 0 0 40px rgba(251, 191, 91, .35); animation: spot 1.6s ease-in-out infinite; transition: left .35s var(--ease), top .35s var(--ease), width .35s var(--ease), height .35s var(--ease); }
@keyframes spot { 50% { box-shadow: 0 0 0 9px rgba(251, 191, 91, .08), 0 0 50px rgba(251, 191, 91, .5); } }

/* ---------- error panel ---------- */
.error-panel { position: fixed; z-index: 80; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem; background: rgba(2, 6, 11, .92); }
.error-panel .card { max-width: 32rem; padding: 1.4rem; }
.error-panel h2 { font-size: 1.3rem; font-weight: 500; }
.error-panel p { color: var(--ink-2); margin-top: .6rem; font-size: .88rem; }

/* ==========================================================================
   Sleep atmosphere & reduced motion
   ========================================================================== */
body.sleeping { --accent: #a99bff; --accent-soft: rgba(169, 155, 255, .16); }
body.sleeping .topbar { background: linear-gradient(180deg, rgba(4, 2, 16, .9), transparent); }
body.reduced *, body.reduced *::before, body.reduced *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
body.reduced .floater { animation: none; opacity: 1; translate: -50% -10px; }
@media (prefers-reduced-motion: reduce) {
  .intro-line { animation-duration: .01ms; opacity: 1; }
}

/* ==========================================================================
   Responsive
   ========================================================================== */

/* ==========================================================================

   ========================================================================== */

  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 14%, rgba(8, 16, 26, .62));
  color: var(--ink); font: 700 .72rem/1 var(--font); letter-spacing: .14em; white-space: nowrap;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: background .2s, border-color .2s, box-shadow .2s;
}

.demo-btn .dot { display: none; width: .5rem; height: .5rem; border-radius: 50%; background: var(--bad); box-shadow: 0 0 10px var(--bad); animation: demoPulse 1.4s ease-in-out infinite; }

<script>
'use strict';
(() => {
/* ==========================================================================
   NEURON — Inside the Living Brain
   A single-file educational 3D game. Everything (WebGL shaders, procedural
   geometry, simulation, audio synthesis, UI) is generated locally: no
   libraries, fonts, network requests or external assets.

   Architecture (sections in this file, in order):
     Utilities · Content · Domain model · BrainSimulation · Plasticity & Reward
     · Memory · Attention · Sleep · Repair · Knowledge · Skill · Glia
     · Progression/Achievements/Missions/Stats · Audio · Save · Camera
     · WebGL helpers · Renderer · UI · Modes · Intro & Tutorial · Input · Game

   IMPORTANT: this is an illustrative teaching model. Thresholds, weights,
   percentages and timescales are game abstractions, not biological measures.
   ========================================================================== */

/* ---------- math ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a));
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const pct = (v) => `${Math.round(clamp(v) * 100)}%`;
const pts = (d) => `${d >= 0 ? '+' : '−'}${Math.abs(Math.round(d * 100))}`;
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/** Small, fast, seedable PRNG. World layout is deterministic per neuron key. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const keyedRandom = (key) => mulberry32(hashString(String(key)));

const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  mul: (a, b) => [a[0] * b[0], a[1] * b[1], a[2] * b[2]],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  copy: (a) => [a[0], a[1], a[2]],
};

/** Column-major 4×4 matrices (WebGL convention). */
const M4 = {
  perspective(fovy, aspect, near, far, out = new Float32Array(16)) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out.fill(0);
    out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
    return out;
  },
  lookAt(eye, target, up = [0, 1, 0], out = new Float32Array(16)) {
    let z = V3.norm(V3.sub(eye, target));
    let x = V3.cross(up, z);
    if (V3.len(x) < 1e-5) x = V3.cross([0, 0, 1], z);
    x = V3.norm(x);
    const y = V3.cross(z, x);
    out[0] = x[0]; out[1] = y[0]; out[2] = z[0]; out[3] = 0;
    out[4] = x[1]; out[5] = y[1]; out[6] = z[1]; out[7] = 0;
    out[8] = x[2]; out[9] = y[2]; out[10] = z[2]; out[11] = 0;
    out[12] = -V3.dot(x, eye); out[13] = -V3.dot(y, eye); out[14] = -V3.dot(z, eye); out[15] = 1;
    return out;
  },
  multiply(a, b, out = new Float32Array(16)) {
    for (let c = 0; c < 4; c++) {
      const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
      out[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
      out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
      out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
      out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
    }
    return out;
  },
};

/** Quadratic Bézier helper used for curved axons/synapses. */
function bezier(a, c, b, t, out = [0, 0, 0]) {
  const u = 1 - t, uu = u * u, ut2 = 2 * u * t, tt = t * t;
  out[0] = uu * a[0] + ut2 * c[0] + tt * b[0];
  out[1] = uu * a[1] + ut2 * c[1] + tt * b[1];
  out[2] = uu * a[2] + ut2 * c[2] + tt * b[2];
  return out;
}
function bezierTangent(a, c, b, t) {
  const u = 1 - t;
  return V3.norm([
    2 * u * (c[0] - a[0]) + 2 * t * (b[0] - c[0]),
    2 * u * (c[1] - a[1]) + 2 * t * (b[1] - c[1]),
    2 * u * (c[2] - a[2]) + 2 * t * (b[2] - c[2]),
  ]);
}

const hexToRgb = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mixRgb = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/* ---------- DOM helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function setText(id, text) { const e = document.getElementById(id); if (e && e.textContent !== String(text)) e.textContent = text; }
function setWidth(id, frac) { const e = document.getElementById(id); if (e) e.style.width = `${(clamp(frac) * 100).toFixed(1)}%`; }

/* ---------- event bus ---------- */
/** Game events. UI feedback, achievements, statistics, audio and the tutorial
    all subscribe here instead of calling each other directly. */
const EV = Object.freeze({
  NEURON_FIRED: 'NEURON_FIRED',
  SYNAPSE_ACTIVATED: 'SYNAPSE_ACTIVATED',
  CONNECTION_STRENGTHENED: 'CONNECTION_STRENGTHENED',
  CONNECTION_WEAKENED: 'CONNECTION_WEAKENED',
  MYELIN_INCREASED: 'MYELIN_INCREASED',
  MEMORY_ENCODED: 'MEMORY_ENCODED',
  MEMORY_RECALLED: 'MEMORY_RECALLED',
  MEMORY_FAILED: 'MEMORY_FAILED',
  MEMORY_STABILIZED: 'MEMORY_STABILIZED',
  REWARD_TRIGGERED: 'REWARD_TRIGGERED',
  DISTRACTION_OCCURRED: 'DISTRACTION_OCCURRED',
  DISTRACTION_SUPPRESSED: 'DISTRACTION_SUPPRESSED',
  ATTENTION_CAPTURED: 'ATTENTION_CAPTURED',
  SLEEP_REPLAY: 'SLEEP_REPLAY',
  CONSOLIDATION_COMPLETE: 'CONSOLIDATION_COMPLETE',
  PATHWAY_DAMAGED: 'PATHWAY_DAMAGED',
  PATHWAY_REPAIRED: 'PATHWAY_REPAIRED',
  SIGNAL_BLOCKED: 'SIGNAL_BLOCKED',
  CONCEPT_CONNECTED: 'CONCEPT_CONNECTED',
  NEURON_SELECTED: 'NEURON_SELECTED',
  SYNAPSE_SELECTED: 'SYNAPSE_SELECTED',
  GLIA_SELECTED: 'GLIA_SELECTED',
  REGION_SELECTED: 'REGION_SELECTED',
  SIGNAL_FOLLOWED: 'SIGNAL_FOLLOWED',
  CAMERA_ROTATED: 'CAMERA_ROTATED',
  CAMERA_ZOOMED: 'CAMERA_ZOOMED',
  MODE_CHANGED: 'MODE_CHANGED',
  MODE_UNLOCKED: 'MODE_UNLOCKED',
  LEVEL_UP: 'LEVEL_UP',
  MISSION_COMPLETED: 'MISSION_COMPLETED',
  MODE_MASTERED: 'MODE_MASTERED',
  ACHIEVEMENT_UNLOCKED: 'ACHIEVEMENT_UNLOCKED',
  SKILL_STAGE: 'SKILL_STAGE',

class EventBus {
  constructor() { this.handlers = new Map(); }
  on(type, fn) {
    if (!this.handlers.has(type)) this.handlers.set(type, new Set());
    this.handlers.get(type).add(fn);
    return () => this.handlers.get(type)?.delete(fn);
  }
  emit(type, payload = {}) {
    payload.type = type;
    // Demo sandbox events are marked so nothing downstream can mistake them for the player's own.
    if (this.sandbox) { payload.demo = true; if (payload.source === undefined) payload.source = 'demo'; }
    const hs = this.handlers.get(type);
    if (hs) for (const fn of hs) { try { fn(payload); } catch (err) { console.error(`NEURON event handler failed (${type})`, err); } }
    const all = this.handlers.get('*');
    if (all) for (const fn of all) { try { fn(payload); } catch (err) { console.error('NEURON wildcard handler failed', err); } }
    return payload;
  }
}

const GLOSSARY = {
  soma: { title: 'Soma (cell body)', short: 'Integrates the inputs arriving from dendrites. If the combined input crosses a threshold, the neuron fires.', long: 'The soma contains the nucleus and keeps the cell alive. Inputs spread toward it and are summed; near where the axon begins, the neuron “decides” whether to fire an action potential.', game: 'Each neuron sums signed inputs into an activation value that leaks back toward rest. At about 1.0 (game units), it fires.' },
  dendrite: { title: 'Dendrites', short: 'Branching input fibres. Many synapses deliver signals here.', long: 'Dendrites form a tree of inputs. Their shape and the small spines on them change with experience, altering which signals a neuron listens to most.', game: 'Drawn as fine branches. In the model, inputs arrive at the cell directly.' },
  axon: { title: 'Axon', short: 'The output cable that carries action potentials away from the cell body.', long: 'An axon can be very long and may branch to contact many cells. At its terminals it forms synapses.', game: 'Each curved line is an axon branch ending at a synapse. Taper shows direction: thick at the source, thin at the target.' },
  synapse: { title: 'Synapse', short: 'A junction where one neuron influences another cell.', long: 'At most synapses an electrical signal triggers the release of neurotransmitters, which cross a tiny gap and change the receiving cell’s activity. Synapses can strengthen or weaken—this is synaptic plasticity.', game: 'A synapse has a weight (0–1). Brighter, thicker, continuous lines are stronger. Weak synapses look dashed and transmit unreliably.' },
  'action-potential': { title: 'Action potential', short: 'A brief all-or-nothing electrical impulse that travels along the axon.', long: 'When a neuron reaches threshold, voltage-gated ion channels open in sequence and an impulse travels down the axon. Afterwards there is a short refractory period.', game: 'Shown as a glowing pulse. Its travel time depends on connection strength and myelin in this abstraction.' },
  neurotransmitter: { title: 'Neurotransmitter', short: 'A chemical messenger released at synapses (e.g. glutamate, GABA, dopamine).', long: 'Different neurotransmitters and receptors produce excitatory, inhibitory or modulatory effects.', game: 'Represented by the signed influence delivered when a pulse arrives.' },
  excitatory: { title: 'Excitatory', short: 'Makes the receiving cell more likely to fire.', long: 'In the cortex, most excitatory neurons release glutamate.', game: 'Excitatory synapses add to activation. Drawn in the region’s colour.' },
  inhibitory: { title: 'Inhibitory', short: 'Makes the receiving cell less likely to fire.', long: 'Inhibitory interneurons (often releasing GABA) keep activity balanced and shape timing.', game: 'Inhibitory neurons are rose-coloured with a hollow core; their synapses subtract activation.' },
  threshold: { title: 'Threshold', short: 'The level of combined input needed to trigger an action potential.', long: 'Threshold depends on the cell and its recent history.', game: 'About 1.0 in normalised game units (not millivolts).' },
  myelin: { title: 'Myelin', short: 'Insulating sheaths around axons that speed signal conduction.', long: 'Myelin is made by oligodendrocytes in the brain. Gaps between segments (nodes of Ranvier) let the signal jump quickly. Studies suggest experience can influence myelination.', game: 'Practised pathways grow segmented glowing sleeves. More myelin = visibly faster pulses. A simplified representation.' },
  astrocyte: { title: 'Astrocyte', short: 'Star-shaped glial cell that supports neurons and synapses.', long: 'Astrocytes regulate ions and neurotransmitters around synapses, link neurons with blood vessels and help maintain a stable environment.', game: 'Astrocytes drift toward recently active synapses and slowly restore local energy.' },

  glia: { title: 'Glia', short: 'Non-neuronal cells that support and shape neural function.', long: 'Glia include astrocytes, oligodendrocytes and microglia. They are essential partners rather than packing material.', game: 'Three glial types move autonomously and can be inspected.' },
  hippocampus: { title: 'Hippocampus', short: 'Helps form new memories by binding features of an experience.', long: 'Damage to the hippocampus impairs forming new episodic memories. Over time—possibly aided by sleep—some memories become less dependent on it.', game: 'Hippocampal index neurons coordinate the features of new memories and replay them during sleep.' },
