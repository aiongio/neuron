    gl.bindBuffer(gl.ARRAY_BUFFER, this.dendDynBuf); gl.bufferData(gl.ARRAY_BUFFER, this.dendDyn.byteLength, gl.DYNAMIC_DRAW);
  }

  /** Ambient dust and a brain-shaped "glass" envelope, both static instance buffers. */
  buildClouds() {
    const gl = this.gl, cfg = QUALITY[this.game.settings.quality];
    const r = mulberry32(90211);
    const dust = [];
    for (let i = 0; i < cfg.dust; i++) {
      const u = r() * 2 - 1, th = r() * TAU, rad = 6 + Math.pow(r(), 0.6) * 26, s = Math.sqrt(1 - u * u);
      const c = r() < 0.7 ? [0.35, 0.7, 0.75] : [0.55, 0.5, 0.9];
      dust.push(Math.cos(th) * s * rad, u * rad * 0.7, Math.sin(th) * s * rad, c[0], c[1], c[2], 0.12 + r() * 0.3, 0.02 + r() * 0.05, 7, r());
    }
    const env = [];
    const surf = (center, radii, n, fold, keep) => {
      for (let i = 0; i < n; i++) {
        const u = r() * 2 - 1, th = r() * TAU, s = Math.sqrt(1 - u * u);
        let d = [Math.cos(th) * s, u, Math.sin(th) * s];
        const g = 1 + fold * (Math.sin(d[0] * 9 + d[1] * 4) * Math.sin(d[2] * 7 - d[1] * 5) * 0.6 + Math.sin(d[0] * 17 + d[2] * 13) * 0.25);
        const p = [center[0] + d[0] * radii[0] * g, center[1] + d[1] * radii[1] * g, center[2] + d[2] * radii[2] * g];
        if (keep && !keep(p, d)) continue;
        const b = 0.5 + 0.5 * Math.max(0, d[1]);
        env.push(p[0], p[1], p[2], 0.45 * b + 0.2, 0.75 * b + 0.2, 0.8, 0.22 + r() * 0.2, 0.022 + r() * 0.02, 7, r());
      }
    };
    surf([0, 0.55, 0.25], [6.3, 3.65, 3.25], cfg.envelope, 0.045, (p, d) => !(d[1] < -0.55 && d[0] > 0.15));
    surf([3.6, -2.75, -0.1], [2.05, 1.15, 1.95], Math.round(cfg.envelope * 0.22), 0.06, (p) => p[1] < -1.9);
    for (let i = 0; i < cfg.envelope * 0.08; i++) {
      const t = r(), a = r() * TAU, rr = 0.55 + r() * 0.1;
      const c = V3.lerp([1.7, -1.6, -0.2], [1.25, -4.6, -0.3], t);
      env.push(c[0] + Math.cos(a) * rr, c[1], c[2] + Math.sin(a) * rr, 0.35, 0.55, 0.7, 0.22, 0.022, 7, r());
    }
    if (!this.dustBuf) { this.dustBuf = gl.createBuffer(); this.envBuf = gl.createBuffer(); }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dustBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(dust), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.envBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(env), gl.STATIC_DRAW);
    this.dustCount = dust.length / 10; this.envCount = env.length / 10;
  }

  /** BRAIN-scale tracts: aggregate inter-region synapses into bundles. */
  buildTracts() {
    const sim = this.simRef, map = new Map();
    for (const s of sim.synapses) {
      const ra = s.source.region, rb = s.target.region;
      if (ra === rb) continue;
      const key = ra.index < rb.index ? `${ra.id}|${rb.id}` : `${rb.id}|${ra.id}`;
      if (!map.has(key)) map.set(key, { a: ra.index < rb.index ? ra : rb, b: ra.index < rb.index ? rb : ra, syns: [] });
      map.get(key).syns.push(s);
    }
    const chainPairs = new Set();
    for (let i = 0; i < BRAIN_CHAIN.length - 1; i++) chainPairs.add([BRAIN_CHAIN[i], BRAIN_CHAIN[i + 1]].sort().join('|'));
    this.tracts = [...map.values()].map((t) => {
      const mid = V3.lerp(t.a.center, t.b.center, 0.5);
      const out = V3.norm(V3.sub(mid, [0, 0.3, 0]));
      const ctrl = V3.add(mid, V3.scale(out, 0.9 + V3.dist(t.a.center, t.b.center) * 0.12));
      return { ...t, ctrl, chain: chainPairs.has([t.a.id, t.b.id].sort().join('|')), traffic: 0 };
    });
  }

  /* ---------- per-frame dynamic data ---------- */
  packRGBA(r, g, b, a) { return ((clamp(r) * 255) | 0) | (((clamp(g) * 255) | 0) << 8) | (((clamp(b) * 255) | 0) << 16) | ((((clamp(a) * 255) | 0) << 24) >>> 0); }

  updateEdgeState(decor) {
    const sim = this.simRef, syns = sim.synapses, dyn = this.edgeDyn, VPE = this.edgeVPE;
    const fade = (1 - 0.8 * this.brainT) * (1 - 0.72 * this.buildT);
    const region = decor.focusRegion, dim = decor.dim;
    for (let e = 0; e < this.edgeCount; e++) {
      const s = syns[e];
      let state = 0, color = 0;
      if (s.enabled) {
        const a = s.source, b = s.target;
        const hiInfo = decor.hiSynapses.get(s);
        let rgb = a.type === 'inhibitory' ? INHIB_RGB : a.region.rgb;
        let hi = 0;
        if (hiInfo) { rgb = mixRgb(rgb, hiInfo.rgb, 0.75); hi = hiInfo.level; }
        if (s.rewardGlow > 0) rgb = mixRgb(rgb, [1, 0.8, 0.4], s.rewardGlow * 0.6);
        const damaged = b.health <= 0 || a.health <= 0;
        let alpha = (a.recruited && b.recruited) || hiInfo ? 1 : 0.16;
        if (region && a.region !== region && b.region !== region && !hiInfo) alpha *= 0.22;
        if (dim > 0 && !hiInfo) alpha *= 1 - dim;
        if (s.associatedMemory && !hiInfo) alpha *= 0.5;
        alpha *= fade;
        const act = Math.min(1, s.recentActivity);
        state = this.packRGBA(s.weight, act, this.game.settings.myelin ? s.myelinLevel : 0, damaged ? 1 : Math.min(0.98, hi));
        color = this.packRGBA(rgb[0], rgb[1], rgb[2], alpha);
      }
      const o = e * VPE * 2;
      for (let k = 0; k < VPE; k++) { dyn[o + k * 2] = state; dyn[o + k * 2 + 1] = color; }
    }
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.edgeDynBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn);
  }

  updateDendriteState(decor) {
    const sim = this.simRef, dyn = this.dendDyn, ranges = this.dendRanges;
    const fade = (1 - 0.85 * this.brainT) * (1 - 0.75 * this.buildT) * (0.6 + 0.9 * this.microT);
    const region = decor.focusRegion, dim = decor.dim;
    for (let i = 0; i < ranges.length; i++) {
      const n = sim.neurons[i];
      const hiInfo = decor.hiNeurons.get(n);
      let rgb = n.type === 'inhibitory' ? INHIB_RGB : n.region.rgb;
      if (hiInfo) rgb = mixRgb(rgb, hiInfo.rgb, 0.6);
      let alpha = n.recruited || hiInfo ? 1 : 0.18;
      if (region && n.region !== region && !hiInfo) alpha *= 0.25;
      if (dim > 0 && !hiInfo) alpha *= 1 - dim;
      if (n.health <= 0) { rgb = [0.5, 0.45, 0.5]; alpha *= 0.5; }
      const state = this.packRGBA(0, Math.min(1, n.flash + (hiInfo ? 0.25 : 0)), 0, 0);
      const color = this.packRGBA(rgb[0], rgb[1], rgb[2], alpha * fade);
      const [a, b] = ranges[i];
      for (let k = a; k < b; k++) { dyn[k * 2] = state; dyn[k * 2 + 1] = color; }
    }
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dendDynBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn);
  }

  /* ---------- sprite & dynamic-ribbon batching ---------- */
  sprite(x, y, z, r, g, b, a, size, kind, param = 0) {
    if (this.spriteN >= this.spriteCap) return;
    const o = this.spriteN * 10, d = this.spriteData;
    d[o] = x; d[o + 1] = y; d[o + 2] = z; d[o + 3] = r; d[o + 4] = g; d[o + 5] = b; d[o + 6] = a; d[o + 7] = size; d[o + 8] = kind; d[o + 9] = param;
    this.spriteN++;
  }
  ribbon(points, rgb, alpha, width, flow = 0) {
    if (points.length < 2) return;
    const d = this.dynData;
    const start = this.dynV;
    if (start + points.length * 2 >= this.dynCap) return;
    let acc = 0;
    for (let i = 0; i < points.length; i++) {
      const p = points[i], q = points[Math.min(i + 1, points.length - 1)], pr = points[Math.max(i - 1, 0)];
      if (i > 0) acc += V3.dist(points[i - 1], p);
      const tan = V3.norm(V3.sub(q, pr));
      for (const side of [-1, 1]) {
        const o = this.dynV * 14;
        d[o] = p[0]; d[o + 1] = p[1]; d[o + 2] = p[2]; d[o + 3] = tan[0]; d[o + 4] = tan[1]; d[o + 5] = tan[2];
        d[o + 6] = side; d[o + 7] = acc; d[o + 8] = rgb[0]; d[o + 9] = rgb[1]; d[o + 10] = rgb[2]; d[o + 11] = alpha; d[o + 12] = width; d[o + 13] = flow;
        this.dynV++;
      }
    }
    for (let i = 0; i < points.length - 1; i++) {
      const i0 = start + i * 2, k = this.dynI;
      this.dynIdx[k] = i0; this.dynIdx[k + 1] = i0 + 1; this.dynIdx[k + 2] = i0 + 2;
      this.dynIdx[k + 3] = i0 + 1; this.dynIdx[k + 4] = i0 + 3; this.dynIdx[k + 5] = i0 + 2;
      this.dynI += 6;
    }
  }
  curve(a, c, b, n = 12) { const out = []; for (let i = 0; i <= n; i++) out.push(bezier(a, c, b, i / n)); return out; }

  addRing(pos, rgb, size = 1) { if (this.rings.length < 60) this.rings.push({ pos: pos.slice(), rgb, size, t: 0, dur: 1.4 }); }
  pulseFog(v) { this.fogPulse = Math.min(1.5, this.fogPulse + v); }

  /* ---------- frame ---------- */
  render(dt, decor) {
    if (!this.ready) return;
    const g = this.game, gl = this.gl, sim = this.simRef, cam = g.camera, set = g.settings, cfg = QUALITY[set.quality];
    if (!sim) return;
    if (sim.geometryVersion !== this.geomVersion) this.buildEdges();
    this.frame++;
    const t = performance.now() / 1000 % 1000;
    const dist = cam.viewDistance;
    const sdist = cam.scaleDistance;
    this.brainT = damp(this.brainT, smoothstep(17, 25, sdist), 6, dt);
    this.microT = damp(this.microT, 1 - smoothstep(3.2, 6.5, sdist), 6, dt);
    this.dreamT = damp(this.dreamT, g.sleep.active ? 1 : 0, 1.5, dt);
    this.buildT = damp(this.buildT, g.modeId === 'build' ? 1 : 0, 3, dt);
    this.fogPulse = Math.max(0, this.fogPulse - dt * 0.8);
    for (const r of this.rings) r.t += dt / r.dur;
    this.rings = this.rings.filter((r) => r.t < 1);

    this.updateEdgeState(decor);
    if (this.frame % 2 === 0 || this.frame < 3) this.updateDendriteState(decor);

    // ---------- scene pass ----------
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.scene.fb);
    gl.viewport(0, 0, this.w, this.h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    const additive = () => gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ZERO, gl.ONE);
    const over = () => gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const fogStart = Math.max(6, dist * 0.9), fogDensity = 0.055;
    additive();

    // static clouds
    const sp = this.progs.sprite;
    const spriteUniforms = (alphaMul, drift, minPx) => {
      gl.useProgram(sp.p);
      gl.uniformMatrix4fv(sp.u.uVP, false, cam.vp);
      gl.uniform2f(sp.u.uProj, cam.proj[0], cam.proj[5]);
      gl.uniform2f(sp.u.uRes, this.w, this.h);
      gl.uniform1f(sp.u.uMinPx, minPx * this.dpr);
      gl.uniform1f(sp.u.uTime, t);
      gl.uniform1f(sp.u.uDrift, drift);
      gl.uniform1f(sp.u.uFogStart, fogStart + 8); gl.uniform1f(sp.u.uFogDensity, fogDensity * 0.5);
      gl.uniform1f(sp.u.uAlphaMul, alphaMul);
    };
    const drawSprites = (buf, first, count) => {
      if (count <= 0) return;
      this.attribs(sp, [
        { name: 'aCorner', buf: this.corners, size: 2, stride: 8, offset: 0 },
        { name: 'aCenter', buf, size: 3, stride: 40, offset: first * 40, div: 1 },
        { name: 'aColor', buf, size: 4, stride: 40, offset: first * 40 + 12, div: 1 },
        { name: 'aMisc', buf, size: 3, stride: 40, offset: first * 40 + 28, div: 1 },
      ]);
      this.drawInst(gl.TRIANGLES, 0, 6, count);
    };
    spriteUniforms(set.motion ? 1 : 0.8, set.motion ? 0.6 : 0, 1.2);
    drawSprites(this.dustBuf, 0, this.dustCount);
    spriteUniforms((0.55 + 1.6 * this.brainT) * (1 - 0.4 * this.dreamT), 0, 1.1);
    drawSprites(this.envBuf, 0, this.envCount);

    // dynamic sprites, three groups
    this.spriteN = 0;
    const underStart = 0;
    this.buildUnderSprites(decor);
    const underEnd = this.spriteN;
    this.buildBodySprites(decor);
    const bodyEnd = this.spriteN;
    this.buildOverSprites(decor);
    const overEnd = this.spriteN;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.spriteBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.spriteData.subarray(0, this.spriteN * 10));

    spriteUniforms(1, 0, 1.5);
    gl.uniform1f(sp.u.uFogStart, fogStart); gl.uniform1f(sp.u.uFogDensity, fogDensity);
    drawSprites(this.spriteBuf, underStart, underEnd - underStart);

    // ribbons: dendrites, synapses, myelin
    const rb = this.progs.ribbon;
    gl.useProgram(rb.p);
    gl.uniformMatrix4fv(rb.u.uVP, false, cam.vp);
    gl.uniform2f(rb.u.uRes, this.w, this.h);
    gl.uniform1f(rb.u.uDpr, this.dpr);
    gl.uniform1f(rb.u.uTime, t);
    gl.uniform1f(rb.u.uFogStart, fogStart); gl.uniform1f(rb.u.uFogDensity, fogDensity);
    const ribbonAttribs = (stat, dynb) => this.attribs(rb, [
      { name: 'aPos', buf: stat, size: 3, stride: 40, offset: 0 },
      { name: 'aTan', buf: stat, size: 3, stride: 40, offset: 12 },
      { name: 'aSU', buf: stat, size: 2, stride: 40, offset: 24 },
      { name: 'aWL', buf: stat, size: 2, stride: 40, offset: 32 },
      { name: 'aState', buf: dynb, size: 4, type: gl.UNSIGNED_BYTE, norm: true, stride: 8, offset: 0 },
      { name: 'aColor', buf: dynb, size: 4, type: gl.UNSIGNED_BYTE, norm: true, stride: 8, offset: 4 },
    ]);
    const idxType = this.uintIndex ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
    if (this.dendIndexCount) {
      gl.uniform1f(rb.u.uMode, 1);
      ribbonAttribs(this.dendStatic, this.dendDynBuf);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.dendIdx);
      gl.drawElements(gl.TRIANGLES, this.dendIndexCount, idxType, 0);
    }
    gl.uniform1f(rb.u.uMode, 0);
    ribbonAttribs(this.edgeStatic, this.edgeDynBuf);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.edgeIdx);
    gl.drawElements(gl.TRIANGLES, this.edgeIndexCount, idxType, 0);
    if (set.myelin) { gl.uniform1f(rb.u.uMode, 2); gl.drawElements(gl.TRIANGLES, this.edgeIndexCount, idxType, 0); }

    // dynamic ribbons (glia processes, tracts, concept links, previews, follow path)
    this.dynV = 0; this.dynI = 0;
    this.buildDynamicRibbons(decor);
    if (this.dynI > 0) {
      const dp = this.progs.dyn;
      gl.useProgram(dp.p);
      gl.uniformMatrix4fv(dp.u.uVP, false, cam.vp);
      gl.uniform2f(dp.u.uRes, this.w, this.h);
      gl.uniform1f(dp.u.uDpr, this.dpr);
      gl.uniform1f(dp.u.uTime, t);
      gl.uniform1f(dp.u.uFogStart, fogStart); gl.uniform1f(dp.u.uFogDensity, fogDensity);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuf);
      gl.bufferData(gl.ARRAY_BUFFER, this.dynData.subarray(0, this.dynV * 14), gl.STREAM_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.dynIdxBuf);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, this.dynIdx.subarray(0, this.dynI), gl.STREAM_DRAW);
      this.attribs(dp, [
        { name: 'aPos', buf: this.dynBuf, size: 3, stride: 56, offset: 0 },
        { name: 'aTan', buf: this.dynBuf, size: 3, stride: 56, offset: 12 },
        { name: 'aSU', buf: this.dynBuf, size: 2, stride: 56, offset: 24 },
        { name: 'aColor', buf: this.dynBuf, size: 4, stride: 56, offset: 32 },
        { name: 'aWF', buf: this.dynBuf, size: 2, stride: 56, offset: 48 },
      ]);
      gl.drawElements(gl.TRIANGLES, this.dynI, idxType, 0);
    }

    // bodies (alpha) then over (additive)
    over();
    spriteUniforms(1, 0, 2.2);
    gl.uniform1f(sp.u.uFogStart, fogStart); gl.uniform1f(sp.u.uFogDensity, fogDensity);
    drawSprites(this.spriteBuf, underEnd, bodyEnd - underEnd);
    additive();
    gl.uniform1f(sp.u.uMinPx, 1.6 * this.dpr);
    drawSprites(this.spriteBuf, bodyEnd, overEnd - bodyEnd);

    // ---------- bloom ----------
    const bloomLevels = cfg.bloom;
    gl.disable(gl.BLEND);
    if (bloomLevels > 0) {
      this.pass(this.progs.bright, this.b1a, { uTex: this.scene.tex }, { uTexel: [1 / this.w, 1 / this.h], uThreshold: this.hdr ? 0.55 : 0.42 });
      this.pass(this.progs.blur, this.b1b, { uTex: this.b1a.tex }, { uDir: [1.4 / this.b1a.w, 0] });
      this.pass(this.progs.blur, this.b1a, { uTex: this.b1b.tex }, { uDir: [0, 1.4 / this.b1a.h] });
      if (bloomLevels > 1) {
        this.pass(this.progs.bright, this.b2a, { uTex: this.b1a.tex }, { uTexel: [1 / this.b1a.w, 1 / this.b1a.h], uThreshold: 0 });
        this.pass(this.progs.blur, this.b2b, { uTex: this.b2a.tex }, { uDir: [1.6 / this.b2a.w, 0] });
        this.pass(this.progs.blur, this.b2a, { uTex: this.b2b.tex }, { uDir: [0, 1.6 / this.b2a.h] });
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.b2a.fb); gl.viewport(0, 0, this.b2a.w, this.b2a.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      }
    } else if (!this.bloomCleared) {
      for (const tg of [this.b1a, this.b2a]) { gl.bindFramebuffer(gl.FRAMEBUFFER, tg.fb); gl.viewport(0, 0, tg.w, tg.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
    }
    this.bloomCleared = bloomLevels === 0;

    // ---------- composite ----------
    const center = cam.project([0, 0.3, 0]) || { x: cam.width / 2, y: cam.height / 2 };
    this.pass(this.progs.composite, null, { uScene: this.scene.tex, uBloom1: this.b1a.tex, uBloom2: this.b2a.tex }, {
      uRes: [this.w, this.h], uTime: t, uDream: this.dreamT, uNebula: cfg.nebula ? 1 : 0,
      uCenter: [center.x / cam.width, 1 - center.y / cam.height], uParallax: [cam.yaw * 0.15, cam.pitch * 0.15],
      uBloomK: bloomLevels > 0 ? 0.85 + this.dreamT * 0.35 : 0, uHdr: this.hdr ? 1 : 0, uExposure: 1.35, uGrain: set.motion ? 0.012 : 0.006,
      uPulse: this.fogPulse, uAccent: [0, 0, 0],
    });
  }

  pass(prog, target, textures, uniforms) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    gl.viewport(0, 0, target ? target.w : this.w, target ? target.h : this.h);
    gl.useProgram(prog.p);
    let unit = 0;
    for (const [name, tex] of Object.entries(textures)) {
      gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
      if (prog.u[name]) gl.uniform1i(prog.u[name], unit);
      unit++;
    }
    for (const [name, v] of Object.entries(uniforms)) {
      const loc = prog.u[name];
      if (!loc) continue;
      if (Array.isArray(v)) { if (v.length === 2) gl.uniform2f(loc, v[0], v[1]); else gl.uniform3f(loc, v[0], v[1], v[2]); }
      else gl.uniform1f(loc, v);
    }
    this.attribs(prog, [{ name: 'aPos', buf: this.quad, size: 2, stride: 8, offset: 0 }]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.activeTexture(gl.TEXTURE0);
  }

  /* ---------- sprite builders ---------- */
  buildUnderSprites(decor) {
    const sim = this.simRef, g = this.game, set = g.settings;
    const nFade = (1 - 0.7 * this.brainT) * (1 - 0.7 * this.buildT);
    // region blobs at BRAIN scale
    if (this.brainT > 0.02) {
      for (const r of sim.regions) {
        const sz = (r.radii[0] + r.radii[1] + r.radii[2]) / 3 * 2.1;
        const sel = decor.focusRegion === r ? 0.35 : 0;
        this.sprite(r.center[0], r.center[1], r.center[2], r.rgb[0], r.rgb[1], r.rgb[2], this.brainT * (0.22 + r.activity * 1.4 + sel), sz, 8, r.index * 0.13);
      }
    }
    // neuron halos
    for (const n of sim.neurons) {
      const hiInfo = decor.hiNeurons.get(n);
      if (!n.recruited && !hiInfo) continue;
      let rgb = n.type === 'inhibitory' ? INHIB_RGB : n.region.rgb;
      if (hiInfo) rgb = mixRgb(rgb, hiInfo.rgb, 0.7);
      let a = (0.1 + n.flash * 0.9 + n.recruitGlow * 0.8 + (hiInfo ? 0.25 * hiInfo.level : 0)) * nFade;
      if (decor.focusRegion && n.region !== decor.focusRegion && !hiInfo) a *= 0.3;
      if (decor.dim && !hiInfo) a *= 1 - decor.dim;
      if (n.health <= 0) continue;
      if (a < 0.02) continue;
      const f = set.motion ? n.flash : Math.min(n.flash, 0.6);
      this.sprite(n.position[0], n.position[1], n.position[2], rgb[0], rgb[1], rgb[2], a, n.size * (3.6 + f * 2.4 + (hiInfo ? 1 : 0)), 0);
    }
    // boutons on strong / highlighted synapses (visible closer in)
    const bout = (0.25 + 0.75 * this.microT) * nFade;
    if (bout > 0.05) {
      const tmp = [0, 0, 0];
      for (const s of sim.synapses) {
        if (!s.enabled) continue;
        const hiInfo = decor.hiSynapses.get(s);
        if (s.weight < 0.5 && !hiInfo) continue;
        if (!s.target.recruited && !hiInfo) continue;
        if (decor.dim && !hiInfo) continue;
        s.pointAt(0.93, tmp);
        const rgb = hiInfo ? hiInfo.rgb : s.effectType === 'inhibitory' ? INHIB_RGB : s.source.region.rgb;
        this.sprite(tmp[0], tmp[1], tmp[2], rgb[0], rgb[1], rgb[2], bout * (0.35 + 0.6 * s.recentActivity + 0.3 * s.weight), 0.045 + 0.03 * s.weight, 9);
      }
    }
    // distractor / special orbs (glow)
    for (const o of decor.orbs) this.sprite(o.pos[0], o.pos[1], o.pos[2], o.rgb[0], o.rgb[1], o.rgb[2], o.alpha * 0.8, o.size * 3, 0);
  }

  buildBodySprites(decor) {
    const sim = this.simRef, g = this.game, cam = g.camera;
    const nFade = (1 - 0.65 * this.brainT) * (1 - 0.65 * this.buildT);
    const fwd = cam.forward(), eye = cam.eye;
    const list = [];
    for (const n of sim.neurons) {
      const d = (n.position[0] - eye[0]) * fwd[0] + (n.position[1] - eye[1]) * fwd[1] + (n.position[2] - eye[2]) * fwd[2];
      list.push([d, n]);
    }
    list.sort((a, b) => b[0] - a[0]);
    for (const [, n] of list) {
      const hiInfo = decor.hiNeurons.get(n);
      let rgb = n.type === 'inhibitory' ? mixRgb(n.region.rgb, INHIB_RGB, 0.65) : n.region.rgb;
      if (hiInfo) rgb = mixRgb(rgb, hiInfo.rgb, 0.55);
      let a = (n.recruited || hiInfo ? 0.95 : 0.2) * nFade;
      if (decor.focusRegion && n.region !== decor.focusRegion && !hiInfo) a *= 0.35;
      if (decor.dim && !hiInfo) a *= 1 - decor.dim * 0.85;
      const lit = Math.min(1, n.flash + n.recruitGlow * 0.6);
      rgb = mixRgb(rgb, [1, 1, 0.97], lit * 0.5);
      let kind = n.type === 'inhibitory' ? 11 : 1;
      let size = n.size * (n.recruited ? 1 : 0.75) * (1 + lit * 0.25) * (hiInfo ? 1.18 : 1);
      if (n.health <= 0) { kind = 12; rgb = [0.6, 0.55, 0.6]; a = Math.max(a, 0.7 * nFade); }
      if (n.selected) size *= 1.35;
      this.sprite(n.position[0], n.position[1], n.position[2], rgb[0], rgb[1], rgb[2], a, size, kind, (n.seed % 1000) / 1000);
    }
    if (g.settings.glia) {
      const gFade = (1 - 0.8 * this.brainT) * (1 - 0.8 * this.buildT);
      for (const gc of sim.glia) {
        const c = gc.type === 'astrocyte' ? [0.55, 0.78, 0.9] : gc.type === 'oligodendrocyte' ? [0.85, 0.88, 0.72] : [0.78, 0.66, 0.92];
        const kind = gc.type === 'astrocyte' ? 2 : gc.type === 'oligodendrocyte' ? 3 : 4;
        const sel = g.selection?.type === 'glia' && g.selection.obj === gc;
        this.sprite(gc.position[0], gc.position[1], gc.position[2], c[0], c[1], c[2], (sel ? 1 : 0.72) * gFade, gc.size * (sel ? 1.5 : 1), kind, gc.phase);
      }
    }
    // concept nodes (Build) — shown with the knowledge layer
    if (this.buildT > 0.02) {
      const kn = g.knowledge;
      const frontier = new Set(kn.available().flatMap((r) => [r.a, r.b]));
      for (const c of CONCEPTS) {
        const placed = kn.placed.has(c.id);
        if (!placed && !frontier.has(c.id)) continue;
        const p = kn.pos[c.id];
        const sel = kn.selected === c.id;
        const conn = placed && (c.root || kn.degree(c.id) > 0);
        const rgb = !placed ? [0.4, 0.42, 0.45] : conn ? [1, 0.84, 0.52] : [1, 0.7, 0.35];
        this.sprite(p[0], p[1], p[2], rgb[0], rgb[1], rgb[2], this.buildT * (placed ? 1 : 0.35), (c.root ? 0.42 : 0.3) * (sel ? 1.3 : 1), 10);
      }
    }
  }

  buildOverSprites(decor) {
    const sim = this.simRef, g = this.game, set = g.settings;
    const tmp = [0, 0, 0];
    const trail = set.motion ? QUALITY[set.quality].trail : 1;
    const sFade = (1 - 0.6 * this.brainT) * (1 - 0.55 * this.buildT);
    for (const s of sim.signals) {
      const syn = s.synapse;
      const col = s.sign < 0 && (s.kind === 'normal' || s.kind === 'driven') ? INHIB_RGB : PULSE_COLORS[s.kind] || PULSE_COLORS.normal;
      const strong = syn.weight;
      const speed = 1 / Math.max(0.15, s.duration);
      const size = (0.05 + 0.04 * strong) * (s.visualOnly ? 0.9 : 1) * (g.followSignal === s ? 1.8 : 1);
      const vis = (syn.source.recruited || s.driven || s.kind !== 'normal') ? 1 : 0.35;
      for (let k = 0; k < trail; k++) {
        const tt = s.t - k * (0.035 + 0.05 * Math.min(1, speed * 0.4));
        if (tt < 0) break;
        syn.pointAt(Math.min(1, tt), tmp);
        const fall = 1 - k / (trail + 0.5);
        this.sprite(tmp[0], tmp[1], tmp[2], col[0], col[1], col[2], (0.55 + 0.45 * strong) * fall * vis * sFade, size * (k === 0 ? 1.25 : 0.8 * fall), k === 0 ? 6 : 0);
      }
    }
    for (const r of this.rings) {
      const k = easeInOut(r.t);
      this.sprite(r.pos[0], r.pos[1], r.pos[2], r.rgb[0], r.rgb[1], r.rgb[2], (1 - r.t) * 0.9, r.size * (0.2 + k * 0.9), 5, r.t);
    }
    for (const rg of decor.rings) {
      const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 300 + (rg.phase || 0));
      this.sprite(rg.pos[0], rg.pos[1], rg.pos[2], rg.rgb[0], rg.rgb[1], rg.rgb[2], (rg.alpha ?? 0.8) * pulse, rg.size, rg.kind ?? 5, rg.param ?? 0.6);
    }
    for (const o of decor.orbs) this.sprite(o.pos[0], o.pos[1], o.pos[2], o.rgb[0], o.rgb[1], o.rgb[2], o.alpha, o.size, 6);
    // selected neuron ring
    const sel = g.selection;
    if (sel && sel.type === 'neuron') {
      const n = sel.obj;
      this.sprite(n.position[0], n.position[1], n.position[2], 0.85, 1, 0.95, 0.9, n.size * 3.2, 5, 0.7);
    }
  }

  buildDynamicRibbons(decor) {
    const sim = this.simRef, g = this.game, tmp = [0, 0, 0];
    // glial processes
    if (g.settings.glia && this.brainT < 0.9) {
      const gf = (1 - this.brainT) * (1 - this.buildT * 0.8);
      for (const gc of sim.glia) {
        const c = gc.type === 'astrocyte' ? [0.5, 0.75, 0.9] : gc.type === 'oligodendrocyte' ? [0.9, 0.9, 0.75] : [0.75, 0.62, 0.92];
        const targets = gc.focusSynapses.length ? gc.focusSynapses.map((s) => s.pointAt(gc.type === 'astrocyte' ? 0.86 : 0.5, [0, 0, 0])) : [];
        if (gc.focusNeuron) targets.push(gc.focusNeuron.position);
        for (const p of targets.slice(0, 4)) {
          const mid = V3.add(V3.lerp(gc.position, p, 0.5), [0, 0.12, 0]);
          this.ribbon(this.curve(gc.position, mid, p, 6), c, 0.22 * gf, 1.3, 0);
        }
        if (!targets.length) {
          const r = mulberry32(gc.id * 77 + 5);
          for (let k = 0; k < 4; k++) {
            const d = V3.norm([r() - 0.5, r() - 0.5, r() - 0.5]);
            const tip = V3.add(gc.position, V3.scale(d, 0.25 + r() * 0.2));
            this.ribbon([gc.position, V3.lerp(gc.position, tip, 0.6), tip], c, 0.14 * gf, 1, 0);
          }
        }
      }
    }
    // BRAIN-scale tracts and chain
    if (this.brainT > 0.02 && this.tracts) {
      for (const tr of this.tracts) {
        let traffic = 0;
        for (const s of tr.syns) traffic += s.recentActivity;
        tr.traffic = damp(tr.traffic, Math.min(1, traffic / Math.max(2, tr.syns.length * 0.25)), 3, 1 / 60);
        const rgb = mixRgb(tr.a.rgb, tr.b.rgb, 0.5);
        const w = (tr.chain ? 14 : 7) + 10 * tr.traffic;
        this.ribbon(this.curve(tr.a.center, tr.ctrl, tr.b.center, 16), tr.chain ? mixRgb(rgb, [1, 0.95, 0.85], 0.4) : rgb, this.brainT * (tr.chain ? 0.6 : 0.22) * (0.65 + tr.traffic), w, tr.chain ? 0.6 : 0.25);
      }
    }
    // knowledge links (Build)
    if (this.buildT > 0.02) {
      const kn = g.knowledge, now = performance.now();
      for (const [id] of kn.links) {
        const r = RELATIONS[id];
        const a = kn.pos[r.a], b = kn.pos[r.b];
        const mid = V3.add(V3.lerp(a, b, 0.5), [0, 0.35, 0]);
        const fresh = kn.linkAnim.has(id) ? clamp(1 - (now - kn.linkAnim.get(id)) / 2500) : 0;
        const onPath = decor.knowledgePath && decor.knowledgePath.has(id);
        this.ribbon(this.curve(a, mid, b, 10), onPath ? [1, 0.95, 0.7] : [1, 0.8, 0.45], this.buildT * (0.4 + fresh * 0.6 + (onPath ? 0.4 : 0)), 3 + fresh * 4 + (onPath ? 2 : 0), 0.5);
      }
      if (kn.question && !kn.question.answered) {
        const r = kn.question.rel;
        const a = kn.pos[r.a], b = kn.pos[r.b];
        this.ribbon(this.curve(a, V3.add(V3.lerp(a, b, 0.5), [0, 0.35, 0]), b, 10), [0.7, 0.75, 0.8], this.buildT * 0.35, 2, 1.2);
      }
    }
    for (const rb of decor.ribbons) this.ribbon(rb.points, rb.rgb, rb.alpha, rb.width, rb.flow || 0);
  }
}
/* ==========================================================================
   UI MANAGER
   DOM is rebuilt only for "dirty" parts (at most once per frame); live
   numbers update by id at ~8 Hz; 3D-anchored labels move every frame with
   transforms. Every interactive element uses data-action and is routed
   through Game.action(), so controls stay consistent and testable.
   ========================================================================== */
const term = (key, text) => `<span class="term" data-term="${key}" tabindex="0">${text}</span>`;
const meter = (label, value, id, o = {}) => `<div class="meter-row"${o.color ? ` style="--mc:${o.color}"` : ''}><div class="row"><span>${label}</span><span><b id="${id}">${o.text ?? pct(value)}</b>${o.delta ? `<span class="delta" style="color:${o.deltaColor || 'var(--good)'}">${o.delta}</span>` : ''}</span></div><div class="meter${o.thin ? ' thin' : ''}"><i id="${id}Bar" style="width:${(clamp(value) * 100).toFixed(1)}%"></i>${o.mark != null ? `<span class="mark" style="left:${(clamp(o.mark) * 100).toFixed(1)}%" title="${esc(o.markTitle || '')}"></span>` : ''}</div></div>`;
const kv = (rows) => `<div class="kv">${rows.map(([k, v, id]) => `<span>${k}</span><b${id ? ` id="${id}"` : ''}>${v}</b>`).join('')}</div>`;
const science = (sci, game) => `<div class="science"><div><span class="lab sci">${icon('flask', 'sm')}Science</span><span>${sci}</span></div><div><span class="lab game">${icon('gamepad', 'sm')}In this game</span><span>${game}</span></div></div>`;
const stepsList = (items) => `<div class="steps">${items.map((s, i) => `<div class="step ${s.done ? 'done' : s.now ? 'now' : ''}"><span class="n">${s.done ? '✓' : i + 1}</span><span>${s.text}</span></div>`).join('')}</div>`;
const metric = (k, v, id, s = '') => `<div class="metric"><div class="k">${k}</div><div class="v" id="${id}">${v}</div>${s ? `<div class="s"${id ? ` id="${id}S"` : ''}>${s}</div>` : ''}</div>`;
const btn = (action, label, o = {}) => `<button class="btn${o.cls ? ' ' + o.cls : ''}" data-action="${action}"${o.data ? Object.entries(o.data).map(([k, v]) => ` data-${k}="${esc(v)}"`).join('') : ''}${o.disabled ? ' disabled' : ''}${o.title ? ` title="${esc(o.title)}"` : ''}${o.aria ? ` aria-label="${esc(o.aria)}"` : ''}>${o.icon ? icon(o.icon) : ''}${label}${o.kbd ? `<span class="kbd">${o.kbd}</span>` : ''}</button>`;

class UIManager {
  constructor(game) {
    this.game = game;
    this.dirty = new Set(['top', 'dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags', 'sel']);
    this.panelTab = 'mode';
    this.floaters = [];
    this.tagEls = new Map();
    this.liveTimer = 0;
    this.lastPanelKey = '';
    this.modal = null; this.modalReturn = null; this.modalWasPaused = false;
    this.tipTarget = null;
    this.mbHeight = 0;
    this.journalItems = [];
    this.headTimer = 0;
    this.unsub = [];
    this.el = {
      app: $('#app'), labels: $('#labels'), floaters: $('#floaters'), overlay: $('#modeOverlay'), top: $('#topbar'), stats: $('#statStrip'),
      complexity: $('#complexityBtn'), pause: $('#pauseBtn'), step: $('#stepBtn'), speed: $('#speedGroup'), sound: $('#soundBtn'),
      edu: $('#eduBtn'), settings: $('#settingsBtn'), dock: $('#modeDock'), head: $('#modeHead'), kicker: $('#modeKicker'), title: $('#modeTitle'),
      sub: $('#modeSub'), sel: $('#selChip'), tools: $('#viewTools'), bar: $('#missionBar'), panel: $('#panel'), panelBody: $('#panelBody'),
      panelOpen: $('#panelOpen'), journal: $('#journal'), clock: $('#clock'), toasts: $('#toasts'), tooltip: $('#tooltip'), modalRoot: $('#modalRoot'), sr: $('#srLive'),
    };
    this.el.edu.innerHTML = icon('book');
    this.el.settings.innerHTML = icon('settings');
    this.el.step.innerHTML = icon('step');
    this.el.panelOpen.innerHTML = `${icon('panel')}<span>Panel</span>`;
    $('[data-action="panel-close"]').innerHTML = icon('chevron');
    this.buildRegionLabels();
    this.bindTooltips();
  }

  markDirty(...parts) { for (const p of parts) this.dirty.add(p); }

  /* ---------- event feedback ---------- */
  bindBus(bus) {
    const g = this.game;
    const on = (t, f) => bus.on(t, f);
    on(EV.ACHIEVEMENT_UNLOCKED, (e) => { this.toast(`<b>Achievement · ${esc(e.achievement.name)}</b>${esc(e.achievement.desc)}`, 'good', 'trophy', true); g.audio.success(); this.journal(`Achievement: ${e.achievement.name}`); this.markDirty('top'); });
    on(EV.LEVEL_UP, (e) => { this.toast(`<b>Neural complexity · Level ${e.level}</b>${esc(e.def.name)} — ${esc(e.def.desc)}`, 'good', 'brain', true); this.journal(`Level ${e.level}: ${e.def.name}`); this.announce(`Level up: ${e.def.name}`); this.markDirty('top', 'dock'); g.audio.reward(0.8); });
    on(EV.MODE_UNLOCKED, (e) => { const m = MODE_BY_ID[e.mode]; if (!m) return; setTimeout(() => this.toast(`<b>New mode unlocked · ${m.name}</b>Press ${m.n} or choose it in the dock.`, 'good', m.id, true), 900); this.freshMode = m.id; this.markDirty('dock'); });
    on(EV.MISSION_COMPLETED, (e) => { this.toast(`<b>Mission complete · ${esc(e.mission?.name || e.id)}</b>${e.id === 'word' ? 'CONCEPT INTEGRATED — three retrieval routes now lead to its meaning.' : 'The network has visibly changed. Explore it, or continue.'}`, 'good', 'check', true); this.journal(`Mission complete: ${e.mission?.name || e.id}`); this.markDirty('panel', 'bar', 'tags'); });
    on(EV.MODE_MASTERED, (e) => { this.toast(`<b>${MODE_BY_ID[e.mode].name} mastered</b>Objective complete. Keep experimenting—your changes persist.`, 'good', 'check'); this.markDirty('dock', 'panel', 'bar'); });
    on(EV.MEMORY_ENCODED, (e) => { this.toast(`<b>Memory encoded · ${esc(e.memory.name)}</b>Stored strength ${pct(e.storage)}. It is still fragile—sleep and recall will help it settle.`, 'good', 'memory'); this.journal(`Memory encoded: ${e.memory.name}`); this.markDirty('panel', 'bar'); });
    on(EV.MEMORY_STABILIZED, (e) => { this.toast(`<b>Memory stabilised · ${esc(e.memory.name)}</b>Consolidation passed 60%.`, 'good', 'memory'); this.journal(`Memory stabilised: ${e.memory.name}`); });
    on(EV.MEMORY_RECALLED, (e) => { this.journal(`Recalled ${e.memory.name}: ${Math.round(e.fraction * 100)}% of features`); this.markDirty('panel', 'bar', 'overlay', 'tags'); });
    on(EV.MEMORY_FAILED, (e) => { this.journal(`${e.partial ? 'Partial recall' : 'Recall failed'}: ${e.memory.name} (${Math.round(e.fraction * 100)}%)`); this.markDirty('panel', 'bar', 'overlay', 'tags'); });
    on(EV.CONNECTION_STRENGTHENED, (e) => { if (e.source === 'spont') return; if (e.level >= 0.6) { this.journal(`Synapse ${e.synapse.source.code} → ${e.synapse.target.code} passed ${Math.round(e.level * 100)}%`); g.audio.strengthen(0.7); } });
    on(EV.CONNECTION_WEAKENED, (e) => { if (e.source === 'decay' && e.synapse.networkMembership.has('trainable') && e.level >= 0.6) this.floatAt(e.synapse.pointAt(0.5, [0, 0, 0]), 'UNUSED · STRENGTH ↓', '#ff8a96'); });
    on('SYNAPSES_CHANGED', (e) => {
      const now = performance.now();
      if (now - (this.lastSynFloat || 0) < 900) return;
      this.lastSynFloat = now;
      for (const [syn, d] of e.changes) {
        if (Math.abs(d) < 0.02) continue;
        this.floatAt(syn.pointAt(0.55, [0, 0, 0]), d > 0 ? `+ SYNAPTIC STRENGTH ${pts(d)}` : `SYNAPTIC STRENGTH ${pts(d)} ↓`, d > 0 ? '#5eead4' : '#ff8a96');
        break;
      }
    });
    on(EV.MYELIN_INCREASED, (e) => { if (e.level >= 0.25) this.floatAt(e.synapse.pointAt(0.4, [0, 0, 0]), `+ MYELIN · FASTER SIGNALS`, '#f3e9c8'); });
    on(EV.SKILL_STAGE, (e) => { this.toast(`<b>Skill stage · ${e.stage.name}</b>${esc(e.stage.desc)}`, 'good', 'train', true); this.journal(`Skill stage reached: ${e.stage.name}`); });
    on(EV.SKILL_SEQUENCE, (e) => { this.floatAt(g.sim.regionById.motor.center, `+ NETWORK EFFICIENCY · ${pct(e.eff)}`, '#60b8ff'); this.markDirty('panel', 'bar'); });
    on(EV.FOCUS_COMPLETE, (e) => { this.journal(`Focus session: grade ${e.result.grade} (${Math.round(e.result.score * 100)})`); this.markDirty('panel', 'bar', 'overlay'); });
    on(EV.CONSOLIDATION_COMPLETE, () => { this.toast('<b>Sleep cycle complete</b>Compare the before/after values in the panel.', 'good', 'dream', true); this.journal('Sleep cycle complete — memories consolidated'); this.markDirty('panel', 'bar', 'overlay'); });
    on(EV.PATHWAY_DAMAGED, () => { this.journal('Repair: main relay offline'); this.markDirty('panel', 'bar', 'tags'); });
    on(EV.PATHWAY_REPAIRED, () => { this.toast('<b>Function restored</b>The signal travels through the new route. (An illustrative simulation, not a model of injury recovery.)', 'good', 'repair', true); this.journal('Repair: function restored through a bypass'); });
    on(EV.CONCEPT_CONNECTED, (e) => { this.journal(`${CONCEPT_BY_ID[e.relation.a].label} ↔ ${CONCEPT_BY_ID[e.relation.b].label}${e.cross ? ' (new route)' : ''}`); this.markDirty('panel', 'bar', 'tags'); });
    on(EV.REWARD_TRIGGERED, () => this.markDirty('bar'));
    on(EV.DISTRACTION_OCCURRED, (e) => { if (e.interference) this.floatAt(e.memory.features[0].neuron.position, 'INTERFERENCE ↑ · ACCESSIBILITY ↓', '#ff8a96'); this.markDirty('overlay'); });
    on(EV.ATTENTION_CAPTURED, (e) => this.announce(`Attention captured by ${e.distractor.label}`));
    on(EV.SIGNAL_FOLLOWED, (e) => this.journal(`Followed a signal through ${e.hops} neuron${e.hops === 1 ? '' : 's'}`));
    on(EV.MODE_CHANGED, () => this.markDirty('dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags', 'sel'));
    on(EV.GLIA_ACTION, () => this.markDirty('panel'));
  }

  /* ---------- frame ---------- */
  update(dt) {
    const g = this.game;
    if (this.dirty.size) {
      const d = this.dirty; this.dirty = new Set();
      if (d.has('top')) this.renderTop();
      if (d.has('dock')) this.renderDock();
      if (d.has('head')) this.renderHead();
      if (d.has('panel')) this.renderPanel();
      if (d.has('bar')) this.renderBar();
      if (d.has('overlay')) this.renderOverlay();
      if (d.has('tools')) this.renderTools();
      if (d.has('tags')) this.rebuildTags();
      if (d.has('sel')) this.renderSel();
    }
    this.liveTimer += dt;
    if (this.liveTimer > 0.12) { this.liveTimer = 0; this.updateLive(); }
    this.updateLabels();
    this.updateFloaters();
    this.headTimer += dt;
    if (this.headTimer > 7 && !this.el.head.classList.contains('quiet')) this.el.head.classList.add('quiet');
    const h = this.el.bar.offsetHeight;
    if (Math.abs(h - this.mbHeight) > 2) { this.mbHeight = h; document.documentElement.style.setProperty('--mb-h', `${h}px`); }
  }

  /* ---------- top bar ---------- */
  renderTop() {
    const g = this.game, pr = g.progression, lv = pr.levelDef(), nx = pr.next();
    const frac = pr.progressToNext();
    const R = 15, C = 2 * Math.PI * R;
    this.el.complexity.innerHTML = `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="2.6"/><circle cx="18" cy="18" r="${R}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 18 18)"/><text x="18" y="22.5" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" font-family="var(--mono)">${pr.level}</text></svg><div><div class="lv">Neural complexity</div><div class="lvname">${esc(lv.name)}</div></div>`;
    this.el.complexity.title = nx ? `${pr.points} / ${nx.points} complexity points to “${nx.name}”` : `${pr.points} complexity points · maximum level`;
    this.el.complexity.setAttribute('aria-label', `Neural complexity level ${pr.level}, ${lv.name}. ${this.el.complexity.title}. Open progression and achievements.`);
    const paused = g.paused;
    this.el.pause.innerHTML = icon(paused ? 'play' : 'pause');
    this.el.pause.classList.toggle('paused', paused);

        <span class="num">${m.n}</span>${icon(m.id)}<span>${m.name}</span>${mastered ? `<svg class="mastered ic" viewBox="0 0 24 24">${ICON_PATHS.check}</svg>` : ''}${unlocked ? '' : `<svg class="lock ic" viewBox="0 0 24 24">${ICON_PATHS.lock}</svg>`}</button>`;
    }).join('');

  renderHead() {

  /* ---------- inspector ---------- */
  inspector() {
    const g = this.game, sel = g.selection;
    if (!sel) {
      return `<div class="p-head"><div class="kicker">Inspector</div><h2>Select something<br>to look inside.</h2><p>Click a neuron, a connection, a glial cell or a region label in the 3D world. You can also start from here.</p></div>
        <div class="p-sec stack">${btn('inspect-random', 'Inspect a neuron', { cls: 'primary wide', icon: 'cell' })}${btn('inspect-glia', 'Inspect a glial cell', { cls: 'wide' })}${btn('inspect-memory', 'Inspect a memory', { cls: 'wide', icon: 'memory' })}</div>

  anatomySvg() {

      <circle data-term="soma" cx="82" cy="60" r="17" fill="rgba(94,234,212,.18)" stroke="#5eead4" style="cursor:help"/><circle cx="80" cy="61" r="6" fill="rgba(94,234,212,.4)" pointer-events="none"/>
      <g data-term="synapse" style="cursor:help" fill="#fbbf5b"><circle cx="255" cy="37" r="4"/><circle cx="261" cy="60" r="4"/><circle cx="255" cy="85" r="4"/></g>
      <g fill="#8ea2b4" font-size="8.5" font-family="var(--font)" letter-spacing="1" pointer-events="none"><text x="6" y="12">DENDRITES</text><text x="62" y="96">SOMA</text><text x="150" y="82">AXON + MYELIN</text><text x="236" y="110">SYNAPSES</text></g></svg>`;
  }
  inspectNeuron(n) {
    const g = this.game;
    const memberships = [...n.networkMembership].map((t) => t.startsWith('memory:') ? `Memory: ${g.memory.memories[t.slice(7)]?.name}` : t === 'task' ? 'Focus task network' : t === 'skill' ? 'Piano skill circuit' : t === 'repair' ? 'Repair circuit' : t.startsWith('skill') ? null : t).filter(Boolean);
    const roleMission = LEARN_MISSIONS[0].nodes.includes(n.key) ? 'Learn · sequence route' : null;
    if (roleMission) memberships.push(roleMission);
    const outE = n.outgoing.filter((s) => s.enabled).length, inE = n.incoming.filter((s) => s.enabled).length;
    return `<div class="p-head"><div class="kicker">Neuron · ${n.code}</div><h2>${esc(n.label || n.region.name)}</h2><p><span style="color:${n.type === 'inhibitory' ? 'var(--inh)' : 'var(--exc)'}">${n.displayType}</span> · ${term(n.region.def.term, n.region.name)}${n.health <= 0 ? ' · <b style="color:var(--bad)">OFFLINE</b>' : ''}${n.recruited ? '' : ' · <span class="muted">dormant (not yet recruited)</span>'}</p></div>
      ${this.anatomySvg()}
      <div class="card"><div class="row between" style="font-size:.78rem"><span class="muted">Integrated activation</span><b class="mono" id="in_act">${n.activation.toFixed(2)}</b></div><canvas id="membrane" width="300" height="56" style="width:100%;height:56px;margin-top:.35rem" aria-label="Activation trace with threshold line"></canvas><p style="margin-top:.2rem">Dashed line = ${term('threshold', 'threshold')}. Inputs add up and leak back toward rest; crossing the threshold fires an ${term('action-potential', 'action potential')}.</p></div>
      <div class="p-sec stack">${btn('fire-selected', 'Fire this neuron', { cls: 'primary wide', icon: 'spark', kbd: 'E', disabled: n.health <= 0 })}
        <div class="grid2">${btn('follow-signal', 'Follow signal', { icon: 'follow', kbd: 'T' })}${btn('trace-path', 'Trace pathway', { icon: 'route' })}${btn('inspect-strongest', 'Strongest synapse', { icon: 'link' })}${btn('focus-selected', 'Move closer', { icon: 'target', kbd: 'F' })}</div></div>
      <div class="p-sec"><h3>Properties</h3>${kv([
        ['Neuron ID', n.code], ['Region', n.region.def.short], ['Activation', n.activation.toFixed(2), 'in_act2'], ['Threshold', n.threshold.toFixed(2)],
        ['Resting potential', n.restingPotential.toFixed(2)], ['Recent activity', pct(n.recentActivity), 'in_recent'], ['Plasticity', pct(n.plasticity)],
        ['Energy (game)', pct(n.energy), 'in_energy'], ['Health', n.health > 0 ? 'Healthy' : 'Offline'], ['Myelin efficiency', pct(n.myelinEfficiency), 'in_myelin'],
        ['Network', memberships.length ? memberships.join(', ') : 'Local circuit'], ['Outgoing connections', outE], ['Incoming connections', inE],
        ['Last fired', n.lastFired < -1e8 ? 'Not yet' : `${(g.sim.time - n.lastFired).toFixed(1)} game-s ago`, 'in_last'], ['Times fired', n.fireCount, 'in_count'],
      ])}</div>
      <div class="p-sec"><h3>Browse another neuron</h3><select id="neuronPicker" class="btn wide" aria-label="Choose a neuron to inspect">${g.sim.neurons.filter((x) => x.recruited || x === n).map((x) => `<option value="${x.id}" ${x === n ? 'selected' : ''}>${x.code} · ${esc(x.label || x.region.def.short)} · ${x.type}</option>`).join('')}</select></div>
      ${science('Neurons integrate thousands of inputs at their dendrites and soma; the axon carries the output. Inhibitory interneurons keep activity balanced.', `Activation is in normalised game units, not millivolts. A single synapse needs a weight of roughly ${(1 / g.sim.synapticGain).toFixed(2)} to fire a resting cell on its own; weaker inputs must add up.`)}`;
  }
  inspectSynapse(s) {
    const g = this.game, sim = g.sim;
    const mem = s.associatedMemory ? g.memory.memories[s.associatedMemory]?.name : null;
    const nets = [...s.networkMembership].filter((t) => !t.startsWith('memory:') && t !== 'trainable');
    const pRel = clamp(0.15 + 1.1 * s.weight);
    return `<div class="p-head"><div class="kicker">Synapse · S${String(s.id + 1).padStart(4, '0')}</div><h2>${esc(s.source.code)} → ${esc(s.target.code)}</h2><p>${s.source.region.def.short} → ${s.target.region.def.short} · <span style="color:${s.effectType === 'inhibitory' ? 'var(--inh)' : 'var(--exc)'}">${s.effectType}</span>${s.custom ? ' · grown by you' : ''}${s.enabled ? '' : ' · <b style="color:var(--bad)">disabled</b>'}</p></div>
      <div class="p-sec">${meter('Strength (weight)', s.weight, 'sy_w', { mark: 1 / g.sim.synapticGain, markTitle: 'Enough to fire a resting cell alone' })}${meter('Recent activity', s.recentActivity, 'sy_act', { color: '#ffffff' })}${meter('Myelin', s.myelinLevel, 'sy_my', { color: '#f3e9c8' })}${meter('Long-term stability', s.longTermStability, 'sy_st', { color: '#a99bff' })}</div>
      <div class="p-sec"><h3>Properties</h3>${kv([
        ['Source', `${s.source.code} · ${esc(s.source.label || s.source.region.def.short)}`], ['Target', `${s.target.code} · ${esc(s.target.label || s.target.region.def.short)}`],
        ['Effect', s.effectType === 'inhibitory' ? 'Inhibitory (−)' : 'Excitatory (+)'], ['Plasticity', pct(s.plasticity)], ['Transmission reliability', pct(pRel), 'sy_rel'],
        ['Travel time', `${sim.travelTime(s).toFixed(2)} game-s`, 'sy_tt'], ['Activation count', s.activationCount, 'sy_count'], ['Activation frequency', `${s.activationFrequency.toFixed(2)} / s`, 'sy_freq'],
        ['Eligibility trace', pct(s.eligibility), 'sy_el'], ['Associated memory', mem || 'None'], ['Network', nets.length ? nets.join(', ') : 'Local circuit'],
        ['Last activation', s.lastActivationTime < -1e8 ? 'Never' : `${(sim.time - s.lastActivationTime).toFixed(1)} game-s ago`, 'sy_last'],
      ])}</div>
      <div class="p-sec stack">${btn('fire-source', 'Stimulate the source', { cls: 'primary wide', icon: 'spark' })}<div class="grid2">${btn('inspect-source', 'Inspect source')}${btn('inspect-target', 'Inspect target')}${btn('next-synapse', 'Next synapse', { icon: 'arrow' })}${btn('focus-selected', 'Move closer', { icon: 'target' })}</div></div>
      ${science('Synaptic strength can change with use (plasticity). Myelin, made by glia, changes conduction speed along the axon—a separate property.', 'Weight sets influence on the target and transmission reliability. Weak synapses are drawn dashed and dim; strong ones solid and bright. Myelin is drawn as segmented sleeves and shortens travel time.')}`;
  }
  inspectGlia(gc) {
    const info = {
      astrocyte: ['astrocyte', 'Support the local environment', 'Restores model energy to nearby neurons and slightly stabilises active synapses.'],
      oligodendrocyte: ['oligodendrocyte', 'Myelinate recently active axons', 'Adds model insulation to axons that recently carried several signals.'],
      microglia: ['microglia', 'Clear weak inactive links', 'Disables up to three weak, unused local links (never named memories, lessons or circuits). A pruning analogy.'],
    }[gc.type];

      <div class="p-sec">${kv([['Cell class', 'Glial cell (not a neuron)'], ['Region', gc.region.def.short], ['Contacts', gc.focusSynapses.length + (gc.focusNeuron ? 1 : 0), 'gl_contacts'], ['Fires action potentials', 'No (not modelled)']])}</div>

  inspectRegion(r) {

    return `<div class="p-head"><div class="kicker" style="color:${r.def.color}">Brain region</div><h2>${r.name}</h2><p>${r.def.functions.join(' · ')}</p></div>

      <div class="p-sec"><h3>Active pathways <span class="dim" style="font-weight:500;letter-spacing:0;text-transform:none">last few seconds</span></h3><div id="rg_paths" class="stack" style="gap:.3rem;font-size:.78rem"></div></div>
      <div class="p-sec"><h3>Missions here</h3><div class="stack">${links.map(([target, label]) => { const [mode] = target.split(':'); const ok = g.progression.isUnlocked(mode); return `<button class="mission-card" data-action="goto" data-target="${target}" ${ok ? '' : 'disabled'}><span class="mn">${icon(mode)}</span><span><div class="mt">${esc(label)}</div><div class="ms">${MODE_BY_ID[mode].name}${ok ? '' : ' · locked'}</div></span></button>`; }).join('')}</div></div>
      <div class="p-sec">${kv([['Neurons', `${r.neurons.length} (${r.neurons.filter((n) => n.recruited).length} recruited)`], ['Glial cells', nGlia], ['Learn more', term(r.def.term, 'Glossary')]])}</div>

      <div class="p-sec">${meter('Storage strength', storage, 'mm_st', { color: '#c4a7ff' })}${meter('Retrieval accessibility', m.retrievalAccessibility, 'mm_acc', { color: '#5eead4' })}${meter('Consolidation', m.consolidation, 'mm_cons', { color: '#a99bff' })}${meter('Interference', m.interference, 'mm_int', { color: '#ff8a96' })}</div>

  inspectConcept(id) {

  /* ---------- live values ---------- */
  updateLive() {

    if (!sim) return;
    setText('st_active', g.stats.activeNow); setWidth('st_activeBar', g.stats.activeNow / Math.max(1, sim.neurons.length) * 4);

  /* ---------- 3D labels ---------- */
  buildRegionLabels() {
    this.regionEls = new Map(); this.chainEls = new Map();

      const b = document.createElement('button');
      b.className = 'lbl3d region-label'; b.style.setProperty('--c', r.color);

      if (r.chain) {

        c.className = 'lbl3d chain-label'; c.style.setProperty('--c', r.color);
        c.innerHTML = `${r.chain}<small>${BRAIN_CHAIN.indexOf(r.id) + 1} · ${r.short}</small>`;
        this.el.labels.appendChild(c); this.chainEls.set(r.id, c);

    }
  }
  rebuildTags() {
    for (const el of this.tagEls.values()) el.remove();
    this.tagEls.clear();
    let tags = [];
    try { tags = this.game.mode.tags(); } catch (err) { console.error('NEURON tags failed', err); }
    this.tags = tags;
    for (const t of tags) {
      const el = document.createElement(t.action ? 'button' : 'div');
      el.className = `lbl3d ${t.kind || 'node-tag'} ${t.cls || ''}`;
      if (t.color) el.style.setProperty('--c', t.color);
      el.innerHTML = t.html ?? esc(t.text);
      if (t.action) { el.dataset.action = t.action; for (const [k, v] of Object.entries(t.data || {})) el.dataset[k] = v; el.tabIndex = -1; }
      if (t.term) el.dataset.term = t.term;

  }
  place(el, p, dy = 0) {
    const cam = this.game.camera, s = cam.project(p, this._proj || (this._proj = {}));
    const vis = s && s.visible;
    if (!vis) { if (el._vis !== false) { el.style.display = 'none'; el._vis = false; } return null; }
    if (el._vis !== true) { el.style.display = ''; el._vis = true; }
    el.style.transform = `translate3d(${s.x.toFixed(1)}px, ${(s.y + dy).toFixed(1)}px, 0) translate(-50%, -50%)`;
    return s;
  }
  hide(el) { if (el._vis !== false) { el.style.display = 'none'; el._vis = false; } }
  /** The part of the viewport not covered by HUD chrome (re-measured at most every 0.4 s). */
  freeArea() {
    const now = performance.now();
    if (this._free && now - this._freeAt < 400) return this._free;
    const W = innerWidth, H = innerHeight, vis = (el) => el && !el.hidden && el.offsetParent !== null && getComputedStyle(el).opacity !== '0';
    const dock = this.el.dock.getBoundingClientRect(), bar = this.el.bar.getBoundingClientRect(), top = this.el.top.getBoundingClientRect();
    const panelOpen = !this.el.app.classList.contains('panel-closed') && vis(this.el.panel);
    const pr = panelOpen ? this.el.panel.getBoundingClientRect() : null;
    const dockLeft = dock.width < W * 0.5 && dock.height > H * 0.4;   // vertical dock on the left (desktop / landscape)
    const left = (dockLeft ? dock.right : 0) + 12;
    const right = (pr && pr.width < W * 0.6 ? pr.left : W) - 12;
    let bottom = (vis(this.el.bar) ? bar.top : H) - 12;
    const tools = this.el.tools.getBoundingClientRect();
    if (vis(this.el.tools) && tools.top > H / 2) bottom = Math.min(bottom, tools.top - 10);   // toolbar above the mission bar
    const f = { left: Math.min(left, W / 2 - 60), right: Math.max(right, W / 2 + 60), top: top.bottom + 12, bottom: Math.max(bottom, top.bottom + 120) };
    f.cx = (f.left + f.right) / 2;
    this._free = f; this._freeAt = now;

  }
  updateLabels() {
    const g = this.game, sim = g.sim, r = g.renderer;
    if (!sim) return;
    const intro = g.introRunning;
    const showRegions = g.settings.labels && !intro && !g.sleep.active && g.modeId !== 'focus' && g.modeId !== 'build' && r.brainT < 0.6;
    const focusR = g.focusRegion, cam = g.camera;
    // Region labels: project, then nudge overlapping labels apart (widths cached once).
    const placed = [];
    for (const reg of sim.regions) {
      const el = this.regionEls.get(reg.id);
      if (!showRegions || (r.microT > 0.6 && focusR !== reg)) { this.hide(el); continue; }
      const s = cam.project([reg.center[0], reg.center[1] + reg.radii[1] + 0.35, reg.center[2]], {});
      if (!s || !s.visible) { this.hide(el); continue; }
      if (!el._w) { el.style.display = ''; el._w = el.offsetWidth || 120; el._vis = true; }
      placed.push({ el, reg, x: s.x, y: s.y, w: el._w });
    }
    placed.sort((a, b) => a.y - b.y);
    for (let i = 0; i < placed.length; i++) for (let j = 0; j < i; j++) {
      const a = placed[j], b = placed[i];
      if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 + 6 && Math.abs(a.y - b.y) < 24) b.y = a.y + 24;
    }
    for (const p of placed) {
      if (p.el._vis !== true) { p.el.style.display = ''; p.el._vis = true; }
      p.el.style.transform = `translate3d(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      p.el.classList.toggle('on', focusR === p.reg);
      p.el.style.opacity = focusR && focusR !== p.reg ? 0.5 : 1;
    }
    for (const reg of sim.regions) {
      const ch = this.chainEls.get(reg.id);
      if (ch) { if (r.brainT > 0.3 && !intro && g.settings.labels) { this.place(ch, reg.center, -10); ch.style.opacity = r.brainT; } else this.hide(ch); }
    }
    if (this.tags) {
      // Concept labels (Build) are de-overlapped like region labels; other tags track their cells.
      const stack = [];
      for (const t of this.tags) {
        const el = this.tagEls.get(t.id);
        if (!el) continue;
        const p = typeof t.pos === 'function' ? t.pos() : t.pos;
        if (!p || intro || (t.hideAtBrain && r.brainT > 0.5)) { this.hide(el); continue; }
        if (t.kind === 'concept-label') {
          const s = cam.project(p, {});
          if (!s || !s.visible) { this.hide(el); continue; }
          if (!el._w) { el.style.display = ''; el._w = el.offsetWidth || 90; el._vis = true; }
          stack.push({ el, x: s.x, y: s.y + (t.dy ?? -18), w: el._w });
        } else this.place(el, p, t.dy ?? -18);
      }
      stack.sort((a, b) => a.y - b.y);
      for (let i = 0; i < stack.length; i++) for (let j = 0; j < i; j++) {

      }
      for (const q of stack) {
        if (q.el._vis !== true) { q.el.style.display = ''; q.el._vis = true; }
        q.el.style.transform = `translate3d(${q.x.toFixed(1)}px, ${q.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      }
    }
    if (this.distractorEls && this.distractorEls.size) {

        seen.add(d.id);
        if (el._vis !== true) { el.style.display = ''; el._vis = true; }
        if (!el._w) { el._w = el.offsetWidth || 180; el._h = el.offsetHeight || 40; }
        // Distractions must always be reachable: clamp each chip (by its own size) into the uncovered
        // part of the view — an off-screen indicator — instead of hiding it when its anchor leaves the frame.
        const s = cam.project(d.pos, {});
        const hw = Math.min(el._w / 2, (free.right - free.left) / 2), hh = el._h / 2;
        chips.push({ el, d, w: el._w, h: el._h, x: clamp(s ? s.x : free.cx, free.left + hw, free.right - hw), y: clamp(s ? s.y : free.bottom, free.top + hh, free.bottom - hh) });
      }
      chips.sort((a, b) => a.y - b.y);
      for (let i = 0; i < chips.length; i++) for (let j = 0; j < i; j++) {
        const a = chips[j], b = chips[i];
        if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2 + 6) {
          const below = a.y + (a.h + b.h) / 2 + 6;
          b.y = below + b.h / 2 <= free.bottom ? below : a.y - (a.h + b.h) / 2 - 6;
        }
      }
      for (const c of chips) {
        c.el.style.transform = `translate3d(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
        c.el.style.setProperty('--s', c.d.salience.toFixed(2));

      for (const [id, el] of this.distractorEls) if (!seen.has(id)) this.hide(el);

  /* ---------- floating feedback ---------- */
  floatAt(pos, text, color = '#5eead4') {
    if (!pos || this.game.introRunning) return;
    if (this.floaters.length >= 12) { const old = this.floaters.shift(); old.el.remove(); }
    const el = document.createElement('div');
    el.className = 'floater'; el.textContent = text; el.style.setProperty('--c', color);
    this.el.floaters.appendChild(el);
    const now = performance.now(), cam = this.game.camera;
    const s = cam.project(pos, {});
    let dy = -26;
    if (s) {
      for (let tries = 0; tries < 6; tries++) {
        const clash = this.floaters.some((o) => now - o.born < 1400 && o.sx !== undefined && Math.abs(o.sx - s.x) < 150 && Math.abs(o.sy + o.dy - (s.y + dy)) < 18);
        if (!clash) break;
        dy -= 19;
      }
    }
    const f = { el, pos: pos.slice(), born: now, dy, sx: s ? s.x : undefined, sy: s ? s.y : undefined };
    this.floaters.push(f);
  }
  updateFloaters() {
    const now = performance.now(), cam = this.game.camera;
    for (let i = this.floaters.length - 1; i >= 0; i--) {
      const f = this.floaters[i];
      if (now - f.born > 1950) { f.el.remove(); this.floaters.splice(i, 1); continue; }
      const s = cam.project(f.pos, this._fproj || (this._fproj = {}));
      if (!s || !s.visible) { f.el.style.display = 'none'; continue; }
      f.el.style.display = '';
      f.el.style.left = `${s.x.toFixed(1)}px`; f.el.style.top = `${(s.y + f.dy).toFixed(1)}px`;
    }
  }

  education: {

        <h3>The core loop</h3><p class="lead">Explore → Learn → Practise → Remember → Focus → Sleep → a more efficient network → greater complexity → build richer knowledge networks.</p>

        ['Orbit', 'Drag (one finger on touch). Arrow keys when the canvas is focused.'], ['Zoom', 'Mouse wheel or pinch. MICRO / NETWORK / BRAIN buttons jump between scales.'], ['Pan', 'Right-drag, Shift-drag or two-finger drag.'],
        ['Select', 'Click/tap a neuron, synapse, glial cell or region label. Double-click a neuron to fly to it.'], ['Modes', '1 Explore · 2 Learn · 3 Remember · 4 Train · 5 Focus · 6 Dream · 7 Repair · 8 Build'],
        ['Simulation', 'Space pause/resume · speed buttons ¼× to 4× · step button advances one tick while paused'], ['Camera', 'H whole-brain overview · R reset camera · F focus selected · T follow a signal · V free flight (W A S D, Q E)'],
        ['Explore', 'E fire the selected neuron · L toggle labels'], ['Train', 'A S D F play the four notes'], ['Focus', 'J reinforce the task / engage a relevant signal · K suppress the strongest distraction'],

      if (tab === 'concepts') html += `<div class="guide-grid">${Object.entries(GLOSSARY).map(([k, gl]) => `<details class="more" style="margin-top:0"><summary>${gl.title}</summary><div><p>${gl.short} ${gl.long}</p><p style="color:var(--warn)">In this game: ${gl.game}</p></div></details>`).join('')}</div>`;
      if (tab === 'model') html += `<p class="lead">Every mechanic is labelled as either a scientific idea or a game simplification. Here is the full picture.</p>
        <div class="guide-grid" style="margin-top:1rem">
          <div class="card"><h4>What is simulated</h4><p>Directed, signed connections; leaky integration to a threshold; a refractory period; travelling pulses; unreliable release at weak synapses; timing-dependent (Hebbian-style) plasticity; reward-gated eligibility traces; slow decay of unused connections; myelin-dependent conduction; graph routing; pattern completion over real synapse weights.</p></div>
          <div class="card"><h4>What is simplified</h4><p>Neuron shapes and counts, region positions, neurotransmission, reward modulation, attention, sleep stages and timescales, consolidation, glial roles, pruning and repair. Regions are teaching landmarks, not an anatomical atlas.</p></div>
          <div class="card"><h4>Percentages are game metrics</h4><p>“Storage” is the mean strength of a memory’s synapses. “Accessibility”, “consolidation”, “interference”, “focus”, “efficiency” and “complexity” are game indices—not biomedical measurements.</p></div>

          <div class="card"><h4>Scale</h4><p>About ${g.sim.neurons.length} simulated neurons and ${g.sim.glia.length} glial cells — versus roughly 86 billion neurons in a human brain.</p></div>
        </div>`;
      if (tab === 'about') html += `<div class="disclaimer"><b>Scientific disclaimer</b>${DISCLAIMER}</div>
        <h3>About NEURON</h3><p class="lead">NEURON — Inside the Living Brain is a single-file, offline educational game. All graphics (WebGL), sound (Web Audio) and simulation run locally in your browser. Saves stay on this device unless you export them.</p>
        <h3>Further reading (general)</h3><p class="lead">Hebb, <i>The Organization of Behavior</i> (1949) · spike-timing-dependent plasticity (Bi & Poo, 1998) · reward prediction error (Schultz, 1997) · memory replay during sleep (Wilson & McNaughton, 1994) · storage vs. retrieval strength (Bjork & Bjork, 1992) · activity-dependent myelination (e.g. McKenzie et al., 2014). These inspired the mechanics; the game simplifies them.</p>`;
      return html;

  progress: {

    body(g) {

      return `<p class="lead">${nx ? `<b>${pr.points}</b> complexity points · <b>${nx.points - pr.points}</b> more to reach <b>${nx.name}</b>.` : `<b>${pr.points}</b> complexity points · the whole network is engaged.`} Complexity grows from learning events, never from idle time.</p>

        <p class="lead" style="margin-top:1rem;font-size:.76rem">Levels describe this game’s network, not your brain, intelligence or memory ability.</p>`;

  locked: {

      const md = MODE_BY_ID[m.opts.mode], lv = LEVELS[md.unlock - 1], pr = g.progression;

        <div class="card" style="margin-top:.8rem"><h4>Ways to grow complexity</h4><p>Strengthen pathways in Learn, recall memories, practise sequences, complete missions, explore regions and glial cells, and earn achievements.</p></div>

  reset: {
    kicker: 'NEURON · RESET', narrow: true, title: 'Start with a fresh network?',
    body() {
      return `<p class="lead">This erases saved progress in this browser—levels, memories, trained pathways, missions, achievements and settings—and rebuilds the original network. Exported backups are not affected.</p>
        <div class="grid2" style="margin-top:1.2rem">${btn('close-modal', 'Keep my progress', { data: {} })}${btn('reset-all', 'Erase and restart', { cls: 'danger' })}</div>`;
