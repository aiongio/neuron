/* ==========================================================================
   MODES — one controller per game mode.
   Each provides: enter/exit, update, decorate (3D highlights), panel (side
   panel HTML), bar (mission bar), overlay (centre-stage UI), tags (3D-anchored
   labels), live (fast-changing values), actions, key handling and picking.
   ========================================================================== */
const MB = (o) => `<div class="mb-main"><div class="mb-top"><span class="eyebrow">${o.kicker || 'Objective'}</span><span class="mb-obj">${o.text}</span></div>
  ${o.progress != null ? `<div class="mb-progress"><div class="meter"><i id="mbBar" style="width:${(clamp(o.progress) * 100).toFixed(1)}%"></i></div><span class="count" id="mbCount">${o.count || pct(o.progress)}</span></div>` : ''}
  ${o.insight ? `<div class="mb-insight">${icon('info', 'sm')}<span>${o.insight}</span></div>` : ''}</div><div class="mb-actions">${o.actions || ''}</div>`;
const COL = { learn: [0.98, 0.75, 0.36], memory: [0.77, 0.65, 1], skill: [0.38, 0.72, 1], focus: [0.37, 0.92, 0.83], repair: [0.45, 0.89, 0.6], select: [0.85, 1, 0.95], path: [1, 0.86, 0.5], control: [0.75, 0.6, 1], bad: [1, 0.45, 0.5] };

class ModeBase {
  constructor(game, id) { this.game = game; this.id = id; this.def = MODE_BY_ID[id]; this.actions = {}; }
  enter() {} exit() {} update() {} live() {}
  decorate() {}
  tags() { return []; }
  panel() { return ''; }
  bar() { return ''; }
  overlay() { return this.ambientChips(); }
  key() { return false; }
  pick() { return false; }
  hover() { return null; }
  spotlight() { return null; }
  frame() { this.game.camera.home(); }
  head(title, text) { return `<div class="p-head"><div class="kicker">${this.def.kicker}</div><h2>${title}</h2><p>${text}</p></div>`; }
  ambientChips() {
    return this.game.attention.ambient.map((d) => `<button class="lbl3d distractor" data-distractor="${d.id}" data-action="dismiss-distractor" data-id="${d.id}" style="--s:${d.salience.toFixed(2)}" aria-label="Dismiss distraction: ${d.label}"><span class="ring"><i>${icon('close', 'sm')}</i></span><span>${d.label}<div class="hint">CLICK TO DISMISS · ENCODING ↓</div></span></button>`).join('');
  }
  encodingCard() {
    const a = this.game.attention;
    return `<div class="p-sec"><h3>Attention ${term('attention', '?')}</h3>${meter('Encoding quality', a.encodingQuality, 'enc_q', { color: '#5eead4' })}${meter('Distraction', a.distraction, 'enc_d', { color: '#ff9f7a', thin: true })}</div>`;
  }
  liveEncoding() { const a = this.game.attention; setText('enc_q', pct(a.encodingQuality)); setWidth('enc_qBar', a.encodingQuality); setText('enc_d', pct(a.distraction)); setWidth('enc_dBar', a.distraction); }
}

/* ======================= 1 · EXPLORE ======================= */
class ExploreMode extends ModeBase {
  constructor(game) {
    super(game, 'explore');
    this.wire = null; this.custom = 0; this.tipIndex = 0;
    this.actions = {
      'network-burst': () => { this.game.sim.networkBurst(); this.game.ui.floatAt([0, 3.4, 0], 'SYNCHRONISED NETWORK BURST', '#5eead4'); this.game.audio.chime(0.6); },
      'run-chain': () => this.runChain(),
      'grow-tool': () => { this.wire = this.wire ? null : { from: null }; this.game.ui.toast(this.wire ? 'Grow a synapse: click a source neuron, then a nearby target neuron.' : 'Synapse tool off.', 'info', 'link'); this.game.ui.markDirty('panel', 'bar'); this.game.input.updateCursor(); },
    };
  }
  objectives() {
    const ex = this.game.missions.explore;
    return [
      { text: 'Select three different neurons', done: ex.selected.size >= 3, n: Math.min(3, ex.selected.size), of: 3 },
      { text: 'Fire neurons three times', done: ex.fired >= 3, n: Math.min(3, ex.fired), of: 3 },
      { text: 'Inspect a synapse', done: ex.synapse, n: ex.synapse ? 1 : 0, of: 1 },
      { text: 'Follow a signal from cell to cell', done: ex.followed, n: ex.followed ? 1 : 0, of: 1 },
      { text: 'Visit three brain regions', done: ex.regions.size >= 3, n: Math.min(3, ex.regions.size), of: 3 },
    ];
  }
  runChain() {
    const g = this.game;
    if (g.renderer.brainT < 0.4) g.setScale('brain');
    g.sim.runChain((rid, i) => { const r = g.sim.regionById[rid]; g.renderer.addRing(r.center, r.rgb, 2.6); g.ui.floatAt(r.center, `${i + 1} · ${r.def.chain}`, r.def.color); g.audio.tone({ freq: 330 * Math.pow(2, i / 6), dur: 0.5, gain: 0.05 }); });
  }
  panel() {
    const g = this.game, obj = this.objectives(), sel = g.selection;
    const done = obj.filter((o) => o.done).length;
    return `${this.head('Meet your living network', 'You are inside a small, stylised neural world. Start with one cell, then follow how its signals influence the next. Nothing here is a static picture: every pulse is simulated.')}
      <div class="p-sec"><h3>Survey objectives <span class="tag ${done === 5 ? 'good' : ''}">${done} / 5</span></h3>${stepsList(obj.map((o) => ({ text: `${o.text}${o.of > 1 ? ` <span class="dim">(${o.n}/${o.of})</span>` : ''}`, done: o.done })))}</div>
      <div class="p-sec stack">${btn('inspect-random', sel?.type === 'neuron' ? 'Inspect another neuron' : 'Select a neuron', { cls: 'primary wide', icon: 'cell' })}
        <div class="grid2">${btn('fire-selected', 'Fire', { icon: 'spark', kbd: 'E', disabled: sel?.type !== 'neuron' })}${btn('follow-signal', 'Follow signal', { icon: 'follow', kbd: 'T' })}${btn('trace-path', 'Trace pathway', { icon: 'route', disabled: sel?.type !== 'neuron' })}${btn('grow-tool', this.wire ? 'Cancel tool' : 'Grow a synapse', { icon: 'link', cls: this.wire ? 'on' : '' })}</div></div>
      <div class="p-sec"><h3>Collective activity</h3><div class="grid3">${btn('region-wave', 'Wave', { icon: 'wave', title: 'Regional wave (selected region, or a random one)' })}${btn('network-burst', 'Burst', { icon: 'burst', title: 'Synchronised burst across all regions' })}${btn('run-chain', 'Chain', { icon: 'route', title: 'Run the functional chain at BRAIN scale' })}</div></div>
      <div class="p-sec"><h3>Three scales</h3><div class="grid3">${['micro', 'network', 'brain'].map((s) => btn('scale', s[0].toUpperCase() + s.slice(1), { data: { scale: s }, cls: g.scaleLevel() === s ? 'on' : '' })).join('')}</div>
        <p class="muted" style="font-size:.74rem;margin-top:.5rem"><b>Micro</b>: soma, dendrites, axons and synapses. <b>Network</b>: functional clusters. <b>Brain</b>: regions and the chain VISION → OBJECT RECOGNITION → MEMORY → LANGUAGE → DECISION → MOTOR RESPONSE.</p></div>
      <div class="p-sec"><h3>Nine connected regions</h3><div class="region-grid">${REGIONS.map((r) => `<button class="btn ${g.focusRegion?.id === r.id ? 'on' : ''}" data-action="region" data-region="${r.id}" style="--c:${r.color}"><span class="sw"></span>${r.short}</button>`).join('')}</div></div>
      ${science('Neurons communicate with electrical impulses along axons and chemical signals at synapses. Activity in one cell influences others—sometimes enough to make them fire.', 'Weak connections are drawn as dim, dashed and flickering lines; they transmit unreliably. Training turns them solid and bright. All sizes and speeds are illustrative.')}`;
  }
  bar() {
    const g = this.game, obj = this.objectives(), done = obj.filter((o) => o.done).length;
    const tips = ['Drag to orbit · scroll to zoom · click a glowing cell.', 'Inhibitory neurons are rose-coloured with a hollow core.', 'Thicker, brighter, solid lines are stronger synapses.', 'Zoom right in (MICRO) to see dendrites, axon terminals and myelin.', 'Glial cells move on their own—click one to see what it is doing.'];
    const sel = g.selection;
    return MB({
      text: this.wire ? (this.wire.from ? `Synapse tool: choose a target near ${this.wire.from.code}` : 'Synapse tool: choose a source neuron') : done >= 5 ? 'Survey complete — explore freely or try Learn' : 'Survey the network', progress: done / 5, count: `${done} / 5`,
      insight: tips[Math.floor(performance.now() / 9000) % tips.length],
      actions: `${btn('fire-selected', 'Fire', { cls: 'primary', icon: 'spark', kbd: 'E', disabled: sel?.type !== 'neuron', title: sel?.type === 'neuron' ? 'Trigger an action potential' : 'Select a neuron first' })}${btn('follow-signal', 'Follow', { icon: 'follow', kbd: 'T' })}${btn('network-burst', 'Burst', { icon: 'burst' })}`,
    });
  }
  decorate(d) {
    const sel = this.game.selection;
    if (this.wire && this.wire.from) {
      d.hiNeurons.set(this.wire.from, { rgb: COL.select, level: 1 });
      d.rings.push({ pos: this.wire.from.position, rgb: [0.6, 1, 0.8], size: 3.5, kind: 13, alpha: 0.4 });
      const h = this.game.input.hoverHit;
      if (h && h.type === 'neuron' && h.obj !== this.wire.from) {
        const ok = V3.dist(h.obj.position, this.wire.from.position) <= 3.5;
        d.ribbons.push({ points: [this.wire.from.position, h.obj.position], rgb: ok ? [0.5, 1, 0.7] : [1, 0.4, 0.45], alpha: 0.7, width: 2.5, flow: 1 });
      }
    }
  }
  tags() {
    const g = this.game, sel = g.selection, out = [];
    if (sel?.type === 'neuron') {
      const n = sel.obj;
      const strongest = n.outgoing.filter((s) => s.enabled).sort((a, b) => b.weight - a.weight)[0];
      const mic = () => g.renderer.microT > 0.35;
      out.push({ id: 'p_soma', kind: 'part-label', text: 'SOMA', term: 'soma', pos: () => mic() ? V3.add(n.position, [0.12, 0.12, 0]) : null, dy: -6 });
      out.push({ id: 'p_dend', kind: 'part-label', text: 'DENDRITES', term: 'dendrite', pos: () => mic() ? V3.add(n.position, [-0.45, 0.3, 0.1]) : null, dy: 0 });
      if (strongest) {
        out.push({ id: 'p_axon', kind: 'part-label', text: 'AXON', term: 'axon', pos: () => mic() ? strongest.pointAt(0.3, [0, 0, 0]) : null, dy: -8 });
        out.push({ id: 'p_syn', kind: 'part-label', text: 'SYNAPSE', term: 'synapse', pos: () => mic() ? strongest.pointAt(0.93, [0, 0, 0]) : null, dy: -8 });
        if (strongest.myelinLevel > 0.1) out.push({ id: 'p_my', kind: 'part-label', text: 'MYELIN', term: 'myelin', pos: () => mic() ? strongest.pointAt(0.55, [0, 0, 0]) : null, dy: 12 });
      }
    }
    const tut = g.tutorial.suggestedNeuron();
    if (tut && !(sel?.type === 'neuron')) out.push({ id: 'tut_n', text: 'CLICK THIS NEURON', cls: 'target', pos: () => tut.position, action: 'select-neuron', data: { id: tut.id } });
    return out;
  }
  pick(hit) {
    const g = this.game;
    if (!this.wire || !hit || hit.type !== 'neuron') return false;
    const n = hit.obj;
    if (!this.wire.from) { this.wire.from = n; g.select('neuron', n, { quiet: true }); g.ui.markDirty('bar'); return true; }
    const a = this.wire.from;
    if (a === n) { this.wire.from = null; g.ui.markDirty('bar'); return true; }
    if (V3.dist(a.position, n.position) > 3.5) { g.ui.toast('Too far apart for a new connection in this sandbox (max 3.5 units).', 'warn', 'link'); return true; }
    if (n.isolated || a.isolated) { g.ui.toast('The repair circuit is isolated on purpose. Use Repair mode to grow connections there.', 'warn', 'link'); return true; }
    if (this.custom >= 8) { g.ui.toast('Sandbox limit reached (8 grown synapses). Train existing ones instead.', 'warn', 'link'); return true; }
    const existing = g.sim.synapseBetween(a, n);
    if (existing && existing.enabled) { g.select('synapse', existing); this.wire = null; g.ui.toast('These cells are already connected — showing that synapse.', 'info', 'link'); return true; }
    const s = g.sim.connect(a, n, 0.25, { custom: true, networks: ['trainable'] });
    this.custom++; this.wire = null;
    g.sim.fire(a, { cause: 'manual', forced: true, driven: true, tag: 'manual' });
    g.ui.floatAt(s.pointAt(0.5, [0, 0, 0]), 'NEW SYNAPSE · WEAK', '#5eead4');
    g.select('synapse', s);
    g.ui.markDirty('panel', 'bar');
    g.input.updateCursor();
    return true;
  }
}

/* ======================= 2 · LEARN ======================= */
class LearnMode extends ModeBase {
  constructor(game) {
    super(game, 'learn');
    this.actions = {
      'learn-mission': (el) => { this.game.missions.active = el.dataset.id; this.frame(); this.game.ui.markDirty('panel', 'bar', 'tags', 'overlay'); },
      'learn-node': (el) => this.clickNode(el.dataset.key),
      'seq-test': () => { const r = this.game.missions.seqTest(); if (r === 'busy') this.game.ui.toast('A test signal is already travelling.', 'info'); },
      'bird-experience': () => { this.game.missions.startExperience(); this.game.ui.markDirty('panel', 'bar', 'overlay', 'tags'); },
      'word-context': (el) => { this.game.missions.startContext(el.dataset.ctx); this.game.ui.markDirty('panel', 'bar', 'overlay', 'tags'); },
      'preview-route': () => this.previewRoute(),
      'to-remember': () => this.game.action('goto', { dataset: { target: 'remember:' + (this.mission.memory || 'redbird') } }),
    };
  }
  get mission() { return LEARN_MISSIONS.find((m) => m.id === this.game.missions.active) || LEARN_MISSIONS[0]; }
  enter() { this.game.attention.override = null; }
  exit() { const st = this.game.missions.state; if (st.redbird.window) this.game.missions.endExperience(); st.word.context = null; this.game.attention.override = null; }
  neuronsFor(m = this.mission) {
    const g = this.game;
    if (m.id === 'sequence') return g.missions.seqNeurons();
    const mem = g.memory.memories[m.memory];
    return [...mem.features.map((f) => f.neuron), ...mem.indexNeurons];
  }
  spotlight() { return this.neuronsFor(); }
  frame() { this.game.camera.frameBounds(this.neuronsFor().map((n) => n.position), 1.75); }
  previewRoute() {
    const g = this.game, m = this.mission;
    let seq;
    if (m.id === 'sequence') seq = g.missions.seqNeurons();
    else if (m.id === 'redbird') seq = g.memory.memories.redbird.features.map((f) => f.neuron);
    else { const ctx = m.contexts.find((c) => c.id === (g.missions.state.word.context || 'read')); seq = ctx.path.map((id) => g.memory.memories.neuroplasticity.feature(id).neuron); }
    seq.forEach((n, i) => g.sim.schedule(i * 0.45, () => g.sim.fire(n, { forced: true, kind: 'lesson', cause: 'preview' })));
    g.ui.toast('Watching the route. Practise it yourself to change the connections—watching alone barely does.', 'info', 'eye');
  }
  clickNode(key) {
    const g = this.game, m = this.mission;
    if (g.paused) { g.ui.toast('Resume the simulation (Space) to practise.', 'warn', 'pause'); return; }
    if (m.id === 'sequence') { const i = m.nodes.indexOf(key); if (i >= 0) g.missions.seqClick(i); }
    else if (m.id === 'redbird') { const f = g.memory.memories.redbird.features.find((x) => x.key === key); if (f) g.missions.bindFeature(f.id); }
    else { const f = g.memory.memories.neuroplasticity.features.find((x) => x.key === key); if (f) g.missions.wordClick(f.id); }
    g.ui.markDirty('panel', 'bar', 'tags', 'overlay');
  }
  pick(hit) {
    if (!hit || hit.type !== 'neuron') return false;
    const keys = this.mission.id === 'sequence' ? this.mission.nodes : this.game.memory.memories[this.mission.memory].features.map((f) => f.key);
    if (!keys.includes(hit.obj.key)) return false;
    this.clickNode(hit.obj.key);
    return true;
  }
  missionCards() {
    const ms = this.game.missions;
    return `<div class="mission-list">${LEARN_MISSIONS.map((m) => `<button class="mission-card ${ms.active === m.id ? 'on' : ''} ${ms.isDone(m.id) ? 'done' : ''}" data-action="learn-mission" data-id="${m.id}"><span class="mn">${ms.isDone(m.id) ? '✓' : m.n}</span><span><div class="mt">${m.name}</div><div class="ms">${m.short}${ms.isDone(m.id) ? ' · complete' : ''}</div></span></button>`).join('')}</div>`;
  }
  pathStrip() {
    const g = this.game, syns = g.missions.seqSynapses(), st = g.missions.state.sequence;
    let html = '<div class="path-strip" aria-label="Pathway A to D">';
    LEARN_MISSIONS[0].labels.forEach((l, i) => {
      html += `<span class="node ${i < st.step ? 'lit' : ''}">${l}</span>`;
      if (i < 3) { const w = syns[i].weight; html += `<span class="link ${w >= 0.6 ? 'solid' : ''}" id="ps_${i}" style="--fill:${Math.round(20 + w * 70)}%;opacity:${(0.35 + w * 0.65).toFixed(2)}"></span>`; }
    });
    return html + '</div>';
  }
  panel() {
    const g = this.game, m = this.mission, ms = g.missions;
    let html = `${this.head(m.title, m.desc)}<div class="p-sec"><h3>Missions</h3>${this.missionCards()}</div>`;
    if (m.id === 'sequence') {
      const st = ms.state.sequence, syns = ms.seqSynapses();
      html += `<div class="p-sec"><h3>The route <span class="tag">${st.reps} repetition${st.reps === 1 ? '' : 's'}</span></h3>${this.pathStrip()}
        <p class="muted" style="font-size:.72rem;margin-bottom:.6rem">Dashed = weak and unreliable (before training). Solid and glowing = strong and reliable (after). Click A, B, C, D in order—in the 3D view or below it.</p>
        ${syns.map((s, i) => meter(`${m.labels[i]} → ${m.labels[i + 1]} strength`, s.weight, `seq_w${i}`, { mark: 1 / g.sim.synapticGain, markTitle: 'Enough to fire the next cell alone', color: '#fbbf5b' })).join('')}
        ${meter('Route reliability (A alone reaches D)', ms.seqReliability(), 'seq_rel', { color: '#5eead4' })}</div>
        <div class="p-sec grid2">${btn('seq-test', 'Test: fire A alone', { cls: 'primary', icon: 'spark' })}${btn('preview-route', 'Watch the route', { icon: 'eye' })}</div>
        ${st.lastTest ? `<div class="card ${st.lastTest.ok ? 'good' : 'warn'}" style="margin-top:.6rem"><h4>${st.lastTest.ok ? '✓ A alone reached D' : '✗ The signal faded'}</h4><p>${st.lastTest.ok ? 'The route is now strong enough to carry activity on its own.' : `Activity reached ${st.lastTest.reached} of 4 cells. Weak links release unreliably and cannot fire the next cell alone. Keep repeating A → B → C → D.`}</p></div>` : ''}`;
    } else if (m.id === 'redbird') {

        <p class="muted" style="font-size:.72rem;margin-top:.5rem">Each feature lives in a different region: ${mem.features.map((f) => f.neuron.region.def.short).join(', ')}. The hippocampus binds them.</p></div>
        <div class="p-sec">${btn('bird-experience', st.window ? 'Binding window open…' : st.experiences ? 'Experience it again' : 'Experience the scene', { cls: 'primary wide', icon: 'eye', disabled: !!st.window })}</div>
        <div class="p-sec">${meter('Stored strength', storage, 'bird_st', { mark: 0.55, markTitle: 'Mission target', color: '#c4a7ff' })}${meter('Retrieval accessibility', mem.retrievalAccessibility, 'bird_acc', { color: '#5eead4' })}${meter('Consolidation', mem.consolidation, 'bird_cons', { color: '#a99bff', thin: true })}
          <div class="row between" style="margin-top:.6rem;font-size:.78rem"><span class="muted">Experiences</span><b>${st.experiences}</b></div><div class="row between" style="font-size:.78rem"><span class="muted">Status</span><b>${mem.encoded ? 'Encoded' : 'Not yet encoded'}</b></div></div>
        ${mem.encoded ? `<div class="p-sec">${btn('to-remember', 'Test this memory in Remember', { cls: 'wide', icon: 'remember', disabled: !g.progression.isUnlocked('remember') })}</div>` : ''}`;

        ${ms.isDone('word') ? '<div class="card good"><h4>CONCEPT INTEGRATED</h4><p>Reading, hearing and using the word now all lead to its meaning. Build mode will show this concept already connected.</p></div>' : ''}`;

    html += science(m.science, m.game);

  }
  bar() {
    const g = this.game, m = this.mission, ms = g.missions;
    if (m.id === 'sequence') {
      const st = ms.state.sequence;
      return MB({ kicker: 'Mission 1', text: ms.isDone('sequence') ? 'Route reliable — try the other missions' : `Activate ${m.labels[st.step]} next · repeat A → B → C → D`, progress: ms.seqReliability(), count: `reliability ${pct(ms.seqReliability())}`,
        insight: '<b>Hebbian learning:</b> A firing shortly before B strengthens A → B.', actions: `${btn('seq-test', 'Test A alone', { icon: 'spark', cls: ms.seqReliability() > 0.5 ? 'primary' : '' })}${btn('preview-route', 'Watch', { icon: 'eye' })}` });

      insight: '<b>Varied practice:</b> different contexts build different retrieval routes.', actions: m.contexts.map((c) => btn('word-context', c.label, { cls: `sm ${st.context === c.id ? 'on' : ''}`, data: { ctx: c.id } })).join('') });
  }
  overlay() {
    const g = this.game, m = this.mission, ms = g.missions;
    let html = this.ambientChips();
    if (m.id === 'redbird' && ms.state.redbird.window) {
      const w = ms.state.redbird.window, mem = g.memory.memories.redbird;
      html += `<div class="stage-bottom"><div class="stage-card glass" style="text-align:center"><div class="eyebrow">Hippocampal binding window</div><h3>A red bird lands on the fence and sings.</h3><p>Activate each feature while the window is open.</p>
        <div class="chip-row" style="justify-content:center;margin-top:.7rem">${mem.features.map((f) => `<button class="chip ${w.bound.has(f.id) ? 'done' : ''}" data-action="learn-node" data-key="${f.key}">${w.bound.has(f.id) ? '✓ ' : ''}${esc(f.label)}</button>`).join('')}</div>
        <div class="window-bar"><i id="bindBar" style="width:${(100 * (1 - w.t / w.duration)).toFixed(1)}%"></i></div></div></div>`;
    } else if (m.id === 'word' && ms.state.word.context) {
      const ctx = m.contexts.find((c) => c.id === ms.state.word.context), mem = g.memory.memories.neuroplasticity;
      html += `<div class="stage-bottom"><div class="seq-track glass">${ctx.path.map((id, i) => `<button class="seq-step wide ${i < ms.state.word.step ? 'done' : i === ms.state.word.step ? 'next' : ''}" data-action="learn-node" data-key="${mem.feature(id).key}">${esc(mem.feature(id).label)}</button>`).join('')}</div></div>`;
    } else if (m.id === 'sequence') {

  decorate(d) {
    const g = this.game, m = this.mission, ms = g.missions;
    if (m.id === 'sequence') {
      const ns = ms.seqNeurons(), st = ms.state.sequence;
      ns.forEach((n, i) => d.hiNeurons.set(n, { rgb: COL.learn, level: i === st.step ? 1 : 0.6 }));
      ms.seqSynapses().forEach((s) => d.hiSynapses.set(s, { rgb: COL.learn, level: 0.55 }));
      d.rings.push({ pos: ns[st.step].position, rgb: [1, 0.8, 0.4], size: 0.36, param: 0.5 });
    } else {
      const mem = g.memory.memories[m.memory];
      for (const f of mem.features) d.hiNeurons.set(f.neuron, { rgb: COL.memory, level: 0.75 });
      for (const n of mem.indexNeurons) d.hiNeurons.set(n, { rgb: COL.learn, level: ms.state.redbird.window ? 1 : 0.5 });
      for (const id of mem.associatedSynapseIds) d.hiSynapses.set(g.sim.synapses[id], { rgb: COL.memory, level: 0.35 });
      if (m.id === 'word' && ms.state.word.context) {
        const ctx = m.contexts.find((c) => c.id === ms.state.word.context);
        const next = mem.feature(ctx.path[ms.state.word.step]);
        if (next) d.rings.push({ pos: next.neuron.position, rgb: [1, 0.8, 0.4], size: 0.36, param: 0.5 });
      }
      if (m.id === 'redbird' && ms.state.redbird.window) for (const f of mem.features) if (!ms.state.redbird.window.bound.has(f.id)) d.rings.push({ pos: f.neuron.position, rgb: [1, 0.6, 0.7], size: 0.36, param: 0.5, phase: f.neuron.id });
    }

  }
  tags() {
    const g = this.game, m = this.mission, ms = g.missions;
    if (m.id === 'sequence') {
      const st = ms.state.sequence;
      return ms.seqNeurons().map((n, i) => ({ id: 'l_' + n.key, text: m.labels[i], cls: i === st.step ? 'target' : '', color: '#fbbf5b', pos: () => n.position, action: 'learn-node', data: { key: n.key } }));
    }
    const mem = g.memory.memories[m.memory];
    const out = mem.features.map((f) => {
      let cls = '';
      if (m.id === 'redbird' && ms.state.redbird.window && !ms.state.redbird.window.bound.has(f.id)) cls = 'target';
      if (m.id === 'word' && ms.state.word.context) { const ctx = m.contexts.find((c) => c.id === ms.state.word.context); cls = ctx.path[ms.state.word.step] === f.id ? 'target' : ctx.path.includes(f.id) ? '' : 'dim'; }
      return { id: 'l_' + f.key, text: f.label.toUpperCase(), cls, color: f.neuron.region.def.color, pos: () => f.neuron.position, action: 'learn-node', data: { key: f.key } };
    });
    if (mem.indexNeurons.length) { const n = mem.indexNeurons[0]; out.push({ id: 'l_' + n.key, text: 'HIPPOCAMPAL INDEX', cls: 'dim', color: '#ffbf66', pos: () => n.position, term: 'hippocampus', dy: 16 }); }
    return out;
  }
  update() {
    const w = this.game.missions.state.redbird.window;
    if (w) setWidth('bindBar', 1 - w.t / w.duration);
    if (this._wasWindow && !w) this.game.ui.markDirty('overlay', 'tags', 'panel', 'bar');
    this._wasWindow = !!w;
  }
  live() {
    const g = this.game, m = this.mission, ms = g.missions;
    this.liveEncoding();
    if (m.id === 'sequence') {
      const syns = ms.seqSynapses();
      syns.forEach((s, i) => { setText(`seq_w${i}`, pct(s.weight)); setWidth(`seq_w${i}Bar`, s.weight); const el = document.getElementById(`ps_${i}`); if (el) { el.classList.toggle('solid', s.weight >= 0.6); el.style.setProperty('--fill', `${Math.round(20 + s.weight * 70)}%`); el.style.opacity = (0.35 + s.weight * 0.65).toFixed(2); } });
      const rel = ms.seqReliability(); setText('seq_rel', pct(rel)); setWidth('seq_relBar', rel); setWidth('mbBar', rel); setText('mbCount', `reliability ${pct(rel)}`);
    } else if (m.id === 'redbird') {
      const mem = g.memory.memories.redbird, s = g.memory.storage(mem);
      setText('bird_st', pct(s)); setWidth('bird_stBar', s); setText('bird_acc', pct(mem.retrievalAccessibility)); setWidth('bird_accBar', mem.retrievalAccessibility); setText('bird_cons', pct(mem.consolidation)); setWidth('bird_consBar', mem.consolidation);
      setWidth('mbBar', s / 0.55); setText('mbCount', `stored ${pct(s)}`);
    } else {
      const routes = ms.wordRoutes();
      routes.forEach((r, i) => { setText(`wr_${i}`, pct(r.strength)); setWidth(`wr_${i}Bar`, r.strength); });
      setWidth('mbBar', routes.reduce((s, r) => s + Math.min(1, r.strength / 0.5), 0) / 3);
    }
  }
}

/* ======================= 3 · REMEMBER ======================= */
class RememberMode extends ModeBase {
  constructor(game) {
    super(game, 'remember');
    this.memId = 'paris'; this.cues = null;
    this.actions = {
      'mem-select': (el) => { this.memId = el.dataset.id; this.cues = null; this.game.memory.lastRecall = null; this.frame(); this.game.ui.markDirty('panel', 'bar', 'tags', 'overlay'); },
      'cue-toggle': (el) => this.toggleCue(el.dataset.id),
      'recall-start': () => this.start(),
      concentrate: () => this.concentrate(),
      'suppress-intrusions': () => this.suppress(),
      'add-interference': () => { const m = this.mem; this.game.memory.addInterference(m, 0.3); this.game.ui.markDirty('panel'); },
    };
  }
  get mem() { return this.game.memory.memories[this.memId]; }
  get cueList() { return this.cues || [this.mem.cueId]; }
  enter() {
    const g = this.game;
    if (!this.mem.encoded) this.memId = 'paris';
  }
  exit() { this.game.memory.cancelRecall(); }
  spotlight() { const m = this.mem; return [...m.features.map((f) => f.neuron), ...m.indexNeurons]; }
  frame() { this.game.camera.frameBounds(this.mem.features.map((f) => f.neuron.position), 1.3); }
  toggleCue(id) {
    if (this.game.memory.recall) return;
    let c = this.cueList.slice();
    if (c.includes(id)) c = c.filter((x) => x !== id); else c.push(id);
    if (!c.length) c = [id];
    if (c.length > 2) c = c.slice(-2);
    this.cues = c; this.game.memory.lastRecall = null;
    this.game.ui.markDirty('panel', 'tags', 'bar');
  }
  start() {
    const g = this.game, m = this.mem;
    if (!m.encoded) { g.ui.toast(`${m.name} is not encoded yet. Form it in Learn first.`, 'warn', 'memory'); return; }
    if (g.memory.recall) return;
    if (g.paused) g.setPaused(false);
    g.memory.startRecall(m.id, this.cueList);
    g.audio.chime(0.5);
    g.ui.markDirty('panel', 'bar', 'tags', 'overlay');
  }
  concentrate() {
    const r = this.game.memory.concentrate();
    if (r === 'tired') this.game.ui.toast('Focus energy is low. It recovers over time.', 'warn', 'focus');
    else if (r === 'idle') this.game.ui.toast('Start a recall first.', 'info');
  }
  suppress() {
    const n = this.game.memory.suppressIntrusions();
    if (!n) this.game.ui.toast(this.game.memory.recall ? 'No intrusions right now.' : 'Start a recall first.', 'info');
  }
  key(k) {
    if (k === 'c') { this.concentrate(); return true; }
    if (k === 'x') { this.suppress(); return true; }
    if (k === 'enter' && !this.game.memory.recall) { this.start(); return true; }
    return false;
  }
  memoryCards() {
    const g = this.game;
    return `<div class="mission-list">${g.memory.list.map((m) => {
      const st = g.memory.status(m), s = g.memory.storage(m);
      return `<button class="mission-card ${this.memId === m.id ? 'on' : ''}" data-action="mem-select" data-id="${m.id}" ${m.encoded ? '' : 'disabled'}><span class="mn" style="${m.encoded ? `color:${m.def.color}` : ''}">${icon(m.encoded ? 'memory' : 'lock')}</span><span style="flex:1;min-width:0"><div class="mt">${m.name}</div><div class="ms">${m.encoded ? `${st.label} · stored ${pct(s)} · access ${pct(m.retrievalAccessibility)}` : st.text}</div></span></button>`;
    }).join('')}</div>`;
  }
  resultCard() {
    const lr = this.game.memory.lastRecall;
    if (!lr || lr.m !== this.mem) return '';
    const cls = lr.success ? 'good' : lr.partial ? 'warn' : 'bad';
    const head = lr.success ? '✓ Pattern completed' : lr.partial ? '◐ Partial recall' : '✗ Retrieval failed';
    const why = lr.success ? 'A fragment reactivated the whole distributed pattern.' : `The memory is still stored (${pct(lr.storage)}), but the route from this cue is weak (accessibility was ${pct(lr.accBefore)}). It is hard to access—not erased.`;
    return `<div class="card ${cls}" style="margin-top:.8rem"><h4>${head} · ${lr.revealed} of ${lr.total} features</h4><p>${why}</p><p style="margin-top:.4rem"><b>Retrieval practice:</b> accessibility ${pct(lr.accBefore)} → ${pct(lr.accAfter)}${lr.intrusions ? ` · ${lr.intrusions} intrusion${lr.intrusions > 1 ? 's' : ''} suppressed` : ''}.</p></div>`;
  }
  panel() {
    const g = this.game, m = this.mem, r = g.memory.recall, storage = g.memory.storage(m), st = g.memory.status(m);
    const recalled = g.memory.list.filter((x) => x.successCount > 0).length;
    return `${this.head('Reconstruct a memory', 'You get one fragment. Activation spreads through the memory’s own synapses and reconstructs the rest—if the route is strong enough. Storage and access are different things.')}
      <div class="p-sec"><h3>Memories <span class="tag ${recalled >= 2 ? 'good' : ''}">${recalled} / 2 recalled</span></h3>${this.memoryCards()}</div>
      <div class="card ${st.tone}" style="margin-top:.8rem"><h4>${m.name} · ${st.label}</h4><p>${st.text}</p></div>
      <div class="p-sec">${meter('Memory stored', storage, 'rm_st', { color: '#c4a7ff' })}${meter('Retrieval accessibility', m.retrievalAccessibility, 'rm_acc', { color: '#5eead4' })}${meter('Consolidation', m.consolidation, 'rm_cons', { color: '#a99bff', thin: true })}${meter('Interference', m.interference, 'rm_int', { color: '#ff8a96', thin: true })}</div>
      <div class="p-sec"><h3>Partial cue <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:500">choose 1–2 fragments</span></h3><div class="chip-row">${m.features.map((f) => `<button class="chip ${this.cueList.includes(f.id) ? 'on' : ''}" data-action="cue-toggle" data-id="${f.id}" ${r ? 'disabled' : ''}>${esc(f.label)}</button>`).join('')}</div></div>
      <div class="p-sec stack">${btn('recall-start', r ? 'Reconstructing…' : 'Recall from this cue', { cls: 'primary wide', icon: 'remember', disabled: !!r || !m.encoded })}
        <div class="grid2">${btn('concentrate', 'Concentrate', { kbd: 'C', disabled: !r })}${btn('suppress-intrusions', 'Suppress intrusions', { kbd: 'X', disabled: !r })}</div>
        ${meter('Focus energy', g.attention.energy, 'rm_energy', { color: '#5eead4', thin: true })}
        ${r ? meter('Retrieval drive (live)', clamp(r.A), 'rm_drive', { color: '#c4a7ff' }) : ''}
        ${this.resultCard()}</div>
      <div class="p-sec">${btn('add-interference', 'Add interference (a similar memory)', { cls: 'wide', icon: 'wave' })}<p class="muted" style="font-size:.72rem;margin-top:.4rem">Raises competition from similar memories without touching the stored synapses. Watch for intrusions.</p></div>
      ${science('Recall often works by pattern completion: a partial cue reactivates a wider assembly. Researchers distinguish storage strength from current retrieval strength; retrieving a memory makes later retrieval easier.', 'Each node passes on activation ∝ synapse weight × retrieval drive. Drive = accessibility × (1 − interference) × attention, plus effortful concentration. Forgetting lowers accessibility, not storage.')}`;
  }
  bar() {
    const g = this.game, r = g.memory.recall, m = this.mem;
    const recalled = g.memory.list.filter((x) => x.successCount > 0).length;
    const feats = m.features.length - this.cueList.length;
    return MB({
      kicker: r ? 'Recall in progress' : 'Objective', text: r ? `Reconstructing ${m.name}… concentrate (C) or suppress intrusions (X)` : `Recall a memory from a partial cue · ${m.name}`,
      progress: r ? [...r.nodes.values()].filter((n) => n.feature && !n.cue && n.revealed).length / Math.max(1, feats) : recalled / 2, count: r ? 'features' : `${recalled} / 2 memories`,
      insight: '<b>Forgetting ≠ deletion:</b> low accessibility can coexist with strong storage.',
      actions: r ? `${btn('concentrate', 'Concentrate', { cls: 'primary', kbd: 'C' })}${btn('suppress-intrusions', 'Suppress', { kbd: 'X' })}` : `${btn('recall-start', 'Recall', { cls: 'primary', icon: 'remember', disabled: !m.encoded })}${btn('add-interference', 'Interference', { icon: 'wave' })}`,
    });
  }
  overlay() {
    const g = this.game, r = g.memory.recall, lr = g.memory.lastRecall;
    let html = this.ambientChips();
    const m = this.mem;
    if (r || (lr && lr.m === m)) {
      const nodes = r ? r.nodes : lr.nodes;
      html += `<div class="stage-bottom"><div class="seq-track glass">${m.features.map((f) => { const n = nodes.get(f.neuron); const shown = n.cue || n.revealed; return `<span class="seq-step wide ${n.cue ? 'next' : shown ? 'done' : ''}" id="rc_${f.id}">${shown ? esc(f.label) : '?'}</span>`; }).join('')}</div></div>`;
    }
    return html;
  }
  decorate(d) {
    const g = this.game, m = this.mem, r = g.memory.recall, lr = g.memory.lastRecall;
    const nodes = r ? r.nodes : lr && lr.m === m ? lr.nodes : null;
    for (const f of m.features) {
      const n = nodes?.get(f.neuron);
      const on = n && (n.cue || n.revealed);
      d.hiNeurons.set(f.neuron, { rgb: on ? [0.95, 0.88, 1] : COL.memory, level: on ? 1 : 0.35 });
    }
    for (const n of m.indexNeurons) d.hiNeurons.set(n, { rgb: COL.memory, level: nodes?.get(n)?.revealed ? 0.9 : 0.25 });
    for (const id of m.associatedSynapseIds) {
      const s = g.sim.synapses[id];
      const a = nodes?.get(s.source), b = nodes?.get(s.target);
      const lit = a && b && (a.revealed || a.cue) && (b.revealed || b.cue);
      d.hiSynapses.set(s, { rgb: COL.memory, level: lit ? 0.6 : 0.12 });
    }
    if (r) for (const l of r.lures) if (l.intruding) { d.hiNeurons.set(l.neuron, { rgb: COL.bad, level: 1 }); d.rings.push({ pos: l.neuron.position, rgb: [1, 0.4, 0.45], size: 0.7, param: 0.4 }); }
    d.dim = 0.5;
  }
  tags() {
    const g = this.game, m = this.mem, out = [];
    for (const f of m.features) {
      out.push({ id: 'rm_' + f.id, color: m.def.color, pos: () => f.neuron.position, html: '', dynamic: () => {
        const r = g.memory.recall, lr = g.memory.lastRecall, nodes = r ? r.nodes : lr && lr.m === m ? lr.nodes : null;
        const n = nodes?.get(f.neuron);
        if (this.cueList.includes(f.id)) return { text: `CUE · ${f.label.toUpperCase()}`, cls: 'target' };
        if (n && n.revealed) return { text: f.label.toUpperCase(), cls: 'revealed' };
        return { text: '?', cls: 'hiddenf' };
      } });
    }
    const r = g.memory.recall;
    if (r) for (const l of r.lures) out.push({ id: 'lure_' + l.label, kind: 'node-tag', pos: () => (l.intruding ? l.neuron.position : null), html: `INTRUSION · ${esc(l.label.toUpperCase())}`, cls: 'intrusion', action: 'suppress-intrusions' });
    return out.map((t) => { if (t.dynamic) { const v = t.dynamic(); t.text = v.text; t.cls = v.cls; t.html = undefined; } return t; });
  }
  update() {
    const g = this.game, r = g.memory.recall;
    if (r) {
      const sig = [...r.nodes.values()].map((n) => (n.revealed ? 1 : 0)).join('') + r.lures.map((l) => (l.intruding ? 1 : 0)).join('');
      if (sig !== this._sig) { this._sig = sig; g.ui.markDirty('tags', 'overlay'); }
    } else if (this._sig) { this._sig = null; g.ui.markDirty('tags', 'overlay', 'panel', 'bar'); }
  }
  live() {
    const g = this.game, m = this.mem, r = g.memory.recall, s = g.memory.storage(m);
    setText('rm_st', pct(s)); setWidth('rm_stBar', s); setText('rm_acc', pct(m.retrievalAccessibility)); setWidth('rm_accBar', m.retrievalAccessibility);
    setText('rm_cons', pct(m.consolidation)); setWidth('rm_consBar', m.consolidation); setText('rm_int', pct(m.interference)); setWidth('rm_intBar', m.interference);
    setText('rm_energy', pct(g.attention.energy)); setWidth('rm_energyBar', g.attention.energy);
    if (r) {
      setText('rm_drive', pct(clamp(r.A))); setWidth('rm_driveBar', clamp(r.A));
      const feats = m.features.length - this.cueList.length;
      const rev = [...r.nodes.values()].filter((n) => n.feature && !n.cue && n.revealed).length;
      setWidth('mbBar', rev / Math.max(1, feats)); setText('mbCount', `${rev} / ${feats} features`);
    }
  }
}

/* ======================= 4 · TRAIN ======================= */
class TrainMode extends ModeBase {
  constructor(game) {
    super(game, 'train');
    this.actions = {
      'piano-key': (el) => this.press(+el.dataset.note),
      'skill-seq': (el) => { this.game.skill.setSequence(el.dataset.id); this.game.ui.markDirty('panel', 'bar', 'overlay', 'tags'); },
      'skill-auto': () => { const r = this.game.skill.autoplay(); if (r === 'busy') this.game.ui.toast('Wait for the current playback to finish.', 'info'); this.game.ui.markDirty('overlay'); },
      'skill-preview': () => { this.game.skill.playPreview(); this.game.ui.markDirty('overlay'); },
    };
  }
  spotlight() { const s = this.game.skill; return [...s.keys, ...s.cereb, s.control]; }
  frame() { const s = this.game.skill; this.game.camera.frameBounds([...s.keys, s.control].map((n) => n.position), 1.9, { yaw: 0.25, pitch: 0.3 }); }
  press(i) {
    const g = this.game;
    if (g.paused) { g.ui.toast('Resume the simulation (Space) to practise.', 'warn', 'pause'); return; }
    const r = g.skill.press(i);
    if (r === 'busy') g.ui.toast('The network is playing—listen first.', 'info');
    g.ui.markDirty('overlay', 'tags');
    if (r !== 'busy') g.ui.markDirty('bar');
  }
  key(k, e) {
    const i = PIANO.keys.indexOf(k.toUpperCase());
    if (i >= 0 && !e.repeat) { this.press(i); return true; }
    return false;
  }
  panel() {
    const g = this.game, sk = g.skill, mt = sk.metrics(), seq = sk.seq;
    const order = SKILL_STAGES.findIndex((s) => s.id === mt.stage.id);
    const tr = sk.transitions();
    const exp = g.reward.expectations['skill:' + seq.id] ?? 0.25;
    return `${this.head('Practise makes a pathway', 'Play the sequence with A S D F. Each correct transition is a real synapse between motor neurons: practice strengthens it and grows myelin, until the network can play the sequence on its own.')}
      <div class="p-sec"><h3>Sequences</h3><div class="mission-list">${PIANO.sequences.map((s) => `<button class="mission-card ${sk.seqId === s.id ? 'on' : ''}" data-action="skill-seq" data-id="${s.id}"><span class="mn">${s.notes.length}</span><span style="flex:1"><div class="mt">${s.name}</div><div class="ms mono">${s.notes.map((n) => PIANO.keys[n]).join(' ')} · ${sk.reps[s.id]} reps · ${SKILL_STAGES.find((x) => x.id === sk.stage[s.id]).name}</div></span></button>`).join('')}</div></div>
      <div class="p-sec"><h3>Stage</h3><div class="steps">${SKILL_STAGES.map((s, i) => `<div class="step ${i < order ? 'done' : i === order ? 'now' : ''}"><span class="n">${i < order ? '✓' : i + 1}</span><span><b>${s.name}</b><br><span class="muted" style="font-size:.72rem">${s.desc}</span></span></div>`).join('')}</div></div>
      <div class="p-sec"><div class="metric-grid">${metric('Conscious effort', pct(mt.effort), 'tr_effort', 'prefrontal assistance')}${metric('Network efficiency', pct(mt.eff), 'tr_eff', 'weight × myelin')}${metric('Execution speed', mt.reaction ? `${mt.speed.toFixed(1)}<small>notes/s</small>` : '—', 'tr_speed', mt.reaction ? `${Math.round(mt.reaction * 1000)} ms between notes` : 'play to measure')}${metric('Error rate', pct(mt.errorRate), 'tr_err', `last ${Math.min(24, sk.recent.length)} presses`)}</div></div>
      <div class="p-sec">${kv([['Accuracy', sk.presses ? pct(1 - sk.errors / sk.presses) : '—', 'tr_acc'], ['Mistakes', sk.errors, 'tr_mis'], ['Reaction time', mt.reaction ? `${Math.round(mt.reaction * 1000)} ms` : '—', 'tr_rt'], ['Sequences completed', sk.reps[seq.id], 'tr_reps'], ['Total key presses', sk.presses, 'tr_pr']])}</div>
      <div class="p-sec"><h3>Transitions in this sequence</h3>${tr.map((s, i) => meter(`${PIANO.keys[sk.keys.indexOf(s.source)]} → ${PIANO.keys[sk.keys.indexOf(s.target)]}`, s.weight, `tr_w${i}`, { mark: 1 / g.sim.synapticGain, color: '#60b8ff', delta: s.myelinLevel > 0.05 ? `myelin ${pct(s.myelinLevel)}` : '', deltaColor: '#f3e9c8' })).join('')}</div>
      <div class="p-sec stack">${btn('skill-auto', 'Let the network play', { cls: 'primary wide', icon: 'play', disabled: sk.busy() })}${btn('skill-preview', 'Hear the target sequence', { cls: 'wide', icon: 'eye', disabled: sk.busy() })}
        ${sk.lastAuto ? `<div class="card ${sk.lastAuto.ok ? 'good' : 'warn'}"><h4>${sk.lastAuto.ok ? '✓ Played by the network' : `✗ Stopped at note ${sk.lastAuto.reached} of ${sk.lastAuto.total}`}</h4><p>${sk.lastAuto.ok ? 'Each transition was strong enough to fire the next motor neuron by itself—no conscious control needed.' : 'A transition was too weak to fire the next neuron alone. Keep practising that step.'}</p></div>` : ''}</div>
      <div class="p-sec"><h3>Reward learning ${term('reward', '?')}</h3><div class="card"><p><b>Action → result → reward signal → network update → future behaviour.</b> Completing the sequence sends a reward burst that strengthens recently active (eligible) synapses.</p>
        ${kv([['Expected outcome', pct(exp), 'tr_exp'], ['Last prediction error', sk.lastRep ? `${sk.lastRep.rpe >= 0 ? '+' : ''}${sk.lastRep.rpe.toFixed(2)}` : '—', 'tr_rpe'], ['Repetitions', sk.reps[seq.id]]])}
        <p style="margin-top:.4rem">As the outcome becomes predictable, the reward burst shrinks—it signals surprise, not pleasure.</p></div></div>
      ${science('Motor skills become faster and less effortful with practice as circuits in motor cortex, cerebellum and basal ganglia reorganise. Studies suggest practice can also change myelination.', 'Weak transitions need the prefrontal “conscious control” cell (violet pulses). Strong ones pre-activate the next key (dashed outline). Synaptic strength and myelin are separate: strength sets influence, myelin sets speed.')}`;
  }
  bar() {
    const g = this.game, sk = g.skill, mt = sk.metrics();
    return MB({ kicker: 'Objective', text: mt.stage.id === 'skilled' ? (mt.fading ? 'Skill fading from disuse — practise to refresh it' : 'Skilled! Try “Let the network play”') : `Reach the Skilled stage · ${sk.seq.name}`, progress: mt.eff / 0.62, count: `${mt.stage.name} · ${pct(mt.eff)}`,
      insight: '<b>Practice:</b> repeated, rewarded activation turns effortful steps into automatic ones.', actions: `${btn('skill-preview', 'Hear it', { icon: 'eye', disabled: sk.busy() })}${btn('skill-auto', 'Network plays', { icon: 'play', disabled: sk.busy() })}` });
  }
  overlay() {
    const g = this.game, sk = g.skill, seq = sk.seq;
    const expected = seq.notes[sk.pos];
    return `${this.ambientChips()}<div class="stage-bottom"><div class="seq-track glass">${seq.notes.map((n, i) => `<span class="seq-step ${i < sk.pos ? 'done' : i === sk.pos ? 'next' : ''}">${PIANO.notes[n]}</span>`).join('')}</div>
      <div class="piano glass" role="group" aria-label="Piano keys">${PIANO.keys.map((k, i) => `<button class="key ${i === expected && !sk.busy() ? 'expect' : ''} ${sk.predicted === i ? 'predicted' : ''}" id="pk_${i}" data-action="piano-key" data-note="${i}" aria-label="Note ${PIANO.notes[i]}, key ${k}">${PIANO.notes[i]}<small>${k}</small></button>`).join('')}</div></div>`;
  }
  decorate(d) {
    const sk = this.game.skill;
    sk.keys.forEach((n) => d.hiNeurons.set(n, { rgb: COL.skill, level: 0.8 }));
    sk.cereb.forEach((n) => d.hiNeurons.set(n, { rgb: COL.skill, level: 0.4 }));
    d.hiNeurons.set(sk.control, { rgb: COL.control, level: 0.5 });
    for (const s of sk.transitions()) d.hiSynapses.set(s, { rgb: COL.skill, level: 0.5 });
    d.dim = 0.5;
  }
  tags() {
    const sk = this.game.skill;
    const out = sk.keys.map((n, i) => ({ id: 'k_' + i, text: `${PIANO.keys[i]} · ${PIANO.notes[i]}`, color: '#60b8ff', pos: () => n.position, action: 'piano-key', data: { note: i } }));
    out.push({ id: 'k_ctrl', text: 'CONSCIOUS CONTROL', cls: 'dim', color: '#c4a7ff', pos: () => sk.control.position, term: 'prefrontal' });
    out.push({ id: 'k_cb', text: 'CEREBELLAR REFINEMENT', cls: 'dim', color: '#6ddc8f', pos: () => sk.cereb[1].position, term: 'cerebellum' });
    return out;
  }
  update() {
    const sk = this.game.skill;
    for (let i = 0; i < 4; i++) { const el = document.getElementById('pk_' + i); if (el) el.classList.toggle('lit', sk.keyFlash[i] > 0.3); }
    const busy = sk.busy();
    if (busy !== this._busy) { this._busy = busy; this.game.ui.markDirty('overlay', 'panel', 'bar'); }
  }
  live() {
    const sk = this.game.skill, mt = sk.metrics();
    setText('tr_effort', pct(mt.effort)); setText('tr_eff', pct(mt.eff)); setText('tr_err', pct(mt.errorRate));
    setText('tr_acc', sk.presses ? pct(1 - sk.errors / sk.presses) : '—'); setText('tr_mis', sk.errors); setText('tr_rt', mt.reaction ? `${Math.round(mt.reaction * 1000)} ms` : '—');
    setText('tr_reps', sk.reps[sk.seqId]); setText('tr_pr', sk.presses);
    setText('tr_speed', mt.reaction ? `${mt.speed.toFixed(1)} notes/s` : '—');
    sk.transitions().forEach((s, i) => { setText(`tr_w${i}`, pct(s.weight)); setWidth(`tr_w${i}Bar`, s.weight); });
    setWidth('mbBar', mt.eff / 0.62); setText('mbCount', `${mt.stage.name} · ${pct(mt.eff)}`);
  }
}

/* ======================= 5 · FOCUS ======================= */
class FocusMode extends ModeBase {
  constructor(game) {
    super(game, 'focus');
    this.actions = {
      'focus-start': () => this.start(),
      'focus-abort': () => { this.game.attention.endSession(true); this.game.ui.markDirty('panel', 'bar', 'overlay'); },
      'focus-reinforce': () => this.reinforce(),
      'focus-suppress': (el) => this.suppress(el?.dataset?.id ? +el.dataset.id : null),
    };
  }
  exit() { this.game.attention.endSession(true); document.body.classList.remove('focus-session'); this._active = false; }
  /** Start a focus session (the Start button; Demo Mode passes a short scripted session). */
  start(opts) { const g = this.game; if (g.paused) g.setPaused(false); g.attention.startSession(opts); g.ui.markDirty('panel', 'bar', 'overlay'); g.audio.chime(0.7); }
  frame() { this.game.camera.flyTo({ yaw: 0.3, pitch: 0.22, radius: 16.5, target: [0, 0.6, 0.2] }, 1.2); }
  reinforce() { const r = this.game.attention.reinforce(); if (r === 'idle') this.game.ui.toast('Start the focus session first.', 'info', 'focus'); }
  suppress(id) { const r = this.game.attention.suppress(id); if (r === 'idle') this.game.ui.toast('Start the focus session first.', 'info', 'focus'); }
  key(k) {
    if (k === 'j') { this.reinforce(); return true; }
    if (k === 'k') { this.suppress(null); return true; }
    if (k === 'enter' && !this.game.attention.session) { this.actions['focus-start'](); return true; }
    return false;
  }
  panel() {
    const g = this.game, a = g.attention, s = a.session, res = a.lastSession;
    return `${this.head('Protect the task network', 'Your task is CODING. Distractions activate competing networks that pull activity away. Reinforce the task, suppress distractions that threaten it—and ignore the ones that fade on their own.')}
      <div class="p-sec"><div class="card accent"><h4>Controls</h4><p><span class="kbd">J</span> reinforce CODING (or engage a task-relevant signal) · <span class="kbd">K</span> suppress the strongest distraction · click a distraction to suppress that one. Each action spends focus energy.</p></div></div>
      <div class="p-sec">${s ? btn('focus-abort', 'End session early', { cls: 'wide', icon: 'close' }) : btn('focus-start', res ? 'Start another session' : 'Start the 60-second session', { cls: 'primary wide', icon: 'focus' })}</div>
      ${res ? `<div class="p-sec"><h3>Last session · grade ${res.grade}</h3><div class="metric-grid">${metric('Focus duration', pct(res.focusDuration), '', 'task dominant')}${metric('Task switches', res.switches, '', 'attention captured')}${metric('Encoding quality', pct(res.encodingQuality), '', 'what would be learned')}${metric('Suppression', pct(res.suppression), '', `${res.suppressed} of ${res.threats} threats`)}${metric('Accuracy', pct(res.accuracy), '', `${res.correct} / ${res.decisions} decisions`)}${metric('Best streak', `${res.bestStreak.toFixed(0)}<small>s</small>`, '', 'Deep Focus at 20 s')}</div>
        <div class="card ${res.success ? 'good' : 'warn'}" style="margin-top:.6rem"><h4>${res.success ? '✓ Target network protected' : 'Try again'}</h4><p>${res.wasted ? `${res.wasted} suppression${res.wasted > 1 ? 's' : ''} spent on fading sounds or thoughts—those habituate if ignored. ` : ''}${res.missed ? `${res.missed} task-relevant signal${res.missed > 1 ? 's were' : ' was'} missed. ` : ''}Encoding quality now feeds into Learn for a while.</p></div></div>` : ''}
      <div class="p-sec"><h3>Attention ${term('attention', '?')}</h3>${meter('Focus (baseline in this game)', a.baseline, 'fo_base', { color: '#5eead4' })}${meter('Distraction now', a.distraction, 'fo_dis', { color: '#ff9f7a', thin: true })}${meter('Encoding quality now', a.encodingQuality, 'fo_enc', { color: '#5eead4', thin: true })}<p class="muted" style="font-size:.72rem;margin-top:.4rem">Good sessions slightly raise the game’s focus baseline. This is not an attention test and does not measure you.</p></div>
      ${science('Selective attention biases competition between neural representations: attended inputs get stronger processing, competing ones are suppressed. Salient or rewarding stimuli can capture attention.', 'A “task” network competes with distractor networks (phone, social media, food, chat, sounds, notifications, random thoughts). Dominance = task activity relative to total distractor activity.')}`;
  }
  bar() {
    const a = this.game.attention, s = a.session;
    if (!s) return MB({ text: 'Keep the CODING network dominant for 60 seconds', progress: a.lastSession ? a.lastSession.focusDuration : 0, count: a.lastSession ? `last: ${pct(a.lastSession.focusDuration)} focused` : 'not started', insight: '<b>Attention is selection,</b> not unlimited effort.', actions: btn('focus-start', 'Start', { cls: 'primary', icon: 'focus' }) });
    return MB({ kicker: 'Focus session', text: s.captured ? `Attention captured by ${s.captured.label} — suppress it or reinforce the task!` : 'Reinforce CODING · suppress threats · ignore what fades', progress: s.t / s.duration, count: `${Math.ceil(s.duration - s.t)} s left`,
      actions: `${btn('focus-reinforce', 'Reinforce task', { cls: 'primary', kbd: 'J' })}${btn('focus-suppress', 'Suppress', { kbd: 'K' })}` });
  }
  overlay() {
    const a = this.game.attention, s = a.session;
    if (!s) return '';
    const items = s.distractors;
    return `<div class="focus-hud glass"><div class="focus-top"><div><div class="eyebrow">Task · CODING</div><div class="clock" id="fo_clock">${Math.ceil(s.duration - s.t)}s</div></div><div style="flex:1;max-width:12rem">${meter('Focus energy', a.energy, 'fo_energy', { color: '#5eead4', thin: true })}</div><div class="focus-flags"><span class="tag">switches <b id="fo_sw" style="margin-left:.3rem">${s.switches}</b></span><span class="tag">streak <b id="fo_streak" style="margin-left:.3rem">${Math.floor(s.streak)}s</b></span></div></div>
      <div class="compete"><span class="nm task">CODING TASK</span><span class="bar"><i id="fo_task" style="--c:var(--exc);width:${pct(s.T)}"></i></span><span class="val" id="fo_taskV">${pct(s.T)}</span>
      ${items.map((d) => `<span class="nm" style="color:${d.relevant ? 'var(--exc)' : '#ffb59a'}">${esc(d.label)}${d.relevant ? ' ✓' : d.def.habituates ? ' ~' : ''}</span><span class="bar"><i id="fo_d${d.id}" style="--c:${d.relevant ? 'var(--exc)' : '#ff8f70'};width:${pct(d.salience)}"></i></span><span class="val" id="fo_d${d.id}V">${pct(d.salience)}</span>`).join('')}</div>
      <div class="row between" style="margin-top:.5rem;font-size:.7rem" ><span class="muted">✓ task-relevant: engage with J · ~ fades if ignored</span><span class="muted">dominance <b id="fo_dom">${pct(s.dominance)}</b></span></div>
      <div class="row between" style="margin-top:.35rem;font-size:.68rem;letter-spacing:.08em"><span class="muted">FOCUS <b id="fo_focusNow" style="color:var(--ink)">${pct(a.focus)}</b></span><span class="muted">DISTRACTION <b id="fo_disNow" style="color:var(--ink)">${pct(a.distraction)}</b></span><span class="muted">ENCODING QUALITY <b id="fo_encNow" style="color:var(--ink)">${pct(a.encodingQuality)}</b></span></div></div>
      ${s.captured ? `<div class="captured-banner"><b>ATTENTION CAPTURED</b>${esc(s.captured.label)} is dominating. Suppress it (K) or reinforce the task (J).</div>` : ''}
      ${items.map((d) => `<button class="lbl3d distractor ${d.relevant ? 'relevant' : ''} ${d.def.habituates ? 'habituating' : ''}" data-distractor="${d.id}" data-action="${d.relevant ? 'focus-reinforce' : 'focus-suppress'}" data-id="${d.id}" style="--s:${d.salience.toFixed(2)}"><span class="ring"><i>${icon(d.relevant ? 'check' : 'close', 'sm')}</i></span><span>${esc(d.label)}<div class="hint">${d.relevant ? 'TASK-RELEVANT · ENGAGE (J)' : d.def.habituates ? 'FADES IF IGNORED' : 'CLICK TO SUPPRESS'}</div></span></button>`).join('')}`;
  }
  decorate(d) {
    const a = this.game.attention, s = a.session;
    for (const n of a.taskNeurons) d.hiNeurons.set(n, { rgb: COL.focus, level: s ? 0.5 + 0.5 * s.T : 0.6 });
    if (s) for (const x of s.distractors) d.orbs.push({ pos: x.pos, rgb: x.relevant ? [0.4, 1, 0.85] : [1, 0.55, 0.38], alpha: 0.4 + 0.6 * x.salience, size: 0.25 + 0.35 * x.salience });
    if (s && s.captured) d.focusRegion = this.game.sim.regionById[s.captured.def.regions[0]];
  }
  update() {
    const a = this.game.attention;
    const active = !!a.session;
    if (active !== this._active) { this._active = active; document.body.classList.toggle('focus-session', active); this.game.ui.markDirty('panel', 'bar', 'overlay'); }
    if (a.session) {
      const cap = a.session.captured ? a.session.captured.id : null;
      if (cap !== this._cap) { this._cap = cap; this.game.ui.markDirty('overlay', 'bar'); }
    }
  }
  live() {
    const a = this.game.attention, s = a.session;
    setText('fo_base', pct(a.baseline)); setWidth('fo_baseBar', a.baseline); setText('fo_enc', pct(a.encodingQuality)); setWidth('fo_encBar', a.encodingQuality);
    setText('fo_dis', pct(a.distraction)); setWidth('fo_disBar', a.distraction); setText('fo_focusNow', pct(a.focus)); setText('fo_disNow', pct(a.distraction)); setText('fo_encNow', pct(a.encodingQuality));
    if (!s) return;
    setText('fo_clock', `${Math.ceil(s.duration - s.t)}s`); setText('fo_energy', pct(a.energy)); setWidth('fo_energyBar', a.energy);
    setText('fo_sw', s.switches); setText('fo_streak', `${Math.floor(s.streak)}s`); setText('fo_dom', pct(s.dominance));
    setWidth('fo_task', s.T); setText('fo_taskV', pct(s.T));
    for (const d of s.distractors) { setWidth(`fo_d${d.id}`, d.salience); setText(`fo_d${d.id}V`, pct(d.salience)); }
    setWidth('mbBar', s.t / s.duration); setText('mbCount', `${Math.ceil(s.duration - s.t)} s left`);
  }
}

/* ======================= 6 · DREAM ======================= */
class DreamMode extends ModeBase {
  constructor(game) {
    super(game, 'dream');
    this.actions = {
      'dream-start': () => { const g = this.game; if (g.paused) g.setPaused(false); g.sleep.start(); g.ui.markDirty('panel', 'bar', 'overlay'); g.camera.flyTo({ yaw: g.camera.want.yaw + 0.3, pitch: 0.34, radius: 18, target: [0.3, 0.2, 0] }, 2.5); },
      'dream-stop': () => { this.game.sleep.stop(); this.game.ui.markDirty('panel', 'bar', 'overlay'); },
      'dream-accel': () => { const s = this.game.sleep; s.accelerated = !s.accelerated; this.game.ui.markDirty('panel', 'bar'); },
    };
  }
  exit() { if (this.game.sleep.active) this.game.sleep.stop(); }
  frame() { this.game.camera.flyTo({ yaw: 0.6, pitch: 0.3, radius: 17.5, target: [0.3, 0.2, 0] }, 1.4); }
  flow(vertical = false) {
    const s = this.game.sleep;
    const cur = s.active ? s.phase.flow : s.summary && !s.summary.early ? 4 : 0;
    return `<div class="dream-flow${vertical ? ' vertical' : ''}">${SLEEP_FLOW.map((f, i) => `<span class="${i < cur ? 'done' : i === cur ? 'on' : ''}">${f}</span>${i < SLEEP_FLOW.length - 1 ? `<i>${vertical ? '↓' : '→'}</i>` : ''}`).join('')}</div>`;
  }
  table(sum) {
    const rows = sum.before.memories.map((b, i) => ({ b, a: sum.after.memories[i] })).filter((x) => x.b.encoded || x.a.encoded);
    const cell = (b, a, inverse) => { const d = a - b; const good = inverse ? d < -0.005 : d > 0.005; const bad = inverse ? d > 0.005 : d < -0.005; return `<td>${pct(b)} → <b>${pct(a)}</b> <span class="${good ? 'up' : bad ? 'down' : ''}">${Math.abs(d) > 0.005 ? pts(d) : ''}</span></td>`; };
    return `<table class="cmp-table"><thead><tr><th>Memory</th><th>Stored</th><th>Access</th><th>Consol.</th><th>Interf.</th></tr></thead><tbody>${rows.map(({ b, a }) => `<tr><td>${esc(b.name)}</td>${cell(b.storage, a.storage)}${cell(b.acc, a.acc)}${cell(b.cons, a.cons)}${cell(b.int, a.int, true)}</tr>`).join('')}</tbody></table>`;
  }
  panel() {
    const g = this.game, s = g.sleep, sum = s.summary;
    const recent = g.memory.list.filter((m) => m.encoded).sort((a, b) => b.recentActivity - a.recentActivity);
    return `${this.head('Let the network sleep', 'Enter an accelerated, illustrative night. External input fades, activity slows into waves, and recent experiences replay through their learned pathways.')}
      ${this.flow(true)}
      <div class="p-sec">${s.active ? `<div class="grid2">${btn('dream-stop', 'Wake early', { icon: 'sun' })}${btn('dream-accel', s.accelerated ? 'Accelerated ×3' : 'Real-time', { cls: s.accelerated ? 'on' : '' })}</div>` : `<div class="stack">${btn('dream-start', sum ? 'Sleep again' : 'Begin a sleep cycle', { cls: 'primary wide', icon: 'moon' })}${btn('dream-accel', s.accelerated ? 'Accelerated sleep: ×3' : 'Accelerated sleep: off', { cls: `wide ${s.accelerated ? 'on' : ''}` })}</div>`}</div>
      <div class="p-sec"><h3>Phases</h3>${stepsList(SLEEP_PHASES.map((p, i) => ({ text: `<b>${p.name}</b><br><span class="muted" style="font-size:.72rem">${p.text}</span>`, done: s.active ? i < s.phaseIndex : !!(sum && !sum.early), now: s.active && i === s.phaseIndex })))}
        ${meter('Night progress', s.active ? s.t / s.duration : sum && !sum.early ? 1 : 0, 'dr_prog', { color: '#a99bff', text: s.active ? `${Math.floor(s.t)} / ${s.duration}s` : sum && !sum.early ? 'complete' : 'awake' })}</div>
      <div class="p-sec"><h3>Waiting to be replayed</h3>${recent.length ? recent.map((m) => `<div class="row between" style="font-size:.78rem;margin-top:.3rem"><span>${m.name}</span><span class="muted">recent ${pct(m.recentActivity)} · consolidated ${pct(m.consolidation)}</span></div>`).join('') : '<p class="muted" style="font-size:.78rem">Only the old Paris memory so far. Encode something in Learn first for a more interesting night.</p>'}
        ${g.skill.totalReps() ? `<div class="row between" style="font-size:.78rem;margin-top:.3rem"><span>Piano skill</span><span class="muted">efficiency ${pct(g.skill.bestEfficiency())}</span></div>` : ''}</div>
      ${sum ? `<div class="p-sec"><h3>Before → after ${sum.early ? '(woken early)' : ''}</h3>${this.table(sum)}<div style="margin-top:.6rem">${kv([['Replays', sum.replays], ['Connections stabilised', sum.stabilized], ['Weak links downscaled', sum.downscaled], ['Memory integrations', sum.integrations], ['Skill efficiency', `${pct(sum.before.skill)} → ${pct(sum.after.skill)}`], ['Network efficiency', `${pct(sum.before.efficiency)} → ${pct(sum.after.efficiency)}`]])}</div></div>` : ''}
      ${science('Sleep is thought to support memory consolidation. In animal studies, hippocampal cells active during an experience can replay in compressed sequences during sleep. One hypothesis proposes sleep also rebalances synaptic strength.', 'A 40-second cycle with four illustrative phases. Replay raises consolidation and synapse stability, nudges accessibility up and interference down; weak unused links are gently downscaled. Not literal sleep-stage physiology.')}`;
  }
  bar() {
    const s = this.game.sleep;
    if (s.active) return MB({ kicker: 'Asleep', text: `${s.phase.name}${s.lastReplay ? ` · replaying ${s.lastReplay}` : ''}`, progress: s.t / s.duration, count: `${Math.floor(s.t)} / ${s.duration}s`, actions: `${btn('dream-stop', 'Wake early', { icon: 'sun' })}${btn('dream-accel', s.accelerated ? '×3' : '×1', { cls: s.accelerated ? 'on' : '' })}` });
    return MB({ text: s.summary && !s.summary.early ? 'Cycle complete — compare before and after' : 'Complete a full sleep cycle', progress: s.summary && !s.summary.early ? 1 : 0, count: `${s.cycles} cycle${s.cycles === 1 ? '' : 's'}`, insight: '<b>Offline is not inactive:</b> replay reorganises the network.', actions: btn('dream-start', 'Sleep', { cls: 'primary', icon: 'moon' }) });
  }
  overlay() {
    const s = this.game.sleep;
    if (!s.active) return '';
    return `<div class="dream-stage"><div class="eyebrow">Offline processing · accelerated</div><h2 id="dr_phase">${s.phase.name}</h2><p id="dr_text">${s.phase.text}</p>${this.flow()}</div>`;
  }
  decorate(d) {
    const g = this.game, s = g.sleep;
    for (const m of g.memory.list) if (m.encoded) {
      const recent = m.name === s.lastReplay;
      for (const f of m.features) d.hiNeurons.set(f.neuron, { rgb: [0.7, 0.62, 1], level: recent ? 0.9 : 0.35 });
      if (recent) for (const id of m.associatedSynapseIds) d.hiSynapses.set(g.sim.synapses[id], { rgb: [0.7, 0.62, 1], level: 0.45 });
    }
  }
  update() {
    const s = this.game.sleep;
    const key = s.active ? s.phaseIndex : -1;
    if (key !== this._phase) { this._phase = key; this.game.ui.markDirty('overlay', 'panel', 'bar'); }
    if (s.active && s.lastReplay !== this._rep) { this._rep = s.lastReplay; this.game.ui.markDirty('bar'); }
  }
  live() {
    const s = this.game.sleep;
    if (s.active) { setText('dr_prog', `${Math.floor(s.t)} / ${s.duration}s`); setWidth('dr_progBar', s.t / s.duration); setWidth('mbBar', s.t / s.duration); setText('mbCount', `${Math.floor(s.t)} / ${s.duration}s`); }
  }
}

/* ======================= 7 · REPAIR ======================= */
class RepairMode extends ModeBase {
  constructor(game) {
    super(game, 'repair');
    this.from = null;
    this.actions = {
      'repair-test': () => { const r = this.game.repair.test(); if (r === 'busy') this.game.ui.toast('A test signal is already travelling.', 'info'); },
      'repair-damage': () => { this.game.repair.damage(); this.from = null; this.game.ui.markDirty('panel', 'bar', 'tags'); },
      'repair-practice': () => { const r = this.game.repair.practice(); if (r === 'noroute') this.game.ui.toast('There is no complete route yet. Grow connections from RELAY 1 to TARGET through the candidates.', 'warn', 'repair'); else if (r === 'busy') this.game.ui.toast('Wait for the current activity to finish.', 'info'); },
      'repair-reset': () => { this.game.repair.reset(); this.from = null; this.game.ui.markDirty('panel', 'bar', 'tags'); },
      'repair-node': (el) => this.clickNode(this.game.sim.n(el.dataset.key)),
      'repair-remove': (el) => { const s = this.game.sim.synapseByKey.get(el.dataset.key); if (s && this.game.repair.removeBuilt(s)) { this.game.ui.toast('Connection removed; growth resource recovered.', 'info', 'repair'); this.game.ui.markDirty('panel', 'bar'); } },
      'repair-cancel': () => { this.from = null; this.game.ui.markDirty('bar', 'tags'); },
    };
  }
  spotlight() { return this.game.repair.nodes; }
  frame() { this.game.camera.frameBounds(this.game.repair.nodes.map((n) => n.position), 1.25, { yaw: 0.15, pitch: 0.28 }); }
  exit() { this.from = null; }
  clickNode(n) {
    const g = this.game, rp = g.repair;
    if (!n || !rp.isNode(n)) return false;
    if (!rp.damaged) { g.select('neuron', n, { quiet: true }); g.ui.toast('First simulate the disruption, then grow a bypass.', 'info', 'repair'); return true; }
    if (!this.from) {
      if (n.health <= 0) { g.ui.toast('The offline relay cannot start a new connection.', 'warn', 'repair'); return true; }
      if (n === rp.target) { g.ui.toast('TARGET is where the route ends. Start from RELAY 1 or a candidate.', 'info', 'repair'); return true; }
      this.from = n; g.ui.markDirty('bar', 'tags'); return true;
    }
    if (n === this.from) { this.from = null; g.ui.markDirty('bar', 'tags'); return true; }
    const res = rp.grow(this.from, n);
    if (!res.ok) { g.ui.toast(res.reason, 'warn', 'repair'); if (res.far) return true; }
    else this.from = rp.route() ? null : n;
    g.ui.markDirty('panel', 'bar', 'tags');
    return true;
  }
  pick(hit) { if (hit && hit.type === 'neuron' && this.game.repair.isNode(hit.obj)) return this.clickNode(hit.obj); return false; }
  phaseSteps() {
    const rp = this.game.repair, st = rp.statusLines();
    return [
      { text: 'Simulate the disruption of the main relay', done: rp.damaged },
      { text: `Grow connections around it (${rp.growth} / ${rp.maxGrowth} growth left)`, done: !!st.path && rp.damaged },
      { text: 'Practise the new route until it can drive each cell', done: rp.damaged && st.path && st.strength >= st.need },
      { text: 'Test signal delivery', done: rp.restored },
    ];
  }
  panel() {
    const g = this.game, rp = g.repair, st = rp.statusLines();
    const lt = rp.lastTest;
    const line = (k, v, ic, color) => `<div class="row between" style="padding:.45rem 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:.72rem;letter-spacing:.12em">${k}</span><b style="color:${color};font-size:.8rem;letter-spacing:.08em">${icon(ic, 'sm')} ${v}</b></div>`;
    return `${this.head('Find another way through', 'A small, isolated circuit carries a signal from SOURCE to TARGET. When its main relay goes offline, the signal fails. Grow a bypass through nearby neurons, then practise it until it works.')}
      <div class="p-sec">${line('ORIGINAL ROUTE', st.original, rp.damaged ? 'close' : 'check', rp.damaged ? 'var(--bad)' : 'var(--good)')}${line('ALTERNATIVE ROUTE', st.alt, st.alt === 'READY TO TEST' ? 'check' : st.alt === 'FORMING' ? 'wave' : 'minus', st.alt === 'READY TO TEST' ? 'var(--good)' : st.alt === 'FORMING' ? 'var(--warn)' : 'var(--muted)')}${line('FUNCTION', st.fn, rp.restored || !rp.damaged ? 'check' : 'close', rp.restored || !rp.damaged ? 'var(--good)' : 'var(--bad)')}</div>
      <div class="p-sec"><h3>Steps</h3>${stepsList(this.phaseSteps())}</div>
      <div class="p-sec stack">${!rp.damaged ? btn('repair-damage', 'Simulate disruption', { cls: 'primary wide', icon: 'close' }) : ''}
        <div class="grid2">${btn('repair-test', 'Test signal', { icon: 'spark', cls: rp.damaged && st.path && st.strength >= st.need ? 'primary' : '' })}${btn('repair-practice', 'Practise route', { icon: 'route', disabled: !st.path || !rp.damaged })}</div></div>
      ${rp.damaged ? `<div class="p-sec">${meter('New route strength (weakest link)', st.strength, 'rp_str', { mark: st.need, markTitle: 'Needed to fire the next cell', color: '#74e39a' })}<p class="muted" style="font-size:.72rem;margin-top:.3rem">The marker shows the weight needed for one synapse to fire its target alone (attention helps here). Practice: ${rp.practices}.</p></div>` : ''}
      ${lt ? `<div class="card ${lt.ok ? 'good' : 'bad'}" style="margin-top:.6rem"><h4>${lt.ok ? (lt.damaged ? '✓ Function restored' : '✓ Signal delivered') : '✗ Signal did not reach TARGET'}</h4><p>${lt.ok ? (lt.damaged ? `The signal used ${lt.routeLength - 1} connections, including your bypass. The main relay is still offline—adaptation found another path.` : 'The intact circuit works. Now simulate the disruption.') : lt.blockedAt ? 'It reached the offline relay and stopped there.' : lt.weakAt ? `It reached ${lt.weakAt.label || lt.weakAt.code}, but the new connection was too weak to fire it. Practise the route.` : 'No complete route exists yet.'}</p></div>` : ''}
      ${rp.built.length ? `<div class="p-sec"><h3>Your new connections</h3><div class="stack" style="gap:.35rem">${rp.built.map((s) => `<div class="row between" style="font-size:.78rem"><span>${esc(s.source.label)} → ${esc(s.target.label)} <span class="dim mono">${pct(s.weight)}</span></span>${btn('repair-remove', 'Remove', { cls: 'sm ghost', data: { key: s.key } })}</div>`).join('')}</div></div>` : ''}
      <div class="p-sec">${btn('repair-reset', 'Reset this experiment', { cls: 'wide', icon: 'reset' })}</div>
      ${science('After damage, nervous systems can sometimes reroute function through alternative pathways, usually gradually and with extensive practice; outcomes vary widely.', 'This is a graph-routing analogy: new synapses need reach and growth resources, start weak, and only carry the signal once practice strengthens them. It is not a model of brain injury or its treatment.')}`;
  }
  bar() {
    const g = this.game, rp = g.repair, st = rp.statusLines();
    let text, actions;
    if (!rp.damaged) { text = 'Test the healthy circuit, then simulate the disruption'; actions = `${btn('repair-test', 'Test', { icon: 'spark' })}${btn('repair-damage', 'Disrupt relay', { cls: 'primary', icon: 'close' })}`; }
    else if (rp.restored) { text = 'FUNCTION RESTORED through an alternative route'; actions = `${btn('repair-test', 'Test again', { icon: 'spark' })}${btn('repair-reset', 'Reset', { icon: 'reset' })}`; }
    else if (!st.path) { text = this.from ? `Growing from ${this.from.label}: click a highlighted neuron within reach` : 'Click a neuron (start with RELAY 1), then a neighbour, to grow a connection'; actions = `${this.from ? btn('repair-cancel', 'Cancel', { icon: 'close' }) : ''}${btn('repair-test', 'Test', { icon: 'spark' })}`; }
    else if (st.strength < st.need) { text = 'Route complete but weak — practise it'; actions = `${btn('repair-practice', 'Practise route', { cls: 'primary', icon: 'route' })}${btn('repair-test', 'Test', { icon: 'spark' })}`; }
    else { text = 'The new route looks strong enough — test it'; actions = `${btn('repair-test', 'Test signal', { cls: 'primary', icon: 'spark' })}${btn('repair-practice', 'Practise', { icon: 'route' })}`; }
    const steps = this.phaseSteps();
    return MB({ text, progress: steps.filter((s) => s.done).length / steps.length, count: `${steps.filter((s) => s.done).length} / ${steps.length}`, insight: '<b>Illustrative only:</b> a routing analogy, not treatment of brain injury.', actions });
  }
  decorate(d) {
    const g = this.game, rp = g.repair, st = rp.statusLines();
    const pathSet = new Set(st.path || []);
    for (const n of rp.nodes) d.hiNeurons.set(n, { rgb: n.health <= 0 ? COL.bad : pathSet.has(n) ? [0.6, 1, 0.75] : COL.repair, level: pathSet.has(n) ? 1 : 0.55 });
    for (const s of rp.original) d.hiSynapses.set(s, { rgb: COL.repair, level: 0.5 });
    for (const s of rp.built) d.hiSynapses.set(s, { rgb: [0.6, 1, 0.75], level: 0.9 });
    if (rp.damaged && !rp.restored) for (const c of rp.candidates) d.rings.push({ pos: c.position, rgb: [0.45, 0.9, 0.6], size: 0.32, param: 0.5, phase: c.id });
    if (this.from) {
      d.rings.push({ pos: this.from.position, rgb: [0.5, 1, 0.7], size: rp.reach, kind: 13, alpha: 0.45 });
      const h = g.input.hoverHit;
      if (h && h.type === 'neuron' && h.obj !== this.from && rp.isNode(h.obj)) {
        const ok = rp.canConnect(this.from, h.obj).ok;
        d.ribbons.push({ points: [this.from.position, h.obj.position], rgb: ok ? [0.5, 1, 0.7] : [1, 0.4, 0.45], alpha: 0.75, width: 3, flow: 1.2 });
      }
    }
    d.dim = 0.55;
  }
  tags() {
    const g = this.game, rp = g.repair;
    return rp.nodes.map((n) => ({ id: 'r_' + n.key, color: '#74e39a', pos: () => n.position, action: 'repair-node', data: { key: n.key },
      text: n === rp.r2 && rp.damaged ? 'MAIN RELAY · OFFLINE' : n.label, cls: n === rp.r2 && rp.damaged ? 'off' : this.from === n ? 'target' : rp.candidates.includes(n) && !rp.damaged ? 'dim' : '' }));
  }
  update() {
    const rp = this.game.repair;
    const key = `${rp.phase}|${rp.built.length}|${rp.testing ? 1 : 0}|${rp.practicing ? 1 : 0}`;
    if (key !== this._key) { this._key = key; this.game.ui.markDirty('panel', 'bar', 'tags'); }
  }
  live() {
    const rp = this.game.repair;
    if (rp.damaged) { const s = rp.routeStrength(); setText('rp_str', pct(s)); setWidth('rp_strBar', s); }
  }
}

/* ======================= 8 · BUILD ======================= */
class BuildMode extends ModeBase {
  constructor(game) {
    super(game, 'build');
    this.feedback = null;
    this.actions = {
      'build-next': () => { this.feedback = null; this.game.knowledge.nextQuestion(this.game.knowledge.selected); this.game.ui.markDirty('overlay', 'bar', 'tags'); },
      'build-answer': (el) => this.answer(+el.dataset.i),
      'concept-select': (el) => this.selectConcept(el.dataset.id),
    };
  }
  enter() {
    const g = this.game, added = g.knowledge.syncFromOtherModes();
    if (added.length) g.ui.toast(`<b>Imported from your other modes</b>${added.map(esc).join(' · ')}`, 'good', 'build', true);
    if (!g.knowledge.question) g.knowledge.nextQuestion();
  }

  /** relId (optional, Demo Mode): ask about one specific relationship of this concept. */
  selectConcept(id, relId = null) {
    const kn = this.game.knowledge;

      <div class="p-sec">${kv([['Questions answered', kn.answered], ['Current streak', kn.streak], ['Best streak', kn.bestStreak], ['Imported from other modes', [...kn.links.values()].filter((v) => v.source !== 'build').length]])}</div>
      ${science('Knowledge is organised as networks of related concepts. Ideas linked through many meaningful relationships tend to be easier to retrieve and apply than isolated facts.', 'Concepts float above the brain; their faint lines to regions are teaching anchors, not storage locations. Concepts you learned in other modes (e.g. PLASTICITY after Learn mission 3) arrive pre-connected.')}`;

  }

      const path = new Set(); let c = kn.selected;

  tags() {
    const kn = this.game.knowledge, iso = new Set(kn.isolated());

    return CONCEPTS.filter((c) => kn.placed.has(c.id) || frontier.has(c.id)).map((c) => ({
      id: 'c_' + c.id, kind: 'concept-label', text: kn.placed.has(c.id) ? c.label : `${c.label} ?`, pos: () => kn.pos[c.id], dy: -22, action: 'concept-select', data: { id: c.id },

    }));
  }
  live() {
    const mt = this.game.knowledge.metrics();
