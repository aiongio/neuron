/* ==========================================================================
   INPUT — pointer (mouse, pen, touch), pinch, wheel, picking, hover and
   keyboard shortcuts. Picking is done in screen space against projected
   positions (fast and precise enough for a few hundred objects).
   ========================================================================== */
class InputController {
  constructor(game) {
    this.game = game; this.canvas = $('#gl');
    this.pointers = new Map(); this.drag = null; this.pinch = null;
    this.hoverHit = null; this.hoverAt = 0; this.lastTap = { t: 0, hit: null };
    this.mouse = { x: 0, y: 0, inside: false };
  }

  bind() {
    const c = this.canvas, g = this.game;
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    const down = (e, label = null) => {
      if (g.ui.modal) return;
      // A playing demo ignores the pointer; a paused demo still lets the viewer orbit and zoom.
      if (g.demo.locked && (!g.demo.paused || label)) { g.demo.notice(); return; }
      g.audio.wake();
      c.focus({ preventScroll: true });
      try { c.setPointerCapture(e.pointerId); } catch { /* not capturable */ }
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
      if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()];
        this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
        this.drag = null;
      } else if (this.pointers.size === 1) {
        this.drag = { button: e.button, shift: e.shiftKey, moved: 0, x: e.clientX, y: e.clientY, pan: e.button === 2 || e.button === 1 || e.shiftKey, label };
      }
      g.ui.hideTip();
    };
    c.addEventListener('pointerdown', (e) => down(e));
    // Gestures that start on a 3D-anchored label (region names, lesson tags) still orbit/zoom the
    // camera; a simple tap activates the label. Without this, labels would block pinch and drag.
    $('#labels').addEventListener('pointerdown', (e) => {
      const lbl = e.target.closest('.lbl3d');
      if (!lbl || (e.pointerType === 'mouse' && e.button !== 0)) return;
      down(e, lbl);
    });
    c.addEventListener('pointermove', (e) => {
      this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.inside = true;
      const p = this.pointers.get(e.pointerId);
      if (!p) { if (!g.demo.locked) this.hover(e); return; }
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (this.pointers.size >= 2 && this.pinch) {
        const [a, b] = [...this.pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        if (this.pinch.d > 0 && d > 0) g.camera.zoom(this.pinch.d / d);
        g.camera.pan(mx - this.pinch.mx, my - this.pinch.my);
        this.pinch = { d, mx, my };
        return;
      }
      if (!this.drag) return;
      this.drag.moved += Math.abs(dx) + Math.abs(dy);
      if (this.drag.moved > 4) c.classList.add('dragging');
      if (this.drag.pan) g.camera.pan(dx, dy); else g.camera.orbit(dx, dy);
    });
    const end = (e) => {
      const p = this.pointers.get(e.pointerId);
      this.pointers.delete(e.pointerId);
      c.classList.remove('dragging');
      if (this.pinch) { if (this.pointers.size < 2) this.pinch = null; this.drag = null; return; }
      if (p && this.drag && this.drag.moved < 7 && e.type === 'pointerup' && (this.drag.button === 0 || e.pointerType !== 'mouse')) {
        const lbl = this.drag.label;
        if (g.demo.locked) g.demo.notice();   // paused demo: taps don't select or fire anything
        else if (lbl && lbl.isConnected && lbl.dataset.action) {
          g.ignoreClick = { el: lbl, until: performance.now() + 600 };
          g.audio.wake();
          g.action(lbl.dataset.action, lbl);
        } else this.click(e.clientX, e.clientY);
      }
      this.drag = null;
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', () => { this.mouse.inside = false; if (!this.pointers.size) { this.hoverHit = null; g.ui.hideTip(); this.updateCursor(); } });
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (g.demo.locked && !g.demo.paused) { g.demo.notice(); return; }
      const dy = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
      g.camera.zoom(Math.exp(clamp(dy, -120, 120) * 0.0016));
    }, { passive: false });
    document.addEventListener('keydown', (e) => this.keydown(e));
    document.addEventListener('keyup', (e) => g.camera.keys.delete(e.key.toLowerCase()));
    window.addEventListener('blur', () => g.camera.keys.clear());
  }

  rect() { return this.canvas.getBoundingClientRect(); }

  /** Screen-space hit test. Priority: concept > neuron > glia > region blob > synapse. */
  pick(cx, cy, forHover = false) {
    const g = this.game, cam = g.camera, sim = g.sim, r = this.rect();
    const x = cx - r.left, y = cy - r.top;
    const tmp = {};
    if (g.modeId === 'build' && g.renderer.buildT > 0.5) {
      let best = null, bd = 26;
      for (const c of CONCEPTS) { const p = cam.project(g.knowledge.pos[c.id], tmp); if (!p) continue; const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = c.id; } }
      if (best) return { type: 'concept', obj: best };
      return null;
    }
    const brainT = g.renderer.brainT;
    if (brainT < 0.75) {
      let best = null, score = Infinity;
      for (const n of sim.neurons) {
        if (!n.recruited && !g.decorHas(n)) continue;
        const p = cam.project(n.position, tmp);
        if (!p || !p.visible) continue;
        const rad = clamp(cam.pixelRadius(n.size, p.depth) * 1.7, 9, 30);
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < rad && d + p.depth * 0.25 < score) { score = d + p.depth * 0.25; best = n; }
      }
      if (best) return { type: 'neuron', obj: best };
      if (g.settings.glia) for (const gc of sim.glia) {
        const p = cam.project(gc.position, tmp);
        if (p && p.visible && Math.hypot(x - p.x, y - p.y) < clamp(cam.pixelRadius(gc.size, p.depth) * 1.6, 9, 26)) return { type: 'glia', obj: gc };
      }
    }
    if (brainT > 0.4) {
      let best = null, bd = Infinity;
      for (const reg of sim.regions) {
        const p = cam.project(reg.center, tmp);
        if (!p) continue;
        const rad = cam.pixelRadius((reg.radii[0] + reg.radii[1]) / 2, p.depth);
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < rad && d < bd) { bd = d; best = reg; }
      }
      if (best) return { type: 'region', obj: best };
    }
    if (brainT < 0.75 && !forHover) {
      let best = null, bd = 6;
      const a = {}, b = {}, pt = [0, 0, 0];
      for (const s of sim.synapses) {
        if (!s.enabled || (!s.source.recruited && !s.target.recruited)) continue;
        let prev = null;
        for (let k = 0; k <= 8; k++) {
          s.pointAt(k / 8, pt);
          const q = cam.project(pt, k % 2 ? a : b);
          if (!q || !q.visible) { prev = null; continue; }
          if (prev) {
            const d = this.segDist(x, y, prev.x, prev.y, q.x, q.y);
            if (d < bd) { bd = d; best = s; }
          }
          prev = { x: q.x, y: q.y };
        }
      }
      if (best) return { type: 'synapse', obj: best };
    }
    return null;
  }
  segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l) : 0;
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  }

  click(cx, cy) {
    const g = this.game;
    if (g.introRunning) return;
    const hit = this.pick(cx, cy);
    const now = performance.now();
    const dbl = hit && this.lastTap.hit && this.lastTap.hit.obj === hit.obj && now - this.lastTap.t < 340;
    this.lastTap = { t: now, hit };
    if (dbl && (hit.type === 'neuron' || hit.type === 'glia')) { g.focusObject(hit); return; }
    g.onPick(hit);
  }

  hover(e) {
    const g = this.game, now = performance.now();
    if (now - this.hoverAt < 60 || g.introRunning) return;
    this.hoverAt = now;
    const hit = this.pick(e.clientX, e.clientY, true);
    this.hoverHit = hit;
    this.updateCursor();
    if (e.pointerType !== 'mouse') return;
    if (!hit) { if (!g.ui.tipTarget) g.ui.hideTip(); return; }
    let html = g.mode.hover?.(hit) || '';
    if (!html) {
      if (hit.type === 'neuron') { const n = hit.obj; html = `<span class="tt-k">${n.type === 'inhibitory' ? 'Inhibitory neuron' : 'Neuron'} · ${n.code}</span><b>${esc(n.label || n.region.name)}</b>${n.displayType}. ${n.outgoing.filter((s) => s.enabled).length} outputs · ${n.incoming.filter((s) => s.enabled).length} inputs.<span class="tt-more">Click to inspect · double-click to fly to it</span>`; }
      else if (hit.type === 'glia') { const gl = GLOSSARY[hit.obj.type]; html = `<span class="tt-k">Glial cell</span><b>${gl.title}</b>${gl.short}<span class="tt-more">${esc(hit.obj.state)}</span>`; }
      else if (hit.type === 'region') { const r = hit.obj; html = `<span class="tt-k">Brain region</span><b>${r.name}</b>${r.def.functions.join(' · ')}<span class="tt-more">Click to fly in and inspect</span>`; }
      else if (hit.type === 'concept') { const c = CONCEPT_BY_ID[hit.obj]; html = `<span class="tt-k">Concept</span><b>${c.label}</b>${esc(c.def)}`; }
    }
    if (html) g.ui.showTip(e.clientX, e.clientY, html); else g.ui.hideTip();
  }
  updateCursor() {
    const c = this.canvas, g = this.game;
    const tool = (g.modeId === 'explore' && g.modes.explore.wire) || (g.modeId === 'repair' && g.modes.repair.from);
    c.classList.toggle('crosshair', !!tool);
    c.classList.toggle('hovering', !!this.hoverHit && !tool);
  }

  keydown(e) {
    const g = this.game, ui = g.ui;
    if (ui.modal) {
      if (e.key === 'Escape') { ui.closeModal(); e.preventDefault(); }
      else if (e.key === 'Tab') ui.trapFocus(e);
      return;
    }
    if (g.introRunning) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { if (e.key !== 'Enter' || !g.intro.final) { g.intro.skip(); e.preventDefault(); } } return; }
    if (g.demo.locked) { g.demo.onKey(e); return; }
    if (g.demo.state === 'complete' && e.key === 'Escape') { g.demo.takeControl(); e.preventDefault(); return; }
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    g.audio.wake();
    const k = e.key.toLowerCase();
    if (e.key === 'Escape') {
      if (g.follow) g.stopFollow();
      else if (g.mode.id === 'explore' && g.modes.explore.wire) { g.modes.explore.wire = null; ui.markDirty('panel', 'bar'); this.updateCursor(); }
      else if (g.mode.id === 'repair' && g.modes.repair.from) { g.modes.repair.from = null; ui.markDirty('bar', 'tags'); this.updateCursor(); }
      else if (g.selection) g.deselect();
      else if (innerWidth <= 980 && !ui.el.app.classList.contains('panel-closed')) g.setPanelOpen(false);
      return;
    }
    if (g.mode.key && g.mode.key(k, e)) { e.preventDefault(); return; }
    if (g.camera.fly && ['w', 'a', 's', 'd', 'q', 'e'].includes(k)) { g.camera.keys.add(k); e.preventDefault(); return; }
    if (e.repeat) return;
    const onButton = e.target && e.target.closest && e.target.closest('button, a, [role="tab"]');
    if (e.code === 'Space' && !onButton) { e.preventDefault(); g.togglePause(); return; }
    if (/^[1-8]$/.test(k)) { e.preventDefault(); g.action('mode', { dataset: { mode: MODES[+k - 1].id } }); return; }
    const map = {
      h: 'home', r: 'reset-camera', f: 'focus-selected', t: 'follow-signal', l: 'toggle-labels', v: 'toggle-fly', e: 'fire-selected', m: 'toggle-sound', '?': 'open-education',
    };
    if (map[k] || e.key === '?') { e.preventDefault(); g.action(map[k] || 'open-education', { dataset: {} }); return; }
    if (e.target === this.canvas) {
      const cam = g.camera;
      if (e.key === 'ArrowLeft') { cam.orbit(-25, 0); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { cam.orbit(25, 0); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { cam.orbit(0, -20); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { cam.orbit(0, 20); e.preventDefault(); }
      else if (e.key === '+' || e.key === '=') cam.zoom(0.85);
      else if (e.key === '-' || e.key === '_') cam.zoom(1.18);
    }
  }
}
/* ==========================================================================
   GAME — owns settings, the world, all systems and modes; runs the loop.
     update(dt): fixed sub-steps of simulation + systems (scaled by speed)
     render():   camera → decor (highlights) → WebGL → HUD
   ========================================================================== */
const hexA = (hex, a) => { const [r, g, b] = hexToRgb(hex); return `rgba(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)},${a})`; };

class Game {
  constructor() {
    this.settings = { ...DEFAULT_SETTINGS };
    this.paused = false; this.modeId = 'explore'; this.selection = null; this.focusRegion = null;
    this.introSeen = false; this.introRunning = false;
    this.follow = null; this.followSignal = null; this.followPath = null; this.trace = null;
    this.membraneHistory = new Array(100).fill(0);
    this.audio = new AudioSystem(this);
    this.saver = new SaveSystem(this);
    this.camera = new CameraController(this);
    this.renderer = new Renderer(this);
    this.ui = new UIManager(this);
    this.intro = new Intro(this);
    this.input = new InputController(this);
    this.demo = new DemoController(this);
    this.lastNow = 0; this.fpsFrames = 0; this.fpsTime = 0; this.fps = 60;
    this.saveTimer = 0; this.regionTimer = 0; this.lastScale = null; this.lastDecor = null;
    this.onFollowArrive = this.onFollowArrive.bind(this);
    this.frame = this.frame.bind(this);
  }
  get mode() { return this.modes[this.modeId]; }

  /* ---------- boot ---------- */
  boot() {
    const data = this.saver.load();
    if (data?.settings) Object.assign(this.settings, data.settings);
    this.applySettingsToDom();
    try { this.renderer.init($('#gl')); }
    catch (err) { console.error('NEURON renderer failed', err); this.showFatal(err); return; }
    this.createWorld(data);
    this.input.bind();
    this.bindDom();
    this.resize();
    const ro = window.ResizeObserver ? new ResizeObserver(() => this.resize()) : null;
    if (ro) ro.observe($('#app')); else window.addEventListener('resize', () => this.resize());
    const wantMode = data?.progress?.mode;
    this.modeId = wantMode && this.progression.isUnlocked(wantMode) ? wantMode : 'explore';
    this.applyModeColor();
    this.mode.enter(); this.applySpotlight();
    this.ui.markDirty('top', 'dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags', 'sel');
    this.audio.enabled = this.settings.sound;
    this.audio.volume = this.settings.volume;
    if (data?.migrated) setTimeout(() => this.ui.toast('<b>Welcome back</b>Settings and a matching complexity level were carried over from NEURON v1.', 'good', 'save', true), 1500);
    else if (data && this.introSeen) setTimeout(() => this.ui.toast('<b>Welcome back</b>Your trained pathways, memories and progress are restored.', 'good', 'save'), 900);
    this.ui.journal(data ? 'Network restored from your last session.' : 'Network online. Choose a cell to begin.');
    $('#loadingVeil').classList.add('gone');
    document.body.classList.remove('booting');
    if (!this.introSeen) this.intro.start();
    else {
      this.camera.home(true);
      if (innerWidth > 980) this.setPanelOpen(true);
      if (this.tutorial.active) setTimeout(() => this.tutorial.render(), 600);
    }
    requestAnimationFrame(this.frame);
    this.exposeApi();
  }

  /** (Re)create the simulation and every system on a fresh event bus. opts.sandbox: Demo Mode's throwaway world. */
  createWorld(data, opts = {}) {
    this.bus = new EventBus();
    if (opts.sandbox) this.bus.sandbox = true;
    this.sim = new BrainSimulation(this, this.settings.quality);
    this.plasticity = new PlasticitySystem(this);
    this.reward = new RewardSystem(this);
    this.memory = new MemorySystem(this);
    this.attention = new AttentionSystem(this);
    this.sleep = new SleepSystem(this);
    this.repair = new RepairSystem(this);
    this.knowledge = new KnowledgeSystem(this);
    this.skill = new SkillSystem(this);
    this.glia = new GliaSystem(this);
    this.progression = new ProgressionSystem(this);
    this.achievements = new AchievementSystem(this);
    this.missions = new MissionSystem(this);
    this.stats = new StatsSystem(this);
    this.tutorial = new Tutorial(this);
    if (opts.sandbox) {
      this.progression.sandbox = true; this.achievements.sandbox = true;   // no points, levels or achievements
      this.attention.ambientTimer = Infinity;                              // the scripted demo shows distraction in Focus only
    }
    this.sim.build();
    this.memory.install(this.sim); this.attention.install(this.sim); this.skill.install(this.sim);
    this.repair.install(this.sim); this.reward.install(this.sim); this.missions.install(this.sim);
    if (data) this.saver.apply(data);
    this.sim.setRecruitment(this.progression.recruitFraction(), false);
    // Stats first: achievements and missions read the counters stats keeps for the same events.
    this.stats.bind(this.bus); this.progression.bind(this.bus); this.achievements.bind(this.bus); this.missions.bind(this.bus);
    this.ui.bindBus(this.bus); this.tutorial.bind(this.bus);
    this.bindGameEvents();
    this.modes = {
      explore: new ExploreMode(this), learn: new LearnMode(this), remember: new RememberMode(this), train: new TrainMode(this),
      focus: new FocusMode(this), dream: new DreamMode(this), repair: new RepairMode(this), build: new BuildMode(this),
    };
    if (this.renderer.ready) this.renderer.setWorld(this.sim);
  }

  /** Rebuild the world in place (quality change, import) keeping or replacing progress. */
  rebuildWorld(data) {
    const d = data || this.saver.validate(this.saver.snapshot());
    try { this.mode?.exit(); } catch { /* ignore */ }
    this.stopFollow(true);
    this.selection = null; this.focusRegion = null; this.trace = null; this.followPath = null;
    if (d.settings) Object.assign(this.settings, d.settings);
    this.applySettingsToDom();
    this.createWorld(d);
    this.resize();
    if (!this.progression.isUnlocked(this.modeId)) this.modeId = 'explore';
    this.applyModeColor();
    this.mode.enter(); this.applySpotlight();
    this.ui.lastPanelKey = '';
    this.ui.markDirty('top', 'dock', 'head', 'panel', 'bar', 'overlay', 'tools', 'tags', 'sel');
    this.audio.setEnabled(this.settings.sound);
    if (this.tutorial.active) this.tutorial.render(); else this.tutorial.hide();
  }

  bindGameEvents() {
    const b = this.bus;
    const saveSoon = () => { this.saveTimer = Math.max(this.saveTimer, 13); };
    for (const t of [EV.MISSION_COMPLETED, EV.LEVEL_UP, EV.ACHIEVEMENT_UNLOCKED, EV.CONSOLIDATION_COMPLETE, EV.PATHWAY_REPAIRED, EV.MEMORY_ENCODED, EV.MODE_MASTERED, EV.FOCUS_COMPLETE, EV.CONCEPT_CONNECTED]) b.on(t, saveSoon);
    b.on(EV.NEURON_FIRED, (e) => { if (e.cause === 'manual') this.audio.fire(); });
    b.on(EV.LEVEL_UP, () => { this.ui.markDirty('dock', 'top'); if (this.tutorial.active) this.tutorial.checkAuto(); });
    b.on(EV.SIGNAL_BLOCKED, (e) => { if (this.modeId === 'explore' && !e.signal.tag) this.ui.floatAt(e.neuron.position, 'BLOCKED · OFFLINE RELAY', '#ff8a96'); });
  }

  /* ---------- DOM wiring ---------- */
  bindDom() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      // While the demo plays, only its own controls (and the top-bar DEMO button) respond.
      if (el && this.demo.locked && !el.closest('#demoUi') && el.id !== 'demoBtn' && el.id !== 'soundBtn') { e.preventDefault(); this.demo.notice(); return; }
      if (!el || el.disabled) return;
      if (this.ignoreClick && this.ignoreClick.el === el && performance.now() < this.ignoreClick.until) return;
      if (el.dataset.action === 'modal-backdrop' && e.target !== el) return;
      if (el.tagName === 'A') e.preventDefault();
      if (el.type === 'checkbox') return;
      this.audio.wake();
      this.action(el.dataset.action, el);
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (this.demo.locked) { this.demo.notice(); return; }
      if (el.dataset.setting) this.setSetting(el.dataset.setting, el.checked);
      else if (el.dataset.action === 'toggle-unlock') this.action('toggle-unlock', el);
      else if (el.id === 'neuronPicker') { const n = this.sim.neurons[+el.value]; if (n) { this.select('neuron', n); this.focusObject({ type: 'neuron', obj: n }); } }
      else if (el.id === 'importFile') this.importFile(el.files[0]);
    });
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (this.demo.locked) return;
      if (el.dataset.settingRange) this.setSetting(el.dataset.settingRange, +el.value);
      else if (el.id === 'attnOverride') { this.attention.override = +el.value / 100; this.ui.markDirty('bar'); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { this.camera.keys.clear(); this.saver.save(); if (!this.paused) { this.setPaused(true); this.autoPaused = true; } } else if (this.autoPaused) { this.autoPaused = false; this.setPaused(false); } });
    window.addEventListener('beforeunload', () => { if (!this.resetting) this.saver.save(); });
  }

  /* ---------- actions ---------- */
  action(name, el) {
    const ds = el?.dataset || {};
    const m = this.mode;
    if (m && m.actions[name]) { m.actions[name](el); return; }
    const ui = this.ui;
    switch (name) {
      case 'mode': this.changeMode(ds.mode); break;
      case 'toggle-pause': this.togglePause(); break;
      case 'step': this.setPaused(true); for (let i = 0; i < 5; i++) this.tick(0.02); break;
      case 'speed': this.settings.speed = +ds.speed; ui.markDirty('top'); this.saver.save(); break;
      case 'toggle-sound': this.setSetting('sound', !this.settings.sound); break;
      case 'open-education': ui.openModal('education', { tab: ds.tab || 'start' }); break;
      case 'open-about': ui.openModal('education', { tab: 'about' }); break;
      case 'open-settings': ui.openModal('settings'); break;
      case 'open-progress': ui.openModal('progress'); break;
      case 'edu-tab': ui.modal.tab = ds.tab; ui.renderModal(); break;
      case 'close-modal': case 'modal-backdrop': ui.closeModal(); break;
      case 'panel-tab': ui.setTab(ds.tab); this.setPanelOpen(true); break;
      case 'panel-close': this.setPanelOpen(false); break;
      case 'panel-open': this.setPanelOpen(true); break;
      case 'show-inspector': ui.setTab('inspect'); this.setPanelOpen(true); break;
      case 'scale': this.setScale(ds.scale); break;
      case 'home': this.goHome(); break;
      case 'reset-camera': this.camera.home(); this.stopFollow(); this.ui.markDirty('tools'); break;
      case 'focus-selected': if (this.selection) this.focusObject(this.selection); else ui.toast('Select something first (click a neuron, synapse, glial cell or region).', 'info', 'target'); break;
      case 'follow-signal': if (this.follow) this.stopFollow(); else this.startFollow(); break;
      case 'toggle-labels': this.setSetting('labels', !this.settings.labels); break;
      case 'toggle-fly': { const on = this.camera.toggleFly(); ui.toast(on ? 'Free flight: drag to look · W A S D to move · Q / E down / up · V to exit.' : 'Orbit camera restored.', 'info', 'fly'); ui.markDirty('tools'); break; }
      case 'fullscreen': this.toggleFullscreen(); break;
      case 'fire-selected': this.fireSelected(); break;
      case 'select-neuron': { const n = this.sim.neurons[+ds.id]; if (n) this.select('neuron', n); break; }
      case 'deselect': this.deselect(); break;
      case 'inspect-random': this.inspectRandom(); break;
      case 'inspect-glia': { const list = this.sim.glia; const cur = this.selection?.type === 'glia' ? this.selection.obj : null; const next = list[((cur ? cur.id : -1) + 7) % list.length]; this.select('glia', next); this.focusObject({ type: 'glia', obj: next }); break; }
      case 'inspect-memory': { const m2 = this.memory.list.find((x) => x.encoded) || this.memory.list[0]; this.select('memory', m2); break; }
      case 'highlight-memory': { const m2 = this.memory.memories[ds.memory]; if (m2) { this.select('memory', m2, { quiet: true }); this.camera.frameBounds(m2.features.map((f) => f.neuron.position), 1.3); m2.features.forEach((f, i) => this.sim.schedule(i * 0.15, () => this.sim.fire(f.neuron, { forced: true, kind: 'recall', cause: 'show' }))); } break; }
      case 'region': this.selectRegion(this.sim.regionById[ds.region]); break;
      case 'region-wave': { const r = this.selection?.type === 'region' ? this.selection.obj : this.focusRegion || (this.selection?.type === 'neuron' ? this.selection.obj.region : pick(this.sim.regions)); this.sim.regionalWave(r, { seed: this.selection?.type === 'neuron' ? this.selection.obj : undefined }); ui.floatAt(r.center, `REGIONAL WAVE · ${r.def.short.toUpperCase()}`, r.def.color); this.audio.chime(0.5); break; }
      case 'frame-region': if (this.selection?.type === 'region') this.focusObject(this.selection); break;
      case 'goto': this.gotoTarget(ds.target); break;
      case 'trace-path': this.tracePath(); break;
      case 'inspect-strongest': { const n = this.selection?.type === 'neuron' ? this.selection.obj : null; const s = n && n.outgoing.filter((x) => x.enabled).sort((a, b) => b.weight - a.weight)[0]; if (s) this.select('synapse', s); else ui.toast(n ? 'This neuron has no enabled outgoing synapses.' : 'Select a neuron first.', 'warn', 'link'); break; }
      case 'fire-source': { const s = this.selection?.type === 'synapse' ? this.selection.obj : null; if (s) { const sp = this.sim.fire(s.source, { cause: 'manual', forced: true, driven: true, tag: 'manual' }); if (sp && !sp.some((x) => x.synapse === s)) ui.floatAt(s.pointAt(0.2, [0, 0, 0]), 'RELEASE FAILED · WEAK SYNAPSE', '#fbbf5b'); } break; }
      case 'inspect-source': if (this.selection?.type === 'synapse') this.select('neuron', this.selection.obj.source); break;
      case 'inspect-target': if (this.selection?.type === 'synapse') this.select('neuron', this.selection.obj.target); break;
      case 'next-synapse': { const s = this.selection?.type === 'synapse' ? this.selection.obj : null; if (!s) break; const outs = s.source.outgoing.filter((x) => x.enabled); this.select('synapse', outs[(outs.indexOf(s) + 1) % outs.length]); break; }
      case 'glia-support': { const gc = this.selection?.type === 'glia' ? this.selection.obj : null; if (gc) { const r = this.glia.support(gc); ui.toast(r.message, r.changed || gc.type === 'astrocyte' ? 'good' : 'info', 'cell'); } break; }
      case 'build-ask': this.changeMode('build'); if (this.modeId === 'build') this.modes.build.selectConcept(ds.concept); break;
      case 'dismiss-distractor': this.attention.dismissAmbient(+ds.id); break;
      case 'set-quality': if (ds.quality !== this.settings.quality) { this.settings.quality = ds.quality; this.rebuildWorld(); if (ui.modal) ui.renderModal(); ui.toast(`Quality set to ${QUALITY[ds.quality].label}: ${this.sim.neurons.length} neurons. Trained pathways were kept.`, 'good', 'settings'); this.saver.save(); } break;
      case 'save-now': { const ok = this.saver.save(); ui.toast(ok ? 'Progress saved in this browser.' : 'Browser storage is unavailable—use Export JSON instead.', ok ? 'good' : 'warn', 'save'); if (ui.modal?.kind === 'settings') ui.renderModal(); break; }
      case 'export': this.saver.exportFile(); ui.toast('Save exported as a JSON file.', 'good', 'download'); break;
      case 'import': $('#importFile').click(); break;
      case 'reset-confirm': ui.openModal('reset'); break;
      case 'reset-all': this.resetAll(); break;
      case 'toggle-unlock': {
        const on = ds.force === 'on' ? true : el && el.type === 'checkbox' ? el.checked : !this.progression.unlockAll;
        this.progression.setUnlockAll(on);
        ui.toast(on ? 'All modes unlocked (demo). The full network is now recruited.' : 'Progressive unlocking restored.', 'info', 'lock');
        if (ui.modal?.kind === 'locked') { const target = ui.modal.opts.mode; ui.closeModal(); this.changeMode(target); }
        else if (ui.modal) ui.renderModal();
        if (this.tutorial.active) this.tutorial.render();
        this.saver.save();
        break;
      }
      case 'demo-start': this.demo.onButton(); break;
      case 'demo-pause': this.demo.togglePause(); break;
      case 'demo-skip': this.demo.skipStep(); break;
      case 'demo-restart': this.demo.restart(); break;
      case 'demo-exit': this.demo.exit(); break;
      case 'demo-take-control': this.demo.takeControl(); break;
      case 'demo-replay': this.demo.replay(); break;
      case 'intro-demo': this.intro.finish(false); this.demo.start(); break;
      case 'replay-intro': ui.closeModal(); this.changeMode('explore'); this.intro.start(); break;
      case 'restart-tutorial': ui.closeModal(); this.changeMode('explore'); this.tutorial.restart(); break;
      case 'tutorial-skip': this.tutorial.skip(); break;
      case 'tutorial-min': this.tutorial.min = true; this.tutorial.render(); break;
      case 'tutorial-max': this.tutorial.min = false; this.tutorial.render(); break;
      case 'intro-skip': this.intro.skip(); break;
      case 'intro-start': this.intro.finish(ds.guided === 'yes'); break;
      case 'attn-reset': this.attention.override = null; ui.markDirty('panel'); break;
      default: console.warn('NEURON: unknown action', name);
    }
  }

  /* ---------- modes ---------- */
  changeMode(id) {
    if (!MODE_BY_ID[id]) return;
    if (!this.progression.isUnlocked(id)) { this.ui.openModal('locked', { mode: id }); return; }
    if (this.introRunning) return;
    if (id === this.modeId) { this.mode.frame(); this.ui.setTab('mode'); return; }
    try { this.mode.exit(); } catch (err) { console.error(err); }
    this.stopFollow(true);
    this.modeId = id;
    this.focusRegion = null; this.trace = null;
    if (this.selection && this.selection.type !== 'neuron' && this.selection.type !== 'synapse') this.deselect(true);
    this.applyModeColor();
    this.ui.hideTip(); this.input.hoverHit = null;
    this.mode.enter(); this.applySpotlight(); this.mode.frame();
    this.ui.setTab('mode');
    if (innerWidth > 980) this.setPanelOpen(true);
    this.bus.emit(EV.MODE_CHANGED, { mode: id });
    this.ui.journal(`${MODE_BY_ID[id].name} mode`);
    this.input.updateCursor();
    this.saver.save();
  }
  applyModeColor() {
    const c = MODE_BY_ID[this.modeId].color;
    document.documentElement.style.setProperty('--accent', c);
    document.documentElement.style.setProperty('--accent-soft', hexA(c, 0.14));
    document.body.dataset.mode = this.modeId;
  }
  applySpotlight() { if (!this.attention.session) this.attention.setSpotlight(this.mode.spotlight()); }
  allowAutorotate() { return (this.modeId === 'explore' || this.modeId === 'dream' || this.modeId === 'build') && !this.follow && !this.introRunning && !this.demo.active; }

  /* ---------- selection & camera helpers ---------- */
  select(type, obj, opts = {}) {
    if (!obj) return;
    if (this.selection?.type === 'neuron') this.selection.obj.selected = false;
    this.selection = { type, obj };
    if (type === 'neuron') { obj.selected = true; this.membraneHistory.fill(obj.activation); this.bus.emit(EV.NEURON_SELECTED, { neuron: obj }); }
    else if (type === 'synapse') this.bus.emit(EV.SYNAPSE_SELECTED, { synapse: obj });
    else if (type === 'glia') this.bus.emit(EV.GLIA_SELECTED, { glia: obj });
    else if (type === 'region') { this.focusRegion = obj; this.bus.emit(EV.REGION_SELECTED, { region: obj }); }
    if (!opts.quiet) { this.ui.setTab('inspect'); if (innerWidth > 980) this.setPanelOpen(true); }
    this.ui.markDirty('panel', 'sel', 'tags', 'bar');
  }
  /** Route a 3D click: the current mode may consume it (lesson nodes, tools), otherwise select. */
  onPick(hit) {
    if (this.introRunning) return;
    if (this.mode.pick(hit)) { this.input.updateCursor(); return; }
    if (!hit) { if (this.selection) this.deselect(); return; }
    if (hit.type === 'region') { this.selectRegion(hit.obj); return; }
    if (hit.type === 'concept') return;
    this.select(hit.type, hit.obj);
  }
  deselect(silent = false) {
    if (this.selection?.type === 'neuron') this.selection.obj.selected = false;
    this.selection = null;
    if (!silent) this.ui.markDirty('panel', 'sel', 'tags', 'bar');
  }
  selectRegion(r) {
    if (!r) return;
    this.select('region', r);
    this.camera.frame(r.center, 7.2);
  }
  focusObject(sel) {
    const t = sel.type, o = sel.obj, cam = this.camera;
    if (t === 'neuron') cam.frame(o.position, 3.1);
    else if (t === 'glia') cam.frame(o.position, 2.6);
    else if (t === 'synapse') cam.frame(o.pointAt(0.5, [0, 0, 0]), Math.max(2.8, o.length * 1.3));
    else if (t === 'region') cam.frame(o.center, 7.2);
    else if (t === 'memory') cam.frameBounds(o.features.map((f) => f.neuron.position), 1.3);
    else if (t === 'concept') cam.frame(this.knowledge.pos[o], 6);
  }
  goHome() { this.stopFollow(); this.focusRegion = null; if (this.selection?.type === 'region') this.deselect(); this.camera.home(); this.ui.markDirty('tools', 'panel'); }
  scaleLevel() {
    const cam = this.camera, d = (cam.fly ? cam.viewDistance : cam.want.radius) / cam.zoomNorm;
    return d < 6 ? 'micro' : d < 17.5 ? 'network' : 'brain';
  }
  setScale(s) {
    const cam = this.camera;
    if (s === 'micro') {
      let n = this.selection?.type === 'neuron' ? this.selection.obj : null;
      if (!n) { n = this.sim.neurons.filter((x) => x.recruited && !x.isolated).sort((a, b) => V3.dist(a.position, cam.target) - V3.dist(b.position, cam.target))[0]; this.select('neuron', n, { quiet: true }); }
      cam.frame(n.position, 3.0);
    } else if (s === 'network') {
      if (this.focusRegion) cam.frame(this.focusRegion.center, 8.5 * cam.zoomNorm);
      else cam.flyTo({ radius: 12.5 * cam.zoomNorm, target: HOME_VIEW.target }, 1.1);
    } else cam.flyTo({ radius: 27 * cam.zoomNorm, target: [0, 0, 0], pitch: 0.24 }, 1.3);
    this.ui.markDirty('tools');
  }

  inspectRandom() {
    const cands = this.sim.neurons.filter((n) => n.recruited && !n.isolated && n.health > 0 && (!this.focusRegion || n.region === this.focusRegion));
    const cur = this.selection?.type === 'neuron' ? this.selection.obj : null;
    const n = cands[(cands.indexOf(cur) + 7 + Math.floor(Math.random() * 5)) % cands.length];
    this.select('neuron', n);
    this.focusObject({ type: 'neuron', obj: n });
  }
  fireSelected() {
    const n = this.selection?.type === 'neuron' ? this.selection.obj : null;
    if (!n) { this.ui.toast('Select a neuron first—click any glowing cell.', 'info', 'cell'); return; }
    if (n.health <= 0) { this.ui.toast('This relay is offline. In Repair mode you can route around it.', 'warn', 'repair'); return; }
    if (this.paused) this.setPaused(false);
    const sp = this.sim.fire(n, { cause: 'manual', forced: true, driven: true, boost: 1.3, tag: 'manual' });
    this.renderer.addRing(n.position, n.region.rgb, 0.8);
    this.ui.floatAt(n.position, sp && sp.length ? `ACTION POTENTIAL · ${sp.length} SIGNAL${sp.length > 1 ? 'S' : ''}` : 'FIRED · NO RELEASE', '#ffffff');
  }

  /** Trace the strongest outgoing pathway from the selected neuron and run activity along it. */
  tracePath() {
    const start = this.selection?.type === 'neuron' ? this.selection.obj : null;
    if (!start) { this.ui.toast('Select a neuron to trace its strongest pathway.', 'info', 'route'); return; }
    const neurons = [start], syns = [], seen = new Set([start]);
    let cur = start;
    for (let i = 0; i < 7; i++) {
      const next = cur.outgoing.filter((s) => s.enabled && s.target.health > 0 && !seen.has(s.target)).sort((a, b) => b.weight - a.weight)[0];
      if (!next || next.weight < 0.06) break;
      syns.push(next); neurons.push(next.target); seen.add(next.target); cur = next.target;
    }
    if (!syns.length) { this.ui.toast('No outgoing pathway from this cell.', 'info', 'route'); return; }
    this.trace = { neurons, syns, until: performance.now() + 9000 };
    neurons.forEach((n, i) => this.sim.schedule(i * 0.32, () => this.sim.fire(n, { forced: true, kind: 'chain', cause: 'trace' })));
    const regions = [...new Set(neurons.map((n) => n.region.def.short))].join(' → ');
    const mean = syns.reduce((s, x) => s + x.weight, 0) / syns.length;
    this.ui.toast(`<b>Strongest pathway · ${neurons.length} neurons</b>${regions} · mean strength ${pct(mean)}`, 'info', 'route');
    this.camera.frameBounds(neurons.map((n) => n.position), 1.4);
  }

  /* ---------- follow a signal ---------- */
  startFollow() {
    const sim = this.sim;
    if (this.paused) this.setPaused(false);
    let first = null;
    const sel = this.selection?.type === 'neuron' ? this.selection.obj : null;
    const strongest = (list) => (list && list.length ? list.slice().sort((a, b) => b.synapse.weight - a.synapse.weight)[0] : null);
    if (sel && sel.health > 0) first = strongest(sim.fire(sel, { cause: 'manual', forced: true, driven: true, boost: 1.3, reliable: true, tag: 'manual' }));
    if (!first) first = strongest(sim.signals.filter((s) => !s.visualOnly && s.t < 0.5 && s.synapse.source.recruited));
    if (!first) {
      const cands = sim.neurons.filter((n) => n.recruited && !n.isolated && n.outgoing.some((s) => s.enabled && s.weight > 0.3));
      const n = cands.length ? pick(cands) : null;
      if (n) first = strongest(sim.fire(n, { cause: 'manual', forced: true, driven: true, reliable: true, tag: 'manual' }));
    }
    if (!first) { this.ui.toast('No signal to follow right now. Fire a neuron first.', 'info', 'follow'); return; }
    this.follow = { signal: first, path: [first.synapse.source], hops: 0 };
    this.followSignal = first;
    this.followPath = null;
    sim.arrivalListeners.add(this.onFollowArrive);
    this.camera.startFollow(() => (this.follow ? this.follow.signal.synapse.pointAt(Math.min(1, this.follow.signal.t), [0, 0, 0]) : null), 2.6);
    this.ui.toast('Following a signal in slow motion · Esc to stop', 'info', 'follow');
    this.ui.markDirty('tools');
  }
  onFollowArrive(sig, fired, spawned, blocked) {
    const f = this.follow;
    if (!f || sig !== f.signal) return;
    const tgt = sig.synapse.target;
    f.path.push(tgt); f.hops++;
    if (fired && spawned && spawned.length) {
      const next = spawned.slice().sort((a, b) => b.synapse.weight - a.synapse.weight)[0];
      f.signal = next; this.followSignal = next;
      this.ui.floatAt(tgt.position, `${f.path.length} · ${tgt.region.def.short.toUpperCase()} FIRES`, '#fbbf5b');
      this.audio.pulse(1);
    } else {
      const input = sig.synapse.weight * this.sim.synapticGain * tgt.gain;
      const reason = blocked ? 'it reached an offline relay' : `${tgt.code} received ${input.toFixed(2)} (game units) and stayed below its threshold of ${tgt.threshold.toFixed(2)}`;
      this.ui.floatAt(tgt.position, blocked ? 'BLOCKED' : 'BELOW THRESHOLD', '#ff8a96');
      this.endFollow(reason);
    }
  }
  endFollow(reason) {
    const f = this.follow;
    if (!f) return;
    this.sim.arrivalListeners.delete(this.onFollowArrive);
    this.follow = null; this.followSignal = null;
    this.camera.stopFollow();
    this.followPath = { points: f.path.map((n) => n.position), until: performance.now() + 7000 };
    const neurons = f.path.length;
    const regions = [...new Set(f.path.map((n) => n.region.def.short))].join(' → ');
    this.bus.emit(EV.SIGNAL_FOLLOWED, { hops: neurons, path: f.path });
    if (reason) this.ui.toast(`<b>The signal crossed ${neurons} neuron${neurons > 1 ? 's' : ''}</b>${regions}. It stopped because ${esc(reason)}.${neurons < 4 ? ' Trained pathways carry signals further.' : ''}`, neurons >= 4 ? 'good' : 'info', 'follow', true);
    this.ui.markDirty('tools');
  }
  stopFollow(silent = false) {
    if (!this.follow) return;
    if (silent) { this.sim.arrivalListeners.delete(this.onFollowArrive); this.follow = null; this.followSignal = null; this.camera.stopFollow(); return; }
    this.endFollow(null);
  }

  gotoTarget(target) {
    if (!target) return;
    const [mode, sub] = target.split(':');
    if (!this.progression.isUnlocked(mode)) { this.ui.openModal('locked', { mode }); return; }
    if (mode === 'learn' && sub) this.missions.active = sub;
    if (mode === 'remember' && sub && this.memory.memories[sub]?.encoded) { this.modes.remember.memId = sub; this.modes.remember.cues = null; }
    if (this.modeId === mode) { this.mode.frame(); this.ui.markDirty('panel', 'bar', 'tags', 'overlay'); this.ui.setTab('mode'); }
    else this.changeMode(mode);
  }

  /* ---------- settings ---------- */
  setSetting(key, value) {
    const s = this.settings;
    s[key] = value;
    if (key === 'sound') { if (!this.audio.setEnabled(value)) { s.sound = false; this.ui.toast('Audio is not available in this browser.', 'warn', 'sound-off'); } else if (value) this.audio.chime(0.8); this.ui.markDirty('top'); }
    if (key === 'volume') this.audio.setVolume(value);
    if (key === 'motion' || key === 'uiScale' || key === 'showFps') this.applySettingsToDom();
    if (key === 'uiScale') this.resize();
    if (key === 'labels') this.ui.markDirty('tools');
    if (key === 'ambient' && !value) { this.attention.ambient = []; this.ui.markDirty('overlay'); }
    if (this.ui.modal?.kind === 'settings' && (key === 'sound')) this.ui.renderModal();
    this.saver.save();
  }
  applySettingsToDom() {
    document.documentElement.style.setProperty('--ui-scale', this.settings.uiScale);
    document.body.classList.toggle('reduced', !this.settings.motion);
  }
  setPaused(v, fromModal = false) {
    this.paused = !!v;
    this.ui.markDirty('top');
    if (!fromModal) this.ui.announce(this.paused ? 'Simulation paused' : 'Simulation running');
  }
  togglePause() { this.setPaused(!this.paused); this.ui.toast(this.paused ? 'Paused — the camera and menus still work. Space to resume.' : 'Simulation resumed.', 'info', this.paused ? 'pause' : 'play'); }
  setPanelOpen(open) { this.ui.el.app.classList.toggle('panel-closed', !open); if (open) this.ui.markDirty('panel'); this.updateViewShift(); }
  /** Shift the projection so the brain sits in the middle of the area not covered by the dock and panel. */
  updateViewShift() {
    const w = this.camera.width || innerWidth;
    let px = 0;
    if (w > 980) {
      const dock = $('#modeDock').getBoundingClientRect().width + 16;
      const panelOpen = !this.ui.el.app.classList.contains('panel-closed');
      const panel = panelOpen ? $('#panel').getBoundingClientRect().width + 16 : 0;
      px = (dock - panel) / 2;
    }
    this.camera.wantShift = px / (w / 2);
    // While the demo panel occupies the bottom, centre the scene between the top bar and the panel.
    const h = this.camera.height || innerHeight, dp = this.demo.panelRect();
    const py = dp ? (h / 2 - ($('#topbar').getBoundingClientRect().bottom + dp.top) / 2) / (h / 2) : 0;
    this.camera.wantShiftY = clamp(py, -0.45, 0.45);
  }
  async toggleFullscreen() {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else this.ui.toast('Full screen is not available here.', 'warn', 'fullscreen'); }
    catch { this.ui.toast('The browser did not allow full screen here.', 'warn', 'fullscreen'); }
  }
  async importFile(file) {
    const input = $('#importFile');
    try {
      const data = await this.saver.importFile(file);
      this.ui.closeModal();
      this.rebuildWorld(data);
      this.introSeen = true;
      this.saver.save();
      this.ui.toast('<b>Save imported</b>Your network, memories and progress were restored.', 'good', 'upload', true);
      this.ui.journal('Progress imported from a backup file.');
    } catch (err) { this.ui.toast(`Import failed: ${esc(err.message)}`, 'bad', 'upload'); }
    finally { input.value = ''; }
  }
  resetAll() {
    this.resetting = true;
    this.saver.clear();
    location.reload();
  }
  onContextLost() {
    this.setPaused(true);
    this.showFatal(new Error('The graphics context was lost (for example after a GPU reset). Reload the page to continue — your last save is kept.'));
  }
  showFatal(err) {
    const el = document.createElement('div');
    el.className = 'error-panel';
    el.innerHTML = `<div class="card"><div class="eyebrow">NEURON</div><h2 style="margin-top:.4rem">3D rendering is unavailable.</h2><p>${esc(err.message || err)}</p><p>NEURON needs WebGL. Try enabling hardware acceleration, updating your browser, or opening this file in a current version of Chrome, Edge, Firefox or Safari.</p></div>`;
    document.body.appendChild(el);
    $('#loadingVeil').classList.add('gone');
  }

  resize() {
    const r = $('#app').getBoundingClientRect();
    this.camera.setViewport(r.width, r.height);
    this.renderer.resize(r.width, r.height);
    this.updateViewShift();
    this.ui.markDirty('tools');
  }

  /* ---------- per-frame ---------- */
  /** One fixed simulation step for every system. */
  tick(dt) {
    this.sim.update(dt);
    this.plasticity.update(dt);
    this.memory.update(dt);
    this.attention.update(dt, this.modeId);
    this.sleep.update(dt);
    this.repair.update(dt);
    this.skill.update(dt);
    this.glia.update(dt);
    this.missions.update(dt);
    this.stats.update(dt, 0);
    this.mode.update(dt);
    if (this.intro.running) this.intro.update(dt);
  }
  computeDecor() {
    const d = { hiNeurons: new Map(), hiSynapses: new Map(), dim: 0, focusRegion: this.focusRegion, rings: [], ribbons: [], orbs: [], knowledgePath: null, brainDim: 0 };
    try { this.mode.decorate(d); } catch (err) { console.error('NEURON decorate failed', err); }
    const sel = this.selection, now = performance.now();
    if (sel?.type === 'neuron') {
      d.hiNeurons.set(sel.obj, { rgb: COL.select, level: 1 });
      for (const s of sel.obj.outgoing) if (s.enabled && !d.hiSynapses.has(s)) d.hiSynapses.set(s, { rgb: [0.7, 1, 0.9], level: 0.45 });
    } else if (sel?.type === 'synapse') {
      d.hiSynapses.set(sel.obj, { rgb: [1, 1, 1], level: 1 });
      d.hiNeurons.set(sel.obj.source, { rgb: COL.select, level: 0.9 }); d.hiNeurons.set(sel.obj.target, { rgb: COL.select, level: 0.7 });
    } else if (sel?.type === 'glia') {
      d.rings.push({ pos: sel.obj.position, rgb: [0.7, 0.9, 1], size: sel.obj.size * 3.4, param: 0.7 });
      for (const s of sel.obj.focusSynapses) d.hiSynapses.set(s, { rgb: [0.7, 0.9, 1], level: 0.7 });
    } else if (sel?.type === 'memory') {
      for (const f of sel.obj.features) d.hiNeurons.set(f.neuron, { rgb: COL.memory, level: 1 });
      for (const id of sel.obj.associatedSynapseIds) d.hiSynapses.set(this.sim.synapses[id], { rgb: COL.memory, level: 0.6 });
      d.dim = Math.max(d.dim, 0.5);
    }
    for (const a of this.attention.ambient) d.orbs.push({ pos: a.pos, rgb: [1, 0.55, 0.38], alpha: 0.5 + 0.5 * a.salience, size: 0.3 + 0.3 * a.salience });
    if (this.followPath && now < this.followPath.until && this.followPath.points.length > 1) d.ribbons.push({ points: this.followPath.points, rgb: [1, 0.85, 0.5], alpha: 0.55, width: 2.5, flow: 1 });
    if (this.follow && this.follow.path.length > 1) d.ribbons.push({ points: this.follow.path.map((n) => n.position), rgb: [1, 0.85, 0.5], alpha: 0.5, width: 2.5, flow: 1 });
    if (this.trace && now < this.trace.until) {
      for (const s of this.trace.syns) d.hiSynapses.set(s, { rgb: COL.path, level: 1 });
      for (const n of this.trace.neurons) d.hiNeurons.set(n, { rgb: COL.path, level: 1 });
      d.dim = Math.max(d.dim, 0.4);
    } else this.trace = null;
    if (d.brainDim) d.dim = Math.max(d.dim, 0.55);
    this.demo.decorate(d);
    this.lastDecor = d;
    return d;
  }
  decorHas(n) { return !!this.lastDecor && this.lastDecor.hiNeurons.has(n); }

  frame(now) {
    requestAnimationFrame(this.frame);
    let realDt = this.lastNow ? Math.min(0.05, (now - this.lastNow) / 1000) : 1 / 60;
    this.lastNow = now;
    if (!this.renderer.ready) return;
    if (this.demo.active) realDt *= this.demo.timeScale;   // 1 unless a test speeds the presentation up
    try {
      this.camera.update(realDt);
      if (!this.paused) {
        // The demo always runs the simulation at 1×; the player's own speed setting is left untouched.
        const base = this.demo.active ? this.demo.simSpeed : this.settings.speed;
        const speed = base * (this.sleep.active && this.sleep.accelerated ? 3 : 1) * (this.follow ? 0.4 : 1);
        const total = realDt * speed;
        const steps = Math.max(1, Math.ceil(total / 0.02));
        for (let i = 0; i < steps; i++) this.tick(total / steps);
        this.stats.playTime += realDt;
        this.regionTimer += realDt;
        if (this.regionTimer > 0.25) {
          this.regionTimer = 0;
          for (const r of this.sim.regions) { let s = 0, c = 0; for (const n of r.neurons) if (n.recruited) { s += n.recentActivity; c++; } r.activity = damp(r.activity, clamp(c ? (s / c) * 2.2 : 0), 3, 0.25); }
        }
      }
      this.demo.tick(realDt);
      if (this.modeId === 'build' || this.renderer.buildT > 0.01) this.knowledge.update(realDt);
      if (this.selection?.type === 'neuron') { const n = this.selection.obj; this.membraneHistory.push(n.flash > 0.9 ? 1.35 : n.activation); this.membraneHistory.shift(); }
      this.tutorial.update(realDt);
      this.renderer.render(realDt, this.computeDecor());
      this.ui.update(realDt);
      const scale = this.scaleLevel();
      if (scale !== this.lastScale) { this.lastScale = scale; this.ui.markDirty('tools'); if (this.modeId === 'explore' && this.ui.panelTab === 'mode') this.ui.markDirty('panel'); }
    } catch (err) {
      if (!this.loggedFrameError) { console.error('NEURON frame error', err); this.loggedFrameError = true; }
    }
    this.fpsFrames++; this.fpsTime += realDt;
    if (this.fpsTime > 1) {
      this.fps = Math.round(this.fpsFrames / this.fpsTime); this.fpsFrames = 0; this.fpsTime = 0;
      if (this.settings.showFps) setText('clock', `${fmtTime(this.sim.time)} · ${this.fps} FPS`);
    }
    this.saveTimer += realDt;
    if (this.saveTimer > 15 && !this.ui.modal) { this.saveTimer = 0; this.saver.save(); }
  }

  /** Small, namespaced handle for debugging and automated tests. */
  exposeApi() {
    const g = this;
    window.NEURON = Object.freeze({
      version: '2.0.0',
      get game() { return g; },
      stats: () => ({ neurons: g.sim.neurons.length, synapses: g.sim.enabledSynapseCount(), signals: g.sim.signals.length, glia: g.sim.glia.length, mode: g.modeId, level: g.progression.level, points: g.progression.points, renderer: g.renderer.gl2 ? 'WebGL2' : 'WebGL1', hdr: g.renderer.hdr, fps: g.fps }),
      simulate(seconds, dt = 0.02) { for (let t = 0; t < seconds; t += dt) g.tick(dt); },
      action: (name, data = {}) => g.action(name, { dataset: data }),
      save: () => g.saver.save(),
      demo: Object.freeze({
        start: () => g.demo.start(), pause: () => g.demo.pause(), resume: () => g.demo.resume(), skip: () => g.demo.skipStep(),
        restart: () => g.demo.restart(), exit: () => g.demo.exit(), takeControl: () => g.demo.takeControl(), replay: () => g.demo.replay(),
        get state() { return g.demo.state; }, get step() { return g.demo.stepIndex; }, get clock() { return g.demo.clock; },
        get results() { return g.demo.results; }, get runId() { return g.demo.runId; },
        get timeScale() { return g.demo.timeScale; }, set timeScale(v) { g.demo.timeScale = clamp(+v || 1, 0.25, 8); },
      }),
    });
  }
}

/* ---------- start ---------- */
const game = new Game();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => game.boot());
else game.boot();
})();
</script>
</body>
</html>
